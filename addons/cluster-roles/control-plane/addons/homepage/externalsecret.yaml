# Homepage's widget credentials, all from 1Password through onepassword-store.
# deployment.yaml loads each Secret below with an optional envFrom, and
# Homepage substitutes `{{HOMEPAGE_VAR_<NAME>}}` in services.yaml from the
# environment, so no key is ever written into configmap.yaml.
#
# ONE ExternalSecret PER 1Password ITEM. A Secret is written only when every
# field it reads resolves, so a single bad field in a shared ExternalSecret
# takes every widget's key down with it. That happened on the first deploy:
# `unifi-mcp-login` carries two fields labelled `username`, the lookup by
# label failed as ambiguous, and no Secret was written at all. Split like this,
# a broken item costs only its own widget.
---
# Item "homepage-secret" (homelab vault), read WHOLE: its fields are already
# named HOMEPAGE_VAR_* and become variables as they are. It is the same item
# the media vcluster's eso-homepage-secret reads for configarr and the
# exporters, so the Sonarr/Radarr keys there are known-good. Fields used:
#   HOMEPAGE_VAR_SONARR_KEY, _RADARR_KEY, _SABNZBD_KEY, _PLEX_TOKEN,
#   _UNRAID_KEY, _HA_KEY, _PVE_USER, _PVE_PASS
# A new HOMEPAGE_VAR_* field added to the item is picked up on the next
# refresh (and the next pod start).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-env
  namespace: homepage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: homepage-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: homepage-secret
---
# Item "argocd-mcp-api-token", field `token`: an ArgoCD API token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-argocd
  namespace: homepage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: homepage-argocd
    creationPolicy: Owner
  data:
    - secretKey: HOMEPAGE_VAR_ARGOCD_KEY
      remoteRef: { key: argocd-mcp-api-token, property: token }
---
# Item "unifi-mcp-login", fields `username` and `password`: the UniFi console
# login. The item must have exactly ONE field labelled `username`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-unifi
  namespace: homepage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: homepage-unifi
    creationPolicy: Owner
  data:
    - secretKey: HOMEPAGE_VAR_UNIFI_USER
      remoteRef: { key: unifi-mcp-login, property: username }
    - secretKey: HOMEPAGE_VAR_UNIFI_PASS
      remoteRef: { key: unifi-mcp-login, property: password }
