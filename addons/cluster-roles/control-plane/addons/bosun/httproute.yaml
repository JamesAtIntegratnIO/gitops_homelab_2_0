# bosun.cluster.integratn.tech -- the agent's status page, behind authentik.
#
# HAND-WRITTEN RATHER THAN RENDERED, and the reason is the filter below. The
# bosun chart can render this route from `web.httpRoute` in values.yaml and
# would get the port right by construction, but its HTTPRoute takes no
# `filters`, so it cannot carry the forward-auth ExtensionRef. `httpRoute` is
# off there and this file is what replaced it.
#
# THE PORT IS 8081 AND MUST STAY 8081. The chart's other port, 8080, answers
# POST /v1/promotion-opened -- the endpoint that names the pull request this
# agent edits and the files it reads into a prompt it then publishes. The page
# is read-only and lives on its own listener precisely so that publishing one
# never publishes the other. A route pointed at 8080 renders clean, passes
# every check, attaches to the gateway and hands the internet the endpoint
# that spends money and writes to this repository. Nothing downstream will
# catch it. `web.allowFrom` in values.yaml admits the gateway to 8081 and to
# nothing else, so a wrong number here fails closed rather than open -- that
# is a backstop, not permission to be careless with the number.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bosun
  namespace: bosun
spec:
  parentRefs:
    - name: nginx-gateway
      namespace: nginx-gateway
      sectionName: https
  # external-dns runs with `--source=gateway-httproute`, so this hostname is
  # also what creates the DNS record. There is nothing else to add.
  hostnames:
    - bosun.cluster.integratn.tech
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Forward-auth to authentik's embedded outpost. The SnippetsFilter is in
      # snippetsfilter.yaml beside this file and must stay in THIS namespace:
      # an ExtensionRef has no namespace field, so it resolves only against the
      # route's own. The provider it talks to is `bosun-proxy-provider`, in the
      # authentik blueprint ConfigMap.
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.nginx.org
            kind: SnippetsFilter
            name: authentik-forward-auth
      backendRefs:
        - name: bosun
          port: 8081
---
# The http half.
#
# The gateway's `http` listener serves the same wildcard hostname as `https`,
# and a hostname with no route on it answers 404 rather than upgrading.
# `bosun.cluster.integratn.tech` typed into a browser bar is http until
# something says otherwise; this is what says otherwise. It names no backend
# at all, so it cannot get the port wrong.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bosun-http-redirect
  namespace: bosun
spec:
  parentRefs:
    - name: nginx-gateway
      namespace: nginx-gateway
      sectionName: http
  hostnames:
    - bosun.cluster.integratn.tech
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
