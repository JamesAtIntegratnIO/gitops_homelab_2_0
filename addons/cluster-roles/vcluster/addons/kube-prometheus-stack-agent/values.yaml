alertmanager:
  enabled: false

# The host Prometheus evaluates the default rules over everything this agent
# remote-writes. Evaluating them here as well sent the same recording-rule
# series twice, and the host rejected one copy as "out of order sample"
# (PrometheusRemoteStorageFailures). Note `mode: agent` below is not a chart
# value and Prometheus 3.x ignores `--enable-feature=agent`, so this still
# runs as a full server; `prometheus.agentMode: true` is the real switch.
defaultRules:
  create: false

grafana:
  enabled: false

nodeExporter:
  enabled: false

prometheus-node-exporter:
  enabled: false

kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

kubelet:
  enabled: false

prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    mode: agent
    enableFeatures:
      - agent
    retention: 6h
    scrapeInterval: 30s
    serviceMonitorSelector: {}
    podMonitorSelector: {}
    probeSelector: {}
    storageSpec: {}

kube-state-metrics:
  enabled: true
