apiVersion: platform.integratn.tech/v1alpha1
kind: VClusterOrchestratorV2
metadata:
  name: vcluster-media
  namespace: platform-requests
spec:
  name: vcluster-media
  targetNamespace: vcluster-media
  projectName: vcluster-media
  vcluster:
    # Explicit so a change to the promise's default cannot move this tenant.
    # One minor at a time: see upgrades.md.
    k8sVersion: v1.34.3@sha256:826be1580721885d0b1ab790e2957f1ab1325af580fb477848af69270d8ce2f1
    preset: prod
    replicas: 3
    helmOverrides:
      controlPlane:
        statefulSet:
          # vcluster-oss digest: without a tag the chart renders its own version, by tag only.
          image:
            tag: "0.37.6@sha256:99345bf4c01ec4ed777a72766c861d7d5435f195a6bd6643bb8f3db0f5eb89c8"
          persistence:
            addVolumes:
              - name: etcd-certs
                secret:
                  secretName: vcluster-media-etcd-certs
            addVolumeMounts:
              - name: etcd-certs
                mountPath: /etcd-certs
                readOnly: true
        backingStore:
          etcd:
            deploy:
              enabled: true
              statefulSet:
                image:
                  registry: registry.k8s.io
                  repository: etcd
                  tag: "3.6.8-0@sha256:397189418d1a00e500c0605ad18d1baf3b541a1004d768448c367e48071622e5"
                extraArgs:
                  - "--client-cert-auth=false"
                highAvailability:
                  replicas: 3
        ingress:
          enabled: false
      integrations:
        # Proxies the host cluster's metrics-server into the vcluster so
        # metrics.k8s.io resolves inside it. Off since this file was first
        # written, which left the tenant with no pod or node metrics at all --
        # `kubectl top` empty, and its ArgoCD HPAs stuck at
        # ScalingActive=False for their entire life. The pipeline's own default
        # is true; this override was the only thing holding it off.
        metricsServer:
          enabled: true
    resources:
      requests:
        # The prod preset reserves 500m per control-plane replica (1.5 CPU across
        # the three). Live usage is 47m/141m/120m and this is the single largest
        # block of over-reservation on the cluster: with it, total requests do not
        # fit on two nodes, so losing one leaves pods Pending. The 2-CPU limit is
        # unchanged, so burst headroom is unaffected -- this only changes
        # scheduling.
        cpu: "250m"
        memory: "2Gi"
      limits:
        memory: "2Gi"
    backingStore:
      etcd:
        deploy:
          enabled: true
          statefulSet:
            highAvailability:
              replicas: 3
  exposure:
    hostname: media.integratn.tech
    apiPort: 443
  integrations:
    argocd:
      environment: production
      clusterAnnotations:
        platform.integratn.tech/reconcile-at: "2026-03-03T19:00:00Z"
  argocdApplication:
    repoURL: https://charts.loft.sh
    chart: vcluster
    targetRevision: 0.37.6
    syncPolicy:
      automated:
        selfHeal: true
        prune: true
      syncOptions:
        - CreateNamespace=true
  networkPolicies:
    enableNFS: true
    extraEgress:
      - name: postgres
        cidr: 10.0.3.1/32
        port: 5432
        protocol: TCP
