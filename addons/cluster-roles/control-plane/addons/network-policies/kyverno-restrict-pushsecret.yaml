# PushSecrets may only CREATE new items in the `generated` 1Password vault.
#
# Why: the store onepassword-generated has a write token (secret-generation
# addon). `updatePolicy: Replace` (the PushSecret default) would overwrite an
# existing item's fields and `deletionPolicy: Delete` would remove an item when
# the PushSecret goes. This policy makes both impossible, and keeps every
# PushSecret on that one store, so a PushSecret can never be aimed at the
# read store or any other provider.
#
# No PushSecret exists in the cluster yet, so Enforce blocks nothing today.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-pushsecret
  annotations:
    policies.kyverno.io/title: Restrict PushSecret to create-only into the generated vault
    policies.kyverno.io/category: Secrets
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      A PushSecret must target only the ClusterSecretStore
      onepassword-generated, with updatePolicy IfNotExists and deletionPolicy
      None, so it can create new items and never overwrite or delete one.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: pushsecret-create-only
      match:
        any:
          - resources:
              kinds:
                - external-secrets.io/v1alpha1/PushSecret
      validate:
        message: >-
          A PushSecret must use updatePolicy IfNotExists, deletionPolicy None
          and secretStoreRefs of only the ClusterSecretStore
          onepassword-generated (create-only into the generated vault).
        pattern:
          spec:
            updatePolicy: IfNotExists
            deletionPolicy: None
            secretStoreRefs:
              - name: onepassword-generated
                kind: ClusterSecretStore
