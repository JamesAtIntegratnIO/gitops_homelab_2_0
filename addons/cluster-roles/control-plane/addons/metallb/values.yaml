# MetalLB Helm values — security hardening (chart 0.16.1)
# 0.15.3 added readOnlyRootFilesystem + allowPrivilegeEscalation: false
# to all speaker containers by default (#2863).
#
# Speaker DaemonSet requires (by design, CANNOT be removed):
#   - hostNetwork: true  (L2 ARP/NDP needs real node network)
#   - NET_RAW capability  (ARP/NDP for L2 LoadBalancer)
#
# This cluster is L2-only: one IPAddressPool (10.0.4.200-253) and one
# L2Advertisement on eno1 (amd64) and end0 (Pi 4). There is no BGPPeer and no
# BGPAdvertisement, so nothing here needs FRR.
#
# Chart 0.16.1 flips two defaults in opposite directions -- `speaker.frr.enabled`
# true -> false and `frrk8s.enabled` false -> true -- which would retire the FRR
# sidecars and stand up the separate frr-k8s DaemonSet in their place, with four
# new CRDs, a ValidatingWebhookConfiguration and its own webhook Service. That is
# a lot of new surface on the component that owns every LoadBalancer VIP,
# including the gateway's 10.0.4.205, in exchange for a routing mode this
# cluster does not use. Both are pinned off instead: with FRR out of the picture
# entirely, 0.16.1 renders exactly what 0.15.3 renders today.
frrk8s:
  enabled: false

# Recovery path: the speaker owns every LoadBalancer VIP, including the public
# gateway address and the vcluster API endpoint.
controller:
  priorityClassName: platform-critical
  # Default is 300s: a pod sits on a dead node for five minutes before the
  # scheduler may move it, which is most of the outage for a single-replica
  # component. 60s still absorbs a brief network blip. The cluster-wide version
  # of this is --default-*-toleration-seconds on kube-apiserver, which needs a
  # Talos machine-config change; until then it is set per workload on the
  # recovery path.
  tolerations:
    - key: node.kubernetes.io/not-ready
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 60
    - key: node.kubernetes.io/unreachable
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 60
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault

speaker:
  priorityClassName: platform-critical
  # Speakers also run on the Pi 4 workers. A LoadBalancer with
  # externalTrafficPolicy: Local is announced only from a node that has both a
  # ready endpoint and a speaker, and schedule-arm64-images (Kyverno) lets
  # allowlisted pods -- including the vcluster-media gateway behind 10.0.4.201 --
  # land on the Pi 4s. With speakers only on amd64, a gateway pod on a Pi left
  # its VIP unannounced (2026-11-09 to 11-13, every *.vcluster-media app down).
  # The Pi 4s announce on end0 (see the L2Advertisement). The Pi 5 stays
  # reserved for hermes and cq and gets no speaker, matching the policy's
  # required board!=rpi5 affinity.
  tolerations:
    - key: node.integratn.tech/arch
      operator: Equal
      value: arm64
      effect: NoSchedule
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node.integratn.tech/board
                operator: NotIn
                values:
                  - rpi5
  # L2-only, as above. With this off the speaker is a single container and the
  # frr / reloader / frr-metrics sidecars and their three init containers -- and
  # the resource blocks that used to size them -- are gone.
  frr:
    enabled: false
