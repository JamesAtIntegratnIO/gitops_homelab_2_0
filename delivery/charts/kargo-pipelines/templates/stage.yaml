{{- range $projectName, $project := .Values.projects }}
{{- range $targetName, $t := $project.targets }}
{{- $n := include "kp.normalise" (dict "root" $ "project" $projectName "name" $targetName "target" $t) | fromJson }}
{{- $artifact := ternary (dig "image" "repoURL" "" $t) (ternary (dig "git" "repoURL" "" $t) (printf "%s %s" (dig "chart" "repoURL" "" $t) (dig "chart" "name" "" $t) | trim) $n.isGit) $n.isImage }}
{{- $stages := include "kp.stageList" (dict "target" $t "name" $targetName) | fromJsonArray }}
{{- range $st := $stages }}
{{- $first := index $st.updates 0 }}
{{- $firstFormat := default $n.format $first.format }}
{{- $firstKey := index $first.keys 0 }}
{{- /*
Each stage reads the FIRST file of its OWN updates. That is what makes a chain
correct rather than cosmetic: without it a downstream stage would compare
against the pin its upstream already moved, conclude there is nothing to do,
and silently never promote.
*/ -}}
{{- $changed := include "kp.changedExpr" (dict "target" $t "norm" $n "firstKey" $firstKey "firstFormat" $firstFormat) }}
{{- $auto := include "kp.autoMergeExpr" (dict "target" $t "norm" $n "autoMerge" $st.autoMerge) }}
{{- $subject := include "kp.subject" (dict "target" $t "name" $targetName "norm" $n) }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: {{ $st.stageName }}
  namespace: {{ $projectName }}
  labels:
    {{- include "kp.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: {{ $targetName }}
      sources:
        {{- if $st.isFirst }}
        direct: true
        {{- else }}
        {{- /*
        Kargo only makes Freight available downstream once it is VERIFIED
        upstream, so the gate comes free -- no orchestration, no polling. A
        canary that fails verification simply never offers its Freight on.
        `direct` is emitted explicitly because the webhook defaults it, and an
        absent field ArgoCD keeps re-adding is permanent drift.
        */}}
        direct: false
        stages:
          - {{ $st.upstream }}
        {{- with $st.requiredSoakTime }}
        requiredSoakTime: {{ . }}
        {{- end }}
        {{- end }}
  {{- with $st.verify }}
  # After the PR has merged: are the Applications this pin feeds Synced and
  # Healthy? Template rendered per Project in project.yaml.
  verification:
    analysisTemplates:
      - name: argocd-apps-healthy
    args:
      - name: apps
        value: {{ join "|" .apps | quote }}
      - name: expected
        value: {{ len .apps | quote }}
  {{- end }}
  promotionTemplate:
    spec:
      vars:
        - name: repoURL
          value: {{ $.Values.git.repoURL | quote }}
        - name: branch
          value: {{ $.Values.git.branch | quote }}
      steps:
        - uses: git-clone
          config:
            repoURL: {{ include "kp.expr" "vars.repoURL" | quote }}
            {{- if $.Values.git.insecureSkipTLSVerify }}
            insecureSkipTLSVerify: true
            {{- end }}
            checkout:
              - branch: {{ include "kp.expr" "vars.branch" | quote }}
                path: ./repo
        # Read what is pinned today so the promotion can decide whether there
        # is anything to do, and whether the change is small enough to merge
        # unattended.
        - uses: yaml-parse
          as: read
          config:
            path: ./repo/{{ $first.file }}
            outputs:
              - name: current
                fromExpression: {{ include "kp.exprPath" $firstKey | quote }}
              - name: currentVersion
                fromExpression: {{ include "kp.currentVersionExpr" (dict "path" (include "kp.exprPath" $firstKey) "format" $firstFormat) | quote }}
        {{- range $u := $st.updates }}
        {{- $format := default $n.format $u.format }}
        - uses: yaml-update
          if: {{ include "kp.expr" $changed | quote }}
          config:
            path: ./repo/{{ $u.file }}
            updates:
              {{- range $key := $u.keys }}
              - key: {{ $key | quote }}
                value: {{ include "kp.expr" (include "kp.newValueExpr" (dict "target" $t "format" $format)) | quote }}
              {{- end }}
        {{- end }}
        - uses: git-commit
          as: commit
          if: {{ include "kp.expr" $changed | quote }}
          config:
            path: ./repo
            message: {{ $subject | quote }}
        - uses: git-push
          as: push
          if: {{ include "kp.expr" $changed | quote }}
          config:
            path: ./repo
            # kargo/promotion/<promotion name>: unique per promotion, so a
            # stale branch from an earlier PR can never cause a
            # non-fast-forward push.
            generateTargetBranch: true
        - uses: git-open-pr
          as: pr
          if: {{ include "kp.expr" $changed | quote }}
          config:
            repoURL: {{ include "kp.expr" "vars.repoURL" | quote }}
            {{- if $.Values.git.insecureSkipTLSVerify }}
            insecureSkipTLSVerify: true
            {{- end }}
            provider: {{ $.Values.git.provider }}
            sourceBranch: {{ include "kp.expr" "outputs.push.branch" | quote }}
            targetBranch: {{ include "kp.expr" "vars.branch" | quote }}
            title: {{ $subject | quote }}
            {{- /* Assembled from strings so the ${{ }} never meet Helm's parser. */}}
            {{- $lines := list
                  (printf "Automated by Kargo -- project `%s`, stage `%s`." $projectName $targetName)
                  ""
                  "| | |"
                  "|---|---|"
                  (printf "| Artifact | `%s` |" $artifact)
                  (printf "| From | `%s` |" (include "kp.expr" "outputs.read.currentVersion"))
                  (printf "| To | `%s` |" (include "kp.expr" (include "kp.newVersionDisplayExpr" $t))) }}
            {{- if $n.semver }}
            {{- $lines = append $lines (printf "| Change | `%s` |" (include "kp.expr" (printf "semverDiff(%s, outputs.read.currentVersion)" (include "kp.newVersionExpr" $t)))) }}
            {{- end }}
            {{- $lines = concat $lines (list (printf "| Merge policy | `%s` |" $n.autoMerge) "" "Files:") }}
            {{- range $u := $st.updates }}
            {{- $lines = append $lines (printf "- `%s`" $u.file) }}
            {{- end }}
            {{- $lines = concat $lines (list "" (printf "Kargo: %s/project/%s/stage/%s" (include "kp.expr" "ctx.uiBaseUrl") (include "kp.expr" "ctx.project") (include "kp.expr" "ctx.stage"))) }}
            description: |
              {{- join "\n" $lines | nindent 14 }}
          retry:
            errorThreshold: {{ $.Values.merge.errorThreshold }}
        {{- if and $.Values.triage.enabled (ne $.Values.triage.when "never") }}
        {{- /*
        Hand the freight context to a triage service the moment the PR opens.
        Event-driven, so nothing polls.

        continueOnError keeps this best-effort: a triage service that is down,
        slow, or misconfigured must never fail a promotion. The service is
        expected to answer immediately and do its work asynchronously -- this
        step is synchronous, so a blocking handler would put the triage service
        inside every promotion's critical path.
        */}}
        - uses: http
          as: triage
          if: {{ include "kp.expr" (ternary $changed (printf "(%s) && !(%s)" $changed $auto) (eq $.Values.triage.when "always")) | quote }}
          {{- if $.Values.triage.continueOnError }}
          continueOnError: true
          {{- end }}
          config:
            method: POST
            url: {{ $.Values.triage.url | quote }}
            headers:
              - name: Content-Type
                value: application/json
            body: {{ include "kp.triageBody" (dict
                      "target" $t "norm" $n "artifact" $artifact
                      "files" (include "kp.stageFiles" (dict "stage" $st) | fromJsonArray)
                      "verifyApps" (dig "apps" (list) ($st.verify | default dict))) | quote }}
            successExpression: "response.status >= 200 && response.status < 500"
          retry:
            errorThreshold: 1
            timeout: {{ $.Values.triage.timeout }}
        {{- end }}
        # Exactly one of the next two runs. Either the policy lets the Stage
        # merge its own PR, or the promotion parks here until a human does.
        - uses: git-merge-pr
          if: {{ include "kp.expr" (printf "(%s) && (%s)" $changed $auto) | quote }}
          config:
            repoURL: {{ include "kp.expr" "vars.repoURL" | quote }}
            {{- if $.Values.git.insecureSkipTLSVerify }}
            insecureSkipTLSVerify: true
            {{- end }}
            provider: {{ $.Values.git.provider }}
            prNumber: {{ include "kp.expr" "outputs.pr.pr.id" | quote }}
            mergeMethod: {{ $.Values.merge.method }}
            wait: true
            pollInterval: {{ $.Values.merge.pollInterval }}
          retry:
            errorThreshold: {{ $.Values.merge.errorThreshold }}
            timeout: {{ $.Values.merge.timeout }}
        - uses: git-wait-for-pr
          if: {{ include "kp.expr" (printf "(%s) && !(%s)" $changed $auto) | quote }}
          config:
            repoURL: {{ include "kp.expr" "vars.repoURL" | quote }}
            {{- if $.Values.git.insecureSkipTLSVerify }}
            insecureSkipTLSVerify: true
            {{- end }}
            provider: {{ $.Values.git.provider }}
            prNumber: {{ include "kp.expr" "outputs.pr.pr.id" | quote }}
            pollInterval: {{ $.Values.merge.waitPollInterval }}
          retry:
            errorThreshold: {{ $.Values.merge.errorThreshold }}
            timeout: {{ $.Values.merge.waitTimeout }}
{{- end }}
{{- end }}
{{- end }}
