# Host-side additions to the vcluster-media namespace. The namespace's own
# policies (default-deny-all, allow-vcluster-external, ...) are generated by
# the vcluster-orchestrator-v2 promise pipeline and owned by Kratix; anything
# here is ADDITIVE and owned by ArgoCD, so neither fights the other.
---
# Homepage's Sonarr, Radarr and SABnzbd widgets call the apps' APIs on their
# synced Services. Each app still checks its own API key. The egress half is
# allow-widget-apis in homepage.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-homepage-ingress
  namespace: vcluster-media
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [sonarr, radarr, sabnzbd]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: homepage
          podSelector:
            matchLabels:
              app.kubernetes.io/name: homepage
      ports:
        - protocol: TCP
          port: 8989
        - protocol: TCP
          port: 7878
        - protocol: TCP
          port: 8080
---
# vcluster-media's Prometheus agent remote-writes to the host's receiver at
# prom-remote.cluster.integratn.tech, which resolves to the gateway VIP
# 10.0.4.205. The generated allow-vcluster-external permits :443 only to the
# internet (0.0.0.0/0 minus RFC1918), so the VIP is excluded and every batch
# fails with "context deadline exceeded" -- zero bytes, no error.
#
# Both the VIP and the gateway pods are named, as in kargo.yaml: with
# kube-proxy replacement the VIP is translated before policy on some paths
# and after it on others.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-remote-write
  namespace: vcluster-media
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
      vcluster.loft.sh/managed-by: vcluster-media
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.4.205/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nginx-gateway
      ports:
        - protocol: TCP
          port: 443
