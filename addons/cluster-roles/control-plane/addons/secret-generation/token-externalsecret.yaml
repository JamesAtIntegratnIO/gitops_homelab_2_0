# The write token for onepassword-generated (clustersecretstore.yaml), from
# 1Password through the READ store, the same way every other credential here
# arrives. Item `eso-generated-token` in the `homelab` vault, field `token`: a
# Connect token with read and write on `homelab`. Fields are read by LABEL.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eso-onepassword-generated-token
  namespace: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: eso-onepassword-generated-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: eso-generated-token
        property: token
