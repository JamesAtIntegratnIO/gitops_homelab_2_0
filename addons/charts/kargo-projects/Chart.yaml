apiVersion: v2
name: kargo-projects
description: >-
  Renders Kargo Projects, Warehouses and Stages from a compact list of
  "update targets" -- one Warehouse/Stage pair per artifact whose version is
  pinned somewhere in this repository. Each Stage opens a pull request that
  bumps the pin, and merges it itself when the per-target policy allows.
type: application
version: 0.1.0
appVersion: "1.11.2"
