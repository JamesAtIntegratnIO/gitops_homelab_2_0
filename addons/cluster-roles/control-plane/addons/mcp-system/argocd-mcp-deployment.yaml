# ArgoCD MCP: Bridges AI platform to ArgoCD
# Provides: list/get/sync applications, resource trees, managed resources, workload logs
# Runtime: official Docker image (pre-built Node.js app)
# Transport: http stream on port 3000
# Read-only mode enabled for safety
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-mcp
  namespace: mcp-system
  labels:
    app: argocd-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argocd-mcp
  template:
    metadata:
      labels:
        app: argocd-mcp
    spec:
      # Deferrable: developer tooling, not a platform dependency.
      priorityClassName: platform-batch
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: argocd-mcp
          image: ghcr.io/argoproj-labs/mcp-for-argocd:v0.9.0@sha256:dffc6c719d8635be2d5f2c8ad1c0178540325da4b40da0b373307e12b4c48f86
          # ENTRYPOINT is ["node", "dist/index.js"] and CMD is ["http"]; `args`
          # replaces CMD only, so "http" has to be repeated here.
          #
          # v0.9.0 made the http/sse listener bind 127.0.0.1 instead of every
          # interface, and made widening that bind refuse to start unless either
          # MCP_AUTH_TOKEN is set or --allow-unauthenticated is passed. Left
          # alone, the pod would come up healthy -- the probes are tcpSocket on
          # localhost, which still answers -- while the Service behind it served
          # nothing. Reachability here is a network-policy question, not a bearer
          # token one: mcp-system carries a default-deny and only the routes in
          # network-policies/mcp-system.yaml can reach this port.
          args:
            - "http"
            - "--allow-unauthenticated"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: ARGOCD_BASE_URL
              value: "http://argo-cd-argocd-server.argocd.svc.cluster.local"
            - name: ARGOCD_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: argocd-mcp-secrets
                  key: api-token
                  optional: true
            - name: MCP_READ_ONLY
              value: "true"
            # See the args comment: v0.9.0 defaults to loopback.
            - name: MCP_BIND_ADDRESS
              value: "0.0.0.0"
            # ArgoCD uses self-signed certs internally
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-mcp
  namespace: mcp-system
  labels:
    app: argocd-mcp
spec:
  type: ClusterIP
  selector:
    app: argocd-mcp
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
