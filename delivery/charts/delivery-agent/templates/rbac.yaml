{{- if .Values.rbac.create }}
{{- /*
Read-only, and deliberately so. The agent observes the cluster to correlate a
failure against live state, and writes only to pull requests. There is no
create, update, patch or delete verb anywhere in this chart -- if a future
feature seems to need one, that is a signal to reconsider the feature.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "delivery-agent.fullname" . }}
  labels:
    {{- include "delivery-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [kargo.akuity.io]
    resources: [promotions, stages, warehouses, freights, projects]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [applications, analysisruns, analysistemplates]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "delivery-agent.fullname" . }}
  labels:
    {{- include "delivery-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "delivery-agent.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "delivery-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
