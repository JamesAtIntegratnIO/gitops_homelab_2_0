# CrowdSec (chart crowdsec, addon `crowdsec`): bans addresses that misbehave
# against the public edge. Added 2026-11-27.
#
#   agent  (Deployment)  reads nginx-gateway's access log FROM LOKI, not from
#                        the nodes' /var/log, so no hostPath and no privileged
#                        namespace. Only the data plane's lines; since the
#                        Cloudflare tunnel goes through the gateway (listener
#                        `tunnel`) and the gateway rewrites the client IP
#                        (nginx-gateway-fabric values, rewriteClientIP), those
#                        lines carry the real client address.
#   lapi   (Deployment)  holds decisions, pulls the community blocklist from
#                        CrowdSec's central API and shares our signals back.
#   ban-sync (crowdsec-extras/ban-sync.yaml) pushes our bans to the Cloudflare
#                        list `crowdsec_bans`; a WAF rule blocks it.
#
# Private addresses (LAN, Tailscale, pods) are never banned: the default
# whitelist parser drops them.
#
# STATE IS NOT PERSISTENT: LAPI's SQLite lives in an emptyDir. Bans last 4h
# by default, the bouncer key and registration token come from a Secret, and
# SQLite on the NFS storage classes is how Bazarr's database got corrupted
# (2026-11-05), so a restart forgetting current bans is the cheaper failure.
# Moving it to Postgres on datacron is the upgrade path.

image:
  repository: ghcr.io/crowdsecurity/crowdsec
  tag: "v1.8.2@sha256:65b74942f7e7ed5c60fde4ac15fc4ba715904c398c8b16dd451f4907d90347d4"

container_runtime: containerd

# LAPI secret and agent registration token from crowdsec-extras/secrets.yaml,
# not generated by the chart (a chart-generated Secret would re-randomise on
# every ArgoCD render).
secrets:
  externalSecret:
    name: crowdsec-lapi
    csLapiSecretKey: csLapiSecret
    registrationTokenKey: registrationToken

lapi:
  replicas: 1
  env:
    # Registers bouncer `cloudflare` with this key at start (ban-sync).
    - name: BOUNCER_KEY_cloudflare
      valueFrom:
        secretKeyRef:
          name: crowdsec-lapi
          key: bouncerKeyCloudflare
  persistentVolume:
    data:
      enabled: false
    config:
      enabled: false
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 256Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

agent:
  isDeployment: true
  replicas: 1
  hostVarLog: false
  acquisition: []
  additionalAcquisition:
    # nginx-gateway data plane access log, via Loki (auth disabled, single
    # tenant). Label `type: nginx` picks the nginx parser.
    - source: loki
      url: http://loki-gateway.loki.svc.cluster.local
      query: '{namespace="nginx-gateway", container="nginx"}'
      labels:
        type: nginx
    # FAIL2BAN FOR AUTHENTIK: authentik-server's JSON log. Collection
    # firix/authentik bans an address after 5 failed sign-ins or unknown
    # usernames within ~20s (firix/authentik-bf), or 5 DIFFERENT usernames
    # within ~1 min (user enumeration). Off the home network the password
    # stage is refused anyway, so in practice this catches username spraying.
    # CAVEAT until nginx-gateway-fabric >= 2.7 drops X-Forwarded-For
    # (NginxProxy disableBaseHeaders): authentik's client_ip is the LEFTMOST
    # X-Forwarded-For entry, which the client can write, so a ban from this
    # source can land on a forged address. Bans from the nginx log above
    # always carry the real one. Private addresses are never banned.
    - source: loki
      url: http://loki-gateway.loki.svc.cluster.local
      query: '{namespace="authentik", container="server"} |= "\"action\": "'
      labels:
        type: authentik
  env:
    - name: COLLECTIONS
      value: "crowdsecurity/nginx crowdsecurity/base-http-scenarios crowdsecurity/http-cve firix/authentik"
    # Turns a log line's `type` label into the program the parsers match on.
    - name: PARSERS
      value: "crowdsecurity/non-syslog"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 250Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

appsec:
  enabled: false
