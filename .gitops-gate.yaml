# How gitops-gate renders this repository.
#
# The gate binary knows nothing about any particular repo layout -- this file
# is the whole of that knowledge. See
# https://github.com/JamesAtIntegratnIO/bosun/tree/main/gate.

# The `ref:` name the bootstraps use for the values source, so `$values/...`
# in a valueFiles entry maps back to a path in this repo.
valuesRef: values

bootstraps:
  - name: control-plane
    path: terraform/cluster/bootstrap/addons-control-plane.yaml
  - name: vcluster
    path: terraform/cluster/bootstrap/addons-vcluster.yaml

# NOT export configuration any more -- there is no export. `knownAbsentLabels`
# is the only key left under here and it is consumed by the RENDER, at
# gate/render.go's `inv.Validate(...)`, in cluster mode exactly as in CI. It
# lives under `clustersExport:` because that is where the gate's Config struct
# puts it, and nowhere else will be read.
#
# Selectors that match on a label no cluster carries normally mean a stale
# inventory, so the gate refuses to render rather than quietly compare two
# shrunken sets. These are the deliberate exceptions.
#
# aws_cluster_name comes from the `karpenter` addon, inherited from the
# upstream application-sets chart and meaningless on bare metal. It is already
# `enabled: false`; the selector is simply never satisfied.
#
# DELETING THIS BLOCK IS NOT A CLEANUP. Measured against the live config with
# the gate binary itself: without it, `render` exits 2 with "selectors match on
# label(s) no cluster in the inventory carries: aws_cluster_name" -- which in
# cluster mode is an `error` status on every pull request, not a warning.
# `clustersExport.ignoreKeys` did go, because only `clusters export` read it.
clustersExport:
  knownAbsentLabels:
    - aws_cluster_name

validate:
  enabled: true
  ignoreMissingSchemas: true
  schemaLocations:
    - default
    - 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
