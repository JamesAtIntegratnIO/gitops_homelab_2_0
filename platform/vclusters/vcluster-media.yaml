apiVersion: platform.integratn.tech/v1alpha1
kind: VClusterOrchestratorV2
metadata:
  name: vcluster-media
  namespace: platform-requests
spec:
  name: vcluster-media
  targetNamespace: vcluster-media
  projectName: vcluster-media
  vcluster:
    preset: prod
    replicas: 3
    helmOverrides:
      controlPlane:
        statefulSet:
          persistence:
            addVolumes:
              - name: etcd-certs
                secret:
                  secretName: vcluster-media-etcd-certs
            addVolumeMounts:
              - name: etcd-certs
                mountPath: /etcd-certs
                readOnly: true
        backingStore:
          etcd:
            deploy:
              enabled: true
              statefulSet:
                image:
                  registry: registry.k8s.io
                  repository: etcd
                  tag: "3.6.8-0"
                extraArgs:
                  - "--client-cert-auth=false"
                highAvailability:
                  replicas: 3
        ingress:
          enabled: false
      integrations:
        metricsServer:
          enabled: false
    resources:
      requests:
        # The prod preset reserves 500m per control-plane replica (1.5 CPU across
        # the three). Live usage is 47m/141m/120m and this is the single largest
        # block of over-reservation on the cluster: with it, total requests do not
        # fit on two nodes, so losing one leaves pods Pending. The 2-CPU limit is
        # unchanged, so burst headroom is unaffected -- this only changes
        # scheduling.
        cpu: "250m"
        memory: "2Gi"
      limits:
        memory: "2Gi"
    backingStore:
      etcd:
        deploy:
          enabled: true
          statefulSet:
            highAvailability:
              replicas: 3
  exposure:
    hostname: media.integratn.tech
    apiPort: 443
  integrations:
    certManager:
      clusterIssuerSelectorLabels:
        integratn.tech/cluster-issuer: letsencrypt-prod
    externalSecrets:
      clusterStoreSelectorLabels:
        integratn.tech/cluster-secret-store: onepassword-store
    argocd:
      environment: production
      clusterAnnotations:
        platform.integratn.tech/reconcile-at: "2026-03-03T19:00:00Z"
  argocdApplication:
    repoURL: https://charts.loft.sh
    chart: vcluster
    targetRevision: 0.31.1
    syncPolicy:
      automated:
        selfHeal: true
        prune: true
      syncOptions:
        - CreateNamespace=true
  networkPolicies:
    enableNFS: true
    extraEgress:
      - name: postgres
        cidr: 10.0.3.1/32
        port: 5432
        protocol: TCP
