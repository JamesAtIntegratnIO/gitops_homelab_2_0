# kubernetes-mcp-server: Kubernetes MCP server (read-only, HTTP transport)
# Exposes Kubernetes API operations as MCP tools via streamable-http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-mcp
  namespace: mcp-system
  labels:
    app: kubernetes-mcp
  annotations:
    # Stakater Reloader rolls this Deployment when its config changes: the
    # server reads config.toml once, at start.
    configmap.reloader.stakater.com/reload: "kubernetes-mcp-config"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes-mcp
  template:
    metadata:
      labels:
        app: kubernetes-mcp
    spec:
      # Deferrable: developer tooling, not a platform dependency.
      priorityClassName: platform-batch
      serviceAccountName: kubernetes-mcp
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: kubernetes-mcp
          image: quay.io/containers/kubernetes_mcp_server:v0.1.2@sha256:c289505b06079d7f265a6fef977ce1abbfbbb4271772db17db5b58edbf44c255
          args:
            - "--config"
            - "/etc/kubernetes-mcp-server/config.toml"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/kubernetes-mcp-server
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: kubernetes-mcp-config
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-mcp
  namespace: mcp-system
  labels:
    app: kubernetes-mcp
spec:
  type: ClusterIP
  selector:
    app: kubernetes-mcp
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
