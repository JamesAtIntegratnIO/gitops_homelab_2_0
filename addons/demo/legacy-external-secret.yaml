# The reshape fixture. See README.md in this directory: applied by nothing,
# scanned by bosun, and written in v1alpha1's flat dataFrom shape on purpose.
apiVersion: external-secrets.io/v1alpha1
kind: ExternalSecret
metadata:
  name: demo-legacy-secret
  namespace: demo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: demo-legacy-secret
  dataFrom:
    - key: demo/legacy
      property: credentials
      version: "3"
