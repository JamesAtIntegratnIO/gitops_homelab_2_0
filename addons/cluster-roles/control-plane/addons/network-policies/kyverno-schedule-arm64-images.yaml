# Kyverno ClusterPolicy: let multi-arch vcluster pods run on the arm64 Pi workers
#
# The Pi workers carry node.integratn.tech/arch=arm64:NoSchedule because the
# scheduler does not check image architecture. vcluster-synced pods tolerate
# nothing, so none of them can land there. This policy adds the toleration and
# pins to arm64 -- but ONLY for a pod in which every container image is on the
# arm64-image-allowlist ConfigMap below.
# One image that is not listed leaves the whole pod untouched, on amd64.
#
# Mutation runs on CREATE only, so nothing moves until a pod is recreated.
# Mutate rules have no Audit mode: the allowlist is the dial. Remove an entry
# and the next pod using that image stays on the control-plane nodes.
#
# The second rule is the Audit half: it reports any vcluster-media pod that
# selects arm64 (by hand, or by an earlier version of this policy) while
# running an image that is not on the list.
apiVersion: v1
kind: ConfigMap
metadata:
  name: arm64-image-allowlist
  namespace: kyverno
  labels:
    app.kubernetes.io/part-of: platform
data:
  # One entry per image reference exactly as it appears in a pod spec, minus any
  # @sha256 digest. An entry means "this tag is a multi-arch index that has a
  # linux/arm64 manifest" (checked against each registry on 2026-11-08). It does
  # not mean the application is a good fit for a Pi: trim for that.
  images: |-
    [
      "ghcr.io/linuxserver/bazarr:v1.6.2-ls371",
      "mikefarah/yq:4.54.2",
      "docker.io/linuxserver/sonarr:develop-5.0.0.2941-ls208",
      "linuxserver/sonarr:develop-5.0.0.2941-ls208",
      "ghcr.io/linuxserver/radarr:6.4.4.10685-ls325",
      "ghcr.io/linuxserver/sabnzbd:5.1.3-ls280",
      "ghcr.io/onedr0p/exportarr:v2.3.0",
      "redimp/otterwiki:2.26.3",
      "busybox:1.37",
      "ghcr.io/connorgallopo/tracearr:3.1.7",
      "mirror.gcr.io/library/alpine:3.20",
      "timescale/timescaledb-ha:pg18.6-ts2.31.0",
      "redis:8.10.3-alpine",
      "ghcr.io/raydak-labs/configarr:1.39.1",
      "ghcr.io/luigi311/jellyplex-watched:9.0.0"
    ]
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: schedule-arm64-images
  annotations:
    policies.kyverno.io/title: Schedule Allowlisted Images On arm64 Workers
    policies.kyverno.io/category: Scheduling
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Pods in vcluster-media whose images are all on the arm64-image-allowlist
      ConfigMap in the kyverno namespace get the node.integratn.tech/arch
      toleration and a kubernetes.io/arch=arm64 nodeSelector, so they can run on
      the Raspberry Pi workers. Any other pod is left alone.
spec:
  admission: true
  validationFailureAction: Audit
  background: false
  rules:
    - name: mutate-allowlisted-images-to-arm64
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - vcluster-media
              operations:
                - CREATE
      context:
        - name: arm64Images
          configMap:
            name: arm64-image-allowlist
            namespace: kyverno
      preconditions:
        all:
          # At least one image, so a pod with none cannot pass AllIn vacuously.
          - key: "{{ request.object.spec.[initContainers[].image || `[]`, containers[].image || `[]`][] | length(@) }}"
            operator: GreaterThan
            value: 0
          - key: "{{ request.object.spec.[initContainers[].image || `[]`, containers[].image || `[]`][] | [*].split(@, '@')[0] }}"
            operator: AllIn
            value: "{{ parse_json(arm64Images.data.images) }}"
          # A pod already pinned to another architecture is left alone.
          - key: "{{ request.object.spec.nodeSelector.\"kubernetes.io/arch\" || 'arm64' }}"
            operator: Equals
            value: arm64
      mutate:
        # Other nodeSelector keys are kept (merge's second argument wins). The
        # toleration list keeps what the pod already has.
        patchesJson6902: |-
          - op: add
            path: /spec/nodeSelector
            value: {{ merge(`{"kubernetes.io/arch":"arm64"}`, request.object.spec.nodeSelector || `{}`) }}
          - op: add
            path: /spec/tolerations
            value: {{ [request.object.spec.tolerations || `[]`, `[{"key":"node.integratn.tech/arch","operator":"Equal","value":"arm64","effect":"NoSchedule"}]`][] }}
    - name: audit-non-allowlisted-images-on-arm64
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - vcluster-media
              operations:
                - CREATE
      context:
        - name: arm64Images
          configMap:
            name: arm64-image-allowlist
            namespace: kyverno
      preconditions:
        all:
          - key: "{{ request.object.spec.nodeSelector.\"kubernetes.io/arch\" || '' }}"
            operator: Equals
            value: arm64
      validate:
        message: >-
          This pod selects arm64 but runs an image that is not on the
          arm64-image-allowlist ConfigMap in the kyverno namespace. Check that
          the image has a linux/arm64 manifest and add it, or drop the nodeSelector.
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.[initContainers[].image || `[]`, containers[].image || `[]`][] | [*].split(@, '@')[0] }}"
                operator: AnyNotIn
                value: "{{ parse_json(arm64Images.data.images) }}"
