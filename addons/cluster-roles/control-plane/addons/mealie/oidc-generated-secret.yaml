# Creates the 1Password item `generated-mealie-oidc` (vault homelab) ONCE, with
# a random client secret nobody sees. Requested and approved by James on
# 2026-11-09 (skill secret-requests; the policy is network-policies/
# kyverno-restrict-pushsecret.yaml).
#
# Item `generated-mealie-oidc`, fields by label:
#   client-id      the fixed string "mealie" (not secret)
#   client-secret  64 random letters and digits, no symbols
#
# Read back by two ExternalSecrets through onepassword-store:
#   mealie-oidc            (this namespace, mealie/externalsecret.yaml)
#   authentik-mealie-oidc  (namespace authentik, authentik-mealie-secret.yaml)
#
# Create-only: updatePolicy IfNotExists never overwrites a field and
# deletionPolicy None never deletes the item, so deleting this file or the
# PushSecret leaves the item in place. Rotating or deleting it is done in
# 1Password, by hand; after a rotation both ExternalSecrets pick it up and
# Reloader restarts Mealie (annotation on its Deployment).
#
# `Password` is External Secrets' own generator kind; there is no custom code
# here. Letters and digits only, because the value ends up in URLs.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: generated-mealie-oidc
  namespace: mealie
spec:
  length: 64
  digits: 20
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: generated-mealie-oidc
  namespace: mealie
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - name: onepassword-store
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: generated-mealie-oidc
  template:
    data:
      client-id: "mealie"
      client-secret: "{{ .password }}"
  data:
    - match:
        secretKey: client-id
        remoteRef:
          remoteKey: generated-mealie-oidc
          property: client-id
    - match:
        secretKey: client-secret
        remoteRef:
          remoteKey: generated-mealie-oidc
          property: client-secret
