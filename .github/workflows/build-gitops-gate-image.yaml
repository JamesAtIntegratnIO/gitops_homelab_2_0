name: Build and Publish gitops-gate Image

on:
  push:
    branches:
      - main
    paths:
      - 'delivery/images/gitops-gate/**'
      - '.github/workflows/build-gitops-gate-image.yaml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/gitops-gate

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: delivery/images/gitops-gate/go.mod
          cache-dependency-path: delivery/images/gitops-gate/go.sum
      - name: Vet and test
        working-directory: delivery/images/gitops-gate
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt"; exit 1; }
          go vet ./...
          go test ./...

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # No 'latest'. An unpinned tag is how an image silently changes
          # underneath a cluster, which is the incident class this whole
          # delivery kit exists to prevent -- shipping one here would be
          # embarrassing.
          tags: |
            type=raw,value=main
            type=sha,prefix={{branch}}-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./delivery/images/gitops-gate
          # Multi-arch, unlike every other image here, because the gate is the
          # one that never runs in the cluster. The amd64-only rule is about
          # the three nodes; the gate's consumers are CI runners (amd64) and
          # developer machines (increasingly arm64 Macs). An amd64-only gate
          # cannot be run locally at all except under emulation, which is how
          # you end up with a gate nobody reproduces before pushing.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
