# specmarshal.cluster.integratn.tech -- the Specmarshal surface, behind
# authentik.
#
# The surface is not read-only: it registers projects, marks work ready, and
# steers runs, and Specmarshal has no authentication of its own yet. authentik's
# forward-auth (snippetsfilter.yaml, provider `specmarshal-proxy-provider` in the
# authentik blueprint ConfigMap) IS its access control. Never attach a route to
# this Service without that filter.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: specmarshal
  namespace: specmarshal
spec:
  parentRefs:
    - name: nginx-gateway
      namespace: nginx-gateway
      sectionName: https
  # external-dns runs with `--source=gateway-httproute`, so this hostname is
  # also what creates the DNS record.
  hostnames:
    - specmarshal.cluster.integratn.tech
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.nginx.org
            kind: SnippetsFilter
            name: authentik-forward-auth
      backendRefs:
        - name: specmarshal
          port: 4200
---
# The http half: a redirect to https, naming no backend. `matches` is written
# out for the reason bosun's is -- the API server defaults it, and omitting it
# leaves the route OutOfSync against its own live object.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: specmarshal-http-redirect
  namespace: specmarshal
spec:
  parentRefs:
    - name: nginx-gateway
      namespace: nginx-gateway
      sectionName: http
  hostnames:
    - specmarshal.cluster.integratn.tech
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
