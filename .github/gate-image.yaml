# The gitops-gate image the addons gate runs.
#
# Built and published by https://github.com/JamesAtIntegratnIO/bosun, which is
# where the gate's source lives. Multi-arch, so the same image that judges a
# pull request here can be run on a laptop.
#
# Deliberately NOT inside .github/workflows/. A GitHub token without the
# `workflow` scope is REFUSED any push touching .github/workflows/**, so a pin
# living in the workflow file could never be bumped automatically. Here it can.
# Tracked by the `gitops-gate` target in kargo-projects/values.yaml.
#
# Bosun cannot edit this either -- its deny-list refuses `.github/**` outright,
# which is the point. The agent must never be able to change the gate that
# judges it, and that includes changing WHICH gate runs.
#
# Digest-pinned, and Kargo keeps both halves in step (`format: image`). A tag
# alone is how an image silently changes underneath you, which is the incident
# class this gate exists to prevent.
#
# Kargo rules apply to this file: `image` must stay a scalar, in the first
# YAML document, with no trailing comment on its line.
image: ghcr.io/jamesatintegratnio/gitops-gate:main-0488a9d@sha256:dc99602723c3ecf25135ffafdf42eb5a6bc45ebc0271b5b266cb8f1c3d3df67e
