apiVersion: apps/v1
kind: Deployment
metadata:
  name: sequential-thinking
  namespace: mcp-system
  labels:
    app: sequential-thinking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sequential-thinking
  template:
    metadata:
      labels:
        app: sequential-thinking
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-sequential-thinking
          image: node:22-alpine
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - |
              npm install --prefix /npm-cache @modelcontextprotocol/server-sequential-thinking
          volumeMounts:
            - name: npm-cache
              mountPath: /npm-cache
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      containers:
        - name: sequential-thinking
          image: ghcr.io/supercorp-ai/supergateway:latest
          args:
            - --stdio
            - "node /npm-cache/node_modules/@modelcontextprotocol/server-sequential-thinking/dist/index.js"
            - --port
            - "8000"
            - --outputTransport
            - streamableHttp
            - --path
            - /mcp
            - --healthEndpoint
            - /healthz
          ports:
            - containerPort: 8000
              name: http
          volumeMounts:
            - name: npm-cache
              mountPath: /npm-cache
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: npm-cache
          emptyDir: {}
