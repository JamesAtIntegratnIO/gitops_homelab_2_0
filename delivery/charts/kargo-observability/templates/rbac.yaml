{{- if .Values.kubeStateMetrics.rbac.create }}
{{- /*
kube-state-metrics reads Kargo's CRDs with its own ServiceAccount, so it needs
permission this chart can grant directly rather than asking the operator to
edit the kube-state-metrics chart's own RBAC values. Read-only, and scoped to
Kargo's group plus the CRD list access CustomResourceState requires.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kargo-observability.fullname" . }}-ksm
  labels:
    {{- include "kargo-observability.labels" . | nindent 4 }}
rules:
  - apiGroups: [kargo.akuity.io]
    resources: [promotions, stages, warehouses, freights, projects]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kargo-observability.fullname" . }}-ksm
  labels:
    {{- include "kargo-observability.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kargo-observability.fullname" . }}-ksm
subjects:
  - kind: ServiceAccount
    name: {{ .Values.kubeStateMetrics.serviceAccountName }}
    namespace: {{ .Values.kubeStateMetrics.namespace }}
{{- end }}
