# ── Kargo: automated version updates ──────────────────────────────────
# Kargo watches every registry and chart repo this repo pins something from,
# and opens (and, where the per-target policy allows, merges) PRs that bump
# the pins. Three pieces: the chart (this entry, with kargo-extras/ attached
# as an extra source for the ExternalSecrets and HTTPRoute), the
# Projects/Warehouses/Stages rendered by the local kargo-projects chart
# below, and network-policies/kargo.yaml. Control-plane only: it must never
# render into a vcluster. Full picture in docs/kargo.md.
kargo:
  enabled: true
  namespace: kargo
  releaseName: kargo
  chartName: kargo
  project: platform-services
  chartRepository: oci://ghcr.io/akuity/kargo-charts/kargo
  defaultVersion: "1.11.2"
  selectorMatchLabels:
    cluster_role: control-plane
  additionalResources:
    type: manifest
    path: addons/cluster-roles/control-plane/addons/kargo-extras
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jqPathExpressions:
        - .spec.parentRefs[]?.group
        - .spec.parentRefs[]?.kind
        - .spec.rules[]?.backendRefs[]?.group
        - .spec.rules[]?.backendRefs[]?.kind
        - .spec.rules[]?.backendRefs[]?.weight
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.target.deletionPolicy
        - .spec.data[]?.remoteRef.conversionStrategy
        - .spec.data[]?.remoteRef.decodingStrategy
        - .spec.data[]?.remoteRef.metadataPolicy
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true

# Only the three *analysis* CRDs from Argo Rollouts: Kargo re-uses
# AnalysisTemplate/AnalysisRun for post-merge verification and runs the
# analysis itself. No Rollouts controller, no Rollout/Experiment CRDs. The
# directory source is forced (kustomization.yaml sits in that folder) and
# filtered to those three files. Kargo tracks this version too
# (kargo-projects target argo-rollouts-crds); it rewrites both pins below.
argo-rollouts-crds:
  enabled: true
  type: manifest
  namespace: kargo
  project: platform-services
  defaultVersion: v1.9.1
  annotationsApp:
    argocd.argoproj.io/sync-wave: "-1"
  selectorMatchLabels:
    cluster_role: control-plane
  generatorValues:
    argoRolloutsRevision: v1.9.1
  manifestSource:
    repoURL: https://github.com/argoproj/argo-rollouts.git
    path: manifests/crds
    directory:
      include: '{analysis-run-crd.yaml,analysis-template-crd.yaml,cluster-analysis-template-crd.yaml}'
    targetRevisionFromValue: argoRolloutsRevision
  syncPolicy:
    automated:
      # Never prune: removing a CRD cascade-deletes every AnalysisRun and
      # AnalysisTemplate with it.
      prune: false
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true

# The target list lives in kargo-projects/values.yaml next to this file.
kargo-projects:
  enabled: true
  namespace: kargo
  project: platform-services
  defaultVersion: "main"
  path: addons/charts/kargo-projects
  selectorMatchLabels:
    cluster_role: control-plane
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      # The Kargo CRDs arrive with the kargo app above; do not fail the
      # dry-run while they are still missing on a fresh cluster.
      - SkipDryRunOnMissingResource=true
