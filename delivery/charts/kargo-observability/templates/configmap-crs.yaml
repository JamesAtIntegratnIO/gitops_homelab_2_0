{{- $p := include "kargo-observability.prefix" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.kubeStateMetrics.configMapName }}
  namespace: {{ .Values.kubeStateMetrics.namespace }}
  labels:
    {{- include "kargo-observability.labels" . | nindent 4 }}
data:
  # kube-state-metrics CustomResourceState config. Point kube-state-metrics at
  # this ConfigMap with customResourceState.create=false and .name set to it;
  # if both charts create it, they fight over ownership on every sync.
  {{ .Values.kubeStateMetrics.configMapKey }}: |
    spec:
      resources:
        # ---------------------------------------------------------------
        # Promotion -- one object per attempt, so these accumulate. Phase is
        # a StateSet rather than one Info series per promotion name, which
        # keeps `count by (stage, phase)` cheap as the history grows.
        # ---------------------------------------------------------------
        - groupVersionKind:
            group: kargo.akuity.io
            version: v1alpha1
            kind: Promotion
          # kube-state-metrics prefixes every custom-resource metric with
          # `kube_customresource_` unless this is set. The names below already
          # carry their own prefix, so an empty value is what makes the series
          # come out as documented in docs/metrics.md.
          metricNamePrefix: ""
          labelsFromPath:
            namespace: [metadata, namespace]
            promotion: [metadata, name]
            stage: [spec, stage]
          metrics:
            - name: {{ $p }}_promotion_phase
              help: "Current phase of a Kargo Promotion."
              each:
                type: StateSet
                stateSet:
                  labelName: phase
                  path: [status, phase]
                  list: [Pending, Running, Succeeded, Failed, Errored, Aborted]
            - name: {{ $p }}_promotion_created
              help: "Unix creation time of a Kargo Promotion."
              each:
                type: Gauge
                gauge:
                  path: [metadata, creationTimestamp]

        # ---------------------------------------------------------------
        # Stage -- the durable view. Conditions carry the real signal:
        # Verified=False with reason VerificationError is a failed
        # post-merge check, and nothing else reports it.
        # ---------------------------------------------------------------
        - groupVersionKind:
            group: kargo.akuity.io
            version: v1alpha1
            kind: Stage
          # kube-state-metrics prefixes every custom-resource metric with
          # `kube_customresource_` unless this is set. The names below already
          # carry their own prefix, so an empty value is what makes the series
          # come out as documented in docs/metrics.md.
          metricNamePrefix: ""
          labelsFromPath:
            namespace: [metadata, namespace]
            stage: [metadata, name]
          metrics:
            - name: {{ $p }}_stage_condition
              help: "Kargo Stage conditions (Ready, Healthy, Verified) as 1/0/-1 for true/false/unknown."
              each:
                type: Gauge
                gauge:
                  path: [status, conditions]
                  labelsFromPath:
                    condition: [type]
                    reason: [reason]
                  valueFrom: [status]
              # `status` is the string True/False/Unknown; KSM maps those to
              # 1/0/-1 automatically for Gauge.
            - name: {{ $p }}_stage_last_promotion_phase
              help: "Phase of the most recent Promotion into this Stage."
              each:
                type: StateSet
                stateSet:
                  labelName: phase
                  path: [status, lastPromotion, status, phase]
                  list: [Pending, Running, Succeeded, Failed, Errored, Aborted]
            - name: {{ $p }}_stage_verification_phase
              help: "Phase of the most recent verification of the Stage's current Freight."
              each:
                type: StateSet
                stateSet:
                  labelName: phase
                  path: [status, freightHistory, "0", verificationHistory, "0", phase]
                  list: [Pending, Running, Successful, Failed, Error, Inconclusive]
            - name: {{ $p }}_stage_current_freight
              help: "The Freight the Stage is currently on."
              each:
                type: Info
                info:
                  labelsFromPath:
                    freight: [status, freightSummary]

        # ---------------------------------------------------------------
        # Warehouse -- lastFreightID is what the newest discovered artifact
        # is. Comparing it to the Stage's current freight is how a stage
        # that silently stopped moving becomes visible.
        # ---------------------------------------------------------------
        - groupVersionKind:
            group: kargo.akuity.io
            version: v1alpha1
            kind: Warehouse
          # kube-state-metrics prefixes every custom-resource metric with
          # `kube_customresource_` unless this is set. The names below already
          # carry their own prefix, so an empty value is what makes the series
          # come out as documented in docs/metrics.md.
          metricNamePrefix: ""
          labelsFromPath:
            namespace: [metadata, namespace]
            warehouse: [metadata, name]
          metrics:
            - name: {{ $p }}_warehouse_condition
              help: "Kargo Warehouse conditions as 1/0/-1 for true/false/unknown."
              each:
                type: Gauge
                gauge:
                  path: [status, conditions]
                  labelsFromPath:
                    condition: [type]
                    reason: [reason]
                  valueFrom: [status]
            - name: {{ $p }}_warehouse_last_freight
              help: "The most recent Freight this Warehouse produced."
              each:
                type: Info
                info:
                  labelsFromPath:
                    freight: [status, lastFreightID]

        # ---------------------------------------------------------------
        # Freight -- discoveredAt drives warehouse staleness. Deliberately
        # no per-freight name label: 41 objects today and only growing.
        # ---------------------------------------------------------------
        - groupVersionKind:
            group: kargo.akuity.io
            version: v1alpha1
            kind: Freight
          # kube-state-metrics prefixes every custom-resource metric with
          # `kube_customresource_` unless this is set. The names below already
          # carry their own prefix, so an empty value is what makes the series
          # come out as documented in docs/metrics.md.
          metricNamePrefix: ""
          labelsFromPath:
            namespace: [metadata, namespace]
            warehouse: [origin, name]
          metrics:
            - name: {{ $p }}_freight_discovered
              help: "Unix time at which a Freight was discovered."
              each:
                type: Gauge
                gauge:
                  path: [metadata, creationTimestamp]
