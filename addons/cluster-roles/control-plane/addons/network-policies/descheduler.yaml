# descheduler: a CronJob that lists nodes/pods and evicts a few of them.
# Talks only to the kube-apiserver, so DNS + apiserver egress is the whole set.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: descheduler
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-kube-api
  namespace: descheduler
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
