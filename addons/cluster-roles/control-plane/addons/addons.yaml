# ── Kargo: automated version updates ──────────────────────────────────
# Kargo watches every registry and chart repo this repo pins something from,
# and opens (and, where the per-target policy allows, merges) PRs that bump
# the pins. Three pieces: the chart (this entry, with kargo-extras/ attached
# as an extra source for the ExternalSecrets and HTTPRoute), the
# Projects/Warehouses/Stages rendered by the local kargo-projects chart
# below, and network-policies/kargo.yaml. Control-plane only: it must never
# render into a vcluster. Full picture in docs/kargo.md.
kargo:
  enabled: true
  namespace: kargo
  releaseName: kargo
  chartName: kargo
  project: platform-services
  chartRepository: oci://ghcr.io/akuity/kargo-charts/kargo
  defaultVersion: "1.11.2"
  selectorMatchLabels:
    cluster_role: control-plane
  additionalResources:
    type: manifest
    path: addons/cluster-roles/control-plane/addons/kargo-extras
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jqPathExpressions:
        - .spec.parentRefs[]?.group
        - .spec.parentRefs[]?.kind
        - .spec.rules[]?.backendRefs[]?.group
        - .spec.rules[]?.backendRefs[]?.kind
        - .spec.rules[]?.backendRefs[]?.weight
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.target.deletionPolicy
        - .spec.data[]?.remoteRef.conversionStrategy
        - .spec.data[]?.remoteRef.decodingStrategy
        - .spec.data[]?.remoteRef.metadataPolicy
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true

# Argo Rollouts, controller only, because Kargo's post-merge verification
# needs it: Kargo builds the AnalysisRuns, Argo Rollouts' controller executes
# them (the first attempt installed just the analysis CRDs and 23 runs sat
# with no measurements). No Rollout objects exist here; the chart owns its
# five CRDs. Kargo tracks the chart version (kargo-projects target
# argo-rollouts). Control-plane only.
argo-rollouts:
  enabled: true
  namespace: argo-rollouts
  releaseName: argo-rollouts
  chartName: argo-rollouts
  project: platform-services
  chartRepository: https://argoproj.github.io/argo-helm
  defaultVersion: "2.41.1"
  annotationsApp:
    argocd.argoproj.io/sync-wave: "-1"
  selectorMatchLabels:
    cluster_role: control-plane
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

# The target list lives in kargo-projects/values.yaml next to this file.
bosun:
  # Bosun lives in its own repository now --
  # https://github.com/JamesAtIntegratnIO/bosun -- and ships as a versioned OCI
  # chart rather than a path into this one. So this is an ordinary third-party
  # chart addon, and `defaultVersion` is a real pin that Kargo tracks (target
  # `bosun` in kargo-projects/values.yaml) instead of the branch name it used
  # to be.
  #
  # The image follows the chart: values.yaml leaves `image.tag` unset and the
  # chart falls back to its own appVersion, so one bump moves both and they
  # cannot drift apart.
  #
  # The model endpoint is serving on the workstation and the credentials are in
  # 1Password. See
  # addons/cluster-roles/control-plane/addons/bosun/values.yaml.
  enabled: true
  namespace: bosun
  chartName: bosun
  project: platform-services
  chartRepository: oci://ghcr.io/jamesatintegratnio/charts/bosun
  # 0.25.1 -- a security review of the agent and the chart, and five chart
  # versions of accumulated drift closed in one move. What it needs from the
  # values file beside this one, because none of it is optional:
  #
  #   - `gate.mode`, `gate.wait` and `gate.inventorySource` are gone (0.22.0).
  #     One gate, in the cluster, reading its inventory from the ArgoCD API.
  #   - `gate.argocd.port` is `gate.argocd.podPort` (0.21.0).
  #   - `metrics.serviceMonitor.namespace` is REQUIRED with the ServiceMonitor
  #     and the NetworkPolicy both on (0.24.0). Without it the render fails by
  #     name; the old rule admitted any pod labelled prometheus in any
  #     namespace, to a port serving the whole HTTP surface.
  #
  # The agent is breaking too: internal address space is refused at the dial
  # unless named in `triage.egressAllowPrivate`, and the edit scope is read
  # from the pull request's diff rather than from the promotion body. Neither
  # needs a value here; see the notes in that file.
  #
  # 0.25.1 and not 0.25.0: 0.25.0's ClusterRole is not YAML when `liveReads`
  # is on, which is on here.
  #
  # Verified against the PUBLISHED chart rather than the tree: 0.25.1 renders
  # these values to eight valid documents, selects bosun:0.25.0, mounts the
  # credentials as files with no secretKeyRef env left, and scopes the metrics
  # ingress to the monitoring namespace.
  #
  # 0.27.0 -- the gate stops passing a chart it could not render, and gains the
  # repair for one. Two things arrive together:
  #
  #   - a render that fails at the head revision now blocks instead of being
  #     filed under "not covered", which is the defect that let 0.25.1 through
  #     green while its values.schema.json refused four keys this file was
  #     still setting (bosun#83);
  #   - the gate derives what to render from ArgoCD, so `.gitops-gate.yaml`
  #     becomes optional and `.bosun.yaml` is the filename it moves to.
  #
  # Rendered against this repository's own bosun values at 0.27.0 before the
  # bump: clean, so nothing in the file beside this one has to move with it.
  # 0.28.0 -- the report stops burying its signal: scalar lists align (one
  # inserted flag is one line), namespace stamps that change no applied byte
  # vanish, and the fields this repository's own values set surface above a
  # fold whose summary is the whole read for most bumps.
  # 0.28.1 -- the two values.yaml files in this repository's own bosun and
  # nginx-gateway-fabric directory sources stop counting as schema
  # rejections. They put a standing schema=2 on every pull request here,
  # blocking, on apps the pull request had not touched.
  # 0.28.2 -- a value that names the addon itself no longer claims that
  # addon's label churn as "values this repository sets" (bosun#91), and the
  # report stops escaping backticks it wrote itself (bosun#89).
  # 0.29.0 -- the pipeline report renders itself as a page. `web.enabled`
  # defaults on in this version, so the bump alone opens a second container
  # port; what makes it reachable is spread across four places and none of
  # them works alone: `web.allowFrom` in bosun/values.yaml, the matching
  # egress in network-policies/nginx-gateway.yaml, the hand-written routes and
  # SnippetsFilter in bosun/, and the proxy provider in the authentik
  # blueprint ConfigMap. Published at bosun.cluster.integratn.tech, behind
  # authentik forward-auth. `web.httpRoute` stays OFF: the chart's route
  # cannot carry the filter that puts authentik in front.
  defaultVersion: 0.30.0
  additionalResources:
    type: manifest
    path: addons/cluster-roles/control-plane/addons/bosun
  selectorMatchLabels:
    cluster_role: control-plane
  # The ExternalSecret CRD defaults three fields inside every `remoteRef`
  # (`conversionStrategy: Default`, `decodingStrategy: None`,
  # `metadataPolicy: None`) plus `target.deletionPolicy`. The manifests do not
  # set them, so the API server writes them and ArgoCD's predicted live state
  # -- which only carries what argocd-controller owns -- lacks them. The app
  # then reports OutOfSync forever while syncing successfully every time.
  #
  # Same block as the kargo addon above; `RespectIgnoreDifferences` is what
  # makes it apply during sync and not only in the diff view.
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.target.deletionPolicy
        - .spec.data[]?.remoteRef.conversionStrategy
        - .spec.data[]?.remoteRef.decodingStrategy
        - .spec.data[]?.remoteRef.metadataPolicy
    # Same reason as the block above, different CRDs. The API server defaults
    # `group` and `kind` inside every parentRef and backendRef, and `weight`
    # on every backendRef; the two routes this addon now owns set none of
    # them, so the predicted live state lacks what the server writes and the
    # app reports OutOfSync forever while syncing successfully every time.
    # `.status` is the same story on both objects -- the gateway writes the
    # attachment result there. Union of what the authentik and qdrant entries
    # in this file already carry, because this addon now ships both kinds.
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jqPathExpressions:
        - .status
        - .spec.parentRefs[]?.group
        - .spec.parentRefs[]?.kind
        - .spec.rules[]?.backendRefs[]?.group
        - .spec.rules[]?.backendRefs[]?.kind
        - .spec.rules[]?.backendRefs[]?.weight
    - group: gateway.nginx.org
      kind: SnippetsFilter
      jqPathExpressions:
        - .status
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true

kargo-observability:
  # Its own repository now --
  # https://github.com/JamesAtIntegratnIO/kargo-observability -- because it
  # shares no contract with the gate or the agent and is useful to anyone
  # running Kargo. Consumed as a versioned OCI chart; `defaultVersion` is a
  # real pin that Kargo tracks.
  #
  # No valuesFolderName or releaseName override needed here: the addon key and
  # the chart name are both `kargo-observability`, so nothing moves.
  enabled: true
  namespace: monitoring
  chartName: kargo-observability
  project: platform-services
  chartRepository: oci://ghcr.io/jamesatintegratnio/charts/kargo-observability
  defaultVersion: "0.1.1"
  # Ahead of kube-prometheus-stack. That chart now mounts the
  # CustomResourceState ConfigMap this addon creates, and a kube-state-metrics
  # pod that rolls before the ConfigMap exists sits in
  # CreateContainerConfigError until it appears. It self-heals, but a
  # sync-wave avoids the flap entirely.
  annotationsApp:
    argocd.argoproj.io/sync-wave: "-1"
  selectorMatchLabels:
    cluster_role: control-plane
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      # PrometheusRule and the Kargo CRDs it references may not exist yet on a
      # fresh cluster; do not fail the dry-run on that.
      - SkipDryRunOnMissingResource=true

kargo-projects:
  # Renders the Warehouses and Stages from the target list in
  # kargo-projects/values.yaml beside this file. The chart is `kargo-pipelines`
  # and now ships from https://github.com/JamesAtIntegratnIO/bosun as a
  # versioned OCI package, so `defaultVersion` is a real pin that Kargo tracks
  # rather than the branch name it used to be.
  #
  # THE ADDON KEY STAYS `kargo-projects` AND TWO FIELDS PIN WHAT IT WOULD
  # OTHERWISE DRAG WITH IT. Both default to the chart name, and both would
  # change the moment `chartName` was introduced:
  #
  #   valuesFolderName  value files resolve by CHART name, not addon key, so
  #                     without this the app would look for
  #                     `addons/.../kargo-pipelines/values.yaml` -- which does
  #                     not exist -- and render 0 Warehouses from an empty
  #                     target list. Silently: an empty list is valid input.
  #   releaseName       the Helm release would become `kargo-pipelines`, and a
  #                     renamed release is a DELETE AND RECREATE of all 118
  #                     Projects, Warehouses and Stages, taking every promotion
  #                     with it.
  #
  # `nameLabel: kargo-projects` in the values file keeps the third one --
  # app.kubernetes.io/name -- stable for the same reason.
  enabled: true
  namespace: kargo
  chartName: kargo-pipelines
  valuesFolderName: kargo-projects
  releaseName: kargo-projects
  project: platform-services
  chartRepository: oci://ghcr.io/jamesatintegratnio/charts/kargo-pipelines
  # 0.1.1 carries the fix that makes the triage hook actually reach Bosun.
  # Every call before it died at Kargo's own config validation -- the body
  # rendered as an object where the http step requires a string -- and
  # `continueOnError` on that step meant nothing ever said so.
  defaultVersion: 0.2.0
  selectorMatchLabels:
    cluster_role: control-plane
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      # The Kargo CRDs arrive with the kargo app above; do not fail the
      # dry-run while they are still missing on a fresh cluster.
      - SkipDryRunOnMissingResource=true
