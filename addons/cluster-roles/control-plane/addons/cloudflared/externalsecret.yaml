# The tunnel's token, from 1Password through onepassword-store.
#
# The token is the tunnel's credential: whoever holds it can run a connector
# for this tunnel and receive the traffic Cloudflare routes to it. It never
# leaves this namespace and is never logged; cloudflared reads it from
# TUNNEL_TOKEN (deployment.yaml).
#
# It is an output of the tunnel's stack in IntegratnIO/infrastructure, copied
# into 1Password by hand. Re-creating the tunnel there makes a new token, and
# the connectors here fail to authenticate until the item is updated.
#
# 1Password item "cloudflared-tunnel", field (read by its LABEL):
#   token  the tunnel token, one line
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-tunnel
  namespace: cloudflared
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: cloudflared-tunnel
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef: { key: cloudflared-tunnel, property: token }
