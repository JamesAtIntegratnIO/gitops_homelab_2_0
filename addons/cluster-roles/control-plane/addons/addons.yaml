# The host cluster's CoreDNS Corefile. Talos also writes this ConfigMap, as
# bootstrap manifest `11-core-dns`, and re-applies it on every boot and machine
# config change -- `cluster.coreDNS` has no Corefile field, so there is nowhere
# in the machine config to put the `rewrite` line instead. selfHeal is what
# makes this durable rather than decorative: it reverts a Talos re-apply within
# the sync interval instead of the rewrite being lost until someone notices.
#
# prune is off deliberately. Everything else here prunes; pruning
# kube-system/coredns is a cluster-wide DNS outage, so disabling this addon
# must leave Talos's copy standing rather than delete the ConfigMap.
coredns-host-config:
  enabled: true
  type: manifest
  namespace: kube-system
  project: platform-services
  defaultVersion: "main"
  path: addons/cluster-roles/control-plane/addons/coredns
  selector:
    matchExpressions:
      - key: cluster_role
        operator: In
        values: ['control-plane']
  syncPolicy:
    automated:
      selfHeal: true
      prune: false

# STAGED, DELIBERATELY OFF. The other half of the CoreDNS story: the
# ServiceAccount, RBAC, Deployment and Service that Talos stops shipping the
# moment `cluster.coreDNS.disabled: true` is on. Enabling this without that
# machine config change is harmless (the manifests are byte-identical to what
# Talos renders today -- `kubectl diff` is empty), but pointless.
#
# Cutover order, and it matters -- see
# addons/cluster-roles/control-plane/addons/coredns-workload/README.md:
#   1. flip this to true, confirm the app is Synced/Healthy with an empty diff;
#   2. only then apply matchbox/talos-machineconfigs/live-coredns-disabled.yaml,
#      one node at a time.
# Doing it the other way round leaves a window where Talos has stopped
# recreating CoreDNS and nothing else has started.
#
# prune stays false for the same reason as coredns-host-config: these objects
# are cluster DNS, and Talos will not put them back once disabled.
coredns-workload:
  enabled: false
  type: manifest
  namespace: kube-system
  project: platform-services
  defaultVersion: "main"
  path: addons/cluster-roles/control-plane/addons/coredns-workload
  selector:
    matchExpressions:
      - key: cluster_role
        operator: In
        values: ['control-plane']
  syncPolicy:
    automated:
      selfHeal: true
      prune: false

