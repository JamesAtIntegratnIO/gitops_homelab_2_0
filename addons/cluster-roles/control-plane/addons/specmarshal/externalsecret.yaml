# Specmarshal's credentials, all from 1Password through onepassword-store.
#
# One Secret per 1Password item, so each item can be rotated -- or replaced by a
# different kind of credential -- without touching the others. Every item and
# field named below is listed, with what goes in it, in README.md beside this
# file.
---
# The measurement store's Postgres login.
#
# 1Password item "specmarshal-db-connection" (an API Credential item). The
# fields are read by their LABELS, exactly as the item spells them today:
#
#   host      10.0.3.1
#   port      5432
#   text      the role name (specmarshal)
#   password  the role's password
#
# The item's built-in `username` and `credential` fields are empty and are
# not read. Renaming a field in the item breaks this Secret: the label IS the
# key the provider looks up.
#
# The password is handed over as PGPASSWORD rather than spliced into the
# connection string. The store opens `new pg.Pool({ connectionString })`, and
# node-postgres falls back to PGPASSWORD for a string that carries none -- so a
# password with `@`, `/` or `%` in it cannot corrupt the URL, and the URL
# itself, which Specmarshal names in its own error messages, carries no secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: specmarshal-db
  namespace: specmarshal
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: specmarshal-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SPECMARSHAL_STORE: "postgres://{{ .user }}@{{ .host }}:{{ .port }}/specmarshal"
        PGPASSWORD: "{{ .password }}"
  data:
    - secretKey: host
      remoteRef: { key: specmarshal-db-connection, property: host }
    - secretKey: port
      remoteRef: { key: specmarshal-db-connection, property: port }
    - secretKey: user
      remoteRef: { key: specmarshal-db-connection, property: text }
    - secretKey: password
      remoteRef: { key: specmarshal-db-connection, property: password }
---
# The GitHub App Specmarshal acts as. The `github-app` init container in
# deployment.yaml stores these under the Specmarshal home on every start, the
# same thing `specmarshal github-app` does on a laptop, so the key never sits in
# the environment of the git and gh processes the orchestrator spawns.
#
# 1Password item "specmarshal-github-app", fields:
#   app-id           the App's numeric id
#   installation-id  the installation's id (from its settings URL)
#   private-key      the App's PEM private key, whole
#
# The App's repository permissions are the five src/tracker/github/credential.ts
# names: Administration, Contents, Issues, Pull requests (all write), Metadata
# (read). `specmarshal github-app` with no flags prints the walk-through.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: specmarshal-github-app
  namespace: specmarshal
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: specmarshal-github-app
    creationPolicy: Owner
  data:
    - secretKey: app-id
      remoteRef: { key: specmarshal-github-app, property: app-id }
    - secretKey: installation-id
      remoteRef: { key: specmarshal-github-app, property: installation-id }
    - secretKey: private-key
      remoteRef: { key: specmarshal-github-app, property: private-key }
---
# Read access to the private GHCR packages, as an imagePullSecret -- twice,
# because a pull secret is namespaced:
#   - in specmarshal, for the orchestrator image, and
#   - in specmarshal-agents, for the sandbox images the iteration Jobs run
#     (the orchestrator names it with SPECMARSHAL_KUBERNETES_PULL_SECRET).
# The kubelet uses it to pull; it is never mounted into any container, so an
# agent never holds a registry credential.
#
# Deliberately not the hand-applied `ghcr-pull` in platform-requests: that one
# is a different identity with its token in a last-applied annotation.
#
# 1Password item "specmarshal-ghcr", fields:
#   username  the GitHub account the token belongs to
#   token     a classic PAT with read:packages only (fine-grained tokens cannot
#             read GHCR packages)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: specmarshal-ghcr
  namespace: specmarshal
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: specmarshal-ghcr
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef: { key: specmarshal-ghcr, property: username }
    - secretKey: token
      remoteRef: { key: specmarshal-ghcr, property: token }
---
# The same credential, for the iteration Jobs' sandbox images.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: specmarshal-ghcr
  namespace: specmarshal-agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: specmarshal-ghcr
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef: { key: specmarshal-ghcr, property: username }
    - secretKey: token
      remoteRef: { key: specmarshal-ghcr, property: token }
