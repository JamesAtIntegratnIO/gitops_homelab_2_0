# home.cluster.integratn.tech -- the landing page, behind authentik.
#
# Homepage has no authentication of its own and renders live cluster state, so
# authentik's forward-auth (snippetsfilter.yaml, provider
# `homepage-proxy-provider` in the authentik blueprint ConfigMap) is the only
# door. Never attach a route to this Service without it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage
  namespace: homepage
spec:
  parentRefs:
    - name: nginx-gateway
      namespace: nginx-gateway
      sectionName: https
  # external-dns runs with `--source=gateway-httproute`, so this hostname is
  # also what creates the DNS record -- to the LAN VIP, like every other.
  hostnames:
    - home.cluster.integratn.tech
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.nginx.org
            kind: SnippetsFilter
            name: authentik-forward-auth
      backendRefs:
        - name: homepage
          port: 3000
---
# The http half: a redirect to https, naming no backend. `matches` is written
# out because the API server defaults it, and omitting it leaves the route
# OutOfSync against its own live object.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage-http-redirect
  namespace: homepage
spec:
  parentRefs:
    - name: nginx-gateway
      namespace: nginx-gateway
      sectionName: http
  hostnames:
    - home.cluster.integratn.tech
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
