# PushSecrets may only CREATE new `generated-*` items, through one store.
#
# Why: the store onepassword-generated has a write token for the whole
# `homelab` vault (secret-generation addon). `updatePolicy: Replace` (the
# PushSecret default) would overwrite an existing item's fields, and
# `deletionPolicy: Delete` would remove an item when the PushSecret goes. This
# policy makes both impossible, keeps every PushSecret on that one store, and
# keeps every remoteKey in the `generated-` namespace so a PushSecret cannot be
# aimed at an existing credential.
#
# No PushSecret exists in the cluster yet, so Enforce blocks nothing today.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-pushsecret
  annotations:
    policies.kyverno.io/title: Restrict PushSecret to create-only generated-* items
    policies.kyverno.io/category: Secrets
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      A PushSecret must target only the ClusterSecretStore
      onepassword-generated, with updatePolicy IfNotExists, deletionPolicy
      None and remoteKeys starting generated-, so it can create new items and
      never overwrite or delete one.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: pushsecret-create-only
      match:
        any:
          - resources:
              kinds:
                - external-secrets.io/v1alpha1/PushSecret
      validate:
        message: >-
          A PushSecret must use updatePolicy IfNotExists, deletionPolicy None,
          secretStoreRefs of only the ClusterSecretStore onepassword-generated,
          and a remoteKey starting generated- on every data entry.
        pattern:
          spec:
            updatePolicy: IfNotExists
            deletionPolicy: None
            secretStoreRefs:
              - name: onepassword-generated
                kind: ClusterSecretStore
            data:
              - match:
                  remoteRef:
                    remoteKey: "generated-*"
