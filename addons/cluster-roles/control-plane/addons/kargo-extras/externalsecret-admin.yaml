# Break-glass admin login for the Kargo UI and CLI. Day-to-day login is OIDC
# through Authentik; this is what still works when Authentik does not.
#
# Requires 1Password item "kargo-admin" with properties:
#   password-hash      bcrypt hash of the chosen password, e.g.
#                        htpasswd -bnBC 10 "" '<password>' | tr -d ':\n'
#   token-signing-key  random string used to sign admin ID tokens, e.g.
#                        openssl rand -base64 29 | tr -d "=+/"
#
# The chart's api.secret.name points at the Secret this produces, so the chart
# does not render one of its own.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kargo-admin-credentials
  namespace: kargo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: kargo-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: ADMIN_ACCOUNT_PASSWORD_HASH
      remoteRef:
        key: kargo-admin
        property: password-hash
    - secretKey: ADMIN_ACCOUNT_TOKEN_SIGNING_KEY
      remoteRef:
        key: kargo-admin
        property: token-signing-key
