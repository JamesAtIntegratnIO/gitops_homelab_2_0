apiVersion: apps/v1
kind: Deployment
metadata:
  name: sequential-thinking
  namespace: mcp-system
  labels:
    app: sequential-thinking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sequential-thinking
  template:
    metadata:
      labels:
        app: sequential-thinking
    spec:
      # Deferrable: developer tooling, not a platform dependency.
      priorityClassName: platform-batch
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sequential-thinking
          image: ghcr.io/supercorp-ai/supergateway:3.4.3@sha256:095acf4471e142553c1a5514aa5e480abbc5885d00549d4a3481cc70eac53889
          args:
            - --stdio
            - "npx -y @modelcontextprotocol/server-sequential-thinking"
            - --port
            - "8000"
            - --outputTransport
            - streamableHttp
            - --path
            - /mcp
            - --healthEndpoint
            - /healthz
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
