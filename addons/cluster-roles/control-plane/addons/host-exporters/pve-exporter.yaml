# prometheus-pve-exporter (github.com/prometheus-pve/prometheus-pve-exporter):
# the Proxmox VE host at 192.168.0.10 as pve_* metrics -- the node, every guest
# (up, onboot, CPU, memory) and every storage pool. Credentials are the same
# read-only API token the landing page's Proxmox widget uses
# (externalsecret.yaml). Prometheus calls /pve?target=... through the
# ServiceMonitor below; the exporter itself holds no state.
#
# The Deployment stays the FIRST document in this file: Kargo rewrites its
# image line in place (target `pve-exporter` in kargo-projects/values.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pve-exporter
  namespace: host-exporters
  labels:
    app.kubernetes.io/name: pve-exporter
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: pve-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pve-exporter
    spec:
      automountServiceAccountToken: false
      priorityClassName: platform-batch
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: docker.io/prompve/prometheus-pve-exporter:3.11.0@sha256:290756c34fd13e1d9972b8e64344d49a15ab99dd0053b29d9716f1ca4ae4c069
          # The default is [::]:9221; the pod network is IPv4 only.
          args:
            - --web.listen-address=0.0.0.0:9221
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # PVE_USER being set is what makes the exporter read its config
          # from the environment instead of /etc/prometheus/pve.yml.
          envFrom:
            - secretRef:
                name: pve-exporter
          env:
            # Proxmox serves its own self-signed certificate.
            - name: PVE_VERIFY_SSL
              value: "false"
          ports:
            - name: http
              containerPort: 9221
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # Not /pve: a liveness probe must never depend on Proxmox answering.
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 60
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pve-exporter
  namespace: host-exporters
  labels:
    app.kubernetes.io/name: pve-exporter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pve-exporter
  ports:
    - name: http
      port: 9221
      targetPort: http
      protocol: TCP
---
# job="pve-exporter" (the Service name). instance is rewritten to `proxmox`,
# so alerts and the landing page name the host rather than the exporter pod.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pve-exporter
  namespace: host-exporters
  labels:
    app.kubernetes.io/name: pve-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pve-exporter
  endpoints:
    - port: http
      path: /pve
      params:
        target: ["192.168.0.10"]
        cluster: ["1"]
        node: ["1"]
      interval: 60s
      scrapeTimeout: 30s
      relabelings:
        - targetLabel: instance
          replacement: proxmox
