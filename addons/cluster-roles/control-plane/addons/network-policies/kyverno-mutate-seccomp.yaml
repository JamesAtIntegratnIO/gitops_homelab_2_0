# Kyverno policy: Inject seccomp RuntimeDefault profile on all pods
# Fixes AVD-KSV-0030 (no seccomp profile) and AVD-KSV-0104 (unconfined seccomp)
# Kyverno CEL policy (policies.kyverno.io/v1; ClusterPolicy is gone in 1.20).
# CREATE only, for the same reason (seccompProfile is
# immutable on a running pod). Pods only: every pod a controller makes is
# mutated as it is created, so the controllers' templates are left alone.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: mutate-seccomp-default
  annotations:
    policies.kyverno.io/title: Add Seccomp RuntimeDefault
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Sets the pod-level seccompProfile to RuntimeDefault when the pod sets no
      seccomp profile of its own.
spec:
  evaluation:
    admission:
      enabled: true
    mutateExisting:
      enabled: false
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  matchConditions:
    - name: no-seccomp-profile
      expression: "!has(object.spec.securityContext) || !has(object.spec.securityContext.seccompProfile)"
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              securityContext: Object.spec.securityContext{
                seccompProfile: Object.spec.securityContext.seccompProfile{
                  type: "RuntimeDefault"
                }
              }
            }
          }
