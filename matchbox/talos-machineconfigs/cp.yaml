machine:
  kubelet:
    extraArgs:
      node-labels: "!node.kubernetes.io/exclude-from-external-load-balancers"
  network:
    interfaces:
    - deviceSelector:
        physical: true
      addresses:
        - 10.0.4.101/9
      vip:
        ip: 10.0.4.100
cluster:
  allowSchedulingOnControlPlanes: true
  apiServer:
    extraArgs:
      # Default is 300s: after a node goes away its pods sit there for five
      # minutes before the scheduler may move them. 60s is the cluster-wide
      # version of the per-workload tolerations set on the recovery-path addons,
      # and it also covers pods from charts we do not control -- vcluster-synced
      # pods, Kratix pipeline Jobs. Not lower than ~45s: below that a brief
      # network blip starts evicting pods that were never really gone.
      default-not-ready-toleration-seconds: "60"
      default-unreachable-toleration-seconds: "60"
  controllerManager:
    extraArgs:
      bind-address: "0.0.0.0"
  scheduler:
    extraArgs:
      bind-address: "0.0.0.0"
  network:
    cni:
      name: none
  proxy:
    disabled: true
  etcd:
    extraArgs:
      listen-metrics-urls: "https://0.0.0.0:2381"
      # etcd defaults are 100 ms / 1000 ms, sized for disks that fsync in
      # single-digit ms. These nodes share one SATA SSD between the OS,
      # containerd and etcd: fsync p99 sits at ~55 ms on .101/.102 and
      # stalls 0.5-3 s under image or scan I/O, and a leader stalled on fsync
      # stops sending heartbeats, so followers call an election. 250/2500
      # rides out the stalls seen on the leader so far (max 478 ms on .101);
      # the cost is that a node that really dies takes ~2.5 s, not ~1 s, to
      # lose leadership. Keep election-timeout = 10x heartbeat-interval.
      heartbeat-interval: "250"
      election-timeout: "2500"
