              - 192.168.0.0/16
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-grafana-mcp-monitoring-egress
  namespace: ai
spec:
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - grafana-mcp
          - grafuna-mcp-sa-creator
  egress:
    - toServices:
        - k8sService:
            serviceName: kube-prometheus-stack-grafana
            namespace: monitoring
      toPorts:
        - ports:
            - port: "80"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: grafana
      toPorts:
        - ports:
            - port: "3000"
---
apiVersion: networking.k8s.io/v1
