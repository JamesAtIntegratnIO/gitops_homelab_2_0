# IntegratnIO brand theme for the Kargo UI. Kargo has no custom-stylesheet
# setting, so nginx rewrites its index.html on the way out: a <link> to the
# brand stylesheet, which argocd-server serves from the ConfigMap generated by
# hack/ui-themes/build.sh (clusters/the-cluster/addons/argo-cd/manifests), and
# a one-line script that makes dark the default theme when the browser has no
# saved choice (the stylesheet is built against Kargo's dark theme).
#
# sub_filter cannot see into compressed bodies and Kargo gzips everything it
# serves, so Accept-Encoding is dropped for extension-less paths only -- the
# SPA routes, which all return index.html. Assets (/assets/x.js) and the API
# (/v1beta1/...) keep compression.
#
# If argocd-server is down the <link> 404s and Kargo renders with its own
# theme; nothing else depends on it.
apiVersion: gateway.nginx.org/v1alpha1
kind: SnippetsFilter
metadata:
  name: integratn-theme
  namespace: kargo
spec:
  snippets:
    - context: http
      value: |
        map $uri $integratn_kargo_accept_encoding {
          ~^/v1beta1/             $http_accept_encoding;
          ~^/akuity\.io\.         $http_accept_encoding;
          ~\.[A-Za-z0-9]+$        $http_accept_encoding;
          default                 "";
        }
    - context: http.server.location
      value: |
        proxy_set_header Accept-Encoding $integratn_kargo_accept_encoding;
        sub_filter_once on;
        sub_filter '<head>' '<head><script>try{localStorage.getItem("theme-mode")||localStorage.setItem("theme-mode","dark")}catch(e){}</script>';
        sub_filter '</head>' '<link rel="stylesheet" href="https://argocd.cluster.integratn.tech/custom/kargo.css"></head>';
