# HTTPRoutes for all MCP servers at mcp.cluster.integratn.tech
# Each server gets a path prefix under the shared hostname.
# URLRewrite strips the prefix before forwarding to the backend so
# each server receives requests on its native /mcp path.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-kubernetes
  namespace: mcp-system
spec:
  parentRefs:
    - name: nginx-gateway
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - mcp.cluster.integratn.tech
  rules:
    - backendRefs:
        - name: kubernetes-mcp
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /kubernetes
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: "/"
