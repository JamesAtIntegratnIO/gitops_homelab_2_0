name: Validate Addons

# The gate. Renders what this repo actually deploys, at the merge base and at
# the head, and compares. A version bump is reported and allowed through; a
# change to which clusters an Application targets is not.
#
# Put `addons-gate` -- and only `addons-gate` -- in the branch protection rule.
# It aggregates every job below, so splitting or adding jobs later never
# requires editing the protection rule, which is easy to forget and silently
# drops the gate.

# NO `paths:` FILTER, and that is deliberate.
#
# `addons-gate` is a required status check. GitHub blocks a pull request whose
# required check has not reported -- and a workflow skipped by a paths filter
# never reports at all, so it shows "Expected" forever and the pull request
# becomes permanently unmergeable. A docs-only change would be stuck with no
# way to unstick it short of editing the protection rule.
#
# So the workflow always runs, a cheap first job decides whether the expensive
# work is needed, and the aggregate job always reports either way.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: addons-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: Does this change what gets deployed?
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.check.outputs.relevant }}
      gateImage: ${{ steps.pin.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read the pinned gate image
        id: pin
        # One place, read once, handed to every job below. See
        # .github/gate-image.yaml for why the pin does not live in this file.
        run: |
          set -euo pipefail
          image=$(sed -n 's/^image:[[:space:]]*//p' .github/gate-image.yaml | head -1)
          [ -n "$image" ] || { echo "::error::no image in .github/gate-image.yaml"; exit 1; }
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "::notice::gate image $image"
      - name: Look for paths that affect rendering
        id: check
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          changed=$(git diff --name-only "$base" "$head")
          echo "$changed" | sed 's/^/  /'

          # .github/gate-image.yaml is in the list because moving the pin
          # changes which gate judges the render -- exactly when you most want
          # the full run. The gate's SOURCE is not: CI runs the pinned image,
          # so editing the source changes nothing here until the pin moves.
          # That is deliberate. A pull request that alters the gate must not be
          # judged by its own altered gate.
          if echo "$changed" | grep -qE '^(addons/|terraform/cluster/bootstrap/|\.gitops-gate|\.github/gate-image\.yaml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Rendering affected; running the full gate."
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing that affects rendering changed; the gate passes trivially."
          fi

  render:
    if: needs.scope.outputs.relevant == 'true'
    name: Render (${{ matrix.ref }})
    runs-on: ubuntu-latest
    needs: scope
    strategy:
      fail-fast: false
      matrix:
        ref: [base, head]
    steps:
      - name: Check out the head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the revision under render
        run: |
          set -euo pipefail
          if [ "${{ matrix.ref }}" = "base" ]; then
            git checkout --quiet "${{ github.event.pull_request.base.sha }}"
          fi
          git rev-parse --short HEAD

      - name: Restore the gate config at both revisions
        # The config and inventory describe how to render, not what to render.
        # The base revision may predate them, so take both from the head.
        run: |
          set -euo pipefail
          git checkout --quiet "${{ github.event.pull_request.head.sha }}" -- \
            .gitops-gate.yaml .gitops-gate

      - name: Render
        env:
          GATE_IMAGE: ${{ needs.scope.outputs.gateImage }}
        # The gate is a container with an exit code. Running the PINNED image rather
        # than building from the tree is what stops a pull request that changes the
        # gate from being judged by its own changed gate -- the same reasoning the
        # agent's deny-list uses. It also removes setup-go and setup-helm entirely:
        # the image already carries helm 3.19.0 and kubeconform, so the helm that
        # renders here cannot drift from the helm the gate was built against.
        #
        # --user, because the runner's workspace is owned by the runner and the image
        # runs as uid 10001, which could not write its output into the mount.
        # HOME, because helm needs somewhere to put its cache and the overridden uid
        # has no home directory.
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/repo" -w /repo "$GATE_IMAGE" \
            render -repo . -out "targets-${{ matrix.ref }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: targets-${{ matrix.ref }}
          path: targets-${{ matrix.ref }}.json
          retention-days: 7

  targets-diff:
    name: Targeting diff
    runs-on: ubuntu-latest
    needs: [scope, render]
    if: needs.scope.outputs.relevant == 'true'
    # Widened for this job only, not the whole workflow: it is the one job
    # that publishes anything. The gate's verdict has to reach the pull
    # request -- a verdict that lives only in a job summary is invisible to
    # every reader that is not a human with the tab open, which includes the
    # triage agent.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: targets-*
          merge-multiple: true

      # -repo enables chart-diff: every chart whose version moved is rendered
      # at BOTH versions and the resources are compared. Without it the report
      # says a version changed; with it, it says what the change does.
      - name: Compare
        id: diff
        env:
          GATE_IMAGE: ${{ needs.scope.outputs.gateImage }}
        run: |
          set -euo pipefail
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/repo" -w /repo "$GATE_IMAGE" \
            diff \
              -base targets-base.json \
              -head targets-head.json \
              -repo . \
              -report report.md \
              -json render-diff.json
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: render-diff
          path: |
            render-diff.json
            report.md
          retention-days: 7

      # BEFORE the verdict step, not after. The verdict exits non-zero on a
      # blocking change, and a report published only when the gate is green is
      # published only when nobody needs it.
      #
      # Skipped for pull requests from forks: `pull_request` hands those a
      # read-only token whatever the workflow asks for, so the API call would
      # 403. Skipping says so; failing would look like a broken gate.
      - name: Publish the report to the pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The marker is written by the gate binary itself (diff.go,
          # ReportMarker) and is what a triage agent searches comments for.
          # Read it back out of the report rather than repeating it here --
          # a copy that drifts is how this was broken in the first place.
          marker=$(head -n1 report.md)
          case "$marker" in
            '<!-- '*' -->') ;;
            *) echo "::error::report.md does not lead with the gate marker; refusing to publish an unfindable report" >&2; exit 1 ;;
          esac
          id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
                 --jq "[.[] | select(.body | startswith(\"${marker}\"))] | last | .id // empty")
          if [ -n "$id" ]; then
            # Update in place. One comment per pull request, however many
            # times it is pushed to -- a gate that appends is a gate people
            # collapse and stop reading.
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" \
              -F body=@report.md >/dev/null
            echo "updated gate report comment ${id}"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
              -F body=@report.md >/dev/null
            echo "posted the gate report"
          fi

      - name: Report the verdict
        if: steps.diff.outputs.exit != '0'
        # The gate separates "this change is bad" (1) from "the gate is broken"
        # (2) on purpose -- they want opposite reactions. Both fail the job, but
        # they must not read the same, or a broken gate looks like a bad change.
        run: |
          case "${{ steps.diff.outputs.exit }}" in
            1) echo "::error::A blocking change was found. See the job summary for which: cluster targeting, a source move, or an apiVersion migration." ;;
            *) echo "::error::The gate could not run -- a gate failure, not a bad change." ;;
          esac
          exit 1

  schema:
    name: Schema validation
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v4

      # No setup-go, no setup-helm, no kubeconform download: the image carries
      # all three, at the versions the gate was built and tested against. The
      # hand-installed kubeconform here was also hardcoded to linux-amd64,
      # which would have broken silently on any other runner.
      - name: Validate
        env:
          GATE_IMAGE: ${{ needs.scope.outputs.gateImage }}
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/repo" -w /repo "$GATE_IMAGE" \
            validate -repo . -report schema.md
          cat schema.md >> "$GITHUB_STEP_SUMMARY"

  # The gate's unit tests used to run here, against delivery/images/gitops-gate.
  # The gate lives in JamesAtIntegratnIO/bosun now and its tests run there, on
  # every push, against the source they belong to. Running them from a pinned
  # image would only re-assert what that repository already proved.

  addons-gate:
    name: addons-gate
    runs-on: ubuntu-latest
    needs: [scope, render, targets-diff, schema]
    # always() so this reports even when the jobs above were skipped. This is
    # the single name in the branch protection rule, so it must ALWAYS produce
    # a conclusion -- a required check that never reports blocks the pull
    # request with no way to clear it.
    if: always()
    steps:
      - name: Aggregate
        run: |
          set -euo pipefail
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for r in $results; do
            # `skipped` is a pass: it means this change cannot affect what
            # gets deployed. `cancelled` is not -- that is an unknown answer.
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A gate job did not succeed ($r)."; exit 1 ;;
            esac
          done
          if [ '${{ needs.scope.outputs.relevant }}' != 'true' ]; then
            echo "gate is green (nothing affecting rendering changed)"
          else
            echo "gate is green"
          fi
