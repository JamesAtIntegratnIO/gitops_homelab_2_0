# Mealie's database connection, from 1Password through onepassword-store.
# Fields are read by their LABELS, so renaming one in the item breaks the
# Secret that reads it. Same item layout as umami-db-connection.
#
# 1Password item "mealie-db-connection":
#   host      10.0.3.1
#   port      5432
#   text      the role name (mealie)
#   password  the role's password. Use letters and digits only: Mealie puts it
#             into a connection URL and I did not verify that it escapes
#             symbols.
#
# The database is `mealie`, owned by the role `mealie`, declared in nix_dots_2
# hosts/datacron/postgresql.nix (README.md beside this file).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie-db
  namespace: mealie
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: mealie-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        POSTGRES_SERVER: "{{ .host }}"
        POSTGRES_PORT: "{{ .port }}"
        POSTGRES_USER: "{{ .user }}"
        POSTGRES_PASSWORD: "{{ .password }}"
        POSTGRES_DB: mealie
  data:
    - secretKey: host
      remoteRef: { key: mealie-db-connection, property: host }
    - secretKey: port
      remoteRef: { key: mealie-db-connection, property: port }
    - secretKey: user
      remoteRef: { key: mealie-db-connection, property: text }
    - secretKey: password
      remoteRef: { key: mealie-db-connection, property: password }
---
# Mealie's OIDC client credentials (sign-in with authentik). The SAME 1Password
# item authentik reads (authentik/authentik-mealie-secret.yaml), so the two
# sides cannot disagree for longer than one refresh.
#
# 1Password item "generated-mealie-oidc", fields by label:
#   client-id      the fixed string mealie
#   client-secret  64 random letters and digits
# Nobody creates it by hand: the PushSecret in oidc-generated-secret.yaml
# writes it once, create-only (secret-requests skill).
#
# NOT optional in the pod: with OIDC_AUTH_ENABLED Mealie refuses to start
# without a client id. On the first sync the item does not exist for a few
# seconds, so Mealie can sit in CreateContainerConfigError until the
# PushSecret has written it and this ExternalSecret has read it back.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie-oidc
  namespace: mealie
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: mealie-oidc
    creationPolicy: Owner
  data:
    - secretKey: OIDC_CLIENT_ID
      remoteRef: { key: generated-mealie-oidc, property: client-id }
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef: { key: generated-mealie-oidc, property: client-secret }
