# Kyverno PolicyException: allow the etcd-cert-extractor Job to run privileged.
# This one-shot Job reads Talos etcd TLS certs from /system/secrets/etcd/,
# a protected host path that needs privileged access on Talos Linux.
#
# policies.kyverno.io/v1 exception for the CEL ValidatingPolicy
# disallow-privileged-containers (the kyverno.io/v2 exception for the old
# ClusterPolicy went with it in the Kyverno 1.20 migration). Kyverno only honours
# exceptions in monitoring (features.policyExceptions in the kyverno values).
# Autogen evaluates the Job itself (name etcd-secret-writer) as well as its
# Pods (etcd-secret-writer-<suffix>), so one prefix match covers both.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: etcd-cert-extractor-privileged-cel
  namespace: monitoring
spec:
  policyRefs:
    - name: disallow-privileged-containers
      kind: ValidatingPolicy
  matchConditions:
    - name: etcd-secret-writer-in-monitoring
      expression: >-
        object.metadata.?namespace.orValue('') == 'monitoring' &&
        object.metadata.?name.orValue('').startsWith('etcd-secret-writer')
