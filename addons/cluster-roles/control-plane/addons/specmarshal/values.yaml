# Values for the published Specmarshal chart,
# registry.integratn.io/integratn/charts/specmarshal. The chart's surface is
# small on purpose: `helm show values` prints all of it. The image is left to
# the chart, which pins it by digest to the Version the chart was cut with, so
# bumping `defaultVersion` in addons.yaml moves both.

image:
  # The docker-registry Secret the kubelet pulls the orchestrator with, and the
  # sandbox image of every iteration Job (the chart hands the same name to
  # SPECMARSHAL_KUBERNETES_PULL_SECRET). It is the license key, from
  # externalsecret.yaml beside this file. No container ever holds it.
  pullSecret: specmarshal-registry

# No projects are declared here. `serve` stands with none, and a project is
# registered on the surface and kept in the store.
projects: ""

# The orchestrator's environment, from externalsecret.yaml: the Postgres store
# and the model provider's settings. Everything Specmarshal reads from a
# SPECMARSHAL_* variable can be set there, and nothing else in this chart takes
# an environment variable.
credentials:
  secret: specmarshal-env

# The license key, from externalsecret.yaml. The chart enters it with
# `specmarshal license add` in an init container on every start, so nobody has
# to exec into the pod, and a replaced home is licensed again on its own. A key
# Keygen does not know stops the pod in that container, whose log says so.
license:
  secret: specmarshal-license

# The GitHub App, from externalsecret.yaml. An init container stores it with
# `specmarshal github-app` and the key on standard input on every start, as
# the license is entered, so nobody execs into the pod and a replaced home
# holds the App again on its own.
githubApp:
  secret: specmarshal-github-app

# Sign-in with GitHub, through that App's OAuth client (externalsecret.yaml).
# With it ready, a person with no session is sent to GitHub and returned to
# the page they asked for; what they may do on a project is their permission
# on its repository, and the service itself, its settings and the projects it
# holds, belongs to the operators. The capability in the pod's printed address
# then counts only from inside the pod.
signIn:
  # The address people open. The App's callback URL is this plus
  # /sign-in/callback.
  webUrl: https://specmarshal.cluster.integratn.tech
  # The GitHub logins of the people who run the service.
  operators: [JamesAtIntegratnIO]
  clientSecret:
    name: specmarshal-sign-in

# The chart's Ingress stays off: httproute.yaml beside this file is the route,
# behind authentik. webCapability stays at the core's default too: nothing in
# the pod forwards to the surface, so a caller from the pod's loopback is the
# operator.

home:
  size: 20Gi
  # The cluster's default class, named so that a change of default never moves
  # the home. It is NFS, which is why the measurements are in Postgres.
  storageClassName: config-nfs-client

# Above the iteration timeout, which is 3h on the `local` provider, so a stop
# drains the run in flight instead of cutting it off. A rollout therefore waits
# for work in progress; that is deliberate.
terminationGracePeriodSeconds: 11100
