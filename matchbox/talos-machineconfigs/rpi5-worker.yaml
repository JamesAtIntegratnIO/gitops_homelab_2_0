# Raspberry Pi 5 (16 GB) arm64 WORKER for the-cluster -- talos-pi5-1.
#
# Applied 2026-11-07. Generation-time patch, used INSTEAD of all.yaml/work.yaml
# for this one node (see rpi5-worker.md). Holds no secrets; the rendered config
# does, and it is never committed.
#
# Hardware: Pi 5 16 GB, MAC 2c:cf:67:ed:44:0e, on the Homelab VLAN.
#   - Boots Talos from the 1 TB NVMe on the M.2 HAT, flashed 2026-11-07 with a
#     yama6a/talos-raspberry-pi5 build at Talos v1.13.12 (raspberrypi/linux
#     6.18.57, community U-Boot with BCM2712 PCIe). The NVMe also holds
#     EPHEMERAL and the local-nvme user volume.
#   - Not the Image Factory rpi_5 overlay: as of sbc-raspberrypi v0.2.0 it ships
#     the Pi 4 U-Boot, which cannot read NVMe or USB on a Pi 5 (see rpi5-worker.md).
#
# Why not all.yaml: it installs to /dev/disk/by-label/TALOS_INSTALL with
# wipe: true and carries the x86 schematic. An SBC boots the raw image it was
# written with; install.disk is only what upgrades rewrite, so it must point at
# the NVMe and must not wipe.
machine:
  install:
    # Confirm in maintenance mode first: `talosctl -n <ip> get disks --insecure`
    # must show the 1 TB NVMe as nvme0n1.
    disk: /dev/nvme0n1
    wipe: false
    # The Pi kernel installer for upgrades. It exists only in holocron's
    # build registry today; push it somewhere the node can pull before any
    # `talosctl upgrade` (rpi5-worker.md, "Upgrades").
    image: ghcr.io/jamesatintegratnio/talos-rpi5-installer:v1.13.12
  kubelet:
    defaultRuntimeSeccompProfileEnabled: true
    disableManifestsDirectory: true
    # Nothing schedules here unless it tolerates this. Six running images are
    # amd64-only (Kratix pipeline images in platform-requests, bosun,
    # delivery-agent): without the taint they would land here and fail with
    # "exec format error". Drop it once those carry kubernetes.io/arch affinity.
    #
    # Set at kubelet registration, NOT machine.nodeTaints: on a worker the
    # NodeRestriction admission plugin forbids the node from changing its own
    # taints after it registers, and Talos's NodeApplyController then fails
    # the labels too ("node ... is not allowed to modify taints", 2026-11-07).
    extraConfig:
      registerWithTaints:
        - key: node.integratn.tech/arch
          value: arm64
          effect: NoSchedule
  network:
    interfaces:
      - deviceSelector:
          physical: true
        dhcp: true
    # Same resolvers the control plane runs with live (10.0.4.103, 2026-11-07).
    nameservers:
      - 10.0.0.1
      - 1.1.1.1
      - 8.8.8.8
  features:
    hostDNS:
      enabled: true
      forwardKubeDNSToHost: true
  nodeLabels:
    cluster-role: worker
    node.integratn.tech/board: rpi5
cluster:
  network:
    cni:
      name: none
  proxy:
    disabled: true
---
# Hostname via its own document (Talos 1.12+); stable across reinstalls.
apiVersion: v1alpha1
kind: HostnameConfig
auto: off
hostname: talos-pi5-1
---
# EPHEMERAL (/var: containerd images, pod logs, emptyDir) capped at 100 GiB on the
# boot NVMe (system_disk), leaving the rest for local-nvme.
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: system_disk
  minSize: 50GiB
  maxSize: 100GiB
  grow: false
---
# The rest of the NVMe, mounted at /var/mnt/local-nvme. Not wired to any
# StorageClass yet; local storage is not the cluster's default (NFS is).
apiVersion: v1alpha1
kind: UserVolumeConfig
name: local-nvme
provisioning:
  diskSelector:
    match: system_disk
  minSize: 100GiB
  grow: true
filesystem:
  type: xfs
