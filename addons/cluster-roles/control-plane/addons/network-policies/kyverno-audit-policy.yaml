# Kyverno policy: Audit namespaces for default-deny NetworkPolicy
# Cannot use Enforce: namespace must exist before its NetworkPolicy can be created,
# but this policy blocks namespace creation without a pre-existing NetworkPolicy.
# A companion generate policy auto-creates default-deny for new namespaces.
# Kyverno CEL policy (policies.kyverno.io/v1; ClusterPolicy is gone in 1.20).
# Same name, same Audit-only behaviour.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-default-deny-netpol
  annotations:
    policies.kyverno.io/title: Require Default Deny NetworkPolicy
    policies.kyverno.io/category: Networking
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Every namespace should have a default-deny-all NetworkPolicy. Audit only:
      the generate policy creates it after the namespace exists.
spec:
  validationActions:
    - Audit
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
  matchConditions:
    - name: not-excluded
      expression: >-
        !(object.metadata.name in ['kube-public', 'kube-node-lease',
        'kube-system', 'cilium-secrets', 'kratix-worker-system'])
  validations:
    - expression: >-
        resource.List("networking.k8s.io/v1", "networkpolicies", object.metadata.name).items
        .exists(n, n.metadata.name == 'default-deny-all')
      messageExpression: >-
        "Namespace " + object.metadata.name + " is missing a 'default-deny-all'
        NetworkPolicy. All namespaces should have a default-deny policy with
        explicit allowlists for required traffic."
