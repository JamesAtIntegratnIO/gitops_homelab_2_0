  dashboard-theme.yaml: |
    # Hermes dashboard theme in the IntegratnIO design system ("The Night Shift
    # Ledger", IntegratnIO/specmarshal DESIGN.md). Hermes reads it from
    # $HERMES_HOME/dashboard-themes/; config.yaml sets dashboard.theme: integratn.
    # Schema: website/docs/user-guide/features/extending-the-dashboard.md (v0.23.0).
    name: integratn
    label: Integratn
    description: Night Shift Ledger. Graphite, flat, colour only for verdicts.

    palette:
      background: "#0a0c10"          # ground
      midground: "#f3f7fc"           # text; the dashboard derives chrome from it
      foreground:
        hex: "#f3f7fc"
        alpha: 0
      warmGlow: "rgba(0, 0, 0, 0)"   # no vignette
      noiseOpacity: 0                # no grain

    typography:
      fontSans: 'system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'
      fontMono: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'
      fontDisplay: 'system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'
      baseSize: "14px"
      lineHeight: "1.5"
      letterSpacing: "0"

    layout:
      radius: "6px"
      density: compact

    layoutVariant: standard

    # The palette cascade mixes card/border from midground; pin the ledger's own
    # steps instead. Primary is neutral (Text on Night): orange is the mark only.
    colorOverrides:
      card: "#1d2126"                # panel
      cardForeground: "#f3f7fc"
      popover: "#14171d"             # well
      popoverForeground: "#f3f7fc"
      primary: "#f3f7fc"
      primaryForeground: "#0a0c10"
      secondary: "#262a30"           # raise
      secondaryForeground: "#f3f7fc"
      muted: "#14171d"
      mutedForeground: "#acb2b9"     # dim
      accent: "#262a30"
      accentForeground: "#f3f7fc"
      destructive: "#f47983"         # bad
      destructiveForeground: "#0a0c10"
      success: "#42c161"             # ok
      warning: "#cf9a43"             # warn
      border: "#393e43"              # hairline
      input: "#393e43"
      ring: "#f3f7fc"

    componentStyles:
      card:
        background: "#1d2126"
        boxShadow: "none"
      header:
        background: "#0a0c10"
        boxShadow: "none"
      footer:
        background: "#0a0c10"
      sidebar:
        background: "#14171d"
      backdrop:
        background: "#0a0c10"
      badge:
        boxShadow: "none"

    customCSS: |
      /* Text ladder: Text, Said, Dim, Faint. */
      :root {
        --text-primary: #f3f7fc;
        --text-secondary: #cfd5dc;
        --text-tertiary: #acb2b9;
        --text-disabled: #8d939a;
        --text-display: #f3f7fc;
        --text-on-accent: #0a0c10;
        /* No brand typefaces: the Nous DS display faces fall back to system sans. */
        --font-rules-compressed: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-rules-expanded: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-mondwest: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --series-input-token: #acb2b9;
        --series-output-token: #f3f7fc;
      }
      .font-courier { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      /* Flat: tonal depth only. Kill drop shadows but keep Tailwind focus rings
         (they ride --tw-ring-shadow, not --tw-shadow), and drop glass blur. */
      *, *::before, *::after { --tw-shadow: 0 0 #0000 !important; --tw-shadow-colored: 0 0 #0000 !important; }
      * { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; text-shadow: none !important; }
      .grain::after { display: none !important; }
      /* Nothing below 12px. */
      .text-\[10px\], .text-\[11px\], .text-\[0\.65rem\], .text-\[0\.7rem\] { font-size: 12px !important; }
      /* Figures read as data. */
      table, .tabular-nums, code, pre { font-variant-numeric: tabular-nums; }
      /* Links read by underline, not hue. */
      main a:not([class]) { color: #f3f7fc; text-decoration: underline; text-decoration-color: #393e43; text-underline-offset: 3px; }
      main a:not([class]):hover { text-decoration-color: #f3f7fc; }
      :focus-visible { outline: 2px solid #f3f7fc !important; outline-offset: 2px; }
      /* Fields: the border turns to Text on focus, no outline box inside them. */
      input:focus-visible, textarea:focus-visible, [contenteditable]:focus-visible { outline: none !important; border-color: #f3f7fc !important; }
      ::selection { background: #393e43; color: #f3f7fc; }
  skin.yaml: |
    # Hermes skin in the IntegratnIO design system ("The Night Shift Ledger").
    # A skin themes the CLI/TUI (`hermes chat`, the dashboard's Chat tab) and is
    # offered in the Webapp's Settings -> Appearance, which derives its palette
    # from these colours; customCSS pins the ledger's surfaces there.
    # Hermes reads it from $HERMES_HOME/skins/; config.yaml sets
    # display.skin: integratn. Schema: website/docs/user-guide/features/skins.md.
    name: integratn
    description: Night Shift Ledger. Graphite, flat, colour only for verdicts.

    colors:
      background: "#0a0c10"
      # Neutral chrome: accents are Text, never a hue.
      ui_accent: "#f3f7fc"
      ui_primary: "#f3f7fc"
      banner_accent: "#f3f7fc"
      banner_title: "#f3f7fc"
      ui_text: "#f3f7fc"
      banner_text: "#cfd5dc"
      banner_dim: "#acb2b9"
      ui_border: "#393e43"
      banner_border: "#393e43"
      ui_label: "#acb2b9"
      ui_tool: "#acb2b9"
      ui_thinking: "#8d939a"
      # Verdicts.
      ui_ok: "#42c161"
      ui_warn: "#cf9a43"
      ui_error: "#f47983"
      diff_added: "#7dd18b"
      diff_removed: "#ff969d"
      syntax_keyword: "#c792ea"
      syntax_string: "#8fbf7f"
      syntax_number: "#82aaff"
      syntax_comment: "#8d939a"
      prompt: "#f3f7fc"
      input_rule: "#393e43"
      response_border: "#393e43"
      shell_dollar: "#acb2b9"
      session_label: "#acb2b9"
      session_border: "#8d939a"
      selection_bg: "#393e43"
      status_bar_bg: "#14171d"
      status_bar_text: "#cfd5dc"
      status_bar_strong: "#f3f7fc"
      status_bar_dim: "#8d939a"
      status_bar_good: "#42c161"
      status_bar_warn: "#cf9a43"
      status_bar_bad: "#f47983"
      status_bar_critical: "#f47983"
      voice_status_bg: "#14171d"
      completion_menu_bg: "#14171d"
      completion_menu_current_bg: "#262a30"
      completion_menu_meta_bg: "#14171d"
      completion_menu_meta_current_bg: "#262a30"

    spinner:
      waiting_faces: ["·", "··", "···"]
      thinking_faces: ["·", "··", "···"]
      thinking_verbs: ["working", "reading", "checking", "thinking"]
      wings: [["", ""]]

    branding:
      agent_name: "Hermes"
      welcome: "Hermes on the-cluster. Type a message, or /help."
      goodbye: "Done."
      response_label: " Hermes "
      prompt_symbol: "›"
      help_header: "Commands"

    tool_prefix: "│"

    customCSS: |
      /* Webapp: the skin's palette is derived by mixing; pin the ledger's steps.
         !important beats the inline seeds the theme engine paints on :root. */
      :root {
        --theme-background-seed: #0a0c10 !important;
        --theme-sidebar-seed: #14171d !important;
        --theme-card-seed: #1d2126 !important;
        --theme-elevated-seed: #262a30 !important;
        --theme-bubble-seed: #262a30 !important;
        --theme-mix-chrome: 100% !important;
        --theme-mix-sidebar: 100% !important;
        --theme-mix-card: 100% !important;
        --theme-mix-elevated: 100% !important;
        --theme-mix-bubble: 100% !important;
        --dt-border: #393e43 !important;
        --dt-sidebar-border: #393e43 !important;
        --dt-user-bubble-border: #393e43 !important;
        --dt-input: #14171d !important;
        --dt-muted: #14171d !important;
        --dt-ring: #f3f7fc !important;
        --dt-composer-ring: #8d939a !important;
        --dt-primary-solid: #262a30 !important;
        --dt-primary-solid-foreground: #f3f7fc !important;
        --dt-destructive: #f47983 !important;
        --dt-destructive-foreground: #0a0c10 !important;
        --ui-success: #42c161 !important;
        --dt-font-sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
        --dt-font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace !important;
        --noise-opacity-mul: 0 !important;
      }
      /* Flat: no drop shadows (focus rings ride --tw-ring-shadow and stay), no glass. */
      *, *::before, *::after { --tw-shadow: 0 0 #0000 !important; --tw-shadow-colored: 0 0 #0000 !important; }
      * { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; text-shadow: none !important; }
      :focus-visible { outline: 2px solid #f3f7fc !important; outline-offset: 2px; }
      /* Text fields carry their own frame (the composer has --dt-composer-ring):
         no outline box drawn inside them. */
      input:focus-visible, textarea:focus-visible, [contenteditable]:focus-visible { outline: none !important; }
      ::selection { background: #393e43; color: #f3f7fc; }
