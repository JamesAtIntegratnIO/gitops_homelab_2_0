---
# ConfigMap containing Authentik blueprints for code-driven configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
data:
  00-admin-group.yaml: |
    # Authentik Blueprint: Admin Group
    # Creates a superuser admin group for platform administrators
    version: 1
    metadata:
      name: admin-group
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_core.group
        identifiers:
          name: authentik Admins
        attrs:
          is_superuser: true
          parent: null
        id: admin-group

  01-argocd-provider.yaml: |
    # Authentik Blueprint: ArgoCD OAuth2 Provider
    # Creates OAuth2/OIDC provider for ArgoCD integration
    version: 1
    metadata:
      name: argocd-provider
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    context:
      client_id: !Env ARGOCD_CLIENT_ID
      client_secret: !Env ARGOCD_CLIENT_SECRET
    entries:
      # Custom scope mapping for groups (must come before provider that references it)
      - model: authentik_providers_oauth2.scopemapping
        identifiers:
          name: ArgoCD Groups Scope
          scope_name: groups
        id: groups-scope
        attrs:
          expression: |
            return {
              "groups": [group.name for group in user.ak_groups.all()],
            }
      
      # OAuth2/OIDC Provider
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: argocd-provider
        id: argocd-provider
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: !Context client_id
          client_secret: !Context client_secret
          redirect_uris:
            - url: https://argocd.cluster.integratn.tech/auth/callback
              matching_mode: strict
            - url: https://argocd.cluster.integratn.tech/api/dex/callback
              matching_mode: strict
            # ArgoCD CLI `argocd login --sso --sso-port 8085` local callback
            - url: http://localhost:8085/auth/callback
              matching_mode: strict
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, "ArgoCD Groups Scope"]]
          include_claims_in_id_token: true
          issuer_mode: per_provider
          sub_mode: hashed_user_id
          access_code_validity: minutes=10
          access_token_validity: minutes=60
          refresh_token_validity: days=30
      
      # Application
      - model: authentik_core.application
        identifiers:
          slug: argocd
        attrs:
          name: ArgoCD
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, argocd-provider]]
          open_in_new_tab: true
          launch_url: https://argocd.cluster.integratn.tech
          group: Platform Services
          meta_icon: https://cncf-branding.netlify.app/img/projects/argo/icon/color/argo-icon-color.png
          meta_description: GitOps Continuous Delivery
          policy_engine_mode: all

  02-grafana-provider.yaml: |
    # Authentik Blueprint: Grafana OAuth2 Provider
    # Creates OAuth2/OIDC provider for Grafana integration
    version: 1
    metadata:
      name: grafana-provider
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    context:
      client_id: !Env GRAFANA_CLIENT_ID
      client_secret: !Env GRAFANA_CLIENT_SECRET
    entries:
      # Custom scope mapping for groups (must come before provider that references it)
      - model: authentik_providers_oauth2.scopemapping
        identifiers:
          name: Grafana Groups Scope
          scope_name: groups
        id: groups-scope
        attrs:
          expression: |
            return {
              "groups": [group.name for group in user.ak_groups.all()],
            }
      
      # OAuth2/OIDC Provider
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: grafana-provider
        id: grafana-provider
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: !Context client_id
          client_secret: !Context client_secret
          redirect_uris:
            - url: https://grafana.cluster.integratn.tech/login/generic_oauth
              matching_mode: strict
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, "Grafana Groups Scope"]]
          include_claims_in_id_token: true
          issuer_mode: per_provider
          sub_mode: hashed_user_id
          access_code_validity: minutes=10
          access_token_validity: minutes=60
          refresh_token_validity: days=30
      
      # Application
      - model: authentik_core.application
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, grafana-provider]]
          open_in_new_tab: true
          launch_url: https://grafana.cluster.integratn.tech
          group: Platform Services
          meta_icon: https://grafana.com/static/img/menu/grafana2.svg
          meta_description: Observability & Monitoring Dashboards
          policy_engine_mode: all

  03-authentication-flows.yaml: |
    # Authentik Blueprint: sign-in flows (password + required MFA)
    #
    # OWN FLOWS, NOT THE STOCK ONES. This used to edit authentik's stock
    # `default-authentication-flow` in place. authentik's own blueprint for that
    # flow re-applies on every upgrade and put its MFA stage back to
    # `not_configured_action: skip` next to ours (two bindings at order 30, MFA
    # optional). Flows with our own slugs and stages are never touched by an
    # upgrade, so what is written here is what runs.
    #
    #   integratn-authentication          username/email + password, then MFA,
    #                                     then login. The brand points here.
    #   integratn-source-authentication   what a Google sign-in runs once it has
    #                                     matched an EXISTING user: login only.
    #                                     Google never creates users
    #                                     (04-google-oauth-source.yaml).
    #
    # MFA is REQUIRED for password sign-in: a user with no TOTP/WebAuthn device
    # is made to enrol one before the login completes
    # (`not_configured_action: configure`). Google sign-in TRUSTS GOOGLE'S 2FA
    # instead (James, 2026-11-25: one login, not two). Only invited accounts can
    # sign in with Google, so the exposure is an invitee whose Google account
    # has no 2FA. Add the MFA binding back to the source flow to change that.
    #
    # The stock `default-authentication-flow` is left in place (authentik
    # recreates it anyway) but bound to a deny-all policy, so nobody can run it
    # by URL to skip the MFA above.
    #
    # There is no enrollment and no recovery on these flows. New accounts come
    # only from invitations (12-invitation-enrollment.yaml).
    version: 1
    metadata:
      name: authentication-flows
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_stages_password.passwordstage
        identifiers:
          name: integratn-authentication-password
        id: password-stage
        attrs:
          # Inbuilt only: no app-password (TokenBackend) logins through the
          # browser flow.
          backends:
            - authentik.core.auth.InbuiltBackend
          configure_flow: null
          failed_attempts_before_cancel: 5

      - model: authentik_stages_identification.identificationstage
        identifiers:
          name: integratn-authentication-identification
        id: identification-stage
        attrs:
          user_fields:
            - username
            - email
          password_stage: !KeyOf password-stage
          sources:
            - !Find [authentik_sources_oauth.oauthsource, [slug, google]]
          show_source_labels: true
          # Don't echo back whether an account exists.
          show_matched_user: false
          pretend_user_exists: true
          enrollment_flow: null
          recovery_flow: null
          passwordless_flow: null

      - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        identifiers:
          name: integratn-mfa
        id: mfa-stage
        attrs:
          device_classes:
            - static
            - totp
            - webauthn
          # No device yet -> enrol one now, instead of letting the user in.
          not_configured_action: configure
          configuration_stages:
            - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]
            - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
          last_auth_threshold: seconds=0
          webauthn_user_verification: preferred

      - model: authentik_stages_user_login.userloginstage
        identifiers:
          name: integratn-authentication-login
        id: login-stage
        attrs:
          session_duration: seconds=0
          remember_me_offset: seconds=0

      # --- integratn-authentication -------------------------------------
      - model: authentik_flows.flow
        identifiers:
          slug: integratn-authentication
        id: auth-flow
        attrs:
          name: IntegratnIO sign-in
          title: Welcome to the Platform
          designation: authentication
          authentication: require_unauthenticated
          layout: stacked
          denied_action: message_continue
          background: /static/dist/assets/images/integratn/bg-ridgeline.svg

      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf auth-flow
          stage: !KeyOf identification-stage
          order: 10
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: false
          invalid_response_action: retry

      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf auth-flow
          stage: !KeyOf mfa-stage
          order: 20
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: false
          invalid_response_action: retry

      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf auth-flow
          stage: !KeyOf login-stage
          order: 100
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: false
          invalid_response_action: retry

      # --- integratn-source-authentication (Google, existing users only) --
      # No MFA stage: Google's own 2FA is trusted (see the header).
      - model: authentik_flows.flow
        identifiers:
          slug: integratn-source-authentication
        id: source-auth-flow
        attrs:
          name: IntegratnIO sign-in (via Google)
          title: Welcome to the Platform
          designation: authentication
          authentication: require_unauthenticated
          layout: stacked
          denied_action: message_continue
          background: /static/dist/assets/images/integratn/bg-ridgeline.svg

      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf source-auth-flow
          stage: !KeyOf login-stage
          order: 100
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: false
          invalid_response_action: retry

      # --- the brand signs in through the flow above ----------------------
      # Only flow fields; the look is 10-integratn-brand.yaml's.
      - model: authentik_brands.brand
        identifiers:
          default: true
        state: present
        attrs:
          flow_authentication: !KeyOf auth-flow
          flow_recovery: null
          flow_unenrollment: null

      # --- close the stock flow -------------------------------------------
      - model: authentik_policies_expression.expressionpolicy
        identifiers:
          name: integratn-deny-all
        id: deny-all
        attrs:
          expression: |
            ak_message("This sign-in path is disabled.")
            return False

      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          policy: !KeyOf deny-all
        attrs:
          order: 0
          enabled: true
          negate: false
          timeout: 30

  04-google-oauth-source.yaml: |
    # Authentik Blueprint: Google OAuth Source
    # Configures Google as a social login / federation source
    # Callback URL to configure in Google Cloud Console:
    #   https://auth.cluster.integratn.tech/source/oauth/callback/google/
    #
    # Prerequisites in Google Cloud Console:
    #   1. Enable the "Cloud Identity API" at https://console.cloud.google.com/apis/library/cloudidentity.googleapis.com
    #   2. Add the cloud-identity.groups.readonly scope to the OAuth consent screen
    #   3. Add the callback URL above as an authorized redirect URI
    version: 1
    metadata:
      name: google-oauth-source
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    context:
      google_client_id: !Env GOOGLE_CLIENT_ID
      google_client_secret: !Env GOOGLE_CLIENT_SECRET
    entries:
      # Property mapping to sync Google Workspace group memberships
      - model: authentik_sources_oauth.oauthsourcepropertymapping
        identifiers:
          name: "Google Workspace Groups Sync"
        id: google-groups-mapping
        attrs:
          expression: |
            # Fetch the user's Google Workspace group memberships via Cloud Identity API
            email = info.get("email", "")
            access_token = token.get("access_token", "")
            groups = []
            if email and access_token:
                try:
                    query = f"member_key_id == '{email}'"
                    response = requests.get(
                        "https://cloudidentity.googleapis.com/v1/groups/-/memberships:searchDirectGroups",
                        params={"query": query, "pageSize": 200},
                        headers={"Authorization": f"Bearer {access_token}"},
                        timeout=10,
                    )
                    if response.status_code == 200:
                        data = response.json()
                        for membership in data.get("memberships", []):
                            name = membership.get("displayName", "")
                            if name:
                                groups.append(name)
                    else:
                        ak_logger.warning(
                            "Google Groups API error",
                            status=response.status_code,
                            body=response.text[:500],
                        )
                except Exception as e:
                    ak_logger.warning("Google Groups API exception", error=str(e))
            return {"groups": groups}

      # Google OAuth Source
      - model: authentik_sources_oauth.oauthsource
        identifiers:
          slug: google
        id: google-source
        attrs:
          name: Google
          provider_type: google
          consumer_key: !Context google_client_id
          consumer_secret: !Context google_client_secret
          # Sign-in for EXISTING users only: MFA, then login
          # (03-authentication-flows.yaml).
          authentication_flow: !Find [authentik_flows.flow, [slug, integratn-source-authentication]]
          # No enrollment: a Google account that matches no user is refused.
          # Accounts come only from invitations (12-invitation-enrollment.yaml);
          # once one exists, its Google login links to it by email.
          enrollment_flow: null
          user_matching_mode: email_link
          enabled: true
          oidc_well_known_url: "https://accounts.google.com/.well-known/openid-configuration"
          oidc_jwks_url: "https://www.googleapis.com/oauth2/v3/certs"
          additional_scopes: "https://www.googleapis.com/auth/cloud-identity.groups.readonly"
          user_property_mappings:
            - !Find [authentik_sources_oauth.oauthsourcepropertymapping, [name, "Google Workspace Groups Sync"]]

  05-openwebui-provider.yaml: |
    # Authentik Blueprint: Open WebUI OAuth2 Provider
    # Creates OAuth2/OIDC provider for Open WebUI (AI platform assistant)
    version: 1
    metadata:
      name: openwebui-provider
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    context:
      client_id: !Env OPENWEBUI_CLIENT_ID
      client_secret: !Env OPENWEBUI_CLIENT_SECRET
    entries:
      # Custom scope mapping for groups
      - model: authentik_providers_oauth2.scopemapping
        identifiers:
          name: Open WebUI Groups Scope
          scope_name: groups
        id: groups-scope
        attrs:
          expression: |
            return {
              "groups": [group.name for group in user.ak_groups.all()],
            }

      # OAuth2/OIDC Provider
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: openwebui-provider
        id: openwebui-provider
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: !Context client_id
          client_secret: !Context client_secret
          redirect_uris:
            - url: https://chat.cluster.integratn.tech/oauth/oidc/callback
              matching_mode: strict
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, "Open WebUI Groups Scope"]]
          include_claims_in_id_token: true
          issuer_mode: per_provider
          sub_mode: hashed_user_id
          access_code_validity: minutes=10
          access_token_validity: minutes=60
          refresh_token_validity: days=30

      # Application
      - model: authentik_core.application
        identifiers:
          slug: open-webui
        attrs:
          name: Open WebUI
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, openwebui-provider]]
          open_in_new_tab: true
          launch_url: https://chat.cluster.integratn.tech
          group: Platform Services
          meta_icon: https://raw.githubusercontent.com/open-webui/open-webui/main/static/favicon.png
          meta_description: AI Platform Assistant
          # homelab OR open-webui-users (bindings in 11-access-groups.yaml)
          policy_engine_mode: any

  06-qdrant-proxy-provider.yaml: |
    # Authentik Blueprint: Qdrant Dashboard Proxy Provider
    # Creates a forward-auth proxy provider for the Qdrant vector database dashboard.
    # Uses Authentik's embedded outpost — no standalone outpost deployment needed.
    version: 1
    metadata:
      name: qdrant-proxy-provider
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      # Proxy Provider (forward_single mode)
      - model: authentik_providers_proxy.proxyprovider
        identifiers:
          name: qdrant-proxy-provider
        id: qdrant-proxy-provider
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: https://qdrant.cluster.integratn.tech
          access_token_validity: minutes=60

      # Application
      - model: authentik_core.application
        identifiers:
          slug: qdrant
        attrs:
          name: Qdrant Dashboard
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, qdrant-proxy-provider]]
          open_in_new_tab: true
          launch_url: https://qdrant.cluster.integratn.tech
          group: Platform Services
          meta_icon: https://qdrant.tech/img/logo.png
          meta_description: Vector Database Dashboard
          policy_engine_mode: all

      # The embedded outpost entry that used to sit here now lives in
      # 09-embedded-outpost.yaml. It is one shared object, its `providers` is
      # a whole list rather than a membership, and a second blueprint setting
      # it would have evicted this provider on every reconcile instead of
      # joining it.

  07-kargo-provider.yaml: |
    # Authentik Blueprint: Kargo OAuth2 Provider (public client, PKCE)
    # Kargo's UI and CLI use the Authorization Code flow with PKCE and never
    # hold a client secret, so unlike the ArgoCD/Grafana providers this needs
    # no ExternalSecret and no !Env context. The client_id is the fixed string
    # referenced by api.oidc.clientID in the kargo addon values.
    version: 1
    metadata:
      name: kargo-provider
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_providers_oauth2.scopemapping
        identifiers:
          name: Kargo Groups Scope
          scope_name: groups
        id: groups-scope
        attrs:
          expression: |
            return {
              "groups": [group.name for group in user.ak_groups.all()],
            }

      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: kargo-provider
        id: kargo-provider
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: public
          client_id: kargo
          redirect_uris:
            - url: https://kargo.cluster.integratn.tech/login
              matching_mode: strict
            # `kargo login --sso` listens on an ephemeral localhost port
            - url: ^http://localhost(:[0-9]+)?/auth/callback$
              matching_mode: regex
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, "Kargo Groups Scope"]]
          include_claims_in_id_token: true
          issuer_mode: per_provider
          sub_mode: hashed_user_id
          access_code_validity: minutes=10
          access_token_validity: minutes=60
          refresh_token_validity: days=30

      # Application
      - model: authentik_core.application
        identifiers:
          slug: kargo
        attrs:
          name: Kargo
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, kargo-provider]]
          open_in_new_tab: true
          launch_url: https://kargo.cluster.integratn.tech
          group: Platform Services
          meta_description: Automated version bumps for gitops_homelab_2_0
          policy_engine_mode: all

  08-bosun-proxy-provider.yaml: |
    # Authentik Blueprint: Bosun Status Page Proxy Provider
    # Forward-auth for the delivery agent's read-only status page. Same shape
    # as the qdrant provider above: forward_single against the embedded
    # outpost, no standalone outpost to deploy.
    #
    # The page has no authentication of its own and reveals operational state
    # -- repository name, open pull request titles, Stage and Warehouse names,
    # findings -- so this provider IS its access control. The nginx half is
    # the SnippetsFilter in addons/cluster-roles/control-plane/addons/bosun/.
    version: 1
    metadata:
      name: bosun-proxy-provider
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      # Proxy Provider (forward_single mode)
      - model: authentik_providers_proxy.proxyprovider
        identifiers:
          name: bosun-proxy-provider
        id: bosun-proxy-provider
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          # Must match the HTTPRoute's hostname exactly, scheme included: the
          # outpost compares it against the request it is asked to authorise.
          external_host: https://bosun.cluster.integratn.tech
          access_token_validity: minutes=60

      # Application
      #
      # THE NAME, THE ICON AND THE DESCRIPTION COME FROM THE PROJECT'S OWN SITE
      # and are not written here. bosun.integratn.io is where Bosun's branding
      # is decided; this tile is a consumer of it, the same way the argocd,
      # grafana, open-webui and qdrant tiles above point at their projects'
      # own icons rather than at something drawn for this cluster.
      #
      #   name             the site's Starlight `title`
      #   meta_icon        the site's own favicon -- the badge lockup, square
      #                    and on the #14293E ground, which is the form built
      #                    for exactly this. It is also the only one of the
      #                    site's two marks at a stable URL: the header logo is
      #                    bundled by Astro under a content-hashed name. The
      #                    browser fetches it, not the cluster, so this needs
      #                    no egress rule. Grafana's tile above is already an
      #                    SVG, so the format is proven here.
      #   meta_description the site's Starlight `description`, verbatim
      #
      # If any of the three changes on the site, it changes here. Do not edit
      # them to fit the tile.
      - model: authentik_core.application
        identifiers:
          slug: bosun
        attrs:
          name: Bosun
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, bosun-proxy-provider]]
          open_in_new_tab: true
          launch_url: https://bosun.cluster.integratn.tech
          group: Platform Services
          meta_icon: https://bosun.integratn.io/favicon.svg
          meta_description: >-
            The crew for Argo and Kargo. A gate that renders what a pull request
            deploys and blocks what breaks, and an agent that repairs what is
            provable and escalates the rest.
          policy_engine_mode: all

  08a-specmarshal-proxy-provider.yaml: |
    # Authentik Blueprint: Specmarshal Surface Proxy Provider
    # Forward-auth for Specmarshal's web surface, the same shape as bosun's
    # above. Numbered 08a so it sorts before 09-embedded-outpost, whose
    # provider list `!Find`s it.
    #
    # The surface acts -- it registers projects, marks work ready, steers runs
    # that spend money and push to GitHub -- and has no authentication of its
    # own, so this provider IS its access control. The nginx half is the
    # SnippetsFilter in addons/cluster-roles/control-plane/addons/specmarshal/.
    version: 1
    metadata:
      name: specmarshal-proxy-provider
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_providers_proxy.proxyprovider
        identifiers:
          name: specmarshal-proxy-provider
        id: specmarshal-proxy-provider
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          # Must match the HTTPRoute's hostname exactly, scheme included.
          external_host: https://specmarshal.cluster.integratn.tech
          access_token_validity: minutes=60

      - model: authentik_core.application
        identifiers:
          slug: specmarshal
        attrs:
          name: Specmarshal
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, specmarshal-proxy-provider]]
          open_in_new_tab: true
          launch_url: https://specmarshal.cluster.integratn.tech
          group: Platform Services
          meta_description: >-
            Drives autonomous coding sessions over a spec's tickets.
          policy_engine_mode: all

  08b-umami-proxy-provider.yaml: |
    # Authentik Blueprint: Umami Dashboard Proxy Provider
    # Forward-auth for the Umami dashboard, the same shape as specmarshal's
    # above. Numbered 08b so it sorts before 09-embedded-outpost, whose
    # provider list `!Find`s it.
    #
    # Umami has a login of its own, and ships with admin/umami until someone
    # changes it; this provider is the door in front of that one. It covers the
    # dashboard host only. The public tracker paths arrive by the cloudflared
    # tunnel, which does not pass through the gateway, and the MCP route on
    # mcp.cluster.integratn.tech is authenticated by Umami's API keys. The
    # nginx half is the SnippetsFilter in
    # addons/cluster-roles/control-plane/addons/umami/.
    version: 1
    metadata:
      name: umami-proxy-provider
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_providers_proxy.proxyprovider
        identifiers:
          name: umami-proxy-provider
        id: umami-proxy-provider
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          # Must match the HTTPRoute's hostname exactly, scheme included.
          external_host: https://stats.cluster.integratn.tech
          access_token_validity: minutes=60

      - model: authentik_core.application
        identifiers:
          slug: umami
        attrs:
          name: Umami
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, umami-proxy-provider]]
          open_in_new_tab: true
          launch_url: https://stats.cluster.integratn.tech
          group: Platform Services
          meta_description: >-
            Cookieless web analytics for integratn.io and bosun.integratn.io.
          policy_engine_mode: all

  08c-homepage-proxy-provider.yaml: |
    # Authentik Blueprint: Homepage Proxy Provider
    # Forward-auth for the cluster landing page, the same shape as umami's
    # above. Numbered 08c so it sorts before 09-embedded-outpost, whose
    # provider list `!Find`s it.
    #
    # The landing page (Glance; the provider keeps the name of the Homepage it
    # replaced) has no login of its own and shows live cluster state, so this
    # provider is its only door. The nginx half is the SnippetsFilter in
    # addons/cluster-roles/control-plane/addons/homepage/.
    version: 1
    metadata:
      name: homepage-proxy-provider
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_providers_proxy.proxyprovider
        identifiers:
          name: homepage-proxy-provider
        id: homepage-proxy-provider
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          # Must match the HTTPRoute's hostname exactly, scheme included.
          external_host: https://home.cluster.integratn.tech
          access_token_validity: minutes=60

      - model: authentik_core.application
        identifiers:
          slug: homepage
        attrs:
          name: Homepage
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, homepage-proxy-provider]]
          open_in_new_tab: true
          launch_url: https://home.cluster.integratn.tech
          group: Platform Services
          meta_description: >-
            Landing page for the cluster: health, every service, pod status.
          policy_engine_mode: all

  09-embedded-outpost.yaml: |
    # Authentik Blueprint: the embedded outpost's provider list
    #
    # ONE OBJECT, EVERY FORWARD-AUTH PROVIDER. `providers` here is the whole
    # list and not a membership, so this cannot be split across the blueprints
    # that define the providers: each would set the list to its own single
    # entry and evict the others on every reconcile. It lived inside
    # 06-qdrant-proxy-provider.yaml while qdrant was the only one, which was
    # fine right up until it was not.
    #
    # ADD EVERY NEW forward_single PROVIDER HERE, and keep this file numbered
    # after the ones that define them: `!Find` resolves against what has
    # already been applied, so a provider defined in a later-sorting blueprint
    # fails this one until the next reconcile catches up.
    #
    # `managed` is what makes this the outpost that runs inside authentik-server
    # rather than a Deployment of its own; nothing here has to be scheduled.
    version: 1
    metadata:
      name: embedded-outpost
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_outposts.outpost
        identifiers:
          name: authentik Embedded Outpost
        attrs:
          type: proxy
          managed: goauthentik.io/outposts/embedded
          providers:
            - !Find [authentik_providers_proxy.proxyprovider, [name, qdrant-proxy-provider]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, bosun-proxy-provider]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, specmarshal-proxy-provider]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, umami-proxy-provider]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, homepage-proxy-provider]]

  10-hermes-provider.yaml: |
    # Authentik Blueprint: Hermes Agent OAuth2 Provider (public client, PKCE)
    # Hermes's self-hosted OIDC sign-in supports only public PKCE clients
    # (no client secret), so like Kargo this needs no ExternalSecret. One
    # provider serves both browser UIs, each with its own callback. Hermes
    # treats every account that can sign in as the machine owner, so the
    # application is bound to `authentik Admins` and nobody else gets in.
    version: 1
    metadata:
      name: hermes-provider
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: hermes-provider
        id: hermes-provider
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: public
          client_id: hermes
          redirect_uris:
            - url: https://hermes.cluster.integratn.tech/auth/callback
              matching_mode: strict
            - url: https://hermes-admin.cluster.integratn.tech/auth/callback
              matching_mode: strict
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
          include_claims_in_id_token: true
          issuer_mode: per_provider
          sub_mode: hashed_user_id
          access_code_validity: minutes=10
          access_token_validity: minutes=60
          refresh_token_validity: days=30

      - model: authentik_core.application
        identifiers:
          slug: hermes
        id: hermes-app
        attrs:
          name: Hermes Agent
          provider: !KeyOf hermes-provider
          open_in_new_tab: true
          launch_url: https://hermes.cluster.integratn.tech
          group: AI
          meta_description: Nous Research Hermes Agent (Webapp; dashboard at hermes-admin)
          policy_engine_mode: all

      # Only members of `authentik Admins` may sign in.
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf hermes-app
          group: !Find [authentik_core.group, [name, "authentik Admins"]]
        attrs:
          order: 0
          enabled: true
          negate: false
          timeout: 30

  11-access-groups.yaml: |
    # Authentik Blueprint: access groups, and which apps each group opens
    #
    # DEFAULT DENY. Every application is bound to at least one group; a user in
    # no group can sign in to the user portal and nothing else. Grant access by
    # adding the user to a group (Directory -> Groups) -- never by unbinding an
    # app.
    #
    #   authentik Admins   authentik superusers (00-admin-group.yaml). Also the
    #                      only group for hermes and cq, and an admin role
    #                      inside ArgoCD / Grafana / Kargo / Open WebUI / Mealie.
    #   homelab            runs the platform: ArgoCD, Kargo, Grafana, Bosun,
    #                      Specmarshal, Qdrant, Umami, the landing page, plus
    #                      Open WebUI. Admin role in ArgoCD and Kargo, Editor in
    #                      Grafana.
    #   media-management   Sonarr / Radarr / Bazarr / SABnzbd. Nothing bound yet:
    #                      those apps are on vcluster-media with their own
    #                      logins; bind them here when they move to forward-auth.
    #   media-viewer       Jellyfin and anything request-shaped. Nothing bound
    #                      yet (Jellyfin has its own login; next step is its SSO
    #                      plugin against an OIDC provider bound to this group).
    #   open-webui-users   Open WebUI only. Open WebUI already admits this group
    #                      (OAUTH_ALLOWED_ROLES) but it never existed in authentik.
    #   mealie-users       Mealie only (the household); lives in
    #                      authentik-blueprints-mealie.
    version: 1
    metadata:
      name: access-groups
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_core.group
        identifiers:
          name: homelab
        id: homelab
        attrs:
          is_superuser: false
      - model: authentik_core.group
        identifiers:
          name: media-management
        attrs:
          is_superuser: false
      - model: authentik_core.group
        identifiers:
          name: media-viewer
        attrs:
          is_superuser: false
      - model: authentik_core.group
        identifiers:
          name: open-webui-users
        id: open-webui-users
        attrs:
          is_superuser: false

      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, argocd]]
          group: !KeyOf homelab
        attrs:
          order: 0
          enabled: true
          negate: false
          timeout: 30

      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, kargo]]
          group: !KeyOf homelab
        attrs:
          order: 0
          enabled: true
          negate: false
          timeout: 30

      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, grafana]]
          group: !KeyOf homelab
        attrs:
          order: 0
          enabled: true
          negate: false
          timeout: 30

      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, bosun]]
          group: !KeyOf homelab
        attrs:
          order: 0
          enabled: true
          negate: false
          timeout: 30

      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, specmarshal]]
          group: !KeyOf homelab
        attrs:
          order: 0
          enabled: true
          negate: false
          timeout: 30

      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, qdrant]]
          group: !KeyOf homelab
        attrs:
          order: 0
          enabled: true
          negate: false
          timeout: 30

      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, umami]]
          group: !KeyOf homelab
        attrs:
          order: 0
          enabled: true
          negate: false
          timeout: 30

      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, homepage]]
          group: !KeyOf homelab
        attrs:
          order: 0
          enabled: true
          negate: false
          timeout: 30

      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, open-webui]]
          group: !KeyOf homelab
        attrs:
          order: 0
          enabled: true
          negate: false
          timeout: 30

      # Open WebUI's policy_engine_mode is `any` (05-openwebui-provider.yaml),
      # so either group is enough.
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, open-webui]]
          group: !KeyOf open-webui-users
        attrs:
          order: 10
          enabled: true
          negate: false
          timeout: 30

  12-invitation-enrollment.yaml: |
    # Authentik Blueprint: invite-only enrollment
    #
    # THE ONLY WAY AN ACCOUNT IS CREATED. There is no public sign-up: the
    # sign-in flow has no enrollment link, Google never creates users, and this
    # flow refuses to start without a valid invitation token.
    #
    # To invite someone: Directory -> Invitations -> Create, flow
    # `integratn-invitation`, single use, an expiry of a few days. Optionally
    # put {"email": "...", "username": "..."} in Fixed data to pre-fill them.
    # Send the link it shows. They choose a username and password, must enrol
    # TOTP or a passkey, and are signed in -- with NO groups, so they can reach
    # nothing until you add them to one (11-access-groups.yaml).
    version: 1
    metadata:
      name: invitation-enrollment
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_policies_password.passwordpolicy
        identifiers:
          name: integratn-password-policy
        id: password-policy
        attrs:
          password_field: password
          error_message: >-
            Use at least 14 characters, not a common or previously breached
            password.
          check_static_rules: true
          length_min: 14
          amount_digits: 0
          amount_lowercase: 0
          amount_uppercase: 0
          amount_symbols: 0
          check_have_i_been_pwned: true
          hibp_allowed_count: 0
          check_zxcvbn: true
          zxcvbn_score_threshold: 3

      - model: authentik_stages_invitation.invitationstage
        identifiers:
          name: integratn-invitation
        id: invitation-stage
        attrs:
          continue_flow_without_invitation: false

      - model: authentik_stages_prompt.prompt
        identifiers:
          name: integratn-invitation-username
        id: prompt-username
        attrs:
          field_key: username
          label: Username
          type: username
          required: true
          placeholder: Username
          order: 0
      - model: authentik_stages_prompt.prompt
        identifiers:
          name: integratn-invitation-name
        id: prompt-name
        attrs:
          field_key: name
          label: Name
          type: text
          required: true
          placeholder: Name
          order: 1
      - model: authentik_stages_prompt.prompt
        identifiers:
          name: integratn-invitation-email
        id: prompt-email
        attrs:
          field_key: email
          label: Email
          type: email
          required: true
          placeholder: Email
          order: 2
      - model: authentik_stages_prompt.prompt
        identifiers:
          name: integratn-invitation-password
        id: prompt-password
        attrs:
          field_key: password
          label: Password
          type: password
          required: true
          placeholder: Password
          order: 3
      - model: authentik_stages_prompt.prompt
        identifiers:
          name: integratn-invitation-password-repeat
        id: prompt-password-repeat
        attrs:
          field_key: password_repeat
          label: Password (repeat)
          type: password
          required: true
          placeholder: Password (repeat)
          order: 4

      - model: authentik_stages_prompt.promptstage
        identifiers:
          name: integratn-invitation-prompt
        id: prompt-stage
        attrs:
          fields:
            - !KeyOf prompt-username
            - !KeyOf prompt-name
            - !KeyOf prompt-email
            - !KeyOf prompt-password
            - !KeyOf prompt-password-repeat
          validation_policies:
            - !KeyOf password-policy

      - model: authentik_stages_user_write.userwritestage
        identifiers:
          name: integratn-invitation-write
        id: write-stage
        attrs:
          user_creation_mode: always_create
          create_users_as_inactive: false
          create_users_group: null
          user_type: internal

      - model: authentik_flows.flow
        identifiers:
          slug: integratn-invitation
        id: flow
        attrs:
          name: IntegratnIO invitation
          title: Join the platform
          designation: enrollment
          authentication: require_unauthenticated
          layout: stacked
          denied_action: message_continue
          background: /static/dist/assets/images/integratn/bg-ridgeline.svg

      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf flow
          stage: !KeyOf invitation-stage
          order: 10
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: false
          invalid_response_action: retry
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf flow
          stage: !KeyOf prompt-stage
          order: 20
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: false
          invalid_response_action: retry
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf flow
          stage: !KeyOf write-stage
          order: 30
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: false
          invalid_response_action: retry
      # MFA enrolment before the first login (03-authentication-flows.yaml).
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf flow
          stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, integratn-mfa]]
          order: 40
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: false
          invalid_response_action: retry
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf flow
          stage: !Find [authentik_stages_user_login.userloginstage, [name, integratn-authentication-login]]
          order: 100
        attrs:
          evaluate_on_plan: true
          re_evaluate_policies: false
          invalid_response_action: retry

  13-retire-bootstrap-token.yaml: |
    # Authentik Blueprint: delete the bootstrap API token
    #
    # AUTHENTIK_BOOTSTRAP_TOKEN created a non-expiring API token owned by
    # akadmin, `authentik-bootstrap-token`. Nothing in this repo or the cluster
    # uses it, so the env var is gone from values.yaml and this removes the
    # token itself. Need API access later? Create a token with an expiry, owned
    # by a named user, for that one job.
    version: 1
    metadata:
      name: retire-bootstrap-token
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_core.token
        identifiers:
          identifier: authentik-bootstrap-token
        state: absent
