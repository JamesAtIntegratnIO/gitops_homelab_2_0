argocd:
  additionalResources:
    type: manifests
    path: clusters
    manifestPath: addons/argo-cd/manifests
  syncPolicy:
    automated:
      selfHeal: true
      allowEmpty: false
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jqPathExpressions:
        - .status
      jsonPointers:
        - /spec/rules/0/backendRefs/0/group
        - /spec/rules/0/backendRefs/0/kind
        - /spec/rules/0/backendRefs/0/weight
        - /spec/parentRefs/0/group
        - /spec/parentRefs/0/kind

nginx-gateway-fabric:
  additionalResources:
    type: manifests
    path: clusters
    manifestPath: addons/nginx-gateway-fabric
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: Gateway
      jqPathExpressions:
        - .status
    - group: gateway.networking.k8s.io
      kind: ReferenceGrant
      jqPathExpressions:
        - .status

external-dns:
  additionalResources:
    type: manifests
    path: clusters
    manifestPath: addons/external-dns-resources

authentik:
  enabled: true
  additionalResources:
    type: manifests
    path: clusters
    manifestPath: addons/authentik

qdrant:
  additionalResources:
    type: manifests
    path: clusters
    manifestPath: addons/qdrant
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jqPathExpressions:
        - .status
    - group: gateway.nginx.org
      kind: SnippetsFilter
      jqPathExpressions:
        - .status

# MCP servers are managed by the mcp-system addon (addons/cluster-roles/control-plane/addons/mcp-system/)
# These Helm-chart-based MCP apps are disabled to avoid duplication.
mcp-kubernetes:
  enabled: false

mcp-github:
  enabled: false

mcp-sequential-thinking:
  enabled: false

mcp-grafana:
  enabled: false

mealie:
  # The Mealie recipe manager: the official image, digest-pinned, plain
  # manifests, Postgres on datacron (10.0.3.1). The namespace and its
  # NetworkPolicies are in network-policies/mealie.yaml.
  #
  # DEFINED HERE, NOT NEXT TO UMAMI in cluster-roles/control-plane/addons.yaml,
  # only because that file is 49 KB and this change was committed whole-file.
  # The layers deep-merge, so moving this block there changes nothing.
  #
  # One replica that migrates the database on start, so merging this is the
  # deploy, and the Postgres role, its password and the 1Password item have to
  # exist first (mealie/README.md).
  enabled: true
  type: manifest
  namespace: mealie
  project: platform-services
  defaultVersion: "main"
  path: addons/cluster-roles/control-plane/addons/mealie
  selectorMatchLabels:
    cluster_role: control-plane
  # Defaulted fields the manifests do not set, so the app is not OutOfSync
  # forever while syncing successfully every time -- umami's block, minus
  # SnippetsFilter (there is none here).
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.target.deletionPolicy
        - .spec.target.template.mergePolicy
        - .spec.data[]?.remoteRef.conversionStrategy
        - .spec.data[]?.remoteRef.decodingStrategy
        - .spec.data[]?.remoteRef.metadataPolicy
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jqPathExpressions:
        - .status
        - .spec.parentRefs[]?.group
        - .spec.parentRefs[]?.kind
        - .spec.rules[]?.backendRefs[]?.group
        - .spec.rules[]?.backendRefs[]?.kind
        - .spec.rules[]?.backendRefs[]?.weight
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true

secret-generation:
  # The ClusterSecretStore `onepassword-generated` (a write token for the 1Password
  # vault `generated` only) and its token ExternalSecret, so a reviewed PR can
  # create NEW random secrets without a value passing through git or Hermes.
  # README.md in the path says how it works, its limits and the one-time
  # setup (vault, Connect token, 1Password item `eso-generated-token`). The
  # create-only guard is network-policies/kyverno-restrict-pushsecret.yaml.
  #
  # Defined here, not in cluster-roles/control-plane/addons.yaml, for the same
  # reason as mealie above: that file is 49 KB.
  #
  # Until the 1Password item exists the store is not Ready; nothing else uses it.
  enabled: true
  type: manifest
  namespace: external-secrets
  project: platform-services
  defaultVersion: "main"
  path: addons/cluster-roles/control-plane/addons/secret-generation
  selectorMatchLabels:
    cluster_role: control-plane
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.target.deletionPolicy
        - .spec.target.template.mergePolicy
        - .spec.data[]?.remoteRef.conversionStrategy
        - .spec.data[]?.remoteRef.decodingStrategy
        - .spec.data[]?.remoteRef.metadataPolicy
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
