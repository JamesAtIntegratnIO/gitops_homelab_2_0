# Generated secrets: the capability, not the secrets.
#
# A SECOND ClusterSecretStore over the same `homelab` vault as
# onepassword-store, with its own Connect token that may WRITE. ESO PushSecrets
# create NEW items there (random values from the Password generator);
# ExternalSecrets read them back through the normal read store
# `onepassword-store`, like every other credential. Hermes asks James before it
# ever authors one (skill secret-requests, hermes/secrets-skill.yaml), and
# network-policies/kyverno-restrict-pushsecret.yaml limits every PushSecret to
# this store, to create-only, and to item names starting `generated-`.
#
# The token: 1Password item `eso-generated-token` (field `token`) in the
# `homelab` vault, read through onepassword-store. It is a Connect token with
# read AND write on `homelab`. Until that item exists the Secret below does not
# sync and this store reports not-ready; nothing else is affected. The read
# store keeps its own token and nothing about it changes.
#
# The existing store (`onepassword-store`, defined in
# environments/production/addons/addons.yaml) is untouched.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword-generated
spec:
  provider:
    onepassword:
      connectHost: https://connect.integratn.tech
      vaults:
        homelab: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: eso-onepassword-generated-token
            namespace: external-secrets
            key: token
