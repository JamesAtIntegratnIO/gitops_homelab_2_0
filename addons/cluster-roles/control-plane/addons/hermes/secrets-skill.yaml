# GENERATED SECRETS, ASK FIRST. The skill that goes with the secret-generation
# addon (addons/.../secret-generation, network-policies/
# kyverno-restrict-pushsecret.yaml). Mounted read-only by subPath (see
# hermes-agent.yaml); the pod picks up changes on restart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-skill-secrets
  namespace: hermes
data:
  SKILL.md: |
    ---
    name: secret-requests
    description: "Use when an app needs a generated credential. Ask first."
    version: 1.0.0
    author: James (gitops_homelab_2_0)
    platforms: [linux]
    metadata:
      hermes:
        tags: [Secrets, 1Password, ExternalSecrets, GitOps]
        related_skills: [homelab-app-onboarding, gitops-fix]
    ---

    # Creating a generated secret (ask first)

    ## When to use

    A credential that is only random and only has to be agreed between things
    inside the cluster: an OIDC client id and secret shared by an app and
    authentik, an app's secret key, an internal bearer token.

    Not for: a credential someone else issues (an API key, a GitHub or
    Cloudflare token, the Anthropic key); anything that must also be set in a
    system you cannot reach (a Postgres role password on datacron, a Connect
    token); anything a person types in; an item that already exists. For those,
    say what James has to create and where.

    ## How it works (describe it truthfully)

    - You never see the value. A PR adds a `Password` generator and a
      `PushSecret` in the consumer's namespace. ESO generates the value and
      writes a NEW item to the 1Password vault `generated` through the
      ClusterSecretStore `onepassword-generated`. ExternalSecrets read it back
      through the same store.
    - Create only. Kyverno `restrict-pushsecret` rejects a PushSecret that is
      not `updatePolicy: IfNotExists`, `deletionPolicy: None` and aimed at
      `onepassword-generated`. An existing item is never changed or deleted by
      this path. Rotating or deleting one is James's, in 1Password.
    - The write token reaches only the vault `generated`. Nothing in `homelab`.
    - Merging the PR is what creates the item, and merging is James's call.

    ## Ask first, every time

    Before you write any manifest, send James this and wait for an explicit
    yes in the same conversation. No answer means no secret. In a cron,
    background or unattended run, do not create it: say what you need and stop.
    One block per item.

    ```
    Secret request
    Item:        <1Password item name> (vault: generated)
    Fields:      <label> = <what it will contain, e.g. 64 random letters and
                 digits | the fixed string "mealie">
    Why:         <what needs it and what fails without it>
    Read by:     <the ExternalSecrets and namespaces that consume it>
    Created by:  PushSecret <name> in <namespace>, create-only, in PR <branch>
    Not covered: <anything in this task that still needs James's hands>
    ```

    A yes to one request is not a yes to another, and not a yes to changing or
    deleting an item.

    ## Rules

    - Item names are lowercase with hyphens and name the consumer, for example
      `authentik-mealie-oidc`. Field labels are lowercase with hyphens. Look
      for an existing item first (a `homelab` item you can read by key is not
      this path).
    - Values: letters and digits only (`symbols: 0`) for anything that ends up
      in a URL or a shell. Say the length in the request.
    - Never print, log or paste a value, and never put one in a PR body. The
      PR names the item and the field labels only.
    - Two sides of one credential read the same item, from
      `onepassword-generated`.
    - A Kyverno rejection of the PushSecret is a stop: fix the manifest or
      report it. Never loosen the policy, the store or this skill to get past
      it.
    - Branch, commit and PR rules are gitops-fix's, with homelab-app-onboarding
      for the app side.

    ## Manifests

    One generator and one PushSecret per item, next to the consumer's
    manifests:

    ```yaml
    apiVersion: generators.external-secrets.io/v1alpha1
    kind: Password
    metadata:
      name: <item>
      namespace: <ns>
    spec:
      length: 64
      digits: 20
      symbols: 0
      noUpper: false
      allowRepeat: true
    ---
    apiVersion: external-secrets.io/v1alpha1
    kind: PushSecret
    metadata:
      name: <item>
      namespace: <ns>
    spec:
      refreshInterval: 1h
      updatePolicy: IfNotExists
      deletionPolicy: None
      secretStoreRefs:
        - name: onepassword-generated
          kind: ClusterSecretStore
      selector:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: <item>
      template:
        data:
          client-id: "<fixed non-secret id>"
          client-secret: "{{ .password }}"
      data:
        - match:
            secretKey: client-id
            remoteRef: { remoteKey: <item>, property: client-id }
        - match:
            secretKey: client-secret
            remoteRef: { remoteKey: <item>, property: client-secret }
    ```

    ## After the merge

    Check (kubernetes MCP, resources_get) that the PushSecret is Ready and the
    consuming ExternalSecrets are Ready. You cannot read the Secret and must
    not try. Report what ESO did.

    The first use was written without running it. If a step behaves
    differently from this skill (a field is not created, the value changes on
    refresh, a Kyverno path does not match), say so plainly, and fix this
    skill with a PR.
