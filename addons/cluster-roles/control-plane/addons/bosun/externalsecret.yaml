# The agent's GitHub credential.
#
# Deliberately NOT the same token Kargo uses. Two reasons:
#   * it needs scopes Kargo's does not (Issues, for the labels that carry the
#     attempt cap), and
#   * one identity per actor keeps revocation clean -- and makes it obvious in
#     the PR timeline which commits the agent authored.
#
# Requires 1Password item "bosun-github" with property:
#   token   fine-grained PAT scoped to jamesatintegratnio/gitops_homelab_2_0:
#             Contents:        read+write   (push the fix to the bot branch)
#             Pull requests:   read+write   (comment)
#             Issues:          read+write   (labels: the attempt cap)
#             Commit statuses: read         (read the gate)
#             Metadata:        read
#             Workflows:       NONE
#
# That last line is load-bearing. Without the Workflows permission GitHub
# REJECTS any push touching .github/workflows/**, which makes "the agent
# cannot edit the gate" a guarantee enforced by someone else's server, on top
# of the agent's own deny-list.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bosun-github
  namespace: bosun
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: bosun-github
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        # The 1Password ITEM name, which the rename did not touch and must not:
        # renaming a component in git cannot rename an item in someone's vault.
        # A blanket rename briefly changed this and the ExternalSecret failed
        # with "key not found in 1Password Vaults".
        key: delivery-agent-github
        property: token
---
# The model API key.
#
# The LM Studio endpoint on the workstation requires one, so values.yaml sets
# llm.existingSecret to this Secret and the agent sends it as a bearer token.
#
# Requires 1Password item "bosun-llm" with property:
#   api-key
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bosun-llm
  namespace: bosun
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: bosun-llm
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        # As above -- the 1Password item name, not ours to rename from here.
        key: delivery-agent-llm
        property: api-key
