# kargo-pipelines for the local proving ground.
#
# One target, deliberately shaped as a CHAIN: podinfo promotes into the tenant
# pin file first, verifies, then into the hub pin file. A single-stage target
# would exercise less of the chart than the production one does, and chains are
# the part that has never run anywhere.
git:
  # Set by 20-seed.sh to the seeded Gitea repository. Must match the repoURL on
  # the kargo credential Secret exactly -- Kargo matches by normalised URL.
  repoURL: ""
  branch: main
  provider: gitea

merge:
  method: squash
  # Tighter than production: this is a demo and nobody is waiting five minutes
  # to see a PR get picked up.
  pollInterval: 15s
  waitPollInterval: 30s
  errorThreshold: 3
  timeout: 20m0s
  waitTimeout: 1h0m0s

triage:
  enabled: true
  url: http://bosun.bosun.svc.cluster.local:8080/v1/promotion-opened
  # `always` rather than the production `gated`: the whole point here is to
  # watch the agent work, and gated would skip the auto-mergeable PRs that
  # make up most of the demo.
  when: always
  continueOnError: true
  timeout: 30s

defaults:
  autoMerge: never
  autoPromotion: true
  interval:
    chart: 5m0s
  discoveryLimit:
    chart: 10

verification:
  prometheus: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
  # Far shorter than production's 3m: kind syncs fast and a demo that waits
  # three minutes to show a green tick teaches nobody anything.
  initialDelay: 45s
  interval: 20s
  count: 3
  failureLimit: 1

projects:
  delivery:
    description: The local proving ground for the delivery kit.
    targets:
      podinfo:
        scope: podinfo
        chart:
          repoURL: https://stefanprodan.github.io/podinfo
          name: podinfo
        stages:
          - name: tenant
            updates:
              # The Application's own targetRevision. In a repo whose
              # Applications come from an ApplicationSet the pin lives in a
              # values file instead; here there is no indirection, and
              # updating a values file nothing reads would leave the gate
              # correctly reporting that nothing changed.
              - file: apps/podinfo-tenant.yaml
                keys: [spec.source.targetRevision]
            verify:
              apps: [podinfo-tenant]
            requiredSoakTime: 0s
          - name: hub
            updates:
              - file: apps/podinfo-hub.yaml
                keys: [spec.source.targetRevision]
            verify:
              apps: [podinfo-hub]
