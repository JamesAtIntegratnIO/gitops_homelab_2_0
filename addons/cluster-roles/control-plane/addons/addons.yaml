  path: addons/cluster-roles/control-plane/addons/network-policies
  selector:
    matchExpressions:
      - key: cluster_role
        operator: NotIn
        values: ['vcluster']
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: kyverno.io
      kind: ClusterPolicy
      jqPathExpressions:
        - .metadata.annotations."policies.kyverno.io/rescan"

