# trivy-operator values for control-plane clusters
# Scans workload images for vulnerabilities, misconfigurations, and exposed secrets.

# Exclude system namespaces that run trusted images and would generate noise
excludeNamespaces: "kube-system,kube-public,kube-node-lease"

# Disable node collector — requires hostPID and hostPath which violate
# PodSecurity "baseline" and fail on Talos (immutable root filesystem,
# no /etc/systemd or /lib/systemd). The chart has no nodeCollector.enabled toggle;
# infra assessment scanner controls node-collector job creation.
nodeCollector:
  excludeNodes: ""

# Security hardening — fixes AVD-KSV-0030 / AVD-KSV-0104
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

operator:
  # Disable infra assessment scanning — node-collector can't run on Talos
  infraAssessmentScannerEnabled: false
  # One scan at a time. In Standalone mode every scan Job downloads and
  # unpacks the Trivy DB onto the node's only disk, the same disk as
  # /var/lib/etcd. On 2026-10-16 a full rescan (25 -> 790 reports, up to 166
  # scan pods/hour on .101/.102) pushed etcd WAL fsync p99 on .102 to 1-3 s and
  # caused 196 leader changes in a day against a 14-day baseline of 0-7. One
  # slot keeps the steady state (~13 scans/hour) and turns a full rescan into
  # a slow trickle instead of a storm.
  scanJobsConcurrentLimit: 1
  scanJobTimeout: 10m
  # Clean up completed scan jobs after 30s
  scanJobTTL: 30s

# Deferrable: a vulnerability scan must never cost a running service its node.
priorityClassName: platform-batch

trivyOperator:
  # Kratix ships from a gated community registry that Trivy cannot authenticate
  # to. Trivy resolves the reference back to registry-1.docker.io and gets
  # UNAUTHORIZED, so the scan Job fails, is retried, and reports
  # BackoffLimitExceeded -- 30+ warning events on 2026-08-21 against an
  # otherwise healthy scanner (149 VulnerabilityReports, newest that minute).
  #
  #   unable to find the specified image
  #   "syntasso-community.docker.reo.dev/syntasso/kratix-platform@sha256:..."
  #   remote error: GET https://registry-1.docker.io/v2/syntasso/kratix-platform/
  #   manifests/... UNAUTHORIZED: authentication required
  #
  # Excluding it is honest about what is happening: the image is not being
  # scanned either way, and this stops the retry loop from burying real scan
  # failures. It does leave the Kratix controller image unscanned -- worth
  # revisiting if Syntasso publishes to a registry we can read, or if a pull
  # secret becomes available.
  excludeImages: "syntasso-community.docker.reo.dev/*"
  # Scan Jobs never run on 10.0.4.102 (talos-4kg-ymz). Its etcd member is the
  # one that stalls under disk load: on 2026-10-16 its WAL fsync p99 reached
  # 3.1 s and backend commit 5.1 s while scan Jobs ran there, against a 14-day
  # p99.9 of 94 ms / 187 ms, and on 10-09/10-10, when little else wrote to it,
  # it was the fastest of the three (fsync median 8-9 ms). .101 and .103 take
  # the scans one at a time (scanJobsConcurrentLimit above). Talos hostnames
  # are generated, so update this if .102 is ever reinstalled.
  scanJobAffinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["talos-4kg-ymz"]

trivy:
  priorityClassName: platform-batch
  # Standalone mode — no Trivy server needed
  mode: Standalone
  # Only report actionable severities
  severity: LOW,MEDIUM,HIGH,CRITICAL
  # Drop vulnerabilities with no fixed version available.
  #
  # Without this the VulnerabilityReport for ghcr.io/goauthentik/server crossed
  # the 2 MiB apiserver/etcd gRPC message limit -- 2190230 vs 2097152, only 4%
  # over -- so trivy-operator could never write it:
  #
  #   Reconciler error ... rpc error: code = ResourceExhausted desc = trying to
  #   send message larger than max (2190230 vs 2097152)
  #
  # The two authentik scan Jobs then retried forever, permanently holding 2 of
  # the 3 scanJobsConcurrentLimit slots. The queue never drained: the cluster
  # went from 149 VulnerabilityReports to 2 between 2026-08-28 and 2026-09-01
  # while every dashboard stayed green. Unfixed findings are not actionable
  # anyway, which is the same rationale as the severity list above.
  ignoreUnfixed: true
  # Resource limits for scan jobs — raised CPU to reduce CPUThrottling alerts
  resources:
    requests:
      cpu: 200m
      memory: 200M
    limits:
      cpu: "1"    # Raised from 500m — scan jobs CPU-throttle and fail
      memory: 500M

# Enable Prometheus ServiceMonitor for metrics scraping
serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack
  honorLabels: true
