serviceMonitor:
  enabled: true

config:
  # Counts "stale file handle" lines so Prometheus can alert on a pod that keeps
  # running on a dead NFS mount (platform-alerts: PodLoggingStaleFileHandle).
  # Setting pipelineStages replaces the chart default, so `cri: {}` is restated.
  # Exposed as promtail_custom_stale_file_handle_lines_total on :3101/metrics,
  # labelled with the log stream's labels; dropped 30m after the last match.
  snippets:
    pipelineStages:
      - cri: {}
      - match:
          selector: '{namespace=~".+"} |~ "(?i)stale (nfs )?file handle"'
          stages:
            - metrics:
                stale_file_handle_lines_total:
                  type: Counter
                  description: Log lines reporting a stale NFS file handle (ESTALE)
                  max_idle_duration: 30m
                  config:
                    match_all: true
                    action: inc
      # Hermes Agent's own log (agent.log, copied to stdout by the agent-log
      # sidecar in hermes/hermes-agent.yaml). Counters for the platform.hermes
      # alerts; Hermes has no Prometheus endpoint of its own. Same naming and
      # exported_* labels as above. Patterns are Hermes v0.23 log strings.
      - match:
          selector: '{namespace="hermes", container="agent-log"} |~ "^[0-9-]+ [0-9:,]+ ERROR "'
          stages:
            - metrics:
                hermes_error_lines_total:
                  type: Counter
                  description: Hermes Agent log lines at level ERROR
                  max_idle_duration: 2h
                  config:
                    match_all: true
                    action: inc
      - match:
          selector: '{namespace="hermes", container="agent-log"} |~ "keepalive failed"'
          stages:
            - metrics:
                hermes_mcp_keepalive_failed_lines_total:
                  type: Counter
                  description: Hermes MCP keepalive failures (server session lost, reconnecting)
                  max_idle_duration: 30m
                  config:
                    match_all: true
                    action: inc
      - match:
          selector: '{namespace="hermes", container="agent-log"} |~ "rejected the last [0-9]+ calls"'
          stages:
            - metrics:
                hermes_mcp_rejected_calls_lines_total:
                  type: Counter
                  description: Hermes MCP circuit breaker refusing calls to a server
                  max_idle_duration: 1h
                  config:
                    match_all: true
                    action: inc
      - match:
          selector: '{namespace="hermes", container="agent-log"} |~ "Gateway drain timed out"'
          stages:
            - metrics:
                hermes_turns_interrupted_lines_total:
                  type: Counter
                  description: Hermes gateway stopped with agent turns still running
                  max_idle_duration: 1h
                  config:
                    match_all: true
                    action: inc
      - match:
          selector: '{namespace="hermes", container="agent-log"} |~ "Permission denied: .?/opt/hermes-skills"'
          stages:
            - metrics:
                hermes_skill_write_denied_lines_total:
                  type: Counter
                  description: Hermes tried to edit a read-only git skill
                  max_idle_duration: 6h
                  config:
                    match_all: true
                    action: inc
  clients:
    - url: http://loki-gateway.loki.svc.cluster.local/loki/api/v1/push
      external_labels:
        cluster: the-cluster
        environment: production

# Security hardening — fixes AVD-KSV-0030 (seccomp)
# Note: promtail needs host log access, so allowPrivilegeEscalation and
# capabilities are left at chart defaults (needs some for log reading).
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

# Setting tolerations REPLACES the chart default, so its two control-plane
# entries are restated. The third lets promtail run on the Raspberry Pi 5 worker
# (talos-pi5-1), which is tainted so amd64-only images cannot land there; the
# promtail image is multi-arch.
tolerations:
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node.integratn.tech/arch
    operator: Equal
    value: arm64
    effect: NoSchedule
