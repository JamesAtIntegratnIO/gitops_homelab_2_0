# The kube-dns Service, taken verbatim from Talos bootstrap manifest
# `11-core-dns-svc`. clusterIP 10.96.0.10 is every pod's resolver: it is
# baked into each kubelet's --cluster-dns and therefore into /etc/resolv.conf
# on every running pod. It must not change, which is why it is written out
# explicitly rather than left for the apiserver to allocate.
apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/port: "9153"
    prometheus.io/scrape: "true"
  labels:
    k8s-app: kube-dns
    kubernetes.io/cluster-service: "true"
    kubernetes.io/name: CoreDNS
  name: kube-dns
  namespace: kube-system
spec:
  clusterIP: 10.96.0.10
  clusterIPs:
    - 10.96.0.10
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: dns
      port: 53
      protocol: UDP
      targetPort: 53
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: 53
    - name: metrics
      port: 9153
      protocol: TCP
      targetPort: 9153
  selector:
    k8s-app: kube-dns
