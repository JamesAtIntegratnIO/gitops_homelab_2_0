apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-status-reconciler
  namespace: platform-status-reconciler
  labels:
    app.kubernetes.io/name: platform-status-reconciler
    app.kubernetes.io/part-of: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-status-reconciler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-status-reconciler
        app.kubernetes.io/part-of: platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: platform-status-reconciler
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: reconciler
          # Pinned to the CI-built tag rather than :latest.
          #
          # With :latest, a merged code change never reached the cluster: the
          # manifest was unchanged, so ArgoCD had nothing to sync and the pod
          # kept running whatever it started with. On 2026-08-21 that pod was
          # from 2026-02-28 -- six months of fixes built and published but never
          # deployed, and the write-loop fix in 9878067 needed a manual
          # `kubectl rollout restart` to land.
          #
          # The workflow publishes `main-<sha>` alongside `latest` (see
          # .github/workflows/build-platform-status-reconciler-image.yaml), so
          # bumping this line is what deploys new reconciler code.
          image: ghcr.io/jamesatintegratnio/gitops_homelab_2_0/platform-status-reconciler:main-55400cb@sha256:0ea05f1278b73bfbb712535c73e14c1b4443c59f8ac36283641b81eb517b5fd1
          imagePullPolicy: Always
          env:
            - name: RECONCILE_INTERVAL
              value: "60s"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
