# Open WebUI Helm values (chart v12.5.0, app v0.8.6) — no Ollama, Pipelines disabled
ollama:
  enabled: false

# The external Ollama at 10.0.3.4 is gone (removed 2026-11-07, unreachable).
ollamaUrls: []

# Disable the chart's singular OpenAI URL — we set the plural OPENAI_API_BASE_URLS
# in extraEnvVars to support OpenAI API directly.
openaiBaseApiUrl: ""

pipelines:
  enabled: false

image:
  # Pinned ahead of the chart's appVersion (12.5.0 ships 0.8.5). Kargo keeps
  # this line current (kargo-projects target open-webui-image) and rewrites
  # it from the value onwards, so keep comments off the `tag:` line itself.
  tag: v0.13.2

# Deferrable: the AI stack should yield its node to a platform service.
priorityClassName: platform-batch

resources:
  requests:
    # Live usage 2m; this reserves headroom for a burst, not a baseline.
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 1Gi

persistence:
  enabled: true
  size: 2Gi
  storageClass: config-nfs-client
  accessModes:
    - ReadWriteOnce

ingress:
  enabled: false

# Native Gateway API HTTPRoute (new in chart v12+)
route:
  enabled: true
  apiVersion: gateway.networking.k8s.io/v1
  kind: HTTPRoute
  hostnames:
    - "chat.cluster.integratn.tech"
  parentRefs:
    - name: nginx-gateway
      namespace: nginx-gateway
      sectionName: https
  httpsRedirect: false

# Disable websocket redis (single replica, not needed)
websocket:
  enabled: false

extraEnvVars:
  # No Ollama backend any more (10.0.3.4 is gone). This is a PersistentConfig
  # value: it only seeds a fresh database; the running instance's switch is in
  # Admin Panel -> Settings -> Connections.
  - name: ENABLE_OLLAMA_API
    value: "false"
  - name: WEBUI_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: open-webui-secrets
        key: secret-key
  # OpenAI API (ChatGPT) — key from 1Password via ExternalSecret
  # Defined early so $(OPENAI_API_KEY_OPENAI) can be expanded below.
  - name: OPENAI_API_KEY_OPENAI
    valueFrom:
      secretKeyRef:
        name: open-webui-secrets
        key: openai-api-key
  # OpenAI-compatible backends. Seeds a fresh database only (PersistentConfig);
  # the running instance's connections live in its DB and are edited in Admin
  # Panel -> Settings -> Connections. That is also where Hermes Agent
  # (http://hermes-agent.hermes.svc.cluster.local:8642/v1, key API_SERVER_KEY
  # from 1Password homelab/hermes-agent) is configured. The llmkube service
  # (llmkube-system) no longer exists.
  - name: OPENAI_API_BASE_URLS
    value: "https://api.openai.com/v1"
  - name: OPENAI_API_KEYS
    value: "$(OPENAI_API_KEY_OPENAI)"
  # OIDC / Authentik SSO
  - name: ENABLE_OAUTH_SIGNUP
    value: "true"
  - name: OAUTH_PROVIDER_NAME
    value: "Authentik"
  - name: OPENID_PROVIDER_URL
    value: "https://auth.cluster.integratn.tech/application/o/open-webui/.well-known/openid-configuration"
  - name: OAUTH_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: open-webui-secrets
        key: oidc-client-id
  - name: OAUTH_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: open-webui-secrets
        key: oidc-client-secret
  - name: OAUTH_SCOPES
    value: "openid email profile groups"
  - name: ENABLE_OAUTH_ROLE_MANAGEMENT
    value: "true"
  - name: OAUTH_ADMIN_ROLES
    value: "authentik Admins"
  - name: OAUTH_ALLOWED_ROLES
    value: "authentik Admins,open-webui-users"
  # Disable local signup — SSO only
  - name: ENABLE_SIGNUP
    value: "false"
  - name: ENABLE_LOGIN_FORM
    value: "true"
  - name: DEFAULT_USER_ROLE
    value: "user"
  # Enable API keys for programmatic access
  - name: ENABLE_API_KEY
    value: "true"
  # Filter chat model list — allowlist only (hides embedding-only models like nomic-embed-text)
  - name: ENABLE_MODEL_FILTER
    value: "true"
  - name: MODEL_FILTER_LIST
    value: "hermes-agent;gpt-4o;gpt-4o-mini;gpt-4.1;gpt-4.1-mini;gpt-4.1-nano;gpt-5.2;gpt-5.2-pro;gpt-5.2-with-tools"
  - name: DEFAULT_MODELS
    value: "gpt-5.2-with-tools"
  # Vector DB — use the shared Qdrant instance instead of default ChromaDB
  - name: VECTOR_DB
    value: "qdrant"
  - name: QDRANT_URI
    value: "http://qdrant:6333"
  - name: QDRANT_PREFER_GRPC
    value: "true"
  - name: QDRANT_GRPC_PORT
    value: "6334"
  - name: ENABLE_QDRANT_MULTITENANCY_MODE
    value: "false"
  # RAG settings
  - name: ENABLE_RAG_WEB_SEARCH
    value: "false"
  # KNOWN BROKEN since the Ollama host at 10.0.3.4 went away: document/RAG
  # embeddings have no backend. Left as-is on purpose: switching the embedding
  # model changes the vector size, and the existing Qdrant collections were
  # built with nomic-embed-text (768 dims). Pick a new embedding backend first.
  - name: RAG_EMBEDDING_ENGINE
    value: "ollama"
  - name: RAG_EMBEDDING_MODEL
    value: "nomic-embed-text"
  - name: RAG_EMBEDDING_BATCH_SIZE
    value: "8"
  - name: RAG_OPENAI_API_BASE_URL
    value: "http://10.0.3.4:11434"
