global:
  domain: argocd.cluster.integratn.tech
  # Recovery path: ArgoCD is what puts everything else back.
  priorityClassName: platform-critical

# -- Horizontal + vertical scaling for the host cluster ArgoCD
controller:
  replicas: 2
  dynamicClusterDistribution: true
  # The chart ships pdb.enabled: false. With two replicas a drain is free to
  # take both at once, which stops all reconciliation until they come back.
  pdb:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      # VPA target 361m, upper bound 429m, live 340m on the active replica.
      cpu: 400m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
  # Increase probe tolerance — app-controller GC pauses cause intermittent timeouts
  readinessProbe:
    timeoutSeconds: 10
    failureThreshold: 5
    periodSeconds: 20

server:
  pdb:
    enabled: true
    minAvailable: 1
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 7
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 70
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 600
        policies:
          - type: Pods
            value: 1
            periodSeconds: 300
      scaleUp:
        stabilizationWindowSeconds: 120
        policies:
          - type: Pods
            value: 2
            periodSeconds: 60
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    annotations:
      metallb.io/loadBalancerIPs: 10.0.4.201
  # Disabled 2026-08-22: this never worked, and on chart 10.4.0 it stopped
  # failing quietly.
  #
  # The installer init container downloads the extension from github.com:443,
  # but `allow-argocd-server` grants egress only to ports 8081/6379/5556 inside
  # the namespace -- no internet, unlike allow-repo-server and
  # allow-application-controller, which do carry a 443 ipBlock rule. So the
  # download has always timed out after 30s. Chart 10.4.0 bumps the installer
  # image v0.0.9 -> v1.0.1, and where v0.0.9 timed out and exited 0 (leaving no
  # extension and no complaint), v1.0.1 exits 28. Both pods' init logs show the
  # same "Elapsed Time: 30030 ms"; only the exit code changed.
  #
  # That turned a silent no-op into Init:CrashLoopBackOff, pinning argocd-server
  # to its old ReplicaSet -- no new server pod could ever start.
  #
  # Re-enabling it means deciding to give argocd-server egress to the internet:
  # add a 443 ipBlock egress rule for `app.kubernetes.io/component: server` in
  # network-policies/argocd.yaml, matching the repo-server rule. Left off until
  # someone wants the Trivy tab enough to widen that.
  extensions:
    enabled: false

repoServer:
  pdb:
    enabled: true
    minAvailable: 1
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 7
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 70
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 600
        policies:
          - type: Pods
            value: 1
            periodSeconds: 300
      scaleUp:
        stabilizationWindowSeconds: 120
        policies:
          - type: Pods
            value: 2
            periodSeconds: 60
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"     # Raised from 1 — CPUThrottlingHigh fires during Helm template rendering
      memory: 1Gi
  # Increase probe tolerance — heavy template rendering causes transient timeouts
  livenessProbe:
    timeoutSeconds: 10
    failureThreshold: 5
    periodSeconds: 20
  readinessProbe:
    timeoutSeconds: 10
    failureThreshold: 5
    periodSeconds: 20

applicationSet:
  replicas: 2
  pdb:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      # VPA target 15m, live 2-6m.
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

redis:
  resources:
    requests:
      # VPA target 28m, live 11m.
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

configs:
  params:
    server.insecure: true
    server.url: https://argocd.cluster.integratn.tech
  
  cm:
    # Reduce reconciliation interval from 180s default to 60s
    # Ensures state store changes from Kratix are picked up quickly
    # without over-stressing the controller (30s was causing probe flaps)
    timeout.reconciliation: 60s

    # Authentik OIDC configuration
    oidc.config: |
      name: Authentik
      issuer: https://auth.cluster.integratn.tech/application/o/argocd/
      clientID: $argocd-oidc-config:client-id
      clientSecret: $argocd-oidc-config:client-secret
      requestedScopes:
        - openid
        - profile
        - email
        - groups
    # Ignore webhook caBundle drift — cert-manager rotates these automatically
    resource.customizations.ignoreDifferences.admissionregistration.k8s.io_MutatingWebhookConfiguration: |
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    resource.customizations.ignoreDifferences.admissionregistration.k8s.io_ValidatingWebhookConfiguration: |
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
    # Custom health check for ApplicationSet (ArgoCD doesn't include one by default)
    resource.customizations.health.argoproj.io_ApplicationSet: |
      hs = {}
      hs.status = "Healthy"
      hs.message = "ApplicationSet is running"
      return hs

    # Local account for AI MCP platform (API key only, no UI login)
    accounts.mcp-readonly: apiKey
    accounts.mcp-readonly.enabled: "true"
  
  rbac:
    policy.csv: |
      # Default policy: read-only for authenticated users
      p, role:readonly, applications, get, */*, allow
      p, role:readonly, certificates, get, *, allow
      p, role:readonly, clusters, get, *, allow
      p, role:readonly, repositories, get, *, allow
      p, role:readonly, projects, get, *, allow
      p, role:readonly, accounts, get, *, allow
      p, role:readonly, gpgkeys, get, *, allow
      g, role:readonly, role:readonly
      
      # MCP AI platform read-only account
      p, role:mcp-readonly, applications, get, */*, allow
      p, role:mcp-readonly, clusters, get, *, allow
      p, role:mcp-readonly, projects, get, *, allow
      p, role:mcp-readonly, repositories, get, *, allow
      p, role:mcp-readonly, logs, get, */*, allow
      g, mcp-readonly, role:mcp-readonly
      
      # Map Authentik Admins group to ArgoCD admin role
      g, authentik Admins, role:admin

dex:
  enabled: false

extraObjects:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: argocd
      namespace: argocd
    spec:
      parentRefs:
        - name: nginx-gateway
          namespace: nginx-gateway
          sectionName: https
      hostnames:
        - argocd.cluster.integratn.tech
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: argo-cd-argocd-server
              port: 80
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: argocd-http-redirect
      namespace: argocd
    spec:
      parentRefs:
        - name: nginx-gateway
          namespace: nginx-gateway
          sectionName: http
      hostnames:
        - argocd.cluster.integratn.tech
      rules:
        - filters:
            - type: RequestRedirect
              requestRedirect:
                scheme: https
                statusCode: 301
          matches:
            - path:
                type: PathPrefix
                value: /