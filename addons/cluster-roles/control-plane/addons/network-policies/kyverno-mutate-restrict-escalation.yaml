# Kyverno ClusterPolicy: Set allowPrivilegeEscalation=false and drop ALL capabilities
# Fixes AVD-KSV-0001 (allowPrivilegeEscalation not false)
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: mutate-restrict-escalation
  annotations:
    policies.kyverno.io/title: Restrict Privilege Escalation
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Mutates containers to set allowPrivilegeEscalation to false and drop ALL
      capabilities if not already set. This prevents child processes from
      gaining more privileges than their parent. Excludes namespaces where
      elevated privileges are operationally required (e.g. metallb-speaker
      needs NET_RAW+SYS_ADMIN, promtail needs host log access).
spec:
  admission: true
  validationFailureAction: Audit
  background: false
  rules:
    - name: set-no-privilege-escalation
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - metallb-system
                - promtail
      mutate:
        foreach:
          - list: "request.object.spec.containers"
            patchStrategicMerge:
              spec:
                containers:
                  - (name): "{{ element.name }}"
                    securityContext:
                      +(allowPrivilegeEscalation): false
                      +(capabilities):
                        +(drop):
                          - ALL
          - list: "request.object.spec.initContainers || []"
            patchStrategicMerge:
              spec:
                initContainers:
                  - (name): "{{ element.name }}"
                    securityContext:
                      +(allowPrivilegeEscalation): false
                      +(capabilities):
                        +(drop):
                          - ALL
---
# CEL replacement for the ClusterPolicy above (Kyverno 1.20 no longer runs
# ClusterPolicy). Same add-if-absent semantics as the old +() anchors: a value
# a container already sets is written back unchanged, so nothing is
# overridden. CREATE only (a running pod's securityContext is immutable) and
# Pods only, like mutate-seccomp-default.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: mutate-restrict-escalation
  annotations:
    policies.kyverno.io/title: Restrict Privilege Escalation
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Sets allowPrivilegeEscalation to false and drops ALL capabilities on
      containers and init containers that do not set them. Excludes namespaces
      where elevated privileges are operationally required (metallb-speaker
      needs NET_RAW+SYS_ADMIN, promtail needs host log access).
spec:
  evaluation:
    admission:
      enabled: true
    mutateExisting:
      enabled: false
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, metallb-system, promtail]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        # ?initContainers: leaves the field out entirely for a pod without
        # init containers.
        expression: >-
          Object{
            spec: Object.spec{
              containers: object.spec.containers.map(c, Object.spec.containers{
                name: c.name,
                securityContext: Object.spec.containers.securityContext{
                  allowPrivilegeEscalation: c.?securityContext.?allowPrivilegeEscalation.orValue(false),
                  capabilities: Object.spec.containers.securityContext.capabilities{
                    drop: c.?securityContext.?capabilities.?drop.orValue(['ALL'])
                  }
                }
              }),
              ?initContainers: size(object.spec.?initContainers.orValue([])) == 0 ? optional.none() :
                optional.of(object.spec.initContainers.map(c, Object.spec.initContainers{
                  name: c.name,
                  securityContext: Object.spec.initContainers.securityContext{
                    allowPrivilegeEscalation: c.?securityContext.?allowPrivilegeEscalation.orValue(false),
                    capabilities: Object.spec.initContainers.securityContext.capabilities{
                      drop: c.?securityContext.?capabilities.?drop.orValue(['ALL'])
                    }
                  }
                }))
            }
          }
