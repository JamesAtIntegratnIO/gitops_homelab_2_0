applicationName: sonarr
extraObjects:
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: sonarr-allow-postgres-egress
      namespace: media
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: sonarr
      policyTypes:
        - Egress
      egress:
        - to:
            - ipBlock:
                cidr: 10.0.3.1/32
          ports:
            - protocol: TCP
              port: 5432
  # Jellyfin on Tower (host-networked Docker): Sonarr's Emby/Jellyfin
  # connection calls its library-refresh API on import/upgrade/rename/delete so
  # new files show up without waiting for Jellyfin's scheduled scan. Tracearr
  # has its own rule for the same port; NetworkPolicies are per-pod.
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: sonarr-allow-jellyfin-egress
      namespace: media
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: sonarr
      policyTypes:
        - Egress
      egress:
        - to:
            - ipBlock:
                cidr: 10.0.0.12/32
          ports:
            - protocol: TCP
              port: 8096
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: eso-homepage-secret
      namespace: media
    spec:
      refreshInterval: 1h
      secretStoreRef:
        kind: ClusterSecretStore
        name: onepassword-store
      target:
        name: homepage-secret
        creationPolicy: Owner
      dataFrom:
        - extract:
            key: homepage-secret
            decodingStrategy: None
            conversionStrategy: Default
            metadataPolicy: None
  - apiVersion: v1
    kind: PersistentVolume
    metadata:
      name: sonarr-config-pv
      labels:
        app: sonarr
      annotations:
        pv.kubernetes.io/provisioned-by: k8s-sigs.io/nfs-subdir-external-provisioner
    spec:
      accessModes:
        - ReadWriteOnce
      capacity:
        storage: 1Gi
      nfs:
        path: /mnt/user/kube_storage/sonarr-config-pvc
        server: 10.0.0.12
      persistentVolumeReclaimPolicy: Retain
      storageClassName: config-nfs-client
      volumeMode: Filesystem
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: sonarr-config-pvc
      namespace: media
      labels:
        app: sonarr
    spec:
      storageClassName: config-nfs-client
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
      volumeName: sonarr-config-pv
  - apiVersion: v1
    kind: PersistentVolume
    metadata:
      name: sonarr-media-pv
      labels:
        app: sonarr
      annotations:
        pv.kubernetes.io/provisioned-by: k8s-sigs.io/data-nfs-subdir-external-provisioner
    spec:
      accessModes:
        - ReadWriteOnce
      capacity:
        storage: 1Gi
      nfs:
        path: /mnt/user/data
        server: 10.0.0.12
      persistentVolumeReclaimPolicy: Retain
      storageClassName: data-nfs-client
      volumeMode: Filesystem
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: sonarr-media-pvc
      namespace: media
      labels:
        app: sonarr
    spec:
      storageClassName: data-nfs-client
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
      volumeName: sonarr-media-pv
  # Forward-auth: the nginx half of authentik provider `sonarr-proxy-provider`
  # (blueprint 08d-media-proxy-providers.yaml in the host's authentik addon).
  # Every request to sonarr.vcluster-media.integratn.tech except /api becomes
  # an auth_request subrequest to authentik's embedded outpost; a 401 turns into
  # a 302 to the sign-in page. The app's own login is off (see the httpRoute
  # comment below), so this is the only door for the web UI.
  #
  # The outpost is reached as authentik-server.nginx-gateway: the host Service
  # authentik/authentik-server replicated INTO this vcluster
  # (networking.replicateServices.fromHost in
  # platform/vclusters/vcluster-media.yaml). The host halves of the network
  # path are allow-gateway-authentik-egress (network-policies/vcluster-media.yaml)
  # and the vcluster-media rule in authentik-server-ingress (authentik.yaml).
  #
  # One copy per app on purpose: ExtensionRef has no namespace and each app is
  # its own ArgoCD Application, so a shared object would have one owner.
  - apiVersion: gateway.nginx.org/v1alpha1
    kind: SnippetsFilter
    metadata:
      name: sonarr-forward-auth
      namespace: media
    spec:
      snippets:
        - context: http.server
          value: |
            location /outpost.goauthentik.io/ {
                proxy_pass          http://authentik-server.nginx-gateway.svc.cluster.local/outpost.goauthentik.io/;
                proxy_set_header    Host $host;
                proxy_set_header    X-Original-URL $scheme://$http_host$request_uri;
                proxy_set_header    X-Real-IP $remote_addr;
                proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header    X-Forwarded-Proto $scheme;
                proxy_set_header    Content-Length "";
                proxy_pass_request_body off;
            }

            location @goauthentik_proxy_signin {
                internal;
                add_header Set-Cookie $auth_cookie;
                return 302 /outpost.goauthentik.io/start?rd=$request_uri;
            }
        - context: http.server.location
          value: |
            auth_request        /outpost.goauthentik.io/auth/nginx;
            error_page          401 = @goauthentik_proxy_signin;

            auth_request_set $auth_cookie $upstream_http_set_cookie;
            add_header Set-Cookie $auth_cookie;

            auth_request_set $authentik_username $upstream_http_x_authentik_username;
            auth_request_set $authentik_groups $upstream_http_x_authentik_groups;
            auth_request_set $authentik_email $upstream_http_x_authentik_email;
            proxy_set_header X-authentik-username $authentik_username;
            proxy_set_header X-authentik-groups $authentik_groups;
            proxy_set_header X-authentik-email $authentik_email;
deployment:
  # Recreate, not the chart's RollingUpdate: with one replica a rolling update
  # starts the new pod while the old one still holds the same Postgres
  # database. On a major upgrade that means a v4 process writing while v5 runs
  # its one-way schema migrations.
  strategy:
    type: Recreate
  securityContext:
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    runAsNonRoot: false
    runAsUser: 0
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add:
        - CHOWN
        - DAC_OVERRIDE
        - FOWNER
        - SETUID
        - SETGID
  image:
    repository: linuxserver/sonarr
    # Sonarr v5 beta (linuxserver `develop` builds). The v5 schema migration is
    # one-way: going back to a 4.x tag needs the pre-upgrade pg_dump of
    # sonarr-main/sonarr-log restored first. Kargo tracks develop-* tags only
    # (kargo-projects values, target sonarr), so it cannot "update" back to 4.x.
    tag: develop-5.0.0.3041-ls212
    pullPolicy: IfNotPresent
  ports:
    - name: http
      containerPort: 8989
      protocol: TCP
  env:
    TZ:
      value: America/Denver
    PUID:
      value: "1000"
    PGID:
      value: "1000"
    PUSHOVER_DEBUG:
      value: "false"
    SONARR__AUTHENTICATION_METHOD:
      value: External
    SONARR__AUTHENTICATION_REQUIRED:
      value: DisabledForLocalAddresses
    SONARR__INSTANCE_NAME:
      value: Sonarr
    SONARR__PORT:
      value: "8989"
    SONARR__LOG_LEVEL:
      value: info
    SONARR__THEME:
      value: dark
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      # 1Gi, was 512Mi. A dry run of the v5 migrations on a copy of this
      # database (2026-10-31, Postgres 13.23) peaked at 313Mi against 216Mi
      # steady on v4; v5's media-info migration (225) has OOMed bigger
      # libraries, so this keeps headroom for the one-time migration.
      memory: 1Gi
  additionalContainers:
    - name: exportarr
      image: ghcr.io/onedr0p/exportarr:v2.3.0
      command:
        - /exportarr
      args:
        - sonarr
      ports:
        - name: metrics
          containerPort: 9707
          protocol: TCP
      env:
        - name: PORT
          value: "9707"
        - name: URL
          value: http://localhost:8989
        - name: APIKEY
          valueFrom:
            secretKeyRef:
              name: homepage-secret
              key: HOMEPAGE_VAR_SONARR_KEY
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
  volumes:
    config:
      persistentVolumeClaim:
        claimName: sonarr-config-pvc
    media:
      persistentVolumeClaim:
        claimName: sonarr-media-pvc
    tmp:
      emptyDir:
        medium: Memory
        sizeLimit: 64Mi
    s6-run:
      emptyDir:
        medium: Memory
        sizeLimit: 16Mi
  volumeMounts:
    config:
      mountPath: /config
    media:
      mountPath: /data
    tmp:
      mountPath: /tmp
    s6-run:
      mountPath: /run
persistence:
  enabled: false
service:
  additionalLabels:
    prometheus: media-cluster
  ports:
    - name: http
      port: 8989
      targetPort: 8989
      protocol: TCP
serviceMonitor:
  enabled: false
# The web UI sits behind authentik forward-auth (sonarr-forward-auth above;
# group media-management). /api is the one path left outside it, for clients
# that hold the API key (phone apps, scripts): the app still demands the key
# there and refuses a call without it. Gateway API picks the longest matching
# prefix, so /api wins over / whatever the rule order. Homepage, arr-mcp and the
# other in-cluster callers use the synced Service and never pass the gateway.
# Away from home, sonarr.integratn.tech is the Cloudflare Tunnel straight to the
# synced Service, behind Cloudflare Access (authentik sign-in) with key, backup
# and log paths blocked at the edge; it never uses this route, so the open /api
# rule here is LAN-only (cloudflared/README.md).
httpRoute:
  enabled: true
  parentRefs:
    - name: nginx-gateway
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - sonarr.vcluster-media.integratn.tech
  rules:
    - backendRefs:
        - name: sonarr
          port: 8989
      matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.nginx.org
            kind: SnippetsFilter
            name: sonarr-forward-auth
    - backendRefs:
        - name: sonarr
          port: 8989
      matches:
        - path:
            type: PathPrefix
            value: /api
certificate:
  enabled: false
