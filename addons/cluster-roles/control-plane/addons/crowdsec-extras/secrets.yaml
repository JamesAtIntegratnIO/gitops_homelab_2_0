# CrowdSec's secrets.
#
# crowdsec-lapi: generated in the cluster, never typed by anyone and not in
# 1Password. External Secrets' Password generator fills it once
# (refreshPolicy CreatedOnce) and never touches it again. If it is ever
# deleted, a new one is generated; restart LAPI, the agent and ban-sync
# together (they all read it).
#   csLapiSecret          LAPI's JWT signing secret (chart: secrets.externalSecret)
#   registrationToken     agents auto-register with it (chart: same)
#   bouncerKeyCloudflare  ban-sync's bouncer API key (LAPI env BOUNCER_KEY_cloudflare)
#
# crowdsec-cloudflare: 1Password item `cloudflare-crowdsec-sync`, field
# `token`: a Cloudflare API token with Account > Account Filter Lists > Edit
# on the IntegratnIO account, nothing else. Created by James.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: crowdsec-secret-64
  namespace: crowdsec
spec:
  length: 72
  digits: 20
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-lapi
  namespace: crowdsec
spec:
  refreshPolicy: CreatedOnce
  target:
    name: crowdsec-lapi
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: crowdsec-secret-64
      rewrite:
        - regexp:
            source: "password"
            target: "csLapiSecret"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: crowdsec-secret-64
      rewrite:
        - regexp:
            source: "password"
            target: "registrationToken"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: crowdsec-secret-64
      rewrite:
        - regexp:
            source: "password"
            target: "bouncerKeyCloudflare"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-cloudflare
  namespace: crowdsec
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: crowdsec-cloudflare
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: cloudflare-crowdsec-sync
        property: token
