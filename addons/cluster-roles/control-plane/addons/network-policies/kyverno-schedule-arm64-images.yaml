# Kyverno ClusterPolicy: let multi-arch pods run on the Raspberry Pi 4 workers
#
# The Pi workers carry node.integratn.tech/arch=arm64:NoSchedule because the
# scheduler does not check image architecture, so nothing lands there unless it
# tolerates the taint. This policy gives that toleration to a pod in which
# EVERY container image is on the arm64-image-allowlist ConfigMap below. One
# image that is not listed leaves the whole pod untouched.
#
# The pod gets (1) the arch toleration and (2) a REQUIRED nodeAffinity that
# excludes board=rpi5, so the Pi 5 stays reserved for hermes and cq. Nothing
# prefers or avoids the Pi 4s: the scheduler places the pod on any eligible node
# by its normal scoring, so the Pi 4s are candidates alongside the control-plane
# nodes. If the Pi 4s are full or down the pod runs on the control-plane nodes.
# This keeps mutated pods off the Pi 5 but is not a hard guarantee: only a taint
# on the Pi 5 itself (a Talos machine-config change) would be.
#
# A pod is skipped if it already sets nodeName, a control-plane or board
# nodeSelector, a nodeAffinity (a DaemonSet pod always has one), or a
# kubernetes.io/arch selector other than arm64. Protected namespaces are
# excluded: kube-system, kyverno, cilium-secrets, metallb-system,
# nfs-provisioner, local-path-storage, trivy-system, hermes, cq (and the
# kube-public and kube-node-lease namespaces).
#
# Mutation runs on CREATE only, so nothing moves until a pod is recreated.
# Mutate rules have no Audit mode: the allowlist is the dial. Remove an entry
# and the next pod using that image is left alone.
#
# Allowlist entries are repositories ("repo:*"), so a new version of a listed
# image is picked up without editing this file. If a repository ever drops its
# arm64 build, a pod using the new tag can be scheduled onto a Pi 4 and fail to
# start there (the scheduler does not know about image architecture): remove the
# entry, or replace it with exact tags.
#
# The second rule is the Audit half: it reports any pod that selects arm64 (by
# hand) while running an image that is not on the list.
apiVersion: v1
kind: ConfigMap
metadata:
  name: arm64-image-allowlist
  namespace: kyverno
  labels:
    app.kubernetes.io/part-of: platform
data:
  # One entry per image repository, matched against each container image in a
  # pod spec after any @sha256 digest is dropped. "repo:*" matches every tag of
  # that repository; an entry without * matches that exact reference only.
  #
  # A "repo:*" entry means: the newest tags of this repository were checked
  # against its registry on 2026-11-08 and all had a linux/arm64 manifest, so a
  # version bump (Kargo or by hand) keeps landing on the Pis. It does not mean
  # every old tag does, and it does not mean the application suits a Pi.
  # Remove an entry to take that repository back to the control-plane nodes.
  #
  # Exact entries (no *) are left that way on purpose:
  #   - prometheus-operator: its newest tag (v0.95.1) did not show an arm64
  #     manifest (absent or a failed lookup, not investigated);
  #   - platform-status-reconciler: our own image, tags not sampled;
  #   - the ecr-public redis mirror: the registry has no tag listing to sample;
  #   - kratix-platform has no tag in its reference, so it already matches any
  #     digest and needs no *.
  # A reference with no tag at all (implicit :latest) matches none of the
  # "repo:*" entries.
  images: |-
    [
      "ghcr.io/linuxserver/bazarr:*",
      "mikefarah/yq:*",
      "docker.io/linuxserver/sonarr:*",
      "linuxserver/sonarr:*",
      "ghcr.io/linuxserver/radarr:*",
      "ghcr.io/linuxserver/sabnzbd:*",
      "ghcr.io/onedr0p/exportarr:*",
      "redimp/otterwiki:*",
      "busybox:*",
      "ghcr.io/connorgallopo/tracearr:*",
      "mirror.gcr.io/library/alpine:*",
      "timescale/timescaledb-ha:*",
      "redis:*",
      "ghcr.io/raydak-labs/configarr:*",
      "ghcr.io/luigi311/jellyplex-watched:*",
      "docker.io/cloudflare/cloudflared:*",
      "docker.io/glanceapp/glance:*",
      "docker.io/grafana/grafana:*",
      "docker.io/grafana/mcp-grafana:*",
      "docker.io/nginxinc/nginx-unprivileged:*",
      "docker.io/prompve/prometheus-pve-exporter:*",
      "ecr-public.aws.com/docker/library/redis:8.6.4-alpine",
      "ghcr.io/akuity/kargo:*",
      "ghcr.io/argoproj-labs/mcp-for-argocd:*",
      "ghcr.io/bardesss/arr-mcp:*",
      "ghcr.io/external-secrets/external-secrets:*",
      "ghcr.io/github/github-mcp-server:*",
      "ghcr.io/goauthentik/server:*",
      "ghcr.io/jamesatintegratnio/gitops_homelab_2_0/platform-status-reconciler:main-55400cb",
      "ghcr.io/nginx/nginx-gateway-fabric/nginx:*",
      "ghcr.io/nginx/nginx-gateway-fabric:*",
      "ghcr.io/stefanprodan/podinfo:*",
      "ghcr.io/supercorp-ai/supergateway:*",
      "ghcr.io/umami-software/umami:*",
      "ghcr.io/unpoller/unpoller:*",
      "metio/matrix-alertmanager-receiver:*",
      "quay.io/argoproj/argo-rollouts:*",
      "quay.io/argoproj/argocd:*",
      "quay.io/containers/kubernetes_mcp_server:*",
      "quay.io/jetstack/cert-manager-cainjector:*",
      "quay.io/jetstack/cert-manager-controller:*",
      "quay.io/jetstack/cert-manager-webhook:*",
      "quay.io/kiwigrid/k8s-sidecar:*",
      "quay.io/prometheus-operator/prometheus-operator:v0.93.1",
      "registry.k8s.io/autoscaling/vpa-recommender:*",
      "registry.k8s.io/external-dns/external-dns:*",
      "registry.k8s.io/kube-state-metrics/kube-state-metrics:*",
      "syntasso-community.docker.reo.dev/syntasso/kratix-platform",
      "us-docker.pkg.dev/fairwinds-ops/oss/goldilocks:*"
    ]
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: schedule-arm64-images
  annotations:
    policies.kyverno.io/title: Allow Allowlisted Images On The Pi Workers
    policies.kyverno.io/category: Scheduling
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Pods whose images are all on the arm64-image-allowlist ConfigMap in the
      kyverno namespace get the node.integratn.tech/arch toleration and a
      required nodeAffinity that excludes board=rpi5. Any other pod, and any pod
      in a protected namespace, is left alone.
spec:
  admission: true
  validationFailureAction: Audit
  background: false
  rules:
    - name: tolerate-arm64-for-allowlisted-images
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Pod
              operations:
                - CREATE
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
                - cilium-secrets
                - metallb-system
                - nfs-provisioner
                - local-path-storage
                - trivy-system
                - hermes
                - cq
      context:
        - name: arm64Images
          configMap:
            name: arm64-image-allowlist
            namespace: kyverno
      preconditions:
        all:
          # At least one image, so a pod with none cannot pass AllIn vacuously.
          - key: "{{ request.object.spec.[initContainers[].image || `[]`, containers[].image || `[]`][] | length(@) }}"
            operator: GreaterThan
            value: 0
          - key: "{{ request.object.spec.[initContainers[].image || `[]`, containers[].image || `[]`][] | [*].split(@, '@')[0] }}"
            operator: AllIn
            value: "{{ parse_json(arm64Images.data.images) }}"
          # Already placed, or constrained by something else: leave it alone.
          - key: "{{ request.object.spec.nodeName || '' }}"
            operator: Equals
            value: ""
          # Key presence, not value: the control-plane label's value is empty.
          - key: "{{ keys(request.object.spec.nodeSelector || `{}`) }}"
            operator: AllNotIn
            value:
              - node-role.kubernetes.io/control-plane
              - node.integratn.tech/board
          - key: "{{ request.object.spec.nodeSelector.\"kubernetes.io/arch\" || 'arm64' }}"
            operator: Equals
            value: arm64
          - key: "{{ length(request.object.spec.affinity.nodeAffinity || `{}`) }}"
            operator: Equals
            value: 0
      mutate:
        # Existing affinity keys (podAntiAffinity...) and tolerations are kept:
        # the first op writes the pod's own affinity back (or {}), the second
        # adds nodeAffinity under it (the preconditions guarantee there was none),
        # the third appends ours to the toleration list. The nodeAffinity value is
        # static on purpose: Kyverno's variable syntax cannot hold a JSON literal
        # nested more than one brace deep.
        patchesJson6902: |-
          - op: add
            path: /spec/affinity
            value: {{ request.object.spec.affinity || `{}` }}
          - op: add
            path: /spec/affinity/nodeAffinity
            value:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node.integratn.tech/board
                        operator: NotIn
                        values:
                          - rpi5
          - op: add
            path: /spec/tolerations
            value: {{ [request.object.spec.tolerations || `[]`, `[{"key":"node.integratn.tech/arch","operator":"Equal","value":"arm64","effect":"NoSchedule"}]`][] }}
    - name: audit-non-allowlisted-images-on-arm64
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Pod
              operations:
                - CREATE
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
                - cilium-secrets
                - metallb-system
                - nfs-provisioner
                - local-path-storage
                - trivy-system
                - hermes
                - cq
      context:
        - name: arm64Images
          configMap:
            name: arm64-image-allowlist
            namespace: kyverno
      preconditions:
        all:
          - key: "{{ request.object.spec.nodeSelector.\"kubernetes.io/arch\" || '' }}"
            operator: Equals
            value: arm64
      validate:
        message: >-
          This pod selects arm64 but runs an image that is not on the
          arm64-image-allowlist ConfigMap in the kyverno namespace. Check that
          the image has a linux/arm64 manifest and add it, or drop the nodeSelector.
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.[initContainers[].image || `[]`, containers[].image || `[]`][] | [*].split(@, '@')[0] }}"
                operator: AnyNotIn
                value: "{{ parse_json(arm64Images.data.images) }}"
