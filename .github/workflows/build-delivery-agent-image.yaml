name: Build and Publish delivery-agent Image

on:
  push:
    branches:
      - main
    paths:
      - 'delivery/images/delivery-agent/**'
      - '.github/workflows/build-delivery-agent-image.yaml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/delivery-agent

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: delivery/images/delivery-agent/go.mod
          cache-dependency-path: delivery/images/delivery-agent/go.sum
      - name: Vet and test
        working-directory: delivery/images/delivery-agent
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt"; exit 1; }
          go vet ./...
          go test ./...

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # No 'latest'. An unpinned tag is how an image silently changes
          # underneath a cluster, which is the incident class this whole
          # delivery kit exists to prevent -- shipping one here would be
          # embarrassing.
          tags: |
            type=raw,value=main
            type=sha,prefix={{branch}}-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./delivery/images/delivery-agent
          # amd64 only: all three nodes are amd64 and the vcluster shares them,
          # so an arm64 image has no consumer. Halves the build and removes the
          # emulated runtime stage entirely.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
