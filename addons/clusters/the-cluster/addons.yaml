argocd:
  additionalResources:
    type: manifests
    path: clusters
    manifestPath: addons/argo-cd/manifests
  syncPolicy:
    automated:
      selfHeal: true
      allowEmpty: true
      prune: true
    retry:
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jqPathExpressions:
        - .status
      jsonPointers:
        - /spec/rules/0/backendRefs/0/group
        - /spec/rules/0/backendRefs/0/kind
        - /spec/rules/0/backendRefs/0/weight
        - /spec/parentRefs/0/group
        - /spec/parentRefs/0/kind

nginx-gateway-fabric:
  additionalResources:
    type: manifests
    path: clusters
    manifestPath: addons/nginx-gateway-fabric
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: Gateway
      jqPathExpressions:
        - .status
    - group: gateway.networking.k8s.io
      kind: ReferenceGrant
      jqPathExpressions:
        - .status

external-dns:
  additionalResources:
    type: manifests
    path: clusters
    manifestPath: addons/external-dns-resources

authentik:
  enabled: true
  additionalResources:
    type: manifests
    path: clusters
    manifestPath: addons/authentik

qdrant:
  additionalResources:
    type: manifests
    path: clusters
    manifestPath: addons/qdrant
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jqPathExpressions:
        - .status
    - group: gateway.nginx.org
      kind: SnippetsFilter
      jqPathExpressions:
        - .status

llmkube:
  enabled: true
  namespace: llmkube-system
  chartName: llmkube
  chartRepository: "https://defilantech.github.io/LLMKube"
  defaultVersion: "0.7.6"
  project: platform-services
  selectorMatchLabels:
    cluster_role: control-plane
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  additionalResources:
    type: manifests
    path: clusters
    manifestPath: addons/llmkube-models

