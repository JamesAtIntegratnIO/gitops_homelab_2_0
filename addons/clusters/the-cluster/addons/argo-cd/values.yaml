global:
  domain: argocd.cluster.integratn.tech
  # Recovery path: ArgoCD is what puts everything else back.
  priorityClassName: platform-critical

# -- Horizontal + vertical scaling for the host cluster ArgoCD
controller:
  replicas: 2
  dynamicClusterDistribution: true
  # The chart ships pdb.enabled: false. With two replicas a drain is free to
  # take both at once, which stops all reconciliation until they come back.
  pdb:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      # VPA target 361m, upper bound 429m, live 340m on the active replica.
      cpu: 400m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
  # Increase probe tolerance — app-controller GC pauses cause intermittent timeouts
  readinessProbe:
    timeoutSeconds: 10
    failureThreshold: 5
    periodSeconds: 20

server:
  pdb:
    enabled: true
    minAvailable: 1
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 7
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 70
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 600
        policies:
          - type: Pods
            value: 1
            periodSeconds: 300
      scaleUp:
        stabilizationWindowSeconds: 120
        policies:
          - type: Pods
            value: 2
            periodSeconds: 60
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    annotations:
      metallb.io/loadBalancerIPs: 10.0.4.201
  # The installer init container fetches this tarball from a GitHub release, so
  # argocd-server needs egress to the open internet on 443. It had none until
  # 2026-08-22, which is why the extension had never actually installed -- the
  # download timed out on every rollout, installer v0.0.9 swallowed that and
  # exited 0, and chart 10.4.0's v1.0.1 exits 28 instead, which is what finally
  # surfaced it. The matching egress rule is `allow-argocd-server` in
  # network-policies/argocd.yaml; the two have to move together.
  #
  # EXTENSION_CHECKSUM_URL is deliberately not set. The extension does publish
  # one, but its single entry names the file by build path:
  #
  #   f5e6a134...4ae45  ./dist/resources/extension-trivy.tar
  #
  # and the installer looks the value up with
  # `awk -v f=extension-trivy.tar '$2 == f'` -- an exact match on the bare
  # filename, which never equals the path-prefixed one. So validation cannot
  # succeed for this extension, and there is no way to pass a literal checksum
  # or to skip only the validation (IGNORE_FAILURE would restore exactly the
  # silent no-op this change exists to remove).
  #
  # The artifact was verified by hand on 2026-08-22 and does match what the
  # project published:
  #
  #   sha256  f5e6a134909606d7e176294eea643779a81fb08248b985435ea3ab920694ae45
  #   624640 bytes, single file resources/extension-trivy.js/extension-trivy.js
  #
  # Re-check with that hash if the release is ever re-cut. Restore the checksum
  # URL if upstream republishes with a bare filename, or if the installer learns
  # to match on basename.
  extensions:
    enabled: true
    extensionList:
      - name: extension-trivy
        env:
          - name: EXTENSION_URL
            value: https://github.com/mziyabo/argocd-trivy-extension/releases/download/v0.2.0/extension-trivy.tar

repoServer:
  pdb:
    enabled: true
    minAvailable: 1
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 7
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 70
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 600
        policies:
          - type: Pods
            value: 1
            periodSeconds: 300
      scaleUp:
        stabilizationWindowSeconds: 120
        policies:
          - type: Pods
            value: 2
            periodSeconds: 60
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"     # Raised from 1 — CPUThrottlingHigh fires during Helm template rendering
      memory: 1Gi
  # Increase probe tolerance — heavy template rendering causes transient timeouts
  livenessProbe:
    timeoutSeconds: 10
    failureThreshold: 5
    periodSeconds: 20
  readinessProbe:
    timeoutSeconds: 10
    failureThreshold: 5
    periodSeconds: 20

applicationSet:
  replicas: 2
  pdb:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      # VPA target 15m, live 2-6m.
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

redis:
  resources:
    requests:
      # VPA target 28m, live 11m.
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

configs:
  params:
    server.insecure: true
    server.url: https://argocd.cluster.integratn.tech
  
  cm:
    # Reduce reconciliation interval from 180s default to 60s
    # Ensures state store changes from Kratix are picked up quickly
    # without over-stressing the controller (30s was causing probe flaps)
    timeout.reconciliation: 60s

    # Authentik OIDC configuration
    oidc.config: |
      name: Authentik
      issuer: https://auth.cluster.integratn.tech/application/o/argocd/
      clientID: $argocd-oidc-config:client-id
      clientSecret: $argocd-oidc-config:client-secret
      requestedScopes:
        - openid
        - profile
        - email
        - groups
    # Ignore webhook caBundle drift — cert-manager rotates these automatically
    resource.customizations.ignoreDifferences.admissionregistration.k8s.io_MutatingWebhookConfiguration: |
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    resource.customizations.ignoreDifferences.admissionregistration.k8s.io_ValidatingWebhookConfiguration: |
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
    # Custom health check for ApplicationSet (ArgoCD doesn't include one by default)
    resource.customizations.health.argoproj.io_ApplicationSet: |
      hs = {}
      hs.status = "Healthy"
      hs.message = "ApplicationSet is running"
      return hs

    # Local account for AI MCP platform (API key only, no UI login)
    accounts.mcp-readonly: apiKey
    accounts.mcp-readonly.enabled: "true"

    # Local account for Bosun's gate (API key only, no UI login).
    #
    # It exists to REPLACE an RBAC grant, not to add access. The gate renders
    # ApplicationSets against the live cluster inventory, and reading that
    # inventory from the cluster Secrets means get/list on Secrets in this
    # namespace -- which cannot be scoped to "the labels but not the data",
    # because RBAC has no such predicate. This account reads the same four
    # fields through ArgoCD's own API, which does draw that line, and the
    # bosun chart then stops creating the Role.
    #
    # Its policy below is ONE line. A token with more than that would be a
    # bigger credential than the Secret read it replaced.
    accounts.bosun: apiKey
    accounts.bosun.enabled: "true"
  
  rbac:
    policy.csv: |
      # Default policy: read-only for authenticated users
      p, role:readonly, applications, get, */*, allow
      p, role:readonly, certificates, get, *, allow
      p, role:readonly, clusters, get, *, allow
      p, role:readonly, repositories, get, *, allow
      p, role:readonly, projects, get, *, allow
      p, role:readonly, accounts, get, *, allow
      p, role:readonly, gpgkeys, get, *, allow
      g, role:readonly, role:readonly
      
      # MCP AI platform read-only account
      p, role:mcp-readonly, applications, get, */*, allow
      p, role:mcp-readonly, clusters, get, *, allow
      p, role:mcp-readonly, projects, get, *, allow
      p, role:mcp-readonly, repositories, get, *, allow
      p, role:mcp-readonly, logs, get, */*, allow
      g, mcp-readonly, role:mcp-readonly
      
      # Bosun's gate: the cluster inventory it expands ApplicationSets
      # against, and deliberately nothing else -- not applications, not repos,
      # not logs. This is the whole reason the account exists.
      p, role:bosun, clusters, get, *, allow
      g, bosun, role:bosun
      
      # Map Authentik Admins group to ArgoCD admin role
      g, authentik Admins, role:admin

dex:
  enabled: false

extraObjects:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: argocd
      namespace: argocd
    spec:
      parentRefs:
        - name: nginx-gateway
          namespace: nginx-gateway
          sectionName: https
      hostnames:
        - argocd.cluster.integratn.tech
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: argo-cd-argocd-server
              port: 80
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: argocd-http-redirect
      namespace: argocd
    spec:
      parentRefs:
        - name: nginx-gateway
          namespace: nginx-gateway
          sectionName: http
      hostnames:
        - argocd.cluster.integratn.tech
      rules:
        - filters:
            - type: RequestRedirect
              requestRedirect:
                scheme: https
                statusCode: 301
          matches:
            - path:
                type: PathPrefix
                value: /