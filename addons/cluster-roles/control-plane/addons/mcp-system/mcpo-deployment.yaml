# MCPO: MCP-to-OpenAPI proxy
# Wraps MCP servers (prometheus, kubernetes) as OpenAPI endpoints
# Cluster-internal: no HTTPRoute, and only this namespace can reach port 8000.
# Open WebUI has no tool server configured and no network path here.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcpo
  namespace: mcp-system
  labels:
    app: mcpo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcpo
  template:
    metadata:
      labels:
        app: mcpo
    spec:
      # Deferrable: developer tooling, not a platform dependency.
      priorityClassName: platform-batch
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: render-config
          # First-party, but :latest drifts on every CI build of the image.
          image: ghcr.io/jamesatintegratnio/gitops_homelab_2_0/kubectl:v1.34.1@sha256:2de503a9fc20271a9981abf91f1e1bbbd11ebd4dc461a046c97e6ca04fd44cdb
          command:
            - /bin/bash
            - -c
            - |
              # Substitute env vars in config template
              sed -e "s|\${GITHUB_TOKEN}|${GITHUB_TOKEN}|g" \
                  -e "s|\${UMAMI_MCP_TOKEN}|${UMAMI_MCP_TOKEN}|g" \
                  /config-template/config.json > /config-rendered/config.json
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-github-token
                  key: GITHUB_TOKEN
            # Umami's API key (externalsecret-umami-mcp.yaml). OPTIONAL on
            # purpose: the key can only be created once Umami is running, and a
            # required reference would stop the pod starting without it. Until
            # it exists the umami entry renders an empty bearer, and `start` in
            # mcpo-ops-configmap.yaml leaves that entry out of the running config.
            - name: UMAMI_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: umami-mcp
                  key: token
                  optional: true
          volumeMounts:
            - name: config-template
              mountPath: /config-template
              readOnly: true
            - name: config-rendered
              mountPath: /config-rendered
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: mcpo
          image: ghcr.io/open-webui/mcpo:main@sha256:1e82c9555c19e50b80745705f32b47a2647589f35279527b5118ecd3a71bd467
          # Starts mcpo on the backends that answer: see mcpo-ops-configmap.yaml.
          command:
            - /app/.venv/bin/python
            - /scripts/mcpo_ops.py
            - start
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            # Writable home for uvx cache
            - name: HOME
              value: /tmp/mcpo-home
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          # /openapi.json answers 200 through every wedge, because the schemas
          # are built at start and never read again. It is only good for this
          # one: uvicorn does not listen until every backend has been tried.
          startupProbe:
            httpGet:
              path: /openapi.json
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          # Both of these ask the local `health` server and no real backend, so
          # a backend being down fails neither. -IS skips site-packages: these
          # run stdlib only, and on a wedged pod they share a pinned CPU limit.
          readinessProbe:
            exec:
              command:
                - /app/.venv/bin/python
                - -IS
                - /scripts/mcpo_ops.py
                - ready
            periodSeconds: 10
            timeoutSeconds: 5
          # A wedge is this process's own state and only a restart clears it,
          # which is why this is safe as liveness. `live` adds one thing: a
          # backend left out at start answering again. It never fails on a
          # backend that is down.
          livenessProbe:
            exec:
              command:
                - /app/.venv/bin/python
                - -IS
                - /scripts/mcpo_ops.py
                - live
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: config-rendered
              mountPath: /config-rendered
              readOnly: true
            - name: mcpo-home
              mountPath: /tmp/mcpo-home
            - name: mcpo-ops
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: mcpo-ops
          configMap:
            name: mcpo-ops
        - name: config-template
          configMap:
            name: mcpo-config
        - name: config-rendered
          emptyDir:
            sizeLimit: 1Mi
        - name: mcpo-home
          emptyDir:
            sizeLimit: 500Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mcpo
  namespace: mcp-system
  labels:
    app: mcpo
spec:
  type: ClusterIP
  selector:
    app: mcpo
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
