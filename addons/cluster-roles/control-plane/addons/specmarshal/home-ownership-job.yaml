# PreSync hook: gives the Specmarshal home to uid/gid 1000 before the chart's
# pod rolls.
#
# Up to 0.2.0-rc.9 the chart ran the orchestrator as root, so every file on the
# home's claim is root's. From 0.2.0-rc.12 the pod runs as 1000:1000 on a
# read-only root and relies on fsGroup to hand the home to its group. The home
# is on config-nfs-client, an nfs-subdir provisioner, and the kubelet ignores
# fsGroup on NFS, so without this the new pod fails on its first write to the
# home. The chart's README says the same ("Upgrading a release that ran as
# root") and asks for this chown, once.
#
# It runs on every sync but changes only what is not already 1000:1000, so
# after the first run it is a walk and nothing else. It also catches files the
# old root pod writes while it drains a run (up to terminationGracePeriodSeconds)
# on the next sync. If the NFS export squashes root, the chown is refused, the
# Job fails, and the sync stops before the Deployment changes: rc.9 keeps
# running and the failure is in this Job's log.
#
# Root, not privileged: chown needs CAP_CHOWN and nothing else.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: specmarshal-home-ownership
  namespace: specmarshal
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: specmarshal-home-ownership
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chown
          image: docker.io/alpine/k8s:1.35.9@sha256:b9cb6db0091a2327c0a56ecda69d37fa830c7a96ea669e7382b3ee778aa07a24
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
          command:
            - /bin/sh
            - -ec
            - |
              find /var/lib/specmarshal \( ! -uid 1000 -o ! -gid 1000 \) -exec chown -h 1000:1000 {} +
              echo "the home is 1000:1000"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: home
              mountPath: /var/lib/specmarshal
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: specmarshal-home
