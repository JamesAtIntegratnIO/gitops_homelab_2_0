# The agent's GitHub credential.
#
# Deliberately NOT the same token Kargo uses. Two reasons:
#   * it needs scopes Kargo's does not (Issues, for the labels that carry the
#     attempt cap), and
#   * one identity per actor keeps revocation clean -- and makes it obvious in
#     the PR timeline which commits the agent authored.
#
# Requires 1Password item "delivery-agent-github" with property:
#   token   fine-grained PAT scoped to jamesatintegratnio/gitops_homelab_2_0:
#             Contents:        read+write   (push the fix to the bot branch)
#             Pull requests:   read+write   (comment)
#             Issues:          read+write   (labels: the attempt cap)
#             Commit statuses: read         (read the gate)
#             Metadata:        read
#             Workflows:       NONE
#
# That last line is load-bearing. Without the Workflows permission GitHub
# REJECTS any push touching .github/workflows/**, which makes "the agent
# cannot edit the gate" a guarantee enforced by someone else's server, on top
# of the agent's own deny-list.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: delivery-agent-github
  namespace: delivery-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: delivery-agent-github
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: delivery-agent-github
        property: token
---
# The model API key.
#
# Only needed when the endpoint requires one. The LM Studio endpoint on the
# workstation does not, so llm.existingSecret is empty in values.yaml and this
# Secret goes unused until that changes -- it is created anyway so switching to
# a hosted provider is a one-line values change rather than a scavenger hunt.
#
# Requires 1Password item "delivery-agent-llm" with property:
#   api-key
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: delivery-agent-llm
  namespace: delivery-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: delivery-agent-llm
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: delivery-agent-llm
        property: api-key
