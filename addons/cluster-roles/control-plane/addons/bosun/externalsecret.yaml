# The agent's GitHub credential.
#
# Deliberately NOT the same token Kargo uses. Two reasons:
#   * it needs scopes Kargo's does not (Issues, for the labels that carry the
#     attempt cap), and
#   * one identity per actor keeps revocation clean -- and makes it obvious in
#     the PR timeline which commits the agent authored.
#
# Requires 1Password item "bosun-github" with property:
#   private-key  the GitHub App's PEM. This is what the agent authenticates
#                with now: it mints an installation token per use, and those
#                expire in about an hour rather than never.
#
#                The App exists for IDENTITY, not access. The token below
#                grants exactly the same rights -- but it belongs to whoever
#                minted it, so every comment arrived under that person's name
#                and avatar and read like a colleague's review. The App
#                comments as bosun-mate[bot], with a face of its own.
#
#                Same five repository permissions as the token, and the same
#                Workflows: NONE.
#
#   token   fine-grained PAT scoped to jamesatintegratnio/gitops_homelab_2_0.
#           Retained so falling back is a values change, not a secret change:
#             Contents:        read+write   (push the fix to the bot branch)
#             Pull requests:   read+write   (comment)
#             Issues:          read+write   (labels: the attempt cap)
#             Commit statuses: read+write   (read the gate, and publish its own
#                                          verdict beside it)
#             Metadata:        read
#             Workflows:       NONE
#
# That last line is load-bearing. Without the Workflows permission GitHub
# REJECTS any push touching .github/workflows/**, which makes "the agent
# cannot edit the gate" a guarantee enforced by someone else's server, on top
# of the agent's own deny-list.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bosun-github
  namespace: bosun
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: bosun-github
    creationPolicy: Owner
  data:
    # The GitHub App's private key. Bosun mints an installation token from this
    # on demand -- they last about an hour -- instead of holding a standing
    # credential. `token` above is kept so a rollback to the PAT is a values
    # change rather than a secret change.
    - secretKey: private-key
      remoteRef:
        key: delivery-agent-github
        property: private-key
    - secretKey: token
      remoteRef:
        # The 1Password ITEM name, which the rename did not touch and must not:
        # renaming a component in git cannot rename an item in someone's vault.
        # A blanket rename briefly changed this and the ExternalSecret failed
        # with "key not found in 1Password Vaults".
        key: delivery-agent-github
        property: token
---
# The model API key.
#
# The LM Studio endpoint on the workstation requires one, so values.yaml sets
# llm.existingSecret to this Secret and the agent sends it as a bearer token.
#
# Requires 1Password item "bosun-llm" with property:
#   api-key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bosun-llm
  namespace: bosun
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: bosun-llm
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        # As above -- the 1Password item name, not ours to rename from here.
        key: delivery-agent-llm
        property: api-key
---
# The ArgoCD API token, for the gate's cluster inventory.
#
# This secret is what REPLACES an RBAC grant. Without it the gate reads the
# ArgoCD cluster Secrets directly, which costs get/list on Secrets in the
# `argocd` namespace -- a grant that cannot be scoped to "the labels but not
# the data", because RBAC has no such predicate. With it, the gate reads the
# same four fields through ArgoCD's own API and the chart stops creating the
# Role.
#
# The account's entire ArgoCD policy is one line:
#
#   p, role:bosun, clusters, get, *, allow
#
# and that is load-bearing. A token that could also read applications, repos
# or logs would be a BIGGER credential than the Secret read it replaced, which
# would invert the whole point of it.
#
# Requires 1Password item "bosun-argocd-api-token" with property:
#   token   minted with `argocd account generate-token --account bosun`
#           against the account added to argocd-cm in the argo-cd addon.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bosun-argocd
  namespace: bosun
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: bosun-argocd
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: bosun-argocd-api-token
        property: token
