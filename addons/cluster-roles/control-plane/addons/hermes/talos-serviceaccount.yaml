# Read-only Talos API access for Hermes Agent.
#
# Talos mints a talosconfig into the Secret named after this ServiceAccount
# (`hermes-talos`, key `config`), scoped to the roles listed here. os:reader
# is Talos's read-only role: Talos itself refuses every write (apply-config,
# reboot, upgrade, reset, etcd defrag/snapshot) whatever command Hermes runs.
# The talosconfig points at `talos.default:50000` (the control-plane apids);
# Hermes names a node with `-n`, workers included, by proxy.
#
# Needs the machine-config patch
# matchbox/talos-machineconfigs/live-talos-api-access-hermes.yaml on the
# control-plane nodes (James, commands.md step 2b). Until then Talos does not
# create the Secret; the Deployment mounts it `optional`, so Hermes still
# starts and talosctl just has no config.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: hermes-talos
  namespace: hermes
spec:
  roles:
    - os:reader
