apiVersion: v1
kind: Service
metadata:
  name: {{ include "delivery-agent.fullname" . }}
  labels:
    {{- include "delivery-agent.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "delivery-agent.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "delivery-agent.serviceAccountName" . }}
  labels:
    {{- include "delivery-agent.labels" . | nindent 4 }}
{{- end }}
{{- if .Values.metrics.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "delivery-agent.fullname" . }}
  labels:
    {{- include "delivery-agent.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "delivery-agent.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
