# authentik Blueprint ConfigMap: Mealie. Its own ConfigMap, listed in
# authentik/values.yaml (blueprints.configMaps), so adding it did not mean
# rewriting the 25 KB authentik-blueprints file.
#
# Client id and secret come from the 1Password item `authentik-mealie-oidc`
# (fields `client-id`, `client-secret`) through the ExternalSecret in
# authentik-mealie-secret.yaml and the MEALIE_CLIENT_* env in values.yaml.
# Mealie reads the SAME item (mealie/externalsecret.yaml), so the two sides
# cannot disagree for longer than one refresh.
#
# Who may sign in is decided HERE, by the application's bindings: members of
# `authentik Admins` (they become Mealie admins, OIDC_ADMIN_GROUP) and of
# `mealie-users` (the household; add them to the group in the authentik UI).
# Mealie's own OIDC_USER_GROUP is left unset.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints-mealie
  namespace: authentik
data:
  11-mealie-provider.yaml: |
    # Authentik Blueprint: Mealie OAuth2 Provider (confidential client)
    version: 1
    metadata:
      name: mealie-provider
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    context:
      client_id: !Env MEALIE_CLIENT_ID
      client_secret: !Env MEALIE_CLIENT_SECRET
    entries:
      # The household's group. Membership is managed in the authentik UI.
      - model: authentik_core.group
        identifiers:
          name: mealie-users
        id: mealie-users-group
        attrs:
          is_superuser: false

      # Group names in the `groups` claim, the way the other providers here do
      # it. Mealie compares them to OIDC_ADMIN_GROUP.
      - model: authentik_providers_oauth2.scopemapping
        identifiers:
          name: Mealie Groups Scope
          scope_name: groups
        id: groups-scope
        attrs:
          expression: |
            return {
              "groups": [group.name for group in user.ak_groups.all()],
            }

      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: mealie-provider
        id: mealie-provider
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: !Context client_id
          client_secret: !Context client_secret
          redirect_uris:
            - url: https://mealie.cluster.integratn.tech/login
              matching_mode: strict
            - url: https://mealie.cluster.integratn.tech/login?direct=1
              matching_mode: strict
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, "Mealie Groups Scope"]]
          include_claims_in_id_token: true
          issuer_mode: per_provider
          sub_mode: hashed_user_id
          access_code_validity: minutes=10
          access_token_validity: minutes=60
          refresh_token_validity: days=30

      - model: authentik_core.application
        identifiers:
          slug: mealie
        id: mealie-app
        attrs:
          name: Mealie
          provider: !KeyOf mealie-provider
          open_in_new_tab: true
          launch_url: https://mealie.cluster.integratn.tech
          group: Household
          meta_description: Recipes, meal plans and shopping lists
          # Either binding below is enough.
          policy_engine_mode: any

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf mealie-app
          group: !Find [authentik_core.group, [name, "authentik Admins"]]
        attrs:
          order: 0
          enabled: true
          negate: false
          timeout: 30

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf mealie-app
          group: !KeyOf mealie-users-group
        attrs:
          order: 10
          enabled: true
          negate: false
          timeout: 30
