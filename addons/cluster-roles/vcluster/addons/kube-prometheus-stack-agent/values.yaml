alertmanager:
  enabled: false

grafana:
  enabled: false

nodeExporter:
  enabled: false

prometheus-node-exporter:
  enabled: false

kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

kubelet:
  enabled: false

# The host Prometheus evaluates the recording rules over the series this
# Prometheus remote-writes. Evaluating them here too produced identical series
# (same labels, including the external ones) and the host rejected ~2% of the
# writes as "out of order sample" (PrometheusRemoteStorageFailures). Despite
# `mode: agent` below this runs as a full server, so it must not ship rules.
defaultRules:
  create: false

prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    mode: agent
    enableFeatures:
      - agent
    retention: 6h
    scrapeInterval: 30s
    serviceMonitorSelector: {}
    podMonitorSelector: {}
    probeSelector: {}
    storageSpec: {}

kube-state-metrics:
  enabled: true
