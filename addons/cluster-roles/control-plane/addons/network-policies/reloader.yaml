# reloader: a controller that watches ConfigMaps cluster-wide and patches the
# workloads that name them. Pod label app.kubernetes.io/name: reloader (chart
# `reloader`, release `reloader`). It talks only to the kube-apiserver, so DNS +
# apiserver egress is the whole set, as for descheduler. The default-deny
# baseline is generated by Kyverno. No metrics scrape: the chart's
# ServiceMonitor is off.
---
apiVersion: v1
kind: Namespace
metadata:
  name: reloader
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: reloader
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-kube-api
  namespace: reloader
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
