# Kyverno GeneratingPolicy: default-deny-all NetworkPolicy in every namespace.
# The companion audit policy (require-default-deny-netpol) reports compliance.
#
# Migrated from a ClusterPolicy of the same name for Kyverno 1.20. The name is
# load-bearing: Kyverno only adopts an existing downstream object whose
# generate.kyverno.io/policy-name and trigger-uid labels match, so keeping the
# name lets this policy take over every default-deny-all the old one made
# instead of skipping them. The old policy had orphanDownstreamOnPolicyDelete
# set before it was removed, so its deletion left them in place.
#
# orphanDownstreamOnPolicyDelete is on here too, on purpose: with synchronize
# on, deleting this policy would otherwise delete every default-deny-all in the
# cluster (the trap in CLAUDE.md). generateExisting re-covers every namespace
# whenever the policy is (re)created.
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: generate-default-deny-netpol
  annotations:
    policies.kyverno.io/title: Generate Default Deny NetworkPolicy
    policies.kyverno.io/category: Networking
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Creates a default-deny-all NetworkPolicy in every namespace, blocking all
      ingress and egress until explicit allow rules are added.
spec:
  evaluation:
    admission:
      enabled: true
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
    orphanDownstreamOnPolicyDelete:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
  matchConditions:
    - name: not-excluded
      expression: >-
        !(object.metadata.name in ['kube-system', 'kube-public',
        'kube-node-lease', 'cilium-secrets', 'kratix-worker-system', 'mcp-system'])
  variables:
    - name: nsName
      expression: object.metadata.name
  generate:
    - expression: >-
        generator.Apply(variables.nsName, [
          {
            "apiVersion": dyn("networking.k8s.io/v1"),
            "kind": dyn("NetworkPolicy"),
            "metadata": dyn({"name": "default-deny-all", "namespace": variables.nsName}),
            "spec": dyn({"podSelector": dyn({}), "policyTypes": dyn(["Ingress", "Egress"])})
          }
        ])
