# authentik Blueprint ConfigMap: Mealie. Its own ConfigMap, listed in
# authentik/values.yaml (blueprints.configMaps), so adding it did not mean
# rewriting the 25 KB authentik-blueprints file.
#
# Client id and secret come from the 1Password item `generated-mealie-oidc`
# (fields `client-id`, `client-secret`; created once by the PushSecret in
# mealie/oidc-generated-secret.yaml) through the ExternalSecret in
# authentik-mealie-secret.yaml and the MEALIE_CLIENT_* env in values.yaml.
# Mealie reads the SAME item (mealie/externalsecret.yaml), so the two sides
# cannot disagree for longer than one refresh.
#
# Who may sign in is decided HERE, by the application's bindings: members of
# `authentik Admins` (they become Mealie admins, OIDC_ADMIN_GROUP) and of
# `mealie-users` (the household; add them to the group in the authentik UI).
# Mealie's own OIDC_USER_GROUP is left unset.
#
# authentik applies changes to this file by itself, on its own timer (up to
# about an hour after ArgoCD syncs it).
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints-mealie
  namespace: authentik
data:
  11-mealie-provider.yaml: |
    # Authentik Blueprint: Mealie OAuth2 Provider (confidential client)
    version: 1
    metadata:
      name: mealie-provider
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    context:
      client_id: !Env MEALIE_CLIENT_ID
      client_secret: !Env MEALIE_CLIENT_SECRET
    entries:
      # The household's group. Membership is managed in the authentik UI.
      - model: authentik_core.group
        identifiers:
          name: mealie-users
        id: mealie-users-group
        attrs:
          is_superuser: false

      # Group names in the `groups` claim, the way the other providers here do
      # it. Mealie compares them to OIDC_ADMIN_GROUP.
      - model: authentik_providers_oauth2.scopemapping
        identifiers:
          name: Mealie Groups Scope
          scope_name: groups
        id: groups-scope
        attrs:
          expression: |
            return {
              "groups": [group.name for group in user.ak_groups.all()],
            }

      # The `email` scope for Mealie only, asserting email_verified: true.
      # Mealie (v3.21+) refuses any OIDC login without email_verified true,
      # because it links a login to an existing account by email. authentik
      # (2025.10+) sends email_verified: false from its default email mapping,
      # since it cannot prove anyone owns an address. This is the fix from
      # authentik's "Verify email addresses" doc, scoped to this provider, so
      # the default mapping is NOT also listed below (never both).
      # What it trusts: that no authentik user can set their email to someone
      # else's. Keep "Allow users to change email" off in System > Settings,
      # or a user could sign in to Mealie as whoever owns that address.
      - model: authentik_providers_oauth2.scopemapping
        identifiers:
          name: Mealie Email Scope
          scope_name: email
        id: email-scope
        attrs:
          description: Email address, asserted as verified (Mealie only)
          expression: |
            return {
              "email": request.user.email,
              "email_verified": True,
            }

      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: mealie-provider
        id: mealie-provider
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: !Context client_id
          client_secret: !Context client_secret
          redirect_uris:
            - url: https://mealie.cluster.integratn.tech/login
              matching_mode: strict
            - url: https://mealie.cluster.integratn.tech/login?direct=1
              matching_mode: strict
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          # By name, not by scope_name: two mappings now have scope_name
          # `email` (authentik's default and Mealie's), and a scope_name lookup
          # could return either.
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
            - !KeyOf email-scope
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, "Mealie Groups Scope"]]
          include_claims_in_id_token: true
          issuer_mode: per_provider
          sub_mode: hashed_user_id
          access_code_validity: minutes=10
          access_token_validity: minutes=60
          refresh_token_validity: days=30

      - model: authentik_core.application
        identifiers:
          slug: mealie
        id: mealie-app
        attrs:
          name: Mealie
          provider: !KeyOf mealie-provider
          open_in_new_tab: true
          launch_url: https://mealie.cluster.integratn.tech
          group: Household
          meta_description: Recipes, meal plans and shopping lists
          # Either binding below is enough.
          policy_engine_mode: any

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf mealie-app
          group: !Find [authentik_core.group, [name, "authentik Admins"]]
        attrs:
          order: 0
          enabled: true
          negate: false
          timeout: 30

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf mealie-app
          group: !KeyOf mealie-users-group
        attrs:
          order: 10
          enabled: true
          negate: false
          timeout: 30
