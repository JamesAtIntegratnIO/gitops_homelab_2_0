applicationName: radarr
extraObjects:
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: radarr-allow-postgres-egress
      namespace: media
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: radarr
      policyTypes:
        - Egress
      egress:
        - to:
            - ipBlock:
                cidr: 10.0.3.1/32
          ports:
            - protocol: TCP
              port: 5432
  # Jellyfin on Tower (host-networked Docker): Radarr's Emby/Jellyfin
  # connection calls its library-refresh API on import/upgrade/rename/delete so
  # new files show up without waiting for Jellyfin's scheduled scan. Tracearr
  # has its own rule for the same port; NetworkPolicies are per-pod.
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: radarr-allow-jellyfin-egress
      namespace: media
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: radarr
      policyTypes:
        - Egress
      egress:
        - to:
            - ipBlock:
                cidr: 10.0.0.12/32
          ports:
            - protocol: TCP
              port: 8096
  - apiVersion: v1
    kind: PersistentVolume
    metadata:
      name: radarr-config-pv
      labels:
        app: radarr
      annotations:
        pv.kubernetes.io/provisioned-by: k8s-sigs.io/nfs-subdir-external-provisioner
    spec:
      accessModes:
        - ReadWriteOnce
      capacity:
        storage: 1Gi
      nfs:
        path: /mnt/user/kube_storage/radarr-config-pvc
        server: 10.0.0.12
      persistentVolumeReclaimPolicy: Retain
      storageClassName: config-nfs-client
      volumeMode: Filesystem
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: radarr-config-pvc
      namespace: media
      labels:
        app: radarr
    spec:
      storageClassName: config-nfs-client
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
      volumeName: radarr-config-pv
  - apiVersion: v1
    kind: PersistentVolume
    metadata:
      name: radarr-media-pv
      labels:
        app: radarr
      annotations:
        pv.kubernetes.io/provisioned-by: k8s-sigs.io/data-nfs-subdir-external-provisioner
    spec:
      accessModes:
        - ReadWriteOnce
      capacity:
        storage: 1Gi
      nfs:
        path: /mnt/user/data
        server: 10.0.0.12
      persistentVolumeReclaimPolicy: Retain
      storageClassName: data-nfs-client
      volumeMode: Filesystem
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: radarr-media-pvc
      namespace: media
      labels:
        app: radarr
    spec:
      storageClassName: data-nfs-client
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
      volumeName: radarr-media-pv
  # Forward-auth: the nginx half of authentik provider `radarr-proxy-provider`
  # (blueprint 08d-media-proxy-providers.yaml in the host's authentik addon).
  # Every request to radarr.vcluster-media.integratn.tech except /api becomes
  # an auth_request subrequest to authentik's embedded outpost; a 401 turns into
  # a 302 to the sign-in page. The app's own login is off (see the httpRoute
  # comment below), so this is the only door for the web UI.
  #
  # The outpost is reached as authentik-server.nginx-gateway: the host Service
  # authentik/authentik-server replicated INTO this vcluster
  # (networking.replicateServices.fromHost in
  # platform/vclusters/vcluster-media.yaml). The host halves of the network
  # path are allow-gateway-authentik-egress (network-policies/vcluster-media.yaml)
  # and the vcluster-media rule in authentik-server-ingress (authentik.yaml).
  #
  # One copy per app on purpose: ExtensionRef has no namespace and each app is
  # its own ArgoCD Application, so a shared object would have one owner.
  - apiVersion: gateway.nginx.org/v1alpha1
    kind: SnippetsFilter
    metadata:
      name: radarr-forward-auth
      namespace: media
    spec:
      snippets:
        - context: http.server
          value: |
            location /outpost.goauthentik.io/ {
                proxy_pass          http://authentik-server.nginx-gateway.svc.cluster.local/outpost.goauthentik.io/;
                proxy_set_header    Host $host;
                proxy_set_header    X-Original-URL $scheme://$http_host$request_uri;
                proxy_set_header    X-Real-IP $remote_addr;
                proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header    X-Forwarded-Proto $scheme;
                proxy_set_header    Content-Length "";
                proxy_pass_request_body off;
            }

            location @goauthentik_proxy_signin {
                internal;
                add_header Set-Cookie $auth_cookie;
                return 302 /outpost.goauthentik.io/start?rd=$request_uri;
            }
        - context: http.server.location
          value: |
            auth_request        /outpost.goauthentik.io/auth/nginx;
            error_page          401 = @goauthentik_proxy_signin;

            auth_request_set $auth_cookie $upstream_http_set_cookie;
            add_header Set-Cookie $auth_cookie;

            auth_request_set $authentik_username $upstream_http_x_authentik_username;
            auth_request_set $authentik_groups $upstream_http_x_authentik_groups;
            auth_request_set $authentik_email $upstream_http_x_authentik_email;
            proxy_set_header X-authentik-username $authentik_username;
            proxy_set_header X-authentik-groups $authentik_groups;
            proxy_set_header X-authentik-email $authentik_email;
deployment:
  securityContext:
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    runAsNonRoot: false
    runAsUser: 0
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add:
        - CHOWN
        - DAC_OVERRIDE
        - FOWNER
        - SETUID
        - SETGID
  image:
    repository: ghcr.io/linuxserver/radarr
    tag: 7.0.3.10918-ls328
    pullPolicy: IfNotPresent
  ports:
    - name: http
      containerPort: 7878
      protocol: TCP
  env:
    TZ:
      value: America/Denver
    PUID:
      value: "1000"
    PGID:
      value: "1000"
    PUSHOVER_DEBUG:
      value: "false"
    RADARR__AUTHENTICATION_METHOD:
      value: External
    RADARR__AUTHENTICATION_REQUIRED:
      value: DisabledForLocalAddresses
    RADARR__INSTANCE_NAME:
      value: Radarr
    RADARR__PORT:
      value: "7878"
    RADARR__LOG_LEVEL:
      value: info
    RADARR__THEME:
      value: dark
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  additionalContainers:
    - name: exportarr
      image: ghcr.io/onedr0p/exportarr:v2.3.0
      command:
        - /exportarr
      args:
        - radarr
      ports:
        - name: metrics
          containerPort: 9707
          protocol: TCP
      env:
        - name: PORT
          value: "9707"
        - name: URL
          value: http://localhost:7878
        - name: APIKEY
          valueFrom:
            secretKeyRef:
              name: homepage-secret
              key: HOMEPAGE_VAR_RADARR_KEY
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
  volumes:
    config:
      persistentVolumeClaim:
        claimName: radarr-config-pvc
    media:
      persistentVolumeClaim:
        claimName: radarr-media-pvc
    tmp:
      emptyDir:
        medium: Memory
        sizeLimit: 64Mi
    s6-run:
      emptyDir:
        medium: Memory
        sizeLimit: 16Mi
  volumeMounts:
    config:
      mountPath: /config
    media:
      mountPath: /data
    tmp:
      mountPath: /tmp
    s6-run:
      mountPath: /run
persistence:
  enabled: false
service:
  additionalLabels:
    prometheus: media-cluster
  ports:
    - name: http
      port: 7878
      targetPort: 7878
      protocol: TCP
    - name: metrics
      port: 9707
      targetPort: 9707
      protocol: TCP
serviceMonitor:
  enabled: true
# DETACHED 2026-11-26: the radarr-forward-auth filter is not referenced until
# the vcluster has the replicated authentik-server Service. Referencing it
# before then makes every nginx reload fail (host not found in upstream) and
# the route answer 500. Re-attach by adding back to the / rule:
#   filters: [{type: ExtensionRef, extensionRef: {group: gateway.nginx.org,
#              kind: SnippetsFilter, name: radarr-forward-auth}}]
# Intended: the web UI behind authentik forward-auth (group media-management). /api is the one path left outside it, for clients
# that hold the API key (phone apps, scripts): the app still demands the key
# there and refuses a call without it. Gateway API picks the longest matching
# prefix, so /api wins over / whatever the rule order. Homepage, arr-mcp and the
# other in-cluster callers use the synced Service and never pass the gateway.
httpRoute:
  enabled: true
  parentRefs:
    - name: nginx-gateway
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - radarr.vcluster-media.integratn.tech
  rules:
    - backendRefs:
        - name: radarr
          port: 7878
      matches:
        - path:
            type: PathPrefix
            value: /
    - backendRefs:
        - name: radarr
          port: 7878
      matches:
        - path:
            type: PathPrefix
            value: /api
certificate:
  enabled: false
