# Kratix Values for control-plane clusters

# Disable default BucketStateStore
stateStores: []

# Disable default destinations
destinations: []

# Additional resources for Kratix platform setup
additionalResources:
  
  # ExternalSecret to pull GitHub App credentials from 1Password
  - apiVersion: external-secrets.io/v1beta1
    kind: ExternalSecret
    metadata:
      name: kratix-github-credentials
      namespace: kratix-platform-system
    spec:
      secretStoreRef:
        name: onepassword-store
        kind: ClusterSecretStore
      target:
        name: kratix-github-credentials
        creationPolicy: Owner
      data:
        - secretKey: appID
          remoteRef:
            key: kratix-gitops-statestore
            property: AppID
        - secretKey: installationID
          remoteRef:
            key: kratix-gitops-statestore
            property: InstallID
        - secretKey: privateKey
          remoteRef:
            key: kratix-gitops-statestore
            property: PrivateKey
  
  # GitStateStore pointing to kratix-platform-state repository
  - apiVersion: platform.kratix.io/v1alpha1
    kind: GitStateStore
    metadata:
      name: default
      namespace: kratix-platform-system
    spec:
      authMethod: githubApp
      secretRef:
        name: kratix-github-credentials
        namespace: kratix-platform-system
      url: https://github.com/jamesatintegratnio/kratix-platform-state
      branch: main
      path: clusters

  # PVC for Kratix Git workspace
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: kratix-git-storage
      namespace: kratix-platform-system
    spec:
      accessModes:
        - ReadWriteMany
      resources:
        requests:
          storage: 1Gi
  
  # Destination for the-cluster workload scheduling
  - apiVersion: platform.kratix.io/v1alpha1
    kind: Destination
    metadata:
      name: the-cluster
      namespace: kratix-platform-system
      labels:
        environment: production
        cluster-role: control-plane
        capability.vcluster: "true"
    spec:
      stateStoreRef:
        name: default
        kind: GitStateStore
      path: the-cluster
      strictMatchLabels: false
  
  # ArgoCD Application to reconcile state from kratix-platform-state repo
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: kratix-state-reconciler
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      source:
        repoURL: https://github.com/jamesatintegratnio/kratix-platform-state
        targetRevision: main
        path: clusters/the-cluster
        directory:
          recurse: true
      destination:
        server: https://kubernetes.default.svc
        namespace: kratix-platform-system
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
      ignoreDifferences:
        - group: networking.k8s.io
          kind: NetworkPolicy
          name: default-deny-all
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: batch
          kind: Job
          jsonPointers:
            - /spec
            - /status
        # GatewayRoute CRD defaults sectionName/httpSectionName on admission,
        # and Kratix relabels the request with the owning promise name
        # (kratix.io/promise-name: gateway-route) while the parent http-service
        # pipeline emits its own — same label churn the ArgoCD* request kinds
        # below already ignore.
        - group: platform.integratn.tech
          kind: GatewayRoute
          jsonPointers:
            - /spec/sectionName
            - /spec/httpSectionName
            - /metadata/annotations/argocd.argoproj.io~1tracking-id
            - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
            - /metadata/labels
        - group: argoproj.io
          kind: Application
          namespace: argocd
          jsonPointers:
            - /metadata/annotations/argocd.argoproj.io~1tracking-id
            - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
        - group: argoproj.io
          kind: AppProject
          namespace: argocd
          jsonPointers:
            - /metadata/annotations/argocd.argoproj.io~1tracking-id
            - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
            - /metadata/labels
        - group: platform.integratn.tech
          kind: ArgoCDApplication
          namespace: platform-requests
          jsonPointers:
            - /metadata/annotations/argocd.argoproj.io~1tracking-id
            - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
            - /metadata/labels
        - group: platform.integratn.tech
          kind: ArgoCDProject
          namespace: platform-requests
          jsonPointers:
            - /metadata/annotations/argocd.argoproj.io~1tracking-id
            - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
            - /metadata/labels
        - group: platform.integratn.tech
          kind: ArgoCDClusterRegistration
          namespace: platform-requests
          jsonPointers:
            - /metadata/annotations/argocd.argoproj.io~1tracking-id
            - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
            - /metadata/labels

  # --- VCluster Delete Pipeline RBAC ---
  # Grant the vcluster-orchestrator-v2 delete pipeline permission to clean up
  # host-level PersistentVolumes created by the vcluster syncer.
  # These PVs are NOT in the Kratix state store and must be deleted via direct API calls.

  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: vcluster-delete-pipeline-pv-cleanup
      labels:
        app.kubernetes.io/part-of: kratix
        app.kubernetes.io/component: vcluster-orchestrator-v2
    rules:
      - apiGroups: [""]
        resources: ["persistentvolumes"]
        verbs: ["get", "list", "delete"]
      - apiGroups: [""]
        resources: ["namespaces"]
        verbs: ["get", "list", "delete"]

  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: vcluster-delete-pipeline-pv-cleanup
      labels:
        app.kubernetes.io/part-of: kratix
        app.kubernetes.io/component: vcluster-orchestrator-v2
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: vcluster-delete-pipeline-pv-cleanup
    subjects:
      - kind: ServiceAccount
        name: vcluster-orchestrator-v2-resource-delete-vco-v2-delete
        namespace: platform-requests

  # --- Pipeline Cleanup ---

  # ServiceAccount for pipeline cleanup CronJob
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: kratix-pipeline-cleanup
      namespace: platform-requests
      labels:
        app.kubernetes.io/part-of: kratix

  # Role to delete completed Jobs in platform-requests
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: kratix-pipeline-cleanup
      namespace: platform-requests
      labels:
        app.kubernetes.io/part-of: kratix
    rules:
      - apiGroups: ["batch"]
        resources: ["jobs"]
        verbs: ["list", "delete"]

  # Bind the Role to the ServiceAccount
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: kratix-pipeline-cleanup
      namespace: platform-requests
      labels:
        app.kubernetes.io/part-of: kratix
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: kratix-pipeline-cleanup
    subjects:
      - kind: ServiceAccount
        name: kratix-pipeline-cleanup
        namespace: platform-requests

  # CronJob to delete succeeded pipeline Jobs older than 24h (keeps failed Jobs)
  - apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: kratix-pipeline-cleanup
      namespace: platform-requests
      labels:
        app.kubernetes.io/part-of: kratix
    spec:
      schedule: "0 4 * * *"
      successfulJobsHistoryLimit: 1
      failedJobsHistoryLimit: 3
      jobTemplate:
        spec:
          ttlSecondsAfterFinished: 3600
          template:
            spec:
              serviceAccountName: kratix-pipeline-cleanup
              restartPolicy: OnFailure
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              containers:
                - name: cleanup
                  image: bitnami/kubectl:latest
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop: ["ALL"]
                    readOnlyRootFilesystem: true
                  command:
                    - /bin/sh
                    - -c
                    - |
                      echo "Cleaning up succeeded pipeline Jobs older than 24h..."
                      kubectl get jobs -n platform-requests -o json | \
                        jq -r '.items[] |
                          select(.status.succeeded == 1) |
                          select(.status.completionTime != null) |
                          select((now - (.status.completionTime | fromdateiso8601)) > 86400) |
                          .metadata.name' | \
                        while read -r job; do
                          echo "Deleting completed job: $job"
                          kubectl delete job -n platform-requests "$job" --cascade=foreground
                        done
                      echo "Cleanup complete."

  # --- Kratix Observability ---

  # ServiceAccount for Prometheus to authenticate to the metrics endpoint
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: kratix-metrics-reader
      namespace: kratix-platform-system
      labels:
        app.kubernetes.io/part-of: kratix

  # Secret to generate a long-lived token for the ServiceAccount
  - apiVersion: v1
    kind: Secret
    metadata:
      name: kratix-metrics-reader-token
      namespace: kratix-platform-system
      annotations:
        kubernetes.io/service-account.name: kratix-metrics-reader
    type: kubernetes.io/service-account-token

  # ClusterRole granting access to metrics endpoint via kube-rbac-proxy
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: kratix-metrics-reader
    rules:
      - nonResourceURLs: ["/metrics"]
        verbs: ["get"]

  # Bind the ServiceAccount to the ClusterRole
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: kratix-metrics-reader
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: kratix-metrics-reader
    subjects:
      - kind: ServiceAccount
        name: kratix-metrics-reader
        namespace: kratix-platform-system

  # ServiceMonitor for Kratix controller manager metrics
  - apiVersion: monitoring.coreos.com/v1
    kind: ServiceMonitor
    metadata:
      name: kratix-controller-manager
      namespace: kratix-platform-system
      labels:
        app.kubernetes.io/part-of: kratix
    spec:
      selector:
        matchLabels:
          control-plane: controller-manager
      namespaceSelector:
        matchNames:
          - kratix-platform-system
      endpoints:
        - port: https
          scheme: https
          tlsConfig:
            insecureSkipVerify: true
          bearerTokenSecret:
            name: kratix-metrics-reader-token
            key: token
          interval: 30s
          metricRelabelings:
            - action: keep
              sourceLabels: [__name__]
              regex: kratix_.*|workqueue_.*|controller_runtime_.*|process_.*|go_.*
