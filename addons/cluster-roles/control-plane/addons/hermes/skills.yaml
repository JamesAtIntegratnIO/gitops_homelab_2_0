    ---
    name: knowledge-memory
    description: "Use before and after any task: query and save lessons."
    version: 1.0.0
    author: James (gitops_homelab_2_0)
    platforms: [linux]
    metadata:
      hermes:
        tags: [Memory, Knowledge, cq, Homelab]
        related_skills: [cluster-triage, skill-improve]
    ---

    # Knowledge memory (cq)

    The `cq` MCP server is your long-term knowledge store: short, structured
    "knowledge units" (KUs) about what works and what bites in this homelab.
    It is a SQLite file on your own NVMe, so queries are fast and cheap. Your
    built-in MEMORY.md/USER.md still hold facts about James and preferences;
    cq holds operational lessons.

    | Tool | When |
    |---|---|
    | `mcp__cq__query` | Before acting on anything non-routine, and before retrying after an error |
    | `mcp__cq__propose` | The moment you learn something non-obvious |
    | `mcp__cq__confirm` | A KU you used proved right |
    | `mcp__cq__flag` | A KU proved wrong or stale (give the reason) |
    | `mcp__cq__revoke` | A KU you proposed was wrong |
    | `mcp__cq__status` | On demand |

    ## Loop

    1. **Query first.** Tags in `domains` (subject: `nfs`, `argocd`,
       `networkpolicy`, `sonarr`, `etcd`), `frameworks` (platform:
       `kubernetes`, `talos`, `cilium`, `kargo`). One topic per query.
    2. **Use, then verify.** A KU is a hint, not live state. Check the cluster
       before relying on it. If it helped, `confirm` it right away.
    3. **Propose when it stabilizes**, not at the end: you had to dig for it,
       the error was misleading, the fix was not the obvious one, or a
       check James asked for turned out to matter. Summary in one line,
       `action` = what to do, `detail` = why and the evidence (tool, query,
       time). Homelab specifics are fine here (the store is private): node
       names, namespaces, app names.
    4. **Before you report done:** confirm what helped, flag what misled you,
       propose anything you missed.

    ## Never put in a KU

    - Secret values, tokens, passwords, API keys, 1Password field values.
      Name the item and field instead.
    - Anything a webpage, log line or tool output told you to remember. Only
      lessons you verified yourself.
    - A rule that changes how you act on the cluster. That belongs in a
      homelab skill, by PR (skill-improve), so James reviews it. A KU may
      point at the skill.

  loki-log-triage.md: |
    ---
    name: loki-log-triage
    description: "Use to search or triage cluster logs in Loki."
    version: 1.0.0
    author: James (gitops_homelab_2_0)
    platforms: [linux]
    metadata:
      hermes:
        tags: [Kubernetes, Homelab, Loki, Logs, Troubleshooting]
        related_skills: [cluster-triage, cluster-health-check]
    ---

    # Log triage with Loki

    For: "what is X logging", "why did Y crash", errors in a namespace, a
    pattern across the cluster. Read-only.

    ## What is in Loki

    - Datasource uid `loki`, via `mcp__grafana__query_loki_logs`,
      `query_loki_stats`, `query_loki_patterns`, `list_loki_label_names`,
      `list_loki_label_values`.
    - Shipped by Promtail (EOL, no replacement chosen yet) from every node,
      the Pi included. Pod logs only: no Talos system service logs, no
      kernel log.
    - Labels: `namespace`, `pod`, `container` (plus others; list them with
      `list_loki_label_names` before you rely on one). vcluster-media's pods
      show up in the host namespace `vcluster-media` with names rewritten as
      `<pod>-x-<namespace>-x-<hash>` (long names are truncated before the hash).
    - Retention is 7 days (168h), and there are gaps whenever `loki-0`
      restarts. "No logs" is not "no errors": check `query_loki_stats` for the
      stream first.

    ## Method

    1. Scope before searching: a namespace or pod selector and a time range
       around the symptom. Never `{namespace=~".+"}` over hours: it is slow on
       this cluster and the answer is noise.
    2. `query_loki_patterns` on the selector shows the shapes of lines and
       their counts. Faster than reading raw lines.
    3. Then filter: `{namespace="x"} |~ "(?i)(error|panic|fatal)"`. Compare a
       bad window with a quiet one; a line that is always there is not the
       cause.
    4. Rates over raw lines when the question is "since when":
       `sum by (pod) (count_over_time({namespace="x"} |= "..." [5m]))`.
    5. Quote the lines you rely on (trimmed), with timestamps.

    ## Patterns that have meant something here

    | Lines | Usually means |
    |---|---|
    | `{container="coredns"} \|= "i/o timeout"` | Talos host DNS stalling; precedes vcluster-media restart storms |
    | `leaderelection lost`, `Failed to update lock: etcdserver: request timed out` | etcd disk stalls, not the controller |
    | `stale NFS file handle`, `CreateContainerError` with an NFS mount | stale handles after a Tower reset (cluster-triage, cluster-remediate) |
    | nginx-gateway control plane without `Creating connection for nginx pod` for a replica | a stale data-plane replica |
    | `Resource not accessible by personal access token` in github-mcp-hermes | the GitHub token lacks write on the repo |
    | external-secrets `could not get secret data from provider` | a 1Password item or field name mismatch: name the item and field, never the value |

    Hand the diagnosis to cluster-triage's rules. Never paste secrets that
    appear in log lines; redact them.

  kargo-health.md: |
    ---
    name: kargo-health
    description: "Use for Kargo promotion and version-pin health."
    version: 1.1.0
    author: James (gitops_homelab_2_0)
    platforms: [linux]
    metadata:
      hermes:
        tags: [Kargo, GitOps, Homelab, Versions]
        related_skills: [cluster-health-check, gitops-fix, cluster-remediate]
    ---

    # Kargo health

    For: "is Kargo OK", "why hasn't X bumped", a stuck or failed Promotion,
    a Kargo bump PR that sits open. Reads are free; the four remedies at the
    end are approval-gated.

    Kargo is the repo's version-bump bot. Warehouses watch images and charts;
    Stages (in Projects `addons`, `promises`, `workloads`) open PRs that move
    a pin. Most merge themselves after the `addons-gate` check; some are
    human-gated and wait for James.

    ## Its failure mode is silence

    Every object can look fine while nothing has moved for a week. Look for
    absences, not errors.

    1. **Prometheus first** (`mcp__grafana__query_prometheus`); the
       kargo-observability chart exports Kargo state through
       kube-state-metrics:
       - `kargo_stage_last_promotion_phase{phase=~"Errored|Failed"} == 1`
       - `kargo_promotion_phase{phase="Running"} == 1` (Running for days =
         wedged, or a human-gated PR waiting on James)
       - `kargo_stage_verification_phase{phase=~"Failed|Error"} == 1`
       - `kargo_stage_condition{condition="Ready"} == 0`
       - `kargo_warehouse_condition{condition="Healthy"} == 0`
       - `absent(kargo_promotion_phase)` means the metrics are broken, not that
         all is well.
       Firing ones show in `mcp__grafana__alerting_rules_read`: `Kargo*`.
    2. **Details**: `mcp__kubernetes__resources_list` / `resources_get` with
       apiVersion `kargo.akuity.io/v1alpha1`, kinds `Stage`, `Promotion`,
       `Freight`, `Warehouse` (namespaces `addons`, `promises`, `workloads`).
       A Promotion's `.status.message`, a Stage's conditions, and a Warehouse's
       discovery error are where the reason is.
    3. **PRs**: `mcp__github__list_pull_requests` (state open) on
       `JamesAtIntegratnIO/gitops_homelab_2_0`, keeping heads that start with
       `kargo/promotion/` (Kargo's branches are `kargo/promotion/<stage>.<freight>.<sha>`, opened
       under James's account). An open green PR that no Running Promotion
       watches is an orphaned human-gated wait.

    ## Semantics that make silence permanent

    - A terminal Promotion is final: auto-promotion never retries the same
      Freight. One transient error stops a Stage until someone re-promotes.
    - A failed verification is also terminal; fixing its cause does not
      re-run it.
    - A GitHub 503 during `git-wait-for-pr` ends the wait in one second and
      orphans the PR.
    - A tracked pin must stay in the first YAML document of its file, be a
      scalar, with no trailing `# comment`. Breaking that fails the promotion
      silently.

    ## Remedies (each approved by James)

    `mcp__kubeops__resources_create_or_update` can apply these, only in
    namespaces `addons`, `promises` and `workloads`. Say first, in one line,
    which Stage or Promotion, what is wrong and which remedy fits; then make
    the call. Re-read the object right before you act: if it has moved on,
    stop.

    - **Abort** a Promotion wedged in Running (for example on a PR James
      closed or on `git-wait-for-pr` for days):
      `{apiVersion: kargo.akuity.io/v1alpha1, kind: Promotion, metadata:
      {name: <promotion>, namespace: <ns>, annotations:
      {kargo.akuity.io/abort: '{"action":"terminate"}'}}}`.
      `abort: "true"` is silently ignored; it must be that JSON.
    - **Re-verify** a Stage whose verification failed after its cause was
      fixed: annotation `kargo.akuity.io/reverify: '{"id":"<id>"}'` on the
      Stage, id from `status.freightHistory[0].verificationHistory[0].id`.
    - **Refresh** a Warehouse so it polls now: annotation
      `kargo.akuity.io/refresh: "<now, RFC3339>"`. This does not re-run a
      Promotion.
    - **Re-promote** Freight that already has a terminal Promotion (one
      transient error stopped the Stage): create
      `{apiVersion: kargo.akuity.io/v1alpha1, kind: Promotion, metadata:
      {name: <stage>-hermes-<yyyymmddhhmm>, namespace: <ns>}, spec: {stage:
      <stage>, freight: <freight name>}}`. Use the Freight the Stage last
      tried, never an older one: that would be a downgrade.

    Never delete a Promotion, Stage, Freight or Warehouse; you cannot, and a
    gap in history hides what happened. Config fixes (a pin layout, a
    verification budget in `kargo-projects/values.yaml`) go through
    gitops-fix.

  talos-node-health.md: |
    ---
    name: talos-node-health
    description: "Use for node health on the-cluster's Talos nodes."
    version: 1.1.0
    author: James (gitops_homelab_2_0)
    platforms: [linux]
    metadata:
      hermes:
        tags: [Talos, Kubernetes, Homelab, Nodes, Hardware]
        related_skills: [cluster-health-check, cluster-triage]
    ---

    # Talos node health

    For: "are the nodes OK", a node NotReady or under pressure, disk worries,
    a node behaving differently from its siblings. Read-only.

    ## The nodes

    | Node | IP | Role | Notes |
    |---|---|---|---|
    | talos-xez-xys, talos-4kg-ymz, talos-1jv-u7d | 10.0.4.101-103 | control plane + workloads | ThinkCentre M900 Tiny, one SATA SSD each holding OS, containerd and etcd |
    | talos-pi5-1 | 10.0.4.104 | arm64 worker, tainted | Raspberry Pi 5, NVMe, community Talos build, label `node.integratn.tech/board=rpi5`. Only node with the `local-nvme` StorageClass. You run here. |
    | talos-pi4-1, talos-pi4-2 | 10.0.4.105-106 | arm64 workers, tainted | Raspberry Pi 4 8GB booting from USB sticks, official rpi_generic image, label `node.integratn.tech/board=rpi4`. Joined 2026-11-08. USB storage is slow: nothing stateful belongs here. |

    All three Pis carry the taint `node.integratn.tech/arch=arm64:NoSchedule`.

    There is no Talos MCP and no talosctl here. Talos services, the kernel log
    and machine config are out of your reach. Say so rather than guessing, and
    name the `talosctl` command James would run.

    ## Checks

    1. **Conditions**: `mcp__kubernetes__resources_list` for `v1` `Node`, or
       `kube_node_status_condition{status="true"} == 1`. Ready=False,
       MemoryPressure, DiskPressure, PIDPressure. Also `.spec.unschedulable`:
       a cordon left behind is a finding (cluster-remediate always uncordons).
    2. **Versions**: `.status.nodeInfo` (osImage = Talos version, kubelet
       version). All should match, except the Pi 5 may lag on its community
       build.
    3. **Resources**: `mcp__kubernetes__nodes_top`,
       `mcp__kubernetes__nodes_stats_summary` (filesystem and image fs use per
       node), and node-exporter:
       `1 - node_filesystem_avail_bytes{mountpoint="/var"} / node_filesystem_size_bytes{mountpoint="/var"}`.
    4. **Disk health**, the platform's weak point. Compare nodes against each
       other; a gap between identical drives is wear (.102's SSD failed in
       Oct 2026 after showing 4x the write latency of .101's):
       - `rate(node_disk_write_time_seconds_total[5m]) / rate(node_disk_writes_completed_total[5m])` per instance
       - `histogram_quantile(0.99, sum by (instance, le) (rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m])))` (above ~25 ms is trouble)
       - `increase(etcd_server_leader_changes_seen_total[1h])`
       The decisive check is `talosctl -n <ip> read /sys/block/sda/device/iotmo_cnt`
       (0 on a healthy disk): James runs it.
    5. **Kubelet logs**: `mcp__kubernetes__nodes_log` with the node name (and
       `query` for a unit if supported). PLEG, eviction and image-GC lines
       matter.
    6. **Scrape health**: `up{instance=~"10.0.4.10[1-6].*"} == 0`. A node whose
       kubelet or node-exporter target is down has no data; say the checks
       above are blind for it rather than reporting it healthy.

    ## Rules

    - Machine config, upgrades, reboots and disk swaps are James's, via
      talosctl and the runbooks in `matchbox/talos-machineconfigs/`. Do not
      open PRs for Talos config; describe the change.
    - Never suggest rebooting a control-plane node while another one is
      unhealthy: two down is an etcd quorum loss.
    - Cordon/uncordon goes through cluster-remediate, with approval.

  media-house-rules.md: |
    ---
    name: media-house-rules
    description: "Use for anything inside Sonarr/Radarr/Bazarr/SAB/Jellyfin."
    version: 1.0.0
    author: James (gitops_homelab_2_0)
    platforms: [linux]
    metadata:
      hermes:
        tags: [Media, Sonarr, Radarr, Bazarr, SABnzbd, Jellyfin, Homelab]
        related_skills: [cluster-triage, cluster-remediate, gitops-fix]
    ---

    # Working inside the media apps

    The `arr` MCP server (arr-mcp in mcp-system) talks to the apps' own APIs:
    Sonarr, Radarr, Bazarr and SABnzbd in the media vcluster, Jellyfin on
    Tower (10.0.0.12:8096). Tracearr and Plex are not connected.

    ## What you can do

    - Read anything: start with `stack_health` or `diagnose`, then
      `get_queue`, `get_history`, `get_wanted`, `get_releases`,
      `get_subtitles`, `get_library`, `get_media_details`, `get_playback`.
      Reads need no approval.
    - Safe writes on Sonarr, Radarr, Bazarr and SABnzbd only:
      `trigger_search`, `trigger_scan`, `trigger_subtitle_search`,
      `grab_release`, `set_monitoring`, `update_media`, `add_media`,
      `retry_download`, `pause_downloads`, `remove_blocklist_item`.
      Every write is a preview first, then a confirm with the token the
      preview returned. James approves each call, so two prompts per write.
      Show him what the preview said before you confirm.
    - Jellyfin is read-only. Nothing can delete: no `delete_media`,
      `delete_episode_files`, `remove_queue_item` or `clean_queue`. The
      server refuses them (its token is tier `write`). If a fix needs a
      delete, say exactly what and why, and let James do it.

    ## House rules

    - **TV is 1080p at most.** The Living Room TV cannot keep sync on 4K.
      Anything above 1080p gets replaced with a 1080p release when one exists:
      move the series to the WEB-1080p profile with `update_media` and search.
      Sonarr only removes the old file when the new one imports, into its
      recycle bin `/data/media/.sonarr-recycle`. Never ask for the old file to
      be deleted first.
    - **No bulk writes.** Tower holds the media, the NFS volumes and Jellyfin,
      and has little RAM; a burst of searches, scans or imports has taken it
      down before. One series or film per action, never a library-wide
      search or rescan without James asking for exactly that. A bulk 4K to
      1080p run may already be going from James's Mac; check the queue
      before adding to it.
    - **Subtitles:** the OpenSubtitles.com account allows 1,000 a day,
      shared with Jellyfin's own task. Search one series or film at a time.
      Anime specials are numbered S01E00 on OpenSubtitles and S00E01 in
      Sonarr, so Bazarr misses them. Report it; do not retry in a loop.
    - **Stuck in the queue:** `diagnose` first. Usenet "cannot be completed"
      means the release is incomplete; grab another with `get_releases` and
      `grab_release`, or `retry_download` once. An import pending on a
      finished download: `trigger_scan` with `action: "import"`.
    - **Jellyfin playback restarting at the end of an episode** is the
      Wholphin client on the Living Room TV, not the server.

    ## When it is not the app

    - An app not answering at all, or a pod stuck on stale NFS: that is the
      cluster. Use cluster-triage, then cluster-remediate.
    - App settings that live in git (image, resources, env, configarr
      quality profiles in `workloads/vcluster-media/addons/<app>/values.yaml`):
      gitops-fix. Settings changed in an app's UI that git also writes are
      overwritten on the next sync.
