# The landing page's API keys, from 1Password through onepassword-store.
# deployment.yaml loads the Secret with an optional envFrom after glance-env,
# and Glance substitutes `${HOMEPAGE_VAR_<NAME>}` in glance.yml from the
# environment, so no key is ever written into configmap.yaml.
#
# Add another 1Password item as its own ExternalSecret, never as a line in this
# one: a Secret is written only when every field it reads resolves, so one bad
# field blanks every key in it.
---
# Item "homepage-secret" (homelab vault), read WHOLE: its fields are already
# named HOMEPAGE_VAR_* and become variables as they are. It is the same item
# the media vcluster's eso-homepage-secret reads for configarr and the
# exporters, so the Sonarr/Radarr keys there are known-good. Fields used:
#   HOMEPAGE_VAR_SONARR_KEY, _RADARR_KEY, _SABNZBD_KEY, _PLEX_TOKEN,
#   _UNRAID_KEY, _PVE_USER, _PVE_PASS, _UMAMI_KEY
# A new HOMEPAGE_VAR_* field added to the item is picked up on the next
# refresh (and the next pod start; Glance reads the
# environment once).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-env
  namespace: homepage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: homepage-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: homepage-secret
