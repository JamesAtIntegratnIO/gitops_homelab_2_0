# Homepage's widget credentials, all from 1Password through onepassword-store,
# into one Secret `homepage-env` that deployment.yaml loads with envFrom.
# Homepage substitutes `{{HOMEPAGE_VAR_<NAME>}}` in services.yaml from the
# environment, so no key is ever written into configmap.yaml.
#
# Item "homepage-secret" (homelab vault) is read WHOLE: its fields are already
# named HOMEPAGE_VAR_* and become variables as they are. It is the same item
# the media vcluster's eso-homepage-secret reads for configarr and the
# exporters, so the Sonarr/Radarr keys there are known-good. Fields used:
#   HOMEPAGE_VAR_SONARR_KEY, _RADARR_KEY, _SABNZBD_KEY, _PLEX_TOKEN,
#   _UNRAID_KEY, _HA_KEY, _PVE_USER, _PVE_PASS
#
# The rest come from items other things already use, by field LABEL:
#   unifi-mcp-login       username, password  (the UniFi console login)
#   argocd-mcp-api-token  token               (an ArgoCD API token)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-env
  namespace: homepage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: homepage-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: homepage-secret
  data:
    - secretKey: HOMEPAGE_VAR_UNIFI_USER
      remoteRef: { key: unifi-mcp-login, property: username }
    - secretKey: HOMEPAGE_VAR_UNIFI_PASS
      remoteRef: { key: unifi-mcp-login, property: password }
    - secretKey: HOMEPAGE_VAR_ARGOCD_KEY
      remoteRef: { key: argocd-mcp-api-token, property: token }
