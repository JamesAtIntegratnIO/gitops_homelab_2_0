# The Secrets the chart's values name, all from 1Password through
# onepassword-store. Every item and field read below is listed, with what goes
# in it, in README.md beside this file. Fields are read by their LABELS, so
# renaming one in the item breaks the Secret that reads it.
---
# The orchestrator's environment (`credentials.secret` in values.yaml): the
# chart loads every key of this Secret as a variable.
#
# The store is Postgres on 10.0.3.1, from the item "specmarshal-db-connection":
#
#   host      10.0.3.1
#   port      5432
#   text      the role name (specmarshal)
#   password  the role's password
#
# The password is handed over as PGPASSWORD rather than spliced into the
# connection string. node-postgres falls back to PGPASSWORD for a string that
# carries none, so a password with `@`, `/` or `%` in it cannot corrupt the URL,
# and the URL, which Specmarshal names in its own error messages, carries no
# secret.
#
# The rest are settings, not secrets. They are here because this Secret is the
# only environment the chart lets an operator set. The model is LM Studio on
# the workstation, the same server and DHCP reservation bosun uses, through
# Pi's `local` provider, so an iteration costs nothing per token and there is
# no provider key. Pi reaches it from inside each iteration's Job, which is why
# the iteration pods have an egress rule for exactly this host and port
# (network-policies/specmarshal.yaml). LM Studio must have "Serve on Local
# Network" on and the model available; a sleeping workstation reads as every
# iteration timing out.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: specmarshal-env
  namespace: specmarshal
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: specmarshal-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SPECMARSHAL_STORE: "postgres://{{ .user }}@{{ .host }}:{{ .port }}/specmarshal"
        PGPASSWORD: "{{ .password }}"
        SPECMARSHAL_PROVIDER: local
        SPECMARSHAL_BASE_URL: http://192.168.0.57:1234/v1
        SPECMARSHAL_IMPLEMENT_MODEL: qwen3.6-35b-a3b-splash
        SPECMARSHAL_REVIEW_MODEL: qwen3.6-35b-a3b-splash
        SPECMARSHAL_ANSWER_MODEL: qwen3.6-35b-a3b-splash
  data:
    - secretKey: host
      remoteRef: { key: specmarshal-db-connection, property: host }
    - secretKey: port
      remoteRef: { key: specmarshal-db-connection, property: port }
    - secretKey: user
      remoteRef: { key: specmarshal-db-connection, property: text }
    - secretKey: password
      remoteRef: { key: specmarshal-db-connection, property: password }
---
# The pull secret (`image.pullSecret` in values.yaml) for
# registry.integratn.io, which serves the orchestrator image and the sandbox
# images. The username is always `license` and the password is the license
# key. The kubelet pulls with it; it is never mounted into any container, so
# an agent never holds the key.
#
# 1Password item "specmarshal-license", field:
#   key  the license key
#
# The same item feeds ArgoCD's repository Secret for the chart, in the argo-cd
# values (`specmarshal-registry-repo`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: specmarshal-registry
  namespace: specmarshal
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: specmarshal-registry
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: |
          {"auths":{"registry.integratn.io":{"auth":"{{ printf "license:%s" .key | b64enc }}"}}}
  data:
    - secretKey: key
      remoteRef: { key: specmarshal-license, property: key }
---
# The license key, for the chart to enter (`license.secret` in values.yaml).
# An init container runs `specmarshal license add` with it on standard input
# each time the pod starts, so a new home is licensed on its first start. Only
# that init container mounts this Secret; the orchestrator reads the license
# from its home.
#
# The same 1Password item as the pull secret above, in the shape the chart
# reads: the key alone, under `key`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: specmarshal-license
  namespace: specmarshal
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: specmarshal-license
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef: { key: specmarshal-license, property: key }
---
# The GitHub App the orchestrator acts as (`githubApp.secret` in values.yaml).
# An init container runs `specmarshal github-app` with the key on standard
# input each time the pod starts, so a new home holds the App on its first
# start. Only that init container mounts this Secret; the orchestrator reads
# the App from its home. The chart reads the keys by these names, so they are
# not the operator's to rename.
#
# It is the owner's App, 4924067, the same one the Mac's service acts as: one
# App serves every account it is installed on, and the installation that
# reaches a repository is found per repository, so no installation id is
# pinned. The App also carries the OAuth client sign-in uses, below.
#
# 1Password item "specmarshal-github-app", fields:
#   app-id       the App ID from the App's settings page
#   private-key  the private key the settings page generated: the whole .pem,
#                BEGIN and END lines included, as a multi-line text field
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: specmarshal-github-app
  namespace: specmarshal
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: specmarshal-github-app
    creationPolicy: Owner
  data:
    - secretKey: app-id
      remoteRef: { key: specmarshal-github-app, property: app-id }
    - secretKey: private-key
      remoteRef: { key: specmarshal-github-app, property: private-key }
---
# The App's OAuth client, which people sign in to the surface with
# (`signIn.clientSecret.name` in values.yaml). The chart hands both to the
# orchestrator by reference, as SPECMARSHAL_GITHUB_CLIENT_ID and
# SPECMARSHAL_GITHUB_CLIENT_SECRET. The keys are the chart's to name.
#
# The client is the App's own: its settings page shows the client ID and
# generates a client secret, which GitHub shows once. The App's callback URL
# has to be exactly `signIn.webUrl` plus /sign-in/callback,
# https://specmarshal.cluster.integratn.tech/sign-in/callback, or GitHub
# returns nobody.
#
# 1Password item "specmarshal-sign-in", fields:
#   client-id      the client ID
#   client-secret  a client secret generated for the App
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: specmarshal-sign-in
  namespace: specmarshal
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: specmarshal-sign-in
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef: { key: specmarshal-sign-in, property: client-id }
    - secretKey: client-secret
      remoteRef: { key: specmarshal-sign-in, property: client-secret }
