crds:
  upgradeJob:
    enabled: false

alertmanager:
  enabled: true
  alertmanagerSpec:
    externalUrl: https://alertmanager.cluster.integratn.tech
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: config-nfs-client
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
  config:
    global:
      resolve_timeout: 5m

    # ── Inhibitions ────────────────────────────────────────────────────────
    # Suppress the derivative alerts a single fault fans out into, so one
    # problem produces one message instead of a family of them.
    inhibit_rules:
    # A critical for a given alertname+namespace silences its warning/info twins.
    - source_matchers:
      - severity = critical
      target_matchers:
      - severity =~ warning|info
      equal:
      - namespace
      - alertname
    - source_matchers:
      - alertname = InfoInhibitor
      target_matchers:
      - severity = info
    # A Degraded app is also OutOfSync. Report the worse condition only.
    - source_matchers:
      - alertname = ArgoCDAppDegraded
      target_matchers:
      - alertname = ArgoCDAppOutOfSync
      equal:
      - name
    # Certificate expiry is a ladder (expired > <3d > <14d > not-ready). Only
    # the most severe rung should reach Matrix for a given certificate.
    - source_matchers:
      - alertname = CertificateExpired
      target_matchers:
      - alertname =~ CertificateExpiring.*|CertificateNotReady
      equal:
      - namespace
      - name
    - source_matchers:
      - alertname = CertificateExpiringCritical
      target_matchers:
      - alertname = CertificateExpiringSoon
      equal:
      - namespace
      - name

    # ── Routing tiers ──────────────────────────────────────────────────────
    # Severity is a delivery contract, defined alongside the rules in
    # addons/cluster-roles/control-plane/addons/platform-alerts:
    #
    #   critical -> matrix-critical  10s wait, 1h repeat, resolved notices ON
    #   warning  -> matrix-digest    5m wait, 30m batch, 24h repeat, no resolves
    #   info     -> dropped          Grafana / Alertmanager UI only
    #
    # `name` is in every group_by. Without it, every ArgoCD app shares a single
    # namespace+alertname group, so one app changing state re-notifies the whole
    # group on each group_interval — the single biggest source of repeat spam.
    route:
      # Unclassified alerts fall through to the quiet digest rather than paging
      # or vanishing: visible, but never a 3am message.
      receiver: matrix-digest
      group_by:
      - alertname
      - namespace
      - name
      group_wait: 5m
      group_interval: 30m
      repeat_interval: 24h
      routes:

      # 1. Muted: permanently true on this cluster by design, tracked in Grafana.
      #    CPUThrottlingHigh — fires for any container that has a CPU limit and
      #    uses it; upstream's own docs call it noisy.
      #    KubeCPUOvercommit used to be in this list, from when 8.4 of the 7.9
      #    two-node CPU was requested and "cannot tolerate node failure" was the
      #    steady state. After the 2026-08-21 right-sizing requests sit near
      #    6.5, the alert is quiet, and it is exactly the N+1 check in
      #    docs/game-day.md -- so it now flows to the warning digest and fires
      #    only when N+1 has regressed. Do not re-mute it; fix the requests.
      - receiver: 'null'
        matchers:
        - alertname =~ Watchdog|InfoInhibitor|CPUThrottlingHigh
        continue: false

      # 2. Info: awareness only, never messaged.
      - receiver: 'null'
        matchers:
        - severity = info
        continue: false

      # 3. Critical: something is broken now. Page immediately, repeat hourly
      #    until fixed, and confirm on resolve.
      - receiver: matrix-critical
        matchers:
        - severity = critical
        group_wait: 10s
        group_interval: 5m
        repeat_interval: 1h
        continue: false

      # 4. ArgoCD's own app-level notification webhook.
      - receiver: matrix-digest
        matchers:
        - source = argocd-notifications
        group_by:
        - alertname
        - app_name
        group_wait: 1m
        group_interval: 30m
        repeat_interval: 24h
        continue: false

      # 5. Warning: batched. No resolved notices — a warning that cleared on its
      #    own is not news, and resolve traffic was roughly half of all volume.
      - receiver: matrix-digest
        matchers:
        - severity = warning
        continue: false

    receivers:
    - name: 'null'
    # Both receivers currently target the same Matrix room via two distinct
    # receiver paths. To split warnings into a dedicated digest room: create the
    # room, add its ID as `digest-room-id` on the matrix-alertmanager-receiver
    # 1Password item, add that key to the ExternalSecret and a
    # MATRIX_DIGEST_ROOM_ID env var to the Deployment, then point the
    # homelab-digest room-mapping entry at it. No change is needed here.
    - name: matrix-critical
      webhook_configs:
      - url: http://matrix-alertmanager-receiver.monitoring.svc.cluster.local:12345/alerts/homelab-alerts
        send_resolved: true
    - name: matrix-digest
      webhook_configs:
      - url: http://matrix-alertmanager-receiver.monitoring.svc.cluster.local:12345/alerts/homelab-digest
        send_resolved: false
prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    externalUrl: https://prometheus.cluster.integratn.tech
    enableRemoteWriteReceiver: true
    enableFeatures:
    - exemplar-storage
    retention: 15d
    secrets:
    - etcd-client-cert
    # Tuned probes: kube-apiserver-burnrate.rules can spike to 5s+ evaluation,
    # causing the default 3s liveness timeout to fail. See k/k#134080.
    containers:
    - name: prometheus
      livenessProbe:
        httpGet:
          path: /-/healthy
          port: http-web
          scheme: HTTP
        timeoutSeconds: 10
        periodSeconds: 15
        failureThreshold: 8
      readinessProbe:
        httpGet:
          path: /-/ready
          port: http-web
          scheme: HTTP
        timeoutSeconds: 10
        periodSeconds: 10
        failureThreshold: 6
      startupProbe:
        httpGet:
          path: /-/ready
          port: http-web
          scheme: HTTP
        timeoutSeconds: 10
        periodSeconds: 15
        failureThreshold: 60
    # Discover ServiceMonitors/PodMonitors/Rules in ALL namespaces
    # regardless of labels. Without the *NilUsesHelmValues: false
    # settings, empty selectors get replaced with {release: <helm-release>}.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector: {}
    podMonitorSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}
    ruleSelector: {}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: config-nfs-client
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 30Gi
kubeControllerManager:
  enabled: true
  endpoints:
  - 10.0.4.101
  - 10.0.4.102
  - 10.0.4.103
  service:
    enabled: true
    port: 10257
    targetPort: 10257
  serviceMonitor:
    enabled: true
    https: true
    insecureSkipVerify: true
kubeScheduler:
  enabled: true
  endpoints:
  - 10.0.4.101
  - 10.0.4.102
  - 10.0.4.103
  service:
    enabled: true
    port: 10259
    targetPort: 10259
  serviceMonitor:
    enabled: true
    https: true
    insecureSkipVerify: true
# kube-state-metrics: set resource requests/limits and tune probes to prevent
# transient 503 liveness failures caused by short CPU starvation on busy nodes.
kube-state-metrics:
  # Kargo exports controller-runtime counters and nothing about promotions,
  # freight or stages, so a failed promotion appears nowhere. The
  # kargo-observability addon writes a CustomResourceState config over Kargo's
  # CRDs and the ClusterRole to read them; this is the half that tells
  # kube-state-metrics to load it.
  #
  # `create: false` matters: the config ConfigMap is owned by that addon, and
  # letting this chart create one too makes the two fight over it every sync.
  customResourceState:
    enabled: true
    create: false
    name: kargo-custom-resource-state
    key: config.yaml
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # Relax probes — KSM can be briefly slow during large list/watch cycles
  livenessProbe:
    failureThreshold: 5
    httpGet:
      httpHeaders: []
      scheme: http
    initialDelaySeconds: 5
    periodSeconds: 15
    successThreshold: 1
    timeoutSeconds: 10
  readinessProbe:
    failureThreshold: 5
    httpGet:
      httpHeaders: []
      scheme: http
    initialDelaySeconds: 5
    periodSeconds: 15
    successThreshold: 1
    timeoutSeconds: 10

# kube-proxy is replaced by Cilium eBPF — nothing to monitor
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: true
  service:
    enabled: true
    port: 2379
    targetPort: 2379
    selector:
      k8s-app: kube-controller-manager
  serviceMonitor:
    enabled: true
    scheme: https
    insecureSkipVerify: false
    serverName: localhost
    caFile: /etc/prometheus/secrets/etcd-client-cert/ca.crt
    certFile: /etc/prometheus/secrets/etcd-client-cert/server.crt
    keyFile: /etc/prometheus/secrets/etcd-client-cert/server.key
    metricRelabelings:
    - action: labeldrop
      regex: pod
grafana:
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: browser
  sidecar:
    datasources:
      uid: prometheus
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: '1'
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: false
    securityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Authentik OAuth2/OIDC configuration
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
      secretKeyRef:
        name: grafana-oidc-config
        key: client-id
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-oidc-config
        key: client-secret
  grafana.ini:
    server:
      root_url: https://grafana.cluster.integratn.tech
    auth:
      oauth_auto_login: false
      disable_login_form: false
    auth.generic_oauth:
      enabled: true
      name: Authentik
      client_id: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
      client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
      scopes: openid profile email groups
      auth_url: https://auth.cluster.integratn.tech/application/o/authorize/
      token_url: http://authentik-server.authentik.svc.cluster.local/application/o/token/
      api_url: http://authentik-server.authentik.svc.cluster.local/application/o/userinfo/
      use_pkce: true
      use_refresh_token: true
      allow_sign_up: true
      role_attribute_path: contains(groups[*], 'authentik Admins') && 'Admin' || contains(groups[*], 'authentik Users') && 'Editor' || 'Viewer'
      allowed_groups:
  # Security hardening — fixes AVD-KSV-0014
  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  extraEmptyDirMounts:
    - name: tmp
      mountPath: /tmp
  initChownData:
    enabled: false
  podSecurityContext:
    fsGroup: 1000
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
  service:
    type: ClusterIP
  persistence:
    enabled: true
    storageClassName: config-nfs-client
    size: 5Gi
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: default
        orgId: 1
        folder: Kubernetes
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default
  dashboards:
    default:
      kubernetes-cluster-monitoring:
        gnetId: 315
        datasource: Prometheus
      node-exporter-full:
        gnetId: 1860
        datasource: Prometheus
  additionalDataSources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki-gateway.loki.svc.cluster.local
    jsonData:
      maxLines: 5000
      timeout: 60
defaultRules:
  rules:
    etcd: true
  # Turn off exactly one mixin rule. It needs ratio < 0.5 AND in_use > 100MiB,
  # and this cluster's live keyspace sits at ~100MiB -- so the floor, not the
  # ratio, decides whether it fires. Measured over 30 days of this cluster's own
  # series it was silent at ratio 0.18 (in_use 71MiB, the worst fragmentation in
  # the window), fired for 86 hours straight at 0.42-0.48 (the mildest), and
  # went quiet again on 2026-08-29 as fragmentation deepened because in_use
  # dipped 800KB below the floor. It covered 86 of the 310 hours the cluster was
  # actually fragmented. Replaced by EtcdReclaimableSpaceHigh in the
  # platform-alerts addon, which alerts on absolute reclaimable bytes and is
  # therefore scale-free. The other 14 etcd mixin rules stay on.
  disabled:
    etcdDatabaseHighFragmentationRatio: true

# NOTE 2026-08-30: a `defaultRules.additionalPrometheusRules` block lived here
# from 2026-01 until today, carrying an etcdInsufficientMembers rewrite that
# dropped the mixin's `without (instance, pod)` grouping. It never rendered
# anything. That key does not exist in this chart -- `helm show values
# kube-prometheus-stack --version 88.5.3` declares `defaultRules.disabled` and a
# TOP-LEVEL `additionalPrometheusRulesMap`, and Helm silently ignores a value it
# does not recognise. So the override sat dead for 218 days while the live rule
# stayed the mixin's, and `kubectl get prometheusrules -n monitoring` showed no
# etcd-override object. Removed rather than repaired: activating an alert change
# nobody has validated since January is its own decision, and the text is in git
# history. If it is still wanted, it belongs in platform-alerts with the mixin
# copy turned off via `disabled:` above -- the pattern this file now uses.
