# Mealie's OAuth2 client credentials, read by authentik (env MEALIE_CLIENT_ID
# and MEALIE_CLIENT_SECRET in authentik/values.yaml) for the blueprint in
# authentik-blueprints-mealie.yaml. Same shape as authentik-secrets-external.yaml.
#
# 1Password item "generated-mealie-oidc", fields by label:
#   client-id      the fixed string mealie
#   client-secret  64 random letters and digits
# Created once by the PushSecret in mealie/oidc-generated-secret.yaml; Mealie
# reads the same item (mealie/externalsecret.yaml, mealie-oidc).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-mealie-oidc
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: authentik-mealie-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: generated-mealie-oidc
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: generated-mealie-oidc
        property: client-secret
