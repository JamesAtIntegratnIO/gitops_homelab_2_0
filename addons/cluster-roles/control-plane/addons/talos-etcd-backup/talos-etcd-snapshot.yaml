# Nightly etcd snapshot of the-cluster's own control plane, via the Talos API.
#
# WHY
# ---
# Nothing backs up the host etcd. Git rebuilds what *should* exist, but a
# rebuild loses everything that only etcd knows: every PV/PVC binding (the
# NFS directories stay, the objects that point at them do not), Kratix request
# status, ArgoCD's cluster registrations, cert-manager's issued certificates.
# Today the only recovery from etcd loss is the 2-3 hour rebuild in
# docs/operations.md, followed by hand-reattaching storage.
#
# PREREQUISITE -- this addon ships DISABLED
# -----------------------------------------
# The `talos.dev/v1alpha1 ServiceAccount` below is a Talos-provided kind that
# only exists once `machine.features.kubernetesTalosAPIAccess` is enabled --
# that is matchbox/talos-machineconfigs/all.yaml, which is committed but needs
# `talosctl patch mc` on each node. Until then ArgoCD cannot create this
# resource, so the addon is `enabled: false` in addons.yaml. After the patch:
#
#   kubectl get crd serviceaccounts.talos.dev     # must exist
#   # then flip platform-backups-talos.enabled to true in
#   # addons/cluster-roles/control-plane/addons/addons.yaml
#
# HOW
# ---
# Talos mints a short-lived talosconfig into the Secret named after the
# ServiceAccount, scoped to the single `os:etcd:backup` role. The pod calls
# `talosctl etcd snapshot` against the node it happens to be scheduled on
# (every node here is a control-plane member) and streams the snapshot onto
# the Unraid share -- off the nodes, at a fixed path that survives a rebuild.
#
# Restore procedure: docs/operations.md, "Restore the-cluster etcd".
---
# The talos-backup Namespace itself is owned by the network-policies addon
# (network-policies/talos-backup.yaml), like every other namespace that addon
# fences, so the default-deny and this addon's resources never race.
#
# Talos watches this kind and writes a Secret of the same name containing a
# talosconfig. The namespace and role must both be in the allow-lists in
# matchbox/talos-machineconfigs/all.yaml.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: talos-etcd-backup
  namespace: talos-backup
spec:
  roles:
    - os:etcd:backup
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: talos-etcd-snapshot
  namespace: talos-backup
  labels:
    app.kubernetes.io/name: talos-etcd-snapshot
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: platform
spec:
  # 03:15 UTC; the vcluster-media snapshot follows at 03:45.
  schedule: "15 3 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: talos-etcd-snapshot
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          priorityClassName: platform-batch
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: snapshot
              # Must not run ahead of the Talos version on the nodes (v1.11.x);
              # Kargo tracks this line under addons.targets.talosctl and the
              # constraint there is bumped together with the Talos upgrade.
              image: ghcr.io/siderolabs/talosctl:v1.11.5@sha256:7319acae2d4082662fd6dafeb6a2491d66cabb907c2227b2214d61242a6b1faa
              args:
                - --nodes=$(NODE_IP)
                - --endpoints=$(NODE_IP)
                - etcd
                - snapshot
                - /backups/the-cluster-etcd.partial
              env:
                - name: TALOSCONFIG
                  value: /var/run/secrets/talos.dev/config
                - name: NODE_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.hostIP
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: talos-secrets
                  mountPath: /var/run/secrets/talos.dev
                  readOnly: true
                - name: backups
                  mountPath: /backups
                  subPath: backups/the-cluster-etcd
          containers:
            - name: finalize
              image: docker.io/alpine/k8s:1.35.6@sha256:b7a12c5ddf261994c33d2eaaa06fd69a0803ff6b38683bfa3d30a76dcdf92807
              command: [/bin/sh, -euo, pipefail, -c]
              args:
                - |
                  cd /backups
                  name="the-cluster-etcd-$(date -u +%Y-%m-%dT%H%MZ).snapshot"
                  test -s the-cluster-etcd.partial || { echo "snapshot is empty"; exit 1; }
                  mv the-cluster-etcd.partial "$name"
                  echo "wrote $name ($(stat -c %s "$name") bytes)"
                  find . -maxdepth 1 -name 'the-cluster-etcd-*.snapshot' -mtime +"$RETENTION_DAYS" -print -delete | sed 's/^/pruned /'
                  echo "retained:"; ls -l the-cluster-etcd-*.snapshot
              env:
                - name: RETENTION_DAYS
                  value: "14"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              volumeMounts:
                - name: backups
                  mountPath: /backups
                  subPath: backups/the-cluster-etcd
          volumes:
            - name: talos-secrets
              secret:
                secretName: talos-etcd-backup
            # Same export the NFS provisioners use, mounted directly so the
            # target path is fixed and no PV/PVC object is involved -- the
            # backup must not depend on the etcd it backs up. The kubelet does
            # the mount in the host network namespace; no egress rule needed.
            - name: backups
              nfs:
                server: 10.0.0.12
                path: /mnt/user/kube_storage
