# Ping URL for the external dead-man's-switch check that Alertmanager's
# deadman-heartbeat receiver posts the Watchdog alert to (kube-prometheus-stack
# values). The checker lives outside the cluster on purpose -- it exists to
# notice when Prometheus or Alertmanager themselves are down.
#
# 1Password item `alertmanager-deadman-heartbeat`, field `url`: the full HTTPS
# ping URL (e.g. a healthchecks.io check that accepts POST).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-deadman-heartbeat
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: alertmanager-deadman-heartbeat
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: alertmanager-deadman-heartbeat
        property: url
