# ExternalSecret for mcpo's Umami API key
# Requires 1Password item "umami-mcp" with property "token": an API key made in
# Umami under Settings -> API keys, the whole `umami_...` string. Umami's /mcp
# accepts only such a key; a dashboard login token is refused.
#
# mcpo-deployment.yaml reads it optionally (the key cannot exist before Umami
# runs), and its init container renders it into the config only at start: after
# creating or rotating the key, `kubectl -n mcp-system rollout restart
# deploy/mcpo`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eso-umami-mcp
  namespace: mcp-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: umami-mcp
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: umami-mcp
        property: token
