# Without this the chart's objects are named `bosun-bosun` -- release name
# plus chart name, both of which are now `bosun`.
fullnameOverride: bosun

# Consumes the bosun chart from https://github.com/JamesAtIntegratnIO/bosun.
# See that chart's README, and the repository's docs/ for the safety model and
# the prompt contract the eval numbers come from. The chart version is pinned
# by `bosun.defaultVersion` in the addons.yaml beside this file.
#
# ENABLED. Both preconditions hold: the model endpoint below is serving, and
# LM Studio has "Serve on Local Network" on -- it binds 127.0.0.1 by default,
# which the cluster cannot reach. If triage starts timing out, check those two
# first; a sleeping workstation looks exactly like a wedged model.

image:
  repository: ghcr.io/jamesatintegratnio/bosun
  # Deliberately unset: the chart falls back to its own appVersion, so bumping
  # the chart moves the image with it and the two cannot drift. This used to be
  # the branch name `main` -- an unpinned tag, which is exactly the way an image
  # silently changes underneath a cluster.
  pullPolicy: IfNotPresent

git:
  provider: github
  owner: jamesatintegratnio
  repo: gitops_homelab_2_0
  repoURL: https://github.com/jamesatintegratnio/gitops_homelab_2_0.git
  # No author block: empty means the agent derives its commit identity from
  # the GitHub App itself (bosun-mate[bot] <id+bosun-mate[bot]@users.noreply.
  # github.com>), which is what makes pushed commits render under the App's
  # avatar. The block that used to sit here was the chart's old default --
  # bosun <bosun@users.noreply.github.com> -- which is the noreply address of
  # an UNRELATED GitHub account, so the first live repair's commits rendered
  # under a stranger's face. Never put an author here whose
  # users.noreply.github.com address is not your own bot's.
  existingSecret: bosun-github
  tokenKey: token

  # Authenticate as the Bosun GitHub App rather than as the owner of a token.
  #
  # This is about IDENTITY. The PAT granted exactly the same access, but it is
  # James's, so every comment the agent wrote carried his name and avatar and
  # read like a colleague's review until the footer said otherwise. The
  # `branding` block exists to compensate for that, and compensating was all it
  # could do.
  #
  # Comments now come from bosun-mate[bot]. `branding.name` is unchanged, so
  # the comment header and the `bosun` commit status read exactly as before --
  # only the author changes.
  #
  # installationId is deliberately unset: it is discovered from the repository,
  # which removes a value that can be silently wrong. GIT_TOKEN is not set at
  # all in this mode.
  app:
    appId: "4694792"
    privateKeyKey: private-key

llm:
  # Self-hosted, OpenAI-compatible. LM Studio on the workstation.
  provider: openai
  baseURL: http://192.168.0.57:1234/v1
  # The eval suite measures both: 9/9 classification on qwen3.8-27b against 8/9
  # on qwen3.5-9b, with 0 unsafe actions either way. The 9B was chosen when the
  # only question was "does a local model work at all"; now that Bosun is being
  # asked to EXPLAIN a rendered diff and not merely classify it, the larger
  # model is worth the latency -- nothing waits on this call.
  model: qwen/qwen3.8-27b
  # Generous: a local model reasoning over a 15k-token chart diff takes
  # minutes, and nothing is waiting on it.
  timeout: 10m
  # The endpoint requires a key. Renders LLM_API_KEY from the ExternalSecret
  # beside this file; the client sends it as a bearer token.
  existingSecret: bosun-llm

gate:
  # THE AGENT IS THE GATE. It polls this repository's open pull requests,
  # renders base and head against the LIVE ArgoCD cluster inventory, and posts
  # the `addons-gate` status and the report comment itself. That is what let
  # the CI half of this go away: no workflow to install, no checked-in cluster
  # inventory to export and keep fresh, and no `paths:` filter to hand-edit.
  #
  # This is the chart's default from 0.16.0 on. It is written down anyway,
  # because it is a decision rather than an inherited default -- and because
  # what it COSTS deserves to be visible in the values file that chose it.
  # That cost used to be get/list on Secrets in the `argocd` namespace -- the
  # inventory IS the ArgoCD cluster Secrets, and those same objects carry
  # cluster credentials, and RBAC cannot grant "the labels but not the data".
  # `inventorySource` below is how that grant went away; see the note there.
  #
  # `ci` is the other half of the enum and keeps the old shape whole. It is the
  # answer for a repository that takes fork pull requests, and for a gate that
  # must keep answering while the cluster itself is down. Flipping back is this
  # one line plus restoring the workflow and the inventory snapshot.
  mode: cluster

  # WHERE THE INVENTORY COMES FROM, and the reason the Secret read is gone.
  #
  # The gate needs four fields per cluster -- name, server, labels,
  # annotations. Reading them from the cluster Secrets meant get/list on
  # Secrets in `argocd`, and that grant could not be made smaller: RBAC has no
  # deny rules, `resourceNames` does not apply to `list`, and the label
  # selector the gate sends is a filter the apiserver applies AFTER
  # authorising. So the Role could read argocd-secret and every repository
  # credential beside it, and no narrowing of it would have changed that.
  #
  # ArgoCD's own API draws the line RBAC cannot: `GET /api/v1/clusters`
  # serves those four fields with no credential block at all. With this set,
  # the chart stops creating the Role entirely.
  #
  # What it costs, because it is a trade and not a win: the token below, whose
  # ArgoCD policy is one line (`p, role:bosun, clusters, get, *, allow`), and
  # a gate that now needs argocd-server up to reach a verdict -- the Secrets
  # were readable whenever the apiserver was. Flipping back is this one line.
  inventorySource: argocd

  argocd:
    # In-cluster and plain HTTP, because this ArgoCD runs `server.insecure:
    # true` behind the gateway -- so there is no certificate to verify and
    # neither `caSecret` nor `insecureSkipTLSVerify` is needed. The traffic
    # never leaves the cluster. Port 80 is what the chart opens to the
    # `argocd` namespace in its NetworkPolicy; argocd-server's Service maps
    # 80 and 443 to the same plaintext listener, and naming 443 here would
    # hang on a TLS handshake that never completes.
    baseURL: http://argo-cd-argocd-server.argocd.svc
    port: 80
    # Projected from 1Password by the ExternalSecret beside this file.
    existingSecret: bosun-argocd
    tokenKey: token

  # This repository is PUBLIC, so this is a real choice and not a formality.
  # Off means a pull request from a fork gets an `error` status naming this
  # value. That is the wanted outcome: in cluster mode the render runs helm
  # over the pull request's own content INSIDE the cluster, and doing that to a
  # stranger's chart values is a trust decision, not a default. Zero forks
  # today; the refusal is what keeps that from mattering the day there is one.
  forkPRs: false

  checkName: addons-gate
  # Inert in cluster mode -- there is no external check to wait on, the gate
  # runs in-process. Kept so that flipping `mode` back to `ci` is genuinely one
  # line. `poll` does still apply: it paces the sweep for new pull requests.
  wait: 10m
  poll: 30s

triage:
  maxAttempts: 2
  # Where a fix may land. Everything else is refused -- and CI config, the
  # gate and the Kargo target list are refused regardless, by a deny-list the
  # agent's own configuration cannot remove from.
  # Hosts Bosun must not contact, whatever the NetworkPolicy permits. An exact
  # host or a `*.suffix` pattern; a pattern forbids the apex too. Empty because
  # nothing has earned a place here yet -- the outbound log is the first place
  # to look if that changes.
  egressDeny: []

  allowPaths:
    - addons/**
    - workloads/**
    - promises/**

# Read what is actually running.
#
# The gate renders this repository and compares, so everything it knows is a
# property of text: "3 manifests still declare a version this chart stops
# serving" is a fact about the repo. Whether anything is STORED on that version
# is a different question, it usually decides whether this needs a human, and
# CI structurally cannot answer it. Bosun runs in the cluster; this is the first
# release that spends that.
#
# Briefs gain lines like:
#
#   - externalsecrets.external-secrets.io on v1beta1 — 0 live object(s)
#   - Application external-secrets-host — Degraded / OutOfSync
#
# Read-only: get and list, no watch, and no create/update/patch/delete anywhere
# in the chart.
#
# NO EGRESS CHANGE NEEDED HERE. This cluster runs the `cilium` flavor, and the
# chart emits `toEntities: [kube-apiserver]` for it -- the idiomatic answer,
# which does not go stale when a control-plane node is replaced. The `standard`
# flavor would need explicit endpoint CIDRs, because `kubernetes.default.svc`
# is a ClusterIP and a ClusterIP is DNAT'd before policy is evaluated.
#
# The pod refuses to start if it cannot read the API, so a mistake here is a
# crash loop with an explanation rather than a permanent quiet shrug.
liveReads:
  enabled: true

  # `groups`, not `wide`. "Everything except the core group" is the intent and
  # it is NOT EXPRESSIBLE in Kubernetes RBAC -- there are no deny rules, and
  # apiGroups ["*"] includes the core group, which contains Secrets. With
  # `groups` the core group is never granted beyond the pods/events the chart
  # already had, so Secrets are unreadable by construction.
  scope: groups

  # DERIVED, not invented: every non-built-in API group that appears as an
  # `apiVersion:` in addons/, workloads/ or platform/. Kept explicit for the
  # same reason the FQDN allow-list above is -- a bounded list is the
  # difference between "reads the CRDs we deploy" and "reads everything".
  #
  # A group missing from here is not an outage. It shows up in the brief as
  # "not permitted to check <group>/<version>/<plural>", which names itself and
  # is a one-line fix in this file.
  # Verified against the live cluster with
  #   kubectl auth can-i list <resource>.<group> --as=system:serviceaccount:bosun:bosun
  # rather than reasoned about. Secrets, create and delete all answer `no`;
  # every group below answers `yes`.
  apiGroups:
    - external-secrets.io
    # ESO ships its generators in a SEPARATE API group, and the same is true of
    # cert-manager's ACME types and Kyverno's reports. None of the three appears
    # as an `apiVersion:` anywhere in this repository -- those objects are
    # created at runtime, not declared -- so deriving the list from the tree
    # missed them.
    #
    # They matter precisely because they belong to charts this pipeline bumps.
    # If one of those bumps drops a served version, the brief would have said
    # "not permitted to check generators.external-secrets.io/..." instead of a
    # number, and "not permitted" is deliberately harmless -- so nobody would
    # have chased it.
    - generators.external-secrets.io
    - kyverno.io
    - policies.kyverno.io
    - reports.kyverno.io
    - cert-manager.io
    - acme.cert-manager.io
    - gateway.networking.k8s.io
    - gateway.nginx.org
    - cilium.io
    - metallb.io
    - monitoring.coreos.com
    - platform.kratix.io
    - platform.integratn.tech

  argocdNamespace: argocd

# NOTE: this addon's NetworkPolicies come from the chart rather than from the
# network-policies addon, unlike most namespaces here. That is deliberate --
# the chart has to carry them to be usable outside this repo, and keeping them
# beside the Deployment is what stops the two drifting apart.
#
# The half that CANNOT live here is the Kargo controller's own egress rule
# permitting this service; it is in
# network-policies/kargo.yaml (allow-controller-egress). Kyverno still
# generates the namespace's default-deny baseline as normal.
networkPolicy:
  enabled: true
  # This cluster runs Cilium, so take the tighter FQDN form for the git host.
  flavor: cilium
  kargoNamespace: kargo
  egress:
    dnsNamespace: kube-system
    ipBlocks:
      # The workstation running LM Studio. A /32 because it is one host, and
      # because the standard "0.0.0.0/0 except RFC1918" shape used elsewhere
      # in this repo would drop it -- 192.168.0.0/16 is in that exception list.
      #
      # This address must be a DHCP reservation. A lease change breaks triage
      # silently, which is precisely the failure class this work exists to end.
      - cidr: 192.168.0.57/32
        port: 1234
    # No FQDN allow-list any more. See `allowInternet` below.
    #
    # There was one, it was correct, and it was unmaintainable. A chart
    # repository redirects its index (charts.external-secrets.io ->
    # external-secrets.io), serves its archive from a release-asset CDN (15 of
    # this pipeline's 21 chart repositories use
    # release-assets.githubusercontent.com), and GitHub renamed that CDN from
    # objects.githubusercontent.com without telling anyone.
    #
    # Three separate incidents here added a host after the fact. The symptom
    # each time was a two-minute timeout and a brief that said it had no
    # evidence -- which is the exact quiet failure this agent exists to end. The
    # allow-list was manufacturing the thing it was protecting.
    fqdns: []
    fqdnPatterns: []

    # Let it reach the internet on 443, and hold it to account in the log.
    #
    # Bosun 0.15.0 logs EVERY outbound request -- method, host and path, with
    # the query string redacted because release-asset URLs are pre-signed and
    # carry a JWT -- and refuses anything named in `triage.egressDeny`.
    # Accountability after the fact rather than permission before it, which is
    # the right trade for a component whose job is reading public metadata about
    # public artifacts.
    #
    # It does NOT widen what the agent may DO. It still writes only to the pull
    # request's own branch, still refuses paths on a deny-list its own
    # configuration cannot remove from, and still never mutates this cluster.
    #
    # Watch where it goes:
    #   kubectl -n bosun logs deploy/bosun | grep outbound
    allowInternet: true

# Prometheus scrapes the supervisor's findings.
#
# Enabling this is what makes the platform.promotion alerts able to fire: the
# metrics carry findings by kind and severity, how long each has held, what the
# sweep actually read, and a sweep timestamp. The chart's own NetworkPolicy
# opens ingress from `monitoring` only when this is on.
#
# The rule worth having is the one on the TIMESTAMP's absence, not only on the
# findings -- see platform-alerts/prometheus-rules.yaml. A supervisor whose
# subject is silent failure has to be able to fail loudly itself.
metrics:
  serviceMonitor:
    enabled: true

# Watch the promotion pipeline itself. On by default in the chart; stated here
# because it is the reason the ServiceMonitor above exists.
#
# It only ever LISTs, on the Kargo read the ClusterRole already grants, and
# clones the default branch shallowly to check that every pin Kargo rewrites
# still points at a key some file actually has.
supervise:
  enabled: true
  interval: 10m

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 512Mi

priorityClassName: platform-batch
