# Mealie, the recipe manager / meal planner / shopping list: the official image,
# one replica, plain manifests, Postgres on datacron. Recipe images and
# backups live on the PVC below; everything else is in the database.
#
# THE IMAGE IS NOT KARGO-TRACKED YET. It is pinned by tag and digest, but its
# target is not in kargo-projects/values.yaml (that file is 50 KB and this PR
# could not safely rewrite it). Add a `mealie` target in a follow-up.
#
# THE ENTRYPOINT NEEDS FIVE CAPABILITIES, AND KYVERNO WOULD TAKE THEM ALL.
# Mealie's run.sh starts as root, chowns /app, then switches to PUID/PGID
# (911). Kyverno's mutate-restrict-escalation adds `drop: [ALL]` to any
# container that names no capabilities, and on first boot that gave
# "chown: changing ownership of '/app': Operation not permitted" and
# "error: failed switching to \"911\": operation not permitted", a crashloop.
# Naming them below keeps the drop and adds back what startup needs (the same
# set, minus KILL, that hermes-agent.yaml uses for its s6 entrypoint). The
# chown of /app/data itself is still refused by the NFS export, which maps
# every uid to 99:100 (docs/okf/platform/storage.md); run.sh carries on after
# it, and any uid can read and write the volume, so nothing else is needed.
# No runAsNonRoot and no read-only root: the entrypoint needs root first.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mealie-data
  namespace: mealie
  labels:
    app.kubernetes.io/name: mealie
  annotations:
    # Recipe images are only here. Pruning the app must not delete them.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: config-nfs-client
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  namespace: mealie
  labels:
    app.kubernetes.io/name: mealie
  annotations:
    # Stakater Reloader rolls this Deployment when the database Secret changes
    # (envFrom, read once, at start) or, once the OIDC change is merged, the
    # OIDC Secret. Naming a Secret that does not exist yet is harmless.
    secret.reloader.stakater.com/reload: "mealie-db,mealie-oidc"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # One RWO volume: never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mealie
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mealie
    spec:
      automountServiceAccountToken: false
      # A Service named `mealie` would otherwise inject MEALIE_* variables into
      # an app that reads its configuration from the environment.
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mealie
          image: ghcr.io/mealie-recipes/mealie:v3.30.0@sha256:90f83da6f3ab0a421efc827118a556168573930105f13fa3321768f42163d784
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_SERVER, POSTGRES_PORT and
          # POSTGRES_DB, from 1Password (externalsecret.yaml beside this file),
          # and OIDC_CLIENT_ID / OIDC_CLIENT_SECRET from the second Secret.
          envFrom:
            - secretRef:
                name: mealie-db
            - secretRef:
                name: mealie-oidc
          env:
            - name: DB_ENGINE
              value: postgres
            # Used for links and the OIDC callback (/login).
            - name: BASE_URL
              value: https://mealie.cluster.integratn.tech
            # Accounts are created by an admin or by signing in with authentik,
            # not by the login page.
            - name: ALLOW_SIGNUP
              value: "false"
            # Server tasks run at DAILY_SCHEDULE_TIME in this zone. UTC is the
            # image default; set the household's zone here if it matters.
            - name: TZ
              value: UTC
            # Sign in with authentik (provider `mealie`, blueprint
            # authentik-blueprints-mealie). Password login STAYS ON, with no
            # auto-redirect, so a broken OIDC setup cannot lock anyone out;
            # turn it off (ALLOW_PASSWORD_LOGIN=false, OIDC_AUTO_REDIRECT=true)
            # once OIDC is proven. The issuer URL is per provider.
            - name: OIDC_AUTH_ENABLED
              value: "true"
            - name: OIDC_PROVIDER_NAME
              value: authentik
            - name: OIDC_CONFIGURATION_URL
              value: https://auth.cluster.integratn.tech/application/o/mealie/.well-known/openid-configuration
            # Group names come from the `groups` claim (the blueprint's scope
            # mapping). `authentik Admins` become Mealie admins. OIDC_USER_GROUP
            # is unset: who may sign in is the authentik application's bindings.
            - name: OIDC_GROUPS_CLAIM
              value: groups
            - name: OIDC_ADMIN_GROUP
              value: authentik Admins
            # Mealie blocks server-initiated requests to private addresses.
            # From a pod auth.cluster.integratn.tech resolves to the gateway's
            # ClusterIP (coredns-host-config rewrite), which is one. If the
            # OIDC discovery fetch turns out not to be exempt, this is the fix;
            # it allows that one host and nothing else.
            - name: HTTP_ALLOW_LIST
              value: auth.cluster.integratn.tech
          # See the note at the top of the file.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          # /api/app/about is the image's own health check path. It answers from
          # settings and touches nothing external, so it is safe for liveness
          # (CLAUDE.md: never point liveness at a dependency). First start runs
          # the database migrations, hence the long startup probe.
          startupProbe:
            httpGet:
              path: /api/app/about
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/app/about
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/app/about
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mealie-data
---
# mealie.mealie.svc.cluster.local:9000 -- what the gateway route reaches, and
# the address an in-cluster MCP server or Hermes would use for the API.
apiVersion: v1
kind: Service
metadata:
  name: mealie
  namespace: mealie
  labels:
    app.kubernetes.io/name: mealie
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mealie
  ports:
    - name: http
      port: 9000
      targetPort: http
      protocol: TCP
