# Generated secrets: the capability, not the secrets.
#
# A ClusterSecretStore whose Connect token reaches ONE 1Password vault,
# `generated`, and nothing in `homelab`. ESO PushSecrets write NEW items there
# (random values from the Password generator); ExternalSecrets read them back
# through the same store. Hermes asks James before it ever authors one (skill
# secret-requests, hermes/secrets-skill.yaml), and every PushSecret is
# constrained to create-only by network-policies/kyverno-restrict-pushsecret.yaml.
#
# The token: 1Password item `eso-generated-token` (field `token`) in the
# `homelab` vault, read through the existing read store `onepassword-store`.
# It is a Connect token with read AND write on the `generated` vault only.
# Until that item exists the Secret below does not sync and this store
# reports not-ready; nothing else is affected.
#
# The existing store (`onepassword-store`, vault `homelab`, defined in
# environments/production/addons/addons.yaml) is untouched.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword-generated
spec:
  provider:
    onepassword:
      connectHost: https://connect.integratn.tech
      vaults:
        generated: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: eso-onepassword-generated-token
            namespace: external-secrets
            key: token
