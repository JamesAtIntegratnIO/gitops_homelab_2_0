# Cluster-scoped PriorityClasses used by the platform addons. Applied ahead of
# the workloads that reference them (sync-wave -10): a pod naming a
# PriorityClass that does not exist yet is rejected at admission.
#
# Deliberately NOT excluding vclusters. Three addons that set priorityClassName
# also render into every vcluster -- kyverno and external-secrets have no
# cluster_role exclusion, and cert-manager-vcluster resolves its values folder by
# chart name, so it reads the host cert-manager values file. A PriorityClass is
# cluster-scoped, so a vcluster has its own; without this, nine Deployments in
# vcluster-media could not create pods.
platform-scheduling:
  enabled: true
  type: manifest
  namespace: default
  project: platform-services
  defaultVersion: "main"
  path: addons/cluster-roles/control-plane/addons/platform-scheduling
  annotationsApp:
    argocd.argoproj.io/sync-wave: "-10"
  syncPolicy:
    syncOptions:
      - CreateNamespace=false

# PodDisruptionBudgets for components whose chart offers no hook for one:
# CoreDNS (a Talos bootstrap manifest) and the vcluster-media etcd StatefulSet
# (the promise renders a PDB for the vcluster pods but not for its etcd).
# Control-plane only, unlike the PriorityClasses above: a vcluster on the dev
# preset runs a single CoreDNS replica, where minAvailable: 1 would block
# every drain forever.
platform-disruption:
  enabled: true
  type: manifest
  namespace: default
  project: platform-services
  defaultVersion: "main"
  path: addons/cluster-roles/control-plane/addons/platform-disruption
  selector:
    matchExpressions:
      - key: cluster_role
        operator: NotIn
        values: ['vcluster']
  syncPolicy:
    syncOptions:
      - CreateNamespace=false

# ── Backups: the recovery layer ────────────────────────────────────────
# Nightly etcd snapshots of both clusters onto the Unraid share. Two entries
# because the host-cluster one depends on a Talos machine-config patch that
# has to be applied by hand -- see the files for the full reasoning and
# docs/okf/platform/backups.md for the design and restore paths.
platform-backups:
  enabled: true
  type: manifest
  namespace: vcluster-media
  project: platform-services
  defaultVersion: "main"
  path: addons/cluster-roles/control-plane/addons/platform-backups
  selectorMatchLabels:
    cluster_role: control-plane
  syncPolicy:
    syncOptions:
      - CreateNamespace=false

# Depends on machine.features.kubernetesTalosAPIAccess being on every node
# (applied 2026-08-22; `kubectl get crd serviceaccounts.talos.dev` is the
# check). Without it the talos.dev/v1alpha1 ServiceAccount below is a kind the
# API does not serve and the Application can never reach Synced -- set this
# back to false if the cluster is ever rebuilt without that feature.
platform-backups-talos:
  enabled: true
  type: manifest
  namespace: talos-backup
  project: platform-services
  defaultVersion: "main"
  path: addons/cluster-roles/control-plane/addons/talos-etcd-backup
  selectorMatchLabels:
    cluster_role: control-plane
  syncPolicy:
