# Credentials for the two exporters, one ExternalSecret per 1Password item so
# one bad field cannot blank the other's Secret.
---
# Item "homepage-secret": the Proxmox API token the landing page's Proxmox
# widget already uses. HOMEPAGE_VAR_PVE_USER is the token id in Proxmox's
# `user@realm!tokenname` form and HOMEPAGE_VAR_PVE_PASS its secret; the
# exporter wants the two halves of the id apart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pve-exporter
  namespace: host-exporters
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: pve-exporter
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        PVE_USER: '{{ index (splitList "!" .tokenid) 0 }}'
        PVE_TOKEN_NAME: '{{ index (splitList "!" .tokenid) 1 }}'
        PVE_TOKEN_VALUE: '{{ .secret }}'
  data:
    - secretKey: tokenid
      remoteRef:
        key: homepage-secret
        property: HOMEPAGE_VAR_PVE_USER
    - secretKey: secret
      remoteRef:
        key: homepage-secret
        property: HOMEPAGE_VAR_PVE_PASS
---
# Item "unifi-mcp-login": the UniFi console login the UniFi MCP uses.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpoller
  namespace: host-exporters
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: unpoller
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: unifi-mcp-login
        property: username
    - secretKey: password
      remoteRef:
        key: unifi-mcp-login
        property: password
