# Umami and its Redis. The namespace starts from the default-deny Kyverno
# generates (kyverno-generate-default-deny.yaml); everything each pod is
# allowed is below.
#
# Two pods, told apart by label: Umami is `app.kubernetes.io/name: umami`,
# Redis is `app.kubernetes.io/name: redis`. Umami is reached four ways, all on
# 3000 and all named here -- the gateway (the dashboard and the MCP route),
# the cloudflared tunnel (the two public paths), mcpo, and Homepage's stats
# tiles. Each of those
# also needs the EGRESS half on its own side, or the request hangs with zero
# bytes instead of failing:
#
#   gateway      allow-nginx-dataplane in nginx-gateway.yaml
#   cloudflared  allow-umami-egress in cloudflared.yaml
#   mcpo         allow-mcpo-umami-egress in mcp-system.yaml
#   homepage     allow-widget-apis in homepage.yaml
#
# Umami itself reaches Postgres, Redis and DNS and nothing else. It has no
# internet egress, on purpose: telemetry and the update check are off in its
# environment, and visitors are located from the GeoLite database in the image.
apiVersion: v1
kind: Namespace
metadata:
  name: umami
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: umami
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# The store: the external Postgres on 10.0.3.1 that specmarshal and authentik
# also use. Not a node address, so a plain ipBlock matches it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-egress
  namespace: umami
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: umami
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.3.1/32
      ports:
        - protocol: TCP
          port: 5432
---
# Umami to its Redis, both halves in one namespace. Nothing else in the cluster
# may reach Redis: it holds dashboard sessions.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-umami-to-redis
  namespace: umami
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: umami
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
              app.kubernetes.io/instance: umami
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-from-umami
  namespace: umami
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: umami
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: umami
      ports:
        - protocol: TCP
          port: 6379
---
# The dashboard (stats.cluster.integratn.tech, behind authentik) and the MCP
# route (mcp.cluster.integratn.tech/umami/mcp), from the gateway's data plane.
# The other half is the umami entry in allow-nginx-dataplane
# (nginx-gateway.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-ingress
  namespace: umami
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: umami
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nginx-gateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: nginx-gateway-nginx
      ports:
        - protocol: TCP
          port: 3000
---
# The public path: the tunnel's connectors. Which URLs they forward is decided
# by the tunnel's ingress rules (IntegratnIO/infrastructure) -- /c.js and
# /api/c only -- not by this policy, which cannot see paths. The other half is
# allow-umami-egress in cloudflared.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cloudflared-ingress
  namespace: umami
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: umami
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared
      ports:
        - protocol: TCP
          port: 3000
---
# mcpo, which calls Umami's /mcp with an API key and hands the tools to Open
# WebUI. The other half is allow-mcpo-umami-egress in mcp-system.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mcpo-ingress
  namespace: umami
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: umami
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mcp-system
          podSelector:
            matchLabels:
              app: mcpo
      ports:
        - protocol: TCP
          port: 3000
---
# Homepage's two site tiles, which read /api/websites/<id>/stats and /active
# with a Umami API key. The other half is allow-widget-apis in homepage.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-homepage-ingress
  namespace: umami
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: umami
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: homepage
          podSelector:
            matchLabels:
              app.kubernetes.io/name: homepage
      ports:
        - protocol: TCP
          port: 3000
