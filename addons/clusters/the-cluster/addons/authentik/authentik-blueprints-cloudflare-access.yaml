# authentik Blueprint ConfigMap: Cloudflare Access. Its own ConfigMap, listed
# in authentik/values.yaml (blueprints.configMaps), like Mealie's.
#
# WHAT IT IS FOR. The media apps Sonarr and Radarr are reachable away from home
# at sonarr.integratn.tech and radarr.integratn.tech, through the homelab
# Cloudflare Tunnel. Cloudflare Access stands in front of both hosts and signs
# people in with THIS OIDC client, so the sign-in is authentik's: one sign-in,
# no second login. A request without a valid Access session never reaches the
# homelab, and cloudflared checks Access's token again on every request it
# passes on. The Access side (identity provider, policy, application, tunnel
# rules, path blocks) is OpenTofu in IntegratnIO/infrastructure, sites.
#
# Who gets in is decided twice:
#   - here, by the application's binding to `media-management`: authentik
#     refuses to finish the sign-in for anyone else, so Access never gets a
#     token for them;
#   - at Cloudflare, by the Access policy, which requires `media-management`
#     in the `groups` claim this client sends.
# Sign-in happens on auth.integratn.tech, so it comes through Cloudflare and
# the rules in 03-authentication-flows apply: Google sign-in only, and no
# superuser. An admin account cannot use the media apps from outside; use a
# normal account in media-management.
#
# Client id and secret: 1Password item `generated-cloudflare-access-oidc`,
# created by the PushSecret in authentik-cloudflare-access-oidc.yaml, read
# through env CLOUDFLARE_ACCESS_CLIENT_* (authentik/values.yaml). Every entry
# below that needs them carries `conditions`, so nothing is created before the
# secret exists.
#
# authentik applies changes to this file by itself, on its own timer (up to
# about an hour after ArgoCD syncs it).
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints-cloudflare-access
  namespace: authentik
data:
  15-cloudflare-access-provider.yaml: |
    # Authentik Blueprint: Cloudflare Access OAuth2 Provider (confidential client)
    version: 1
    metadata:
      name: cloudflare-access-provider
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    context:
      client_id: !Env CLOUDFLARE_ACCESS_CLIENT_ID
      client_secret: !Env CLOUDFLARE_ACCESS_CLIENT_SECRET
    entries:
      # Group names in a `groups` claim, the way Grafana's and Mealie's are
      # built. The Access policy matches media-management in it.
      - model: authentik_providers_oauth2.scopemapping
        identifiers:
          name: Cloudflare Access Groups Scope
          scope_name: groups
        id: groups-scope
        attrs:
          expression: |
            return {
              "groups": [group.name for group in request.user.ak_groups.all()],
            }

      # Access's callback is on the Zero Trust team domain: <team> is
      # access_team_name in infrastructure/sites (default `integratn`).
      # RS256 (the self-signed keypair): Access verifies the id_token against
      # this provider's JWKS and does not accept HS256.
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: cloudflare-access-provider
        id: cloudflare-access-provider
        conditions:
          - !Context client_id
          - !Context client_secret
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: !Context client_id
          client_secret: !Context client_secret
          redirect_uris:
            - url: https://integratn.cloudflareaccess.com/cdn-cgi/access/callback
              matching_mode: strict
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
            - !KeyOf groups-scope
          include_claims_in_id_token: true
          issuer_mode: per_provider
          sub_mode: hashed_user_id
          access_code_validity: minutes=1
          access_token_validity: minutes=5
          refresh_token_validity: hours=12

      # Not a tile in the user's library: it is the sign-in behind two other
      # addresses, not something to open. `blank://blank` is authentik's way
      # of hiding an application there.
      - model: authentik_core.application
        identifiers:
          slug: cloudflare-access
        id: cloudflare-access-app
        conditions:
          - !Context client_id
          - !Context client_secret
        attrs:
          name: Media apps (away from home)
          provider: !KeyOf cloudflare-access-provider
          meta_launch_url: blank://blank
          meta_icon: /static/dist/assets/images/apps/sonarr.svg
          meta_description: >-
            Cloudflare Access sign-in for sonarr.integratn.tech and
            radarr.integratn.tech.
          policy_engine_mode: all

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf cloudflare-access-app
          group: !Find [authentik_core.group, [name, media-management]]
        conditions:
          - !Context client_id
          - !Context client_secret
        attrs:
          order: 0
          enabled: true
          negate: false
          timeout: 30
