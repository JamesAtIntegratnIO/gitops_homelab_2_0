name: Validate Addons

# The gate. Renders what this repo actually deploys, at the merge base and at
# the head, and compares. A version bump is reported and allowed through; a
# change to which clusters an Application targets is not.
#
# Put `addons-gate` -- and only `addons-gate` -- in the branch protection rule.
# It aggregates every job below, so splitting or adding jobs later never
# requires editing the protection rule, which is easy to forget and silently
# drops the gate.

on:
  pull_request:
    paths:
      - 'addons/**'
      - 'terraform/cluster/bootstrap/**'
      - '.gitops-gate.yaml'
      - '.gitops-gate/**'
      - 'delivery/images/gitops-gate/**'
      - '.github/workflows/validate-addons.yaml'

permissions:
  contents: read

concurrency:
  group: addons-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    name: Render (${{ matrix.ref }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: [base, head]
    steps:
      - name: Check out the head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the revision under render
        run: |
          set -euo pipefail
          if [ "${{ matrix.ref }}" = "base" ]; then
            git checkout --quiet "${{ github.event.pull_request.base.sha }}"
          fi
          git rev-parse --short HEAD

      - name: Restore the gate config at both revisions
        # The config and inventory describe how to render, not what to render.
        # The base revision may predate them, so take both from the head.
        run: |
          set -euo pipefail
          git checkout --quiet "${{ github.event.pull_request.head.sha }}" -- \
            .gitops-gate.yaml .gitops-gate delivery/images/gitops-gate

      - uses: actions/setup-go@v5
        with:
          go-version-file: delivery/images/gitops-gate/go.mod
          cache-dependency-path: delivery/images/gitops-gate/go.sum

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Build the gate
        run: go build -o /usr/local/bin/gitops-gate ./delivery/images/gitops-gate

      - name: Render
        run: gitops-gate render -repo . -out "targets-${{ matrix.ref }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: targets-${{ matrix.ref }}
          path: targets-${{ matrix.ref }}.json
          retention-days: 7

  targets-diff:
    name: Targeting diff
    runs-on: ubuntu-latest
    needs: render
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: delivery/images/gitops-gate/go.mod
          cache-dependency-path: delivery/images/gitops-gate/go.sum

      - name: Build the gate
        run: go build -o /usr/local/bin/gitops-gate ./delivery/images/gitops-gate

      - uses: actions/download-artifact@v4
        with:
          pattern: targets-*
          merge-multiple: true

      - name: Compare
        id: diff
        run: |
          set -euo pipefail
          set +e
          gitops-gate diff \
            -base targets-base.json \
            -head targets-head.json \
            -report report.md \
            -json render-diff.json
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: render-diff
          path: |
            render-diff.json
            report.md
          retention-days: 7

      - name: Fail on a blocking change
        if: steps.diff.outputs.exit != '0'
        run: |
          echo "::error::Cluster targeting changed. See the job summary."
          exit 1

  schema:
    name: Schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: delivery/images/gitops-gate/go.mod
          cache-dependency-path: delivery/images/gitops-gate/go.sum

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Install kubeconform
        run: |
          set -euo pipefail
          wget -qO- https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Build the gate
        run: go build -o /usr/local/bin/gitops-gate ./delivery/images/gitops-gate

      - name: Validate
        run: |
          set -euo pipefail
          gitops-gate validate -repo . -report schema.md
          cat schema.md >> "$GITHUB_STEP_SUMMARY"

  gate-tests:
    name: Gate unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: delivery/images/gitops-gate/go.mod
          cache-dependency-path: delivery/images/gitops-gate/go.sum
      - name: Test
        working-directory: delivery/images/gitops-gate
        run: |
          go vet ./...
          go test ./...

  addons-gate:
    name: addons-gate
    runs-on: ubuntu-latest
    needs: [targets-diff, schema, gate-tests]
    if: always()
    steps:
      - name: Aggregate
        run: |
          set -euo pipefail
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::A gate job did not succeed ($r)."
              exit 1
            fi
          done
          echo "gate is green"
