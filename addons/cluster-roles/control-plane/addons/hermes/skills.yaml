# Hermes skills for the cluster Hermes runs on, owned by git.
#
# Each key is one file. The Deployment mounts each with subPath under
# /opt/hermes-skills/homelab/<skill>/SKILL.md, and config.yaml's
# skills.external_dirs points Hermes at /opt/hermes-skills. They are read-only
# in the pod, so the agent cannot rewrite them; skills it writes itself go to
# /opt/data/skills and are scanned (skills.guard_agent_created).
#
# Why subPath and not a plain ConfigMap volume: a ConfigMap volume holds hidden
# ..data/..<timestamp> directories of symlinks, and Hermes walks skill dirs with
# followlinks=True without excluding them, so every skill would be found twice.
# subPath files do not update in place; the pod picks up changes on restart,
# like config.yaml.
#
# Derived from .claude/skills/cluster-triage/SKILL.md and
# docs/okf/cluster/known-issues.md, rewritten for the tools Hermes actually has:
# the MCP servers (read-only mcp__kubernetes__*, mcp__grafana__*,
# mcp__argocd__*; approval-gated mcp__kubeops__* for cluster-remediate) and,
# for gitops-fix, github-mcp-hermes (mcp__github__*).
# Hermes has no repo checkout and no kubectl. gitops-fix restates the rules in
# the repo's CLAUDE.md. When those sources change, update these.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-skills
  namespace: hermes
data:
  DESCRIPTION.md: |
    ---
    description: Looking after James's homelab cluster (the-cluster) that Hermes runs on, through the in-cluster MCP servers; writes need James's approval.
    ---

  cluster-health-check.md: |
    ---
    name: cluster-health-check
    description: "Use for a health check or status report on the-cluster."
    version: 1.0.0
    author: James (gitops_homelab_2_0)
    platforms: [linux]
    metadata:
      hermes:
        tags: [Kubernetes, Homelab, Health, ArgoCD, Prometheus]
        related_skills: [cluster-triage]
    ---

    # Cluster health check

    For: "how is the cluster doing", a health check or status report, "is
    anything broken" on the-cluster or vcluster-media. A read-only sweep of
    ArgoCD, pods, nodes, etcd, storage and alerts.

    You are looking at `the-cluster`: Talos Linux, Kubernetes 1.36, three
    control-plane nodes (10.0.4.101-103) and one arm64 worker, `talos-pi5-1`
    (10.0.4.104), where you yourself run. GitOps: ArgoCD reconciles everything
    from the `main` branch of `gitops_homelab_2_0`. A tenant vcluster,
    `vcluster-media`, runs the media apps.

    You are **read-only**. You report; you do not fix. Every fix here is a git
    commit James merges. Never suggest `kubectl` edits, deletes or restarts as
    the remedy: say what is wrong, the evidence, and what change would fix it.

    ## The sweep

    Run these, then write one short report. Lead with anything broken; say
    "nothing found" for a step only after it actually returned data.

    1. **ArgoCD**: `mcp__argocd__list_applications`. List every app that is
       not `Synced` + `Healthy`, with its health message. An app `Progressing`
       for more than ~15 minutes, or `OutOfSync` with a failed operation, is a
       finding.
    2. **Pods**: `mcp__kubernetes__pods_list`. Flag pods not Running/Succeeded,
       restart counts climbing, and waiting reasons. Or by PromQL:
       `sum by (namespace, reason) (kube_pod_container_status_waiting_reason)`.
       `CreateContainerError` on a pod with an NFS volume is the stale-NFS
       pattern (see cluster-triage).
    3. **Nodes**: `mcp__kubernetes__nodes_top`, and
       `kube_node_status_condition{status="true", condition!="Ready"} == 1`
       for pressure conditions. Memory headroom on the Pi matters: you share
       it.
    4. **etcd**, the platform's known weak point (`mcp__grafana__query_prometheus`,
       datasource uid `prometheus`):
       - p99 WAL fsync per member:
         `histogram_quantile(0.99, sum by (instance, le) (rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m])))`.
         The target is 10ms. Tens of ms is this cluster's normal; sustained
         hundreds of ms is a finding.
       - leader changes in the last day:
         `sum(increase(etcd_server_leader_changes_seen_total[1d]))`.
    5. **Storage**: `kube_persistentvolumeclaim_status_phase{phase!="Bound"} == 1`,
       and volumes nearly full:
       `kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.1`.
    6. **Alerts**: `mcp__grafana__query_prometheus` with
       `ALERTS{alertstate="firing"}`, and `mcp__grafana__alerting_rules_read`
       for anything Grafana-managed. Name each firing alert and how long it has
       fired.

    ## Report shape

    - One line verdict: healthy / degraded / broken.
    - Findings, most serious first: what, where, since when, evidence (the
      query or tool and what it returned).
    - For each, the likely cause from cluster-triage if one fits, and who acts
      (almost always: a PR for James).
    - Nothing else. No restating healthy components one by one.

    ## Limits

    - A query that returns no rows is not proof of health: check the metric
      exists (`mcp__grafana__list_prometheus_metric_names`) before reporting
      "zero".
    - Green is not evidence on this platform. See cluster-triage, "the house
      style of failure".

  cluster-triage.md: |
    ---
    name: cluster-triage
    description: "Use when something on the-cluster is broken or hangs."
    version: 1.0.0
    author: James (gitops_homelab_2_0)
    platforms: [linux]
    metadata:
      hermes:
        tags: [Kubernetes, Homelab, Troubleshooting, Talos, etcd, NetworkPolicy]
        related_skills: [cluster-health-check]
    ---

    # Diagnosing the-cluster

    For: a connection that hangs, a controller restarting or losing its lease,
    pods stuck in CreateContainerError, stale responses while everything
    reports healthy, a vcluster-media restart storm, a metric that returns
    nothing.

    Read-only. Gather evidence with the MCP tools, name the cause, propose the
    fix. Fixes are git commits James merges; never offer `kubectl` mutation as
    the fix.

    ## The house style of failure here

    Nearly every incident on this platform has been an **absence nothing
    observes**, not an error. Green dashboards are not evidence. Match the
    symptom to one of these first.

    ### A hang with zero bytes → NetworkPolicy

    Not an error or a refusal: a hang. Every namespace is default-deny
    (Kyverno generates `default-deny-all`), so traffic needs **both halves**:
    egress from the caller's namespace and ingress in the target's. One-sided
    policies are the usual cause.

    - Through the gateway: the service's namespace must admit `nginx-gateway`
      **and** the gateway data plane's egress list
      (`network-policies/nginx-gateway.yaml`) must name the namespace and port.
    - A rule of `0.0.0.0/0` minus RFC1918 permits the internet and forbids every
      ClusterIP. Kargo's controller and Hermes's own internet rule are like
      that; an in-cluster target needs its own rule.
    - A ClusterIP cannot be an `ipBlock` (it is DNAT'd before policy runs):
      select namespace + pod, and the **target port**, not the Service port.
    - Cilium never matches `ipBlock` against node IPs: that needs a
      CiliumNetworkPolicy with `toEntities: [host, remote-node]` or
      `[kube-apiserver]`.

    Evidence: `mcp__kubernetes__resources_list` for `networking.k8s.io/v1`
    `NetworkPolicy` in both namespaces; compare selectors and ports.

    ### A controller drops its lease for no local reason → etcd, not the controller

    All three control-plane nodes put etcd on the same disk as the OS and
    containerd. The signature in logs is `Failed to update lock: etcdserver:
    request timed out` followed by `leaderelection lost`. Check etcd before
    blaming the controller:
    `histogram_quantile(0.99, sum by (instance, le) (rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m])))`
    and `increase(etcd_server_leader_changes_seen_total[1h])`. The real fix
    is a dedicated disk: hardware, James only. Past cause worth ruling out: a
    status write loop (one object rewritten many times a second) feeding etcd;
    look for one resource dominating `mcp__kubernetes__events_list`.

    ### vcluster-media restart storms → host DNS, not etcd-on-NFS

    Talos host DNS (169.254.116.108) stalls → CoreDNS saturates (the Talos
    Corefile does not cache cluster.local) → the vcluster syncer cannot resolve
    its etcd → every in-vcluster controller dies at once. Evidence in Loki
    (`mcp__grafana__query_loki_logs`, datasource uid `loki`):
    `{container="coredns"} |= "i/o timeout"`, compared across a crash burst and
    a quiet window.

    ### Stuck in CreateContainerError on NFS → stale handles after a Tower reset

    Tower (Unraid VM 100) serves NFS. After it resets, running pods keep stale
    handles. Deleting the pod fixes most; some node + path combinations stay
    stale until the pod moves to another node. Moving it means cordoning a
    node; use the cluster-remediate playbook (every write needs James's
    approval). **Never propose resetting, loading or backing
    up to Tower**: it is hands-off without James's explicit go-ahead. Local
    storage (local-path, emptyDir) is not an acceptable fix either.

    ### Serving stale config while every signal is green → nginx-gateway data plane

    An NGF data-plane replica that never connects to its control plane keeps
    its start-time config forever, pointing at pod IPs that no longer exist.
    Pods Ready, Gateway Programmed, app Healthy, and some requests fail.
    Evidence: the control-plane pod's logs in `nginx-gateway` should show
    `Creating connection for nginx pod` for every data-plane replica; one
    missing is the stale replica. The remedy, deleting that replica, is James's
    call.

    ### A metric that returns nothing

    Parsing is not existing. kube-state-metrics prefixes custom-resource
    metrics with `kube_customresource_` unless configured otherwise, so a
    query for `kargo_*` can match nothing while data flows. Check with
    `mcp__grafana__list_prometheus_metric_names` before concluding anything.

    ### ArgoCD stuck on an old revision

    A sync that keeps retrying pins the revision it started with and never
    re-plans, so a fix merged to main does not reach the cluster until the
    operation is terminated. `mcp__argocd__get_application` shows the
    operation's revision and retry count; compare with the latest commit.
    Terminating is James's action.

    ## Before proposing a fix

    - Name the evidence: tool, query, what came back, and when.
    - Prefer the git change (which file, roughly what) over any live action.
    - Live operational fixes (cordon, delete a stuck pod, rollout restart) go
      through cluster-remediate; each write waits for James's approval.
    - Say plainly when something needs James himself: hardware, Talos machine
      config, Tower, terminating an ArgoCD operation.

  cluster-remediate.md: |
    ---
    name: cluster-remediate
    description: "Use to fix the-cluster live: cordon, delete, restart."
    version: 1.0.0
    author: James (gitops_homelab_2_0)
    platforms: [linux]
    metadata:
      hermes:
        tags: [Kubernetes, Homelab, Remediation, NFS]
        related_skills: [cluster-triage, gitops-fix, cluster-health-check]
    ---

    # Fixing the-cluster live

    You have two write tools, both on the `kubeops` MCP server, and every call
    waits for James's approval:

    - `mcp__kubeops__pods_delete`: delete one pod. Its controller recreates it.
    - `mcp__kubeops__resources_create_or_update`: server-side apply. RBAC
      lets it change only `spec.unschedulable` on a Node and the pod template
      of a Deployment, StatefulSet or DaemonSet. Anything else is refused.

    Read with the read-only `kubernetes` server as usual.

    ## Rules

    - Only operational actions live: cordon/uncordon, delete a stuck pod,
      rollout restart. **Every config change goes through git** (gitops-fix):
      images, resources, env, replicas, NetworkPolicies, anything in a
      manifest. ArgoCD self-heal reverts live edits anyway.
    - Diagnose first (cluster-triage). Before each write, say in one line what
      you will change, why, and how you will know it worked.
    - One change at a time, verify, then the next. One node cordoned at a time.
    - Always undo what is temporary: a cordon ends with an uncordon in the
      same task, even if the fix failed. Report the node state at the end.
    - Never touch Tower (Unraid VM 100, 10.0.0.12): no reset, restart, or bulk
      I/O. Never delete pods in `kube-system`, `argocd`, `cilium` or etcd-related
      workloads unless James names the pod.
    - Never delete a vcluster's own pods (`vcluster-media-0` and friends) or
      control-plane components to "unstick" something.
    - Stop and report if the result is not what you expected. Don't escalate
      to a bigger action without James.

    ## Cordon / uncordon

    ```yaml
    apiVersion: v1
    kind: Node
    metadata: {name: talos-4kg-ymz}
    spec: {unschedulable: true}     # false to uncordon
    ```

    Never cordon a second node while one is cordoned. The cluster has three
    control-plane nodes doing all the work plus `talos-pi5-1` (arm64, tainted,
    takes only tolerating pods), so a cordoned Lenovo removes a third of the
    capacity.

    ## Rollout restart

    ```yaml
    apiVersion: apps/v1
    kind: Deployment               # or StatefulSet / DaemonSet
    metadata: {name: hermes-agent, namespace: hermes}
    spec:
      template:
        metadata:
          annotations:
            kubectl.kubernetes.io/restartedAt: "2026-11-08T15:30:00Z"   # now, RFC3339
    ```

    Then watch the new pods reach Ready with `mcp__kubernetes__pods_list_in_namespace`.

    ## Playbook: pod stuck on a stale NFS handle (after a Tower reset)

    Symptom: `CreateContainerError` / `CreateContainerConfigError` with
    `stale file handle` or `failed to prepare subPath`, and replacements keep
    landing on the same node and failing (the Kyverno cleanup policy recreates
    them about every 30 minutes).

    1. Get the current pod name and node (`pods_list_in_namespace`). Names
       change; never reuse one from an earlier message.
    2. Cordon that node.
    3. Delete the pod. For vcluster-media apps, delete the host copy in ns
       `vcluster-media` (`<pod>-x-<ns>-x-vcluster-media`); the vcluster
       recreates it.
    4. Wait until the replacement is Running on a different node (poll every
       ~15 s, up to ~3 min).
    5. Uncordon the node.
    6. If the replacement also fails on another node, the stale handle is on
       Tower's side. Stop and tell James; that is his call.

    Do two stuck apps one after the other, each with its own
    cordon -> delete -> verify -> uncordon cycle.

    ## Report

    What you changed (tool, object), what you saw afterwards, the final state
    of every node you touched, and anything left for James.

  gitops-fix.md: |
    ---
    name: gitops-fix
    description: "Use to propose a fix to the-cluster as a GitHub PR."
    version: 1.0.0
    author: James (gitops_homelab_2_0)
    platforms: [linux]
    metadata:
      hermes:
        tags: [GitOps, GitHub, ArgoCD, Kubernetes, Homelab]
        related_skills: [cluster-triage, cluster-health-check]
    ---

    # Fixing the cluster the GitOps way

    For: you have diagnosed something on the-cluster (see cluster-triage) and
    the fix is a change to the manifests. The cluster is reconciled by ArgoCD
    from `main` of `JamesAtIntegratnIO/gitops_homelab_2_0`, so a fix is a
    branch and a pull request. **James merges. You never merge, and you never
    write to `main`.** You have no tool that merges or deletes, by design.

    Tools: `mcp__github__*` (owner `JamesAtIntegratnIO`, repo
    `gitops_homelab_2_0`). Every write call asks James for approval; say in
    one line what the call does before you make it.

    ## Steps

    1. **Read the rules first.** `mcp__github__get_file_contents` on
       `CLAUDE.md` (and `AGENTS.md` if the area is unfamiliar). They win over
       anything here. Then read every file you will change, from `main`, in
       full. Never guess a file's contents.
    2. **Check nobody is on it.** `mcp__github__search_pull_requests` for open
       PRs touching the same files or problem. If one exists, report it
       instead of opening a duplicate.
    3. **Branch.** `mcp__github__create_branch` from `main`, named
       `hermes/<type>-<short-slug>` (for example
       `hermes/fix-grafana-netpol`). Never write to `main` or to a branch you
       did not create.
    4. **Change.** Smallest change that fixes the cause. One commit with
       `mcp__github__push_files` (several files) or
       `mcp__github__create_or_update_file` (one), always with
       `branch: hermes/...`. Commit message: conventional and scoped like the
       history, e.g. `fix(network-policies): let grafana-mcp reach loki`.
    5. **PR.** `mcp__github__create_pull_request`, base `main`, head your
       branch, not a draft. Body: what is wrong (symptom and evidence:
       tool, query, result, time), the cause, the change, how James can
       verify it after merge, and anything that needs his hands. End with
       "Opened by Hermes Agent".
    6. **Report** the PR link and a two-line summary. Then stop.

    ## Hard rules (from CLAUDE.md)

    - Never touch `main` directly. Never merge. Never force anything.
    - Never read, print or edit `secrets.env`. Never put a secret value in any
      file or PR: no `kind: Secret` anywhere, and especially not near
      `promises/` (the Kratix state repo is public). Credentials are
      `ExternalSecret`s against ClusterSecretStore `onepassword-store`.
    - Gateway API (`HTTPRoute`), never `Ingress`.
    - Pin images by tag and digest. Never `:latest`.
    - A Kargo-tracked pin (listed in
      `addons/cluster-roles/control-plane/addons/kargo-projects/values.yaml`)
      must stay in the first YAML document of its file, stay a scalar, and
      carry no trailing `# comment`.
    - A NetworkPolicy fix needs both halves: egress in the caller's namespace
      and ingress in the target's (and the nginx-gateway egress list for a
      service behind the gateway).
    - Addon values resolve `environments/` → `cluster-roles/` → `clusters/`
      by chart name; a change can reach vclusters too. Say so in the PR when
      unsure.
    - Do not "fix" with local storage (local-path, emptyDir) for stale NFS.
      Do not propose anything that loads, resets or backs up to Tower.
    - When the right fix is not a manifest change (hardware, Talos machine
      config, cordoning a node, terminating an ArgoCD operation), do not open
      a PR: report it for James.
    - If the change would touch more than a handful of files or you are not
      sure of the cause, report instead and ask.
