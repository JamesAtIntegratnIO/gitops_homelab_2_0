env:
  - name: CF_API_KEY
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-key
        key: CF_API_KEY
  - name: CF_API_EMAIL
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-key
        key: CF_API_EMAIL

logLevel: info

# Recovery path: publishes the DNS records every ingress hostname resolves through.
priorityClassName: platform-critical

# Default is 300s: a pod sits on a dead node for five minutes before the
# scheduler may move it, which is most of the outage for a single-replica
# component. 60s still absorbs a brief network blip. The cluster-wide version
# of this is --default-*-toleration-seconds on kube-apiserver, which needs a
# Talos machine-config change; until then it is set per workload on the
# recovery path.
tolerations:
  - key: node.kubernetes.io/not-ready
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 60
  - key: node.kubernetes.io/unreachable
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 60

domainFilters:
  - integratn.tech

provider:
  name: cloudflare

sources:
  - gateway-httproute
  - service

policy: sync
registry: txt

# Must be unique per cluster so multiple external-dns instances don't fight.
txtOwnerId: the-cluster
txtPrefix: the-cluster-

extraArgs:
  - --gateway-name=nginx-gateway

resources:
  requests:
    cpu: 100m
    memory: 100Mi
  limits:
    cpu: 500m
    memory: 500Mi
