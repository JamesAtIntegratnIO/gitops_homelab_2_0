---
# HTTPRoutes for authentik.
#
# TWO HOSTNAMES, SPLIT ON PURPOSE.
#
#   auth.cluster.integratn.tech        sign-in, the user portal, OIDC/OAuth2,
#                                      the forward-auth outpost, the API the
#                                      portal calls. LAN name.
#   auth-admin.cluster.integratn.tech  the admin interface. LAN only: never put
#                                      it on a tunnel, and the SnippetsFilter
#                                      below refuses non-private client IPs.
#
# The PUBLIC name is auth.integratn.tech, on the Cloudflare tunnel
# (IntegratnIO/infrastructure, sites). Since 2026-11-27 the tunnel sends it to
# this gateway's `tunnel` listener (plain HTTP, port 80), not straight to
# authentik, so it gets the gateway's real-client-IP handling, its access log
# (which CrowdSec reads) and the country check below. Cloudflare already
# answers 404 for /if/admin and /api/v3/admin and blocks other countries
# and CrowdSec-banned addresses; the route below does the same again.
#
# /if/admin on the first hostname redirects to the second, so the portal's
# "Admin interface" button still works from the LAN and goes nowhere from
# outside. The admin UI's API calls go to /api/v3 on whichever host it is
# served from; those endpoints need a superuser session either way.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik
  namespace: authentik
spec:
  parentRefs:
    - name: nginx-gateway
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - auth.cluster.integratn.tech
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /if/admin
      filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: auth-admin.cluster.integratn.tech
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        # HSTS for the sign-in host (not includeSubDomains: other hosts
        # under cluster.integratn.tech make their own call).
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
      backendRefs:
        - name: authentik-server
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik-admin
  namespace: authentik
spec:
  parentRefs:
    - name: nginx-gateway
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - auth-admin.cluster.integratn.tech
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.nginx.org
            kind: SnippetsFilter
            name: authentik-admin-lan-only
      backendRefs:
        - name: authentik-server
          port: 80
---
# Private client addresses only, for the admin hostname.
#
# Depends on the gateway seeing the real client IP, which it does since its
# Service moved to externalTrafficPolicy: Local (nginx-gateway-fabric
# values.yaml).
#
# Pod addresses (10.244.0.0/16) are refused FIRST: the cloudflared connectors
# are pods, so anything a tunnel ever sends here (a wildcard or catch-all
# rule) would otherwise pass as "private". Anything carrying Cloudflare's
# headers is refused too. LAN and Tailscale clients keep their real
# addresses, so they are unaffected.
apiVersion: gateway.nginx.org/v1alpha1
kind: SnippetsFilter
metadata:
  name: authentik-admin-lan-only
  namespace: authentik
spec:
  snippets:
    - context: http.server.location
      value: |
        if ($http_cf_ray) { return 403; }
        if ($http_cf_connecting_ip) { return 403; }
        # The ORIGINAL peer. Since the gateway trusts X-Forwarded-For from
        # pods (rewriteClientIP), a pod could claim a LAN address in that
        # header; refuse pods by their real address before `allow` sees the
        # rewritten one.
        if ($realip_remote_addr ~ "^10\.244\.") { return 403; }
        deny 10.244.0.0/16;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        allow 172.16.0.0/12;
        allow 100.64.0.0/10;
        deny all;
---
# auth.integratn.tech, from the Cloudflare tunnel only.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik-public
  namespace: authentik
spec:
  parentRefs:
    - name: nginx-gateway
      namespace: nginx-gateway
      sectionName: tunnel
  hostnames:
    - auth.integratn.tech
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.nginx.org
            kind: SnippetsFilter
            name: authentik-public-edge
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
      backendRefs:
        - name: authentik-server
          port: 80
---
# The gateway's half of the edge checks for auth.integratn.tech. Cloudflare
# does the same first (IntegratnIO/infrastructure, sites: WAF custom rules);
# this is the second lock, should a Cloudflare rule ever be dropped.
#
#   1. Only the tunnel: the ORIGINAL peer must be a pod (cloudflared). Anyone
#      on the LAN asking the VIP for this name gets 403.
#   2. Only through Cloudflare: Cf-Ray must be present.
#   3. US ONLY (James, 2026-11-27): Cf-Ipcountry, which Cloudflare sets from
#      the client address and overwrites if a client sends it. XX (unknown)
#      and T1 (Tor) are refused with everything else. Except the OAuth
#      back-channel paths (same exception as the Cloudflare rule). To allow a country,
#      add its ISO code here AND to allowed_countries in the infrastructure
#      repo.
#   4. The admin interface and admin API are 404, as at Cloudflare.
apiVersion: gateway.nginx.org/v1alpha1
kind: SnippetsFilter
metadata:
  name: authentik-public-edge
  namespace: authentik
spec:
  snippets:
    - context: http.server.location
      value: |
        if ($realip_remote_addr !~ "^10\.244\.") { return 403; }
        if ($http_cf_ray = "") { return 403; }
        set $edge_geo_ok 0;
        if ($http_cf_ipcountry ~ "^(US)$") { set $edge_geo_ok 1; }
        # OAuth back-channel (token, userinfo, JWKS): relying parties such as
        # Cloudflare Access call these from their own servers, in whatever
        # country. They need a client secret or token, or are public keys.
        if ($uri ~ "^/application/o/(token|userinfo)/$") { set $edge_geo_ok 1; }
        if ($uri ~ "^/application/o/[^/]+/jwks/$") { set $edge_geo_ok 1; }
        if ($edge_geo_ok = 0) { return 403; }
        if ($uri ~ "^/(if/admin|api/v3/admin)(/|$)") { return 404; }
