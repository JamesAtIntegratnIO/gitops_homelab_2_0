applicationName: tracearr
# Tracearr (https://github.com/connorgallopo/Tracearr): Plex/Jellyfin watch
# history and stream monitoring. Replaces Tautulli, which ran as a Docker
# container on Tower. Tracearr needs TimescaleDB (Postgres + the timescaledb
# and timescaledb_toolkit extensions) and Redis; the shared Postgres on
# 10.0.3.1 is plain Postgres 13 with neither, so both run here, shaped after
# upstream's own Helm chart (docker/helm/tracearr, chart 3.1.3), which the
# addon factory cannot consume directly because it lives in a git path.
extraObjects:
  # 1Password item "tracearr" (vault homelab): fields jwt-secret,
  # cookie-secret (64 hex chars each, `openssl rand -hex 32`) and db-password.
  # The DB password is only read by Postgres on its FIRST start (initdb);
  # changing it afterwards needs an ALTER ROLE inside the database too.
  # The {{` `}} escapes are for the chart, which runs extraObjects through tpl.
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: eso-tracearr-secret
      namespace: media
    spec:
      refreshInterval: 1h
      secretStoreRef:
        kind: ClusterSecretStore
        name: onepassword-store
      target:
        name: tracearr-secret
        creationPolicy: Owner
        template:
          engineVersion: v2
          data:
            JWT_SECRET: '{{`{{ .jwtSecret }}`}}'
            COOKIE_SECRET: '{{`{{ .cookieSecret }}`}}'
            POSTGRES_PASSWORD: '{{`{{ .dbPassword }}`}}'
            DATABASE_URL: '{{`postgres://tracearr:{{ .dbPassword | urlquery }}@tracearr-db:5432/tracearr`}}'
      data:
        - secretKey: jwtSecret
          remoteRef: { key: tracearr, property: jwt-secret }
        - secretKey: cookieSecret
          remoteRef: { key: tracearr, property: cookie-secret }
        - secretKey: dbPassword
          remoteRef: { key: tracearr, property: db-password }
  # Plex (32400) and Jellyfin (8096) on Tower, plus Tautulli (8181) for the
  # one-off history import. The generated allow-vcluster-external permits only
  # 53/80/443/10250 to the internet and nothing to RFC1918.
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: tracearr-allow-media-servers-egress
      namespace: media
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: tracearr
      policyTypes:
        - Egress
      egress:
        - to:
            - ipBlock:
                cidr: 10.0.0.12/32
          ports:
            - protocol: TCP
              port: 32400
            - protocol: TCP
              port: 8096
            - protocol: TCP
              port: 8181
  # One static Retain volume like the other apps' config, split by subPath:
  # db (TimescaleDB), redis (AOF) and app (Tracearr's backups + poster cache).
  # The folder /mnt/user/kube_storage/tracearr must exist on Tower before the
  # first sync (NFS cannot mount a missing path); kubelet creates the subPaths.
  - apiVersion: v1
    kind: PersistentVolume
    metadata:
      name: tracearr-data-pv
      labels:
        app: tracearr
      annotations:
        pv.kubernetes.io/provisioned-by: k8s-sigs.io/config-nfs-subdir-external-provisioner
    spec:
      accessModes:
        - ReadWriteMany
      capacity:
        storage: 20Gi
      nfs:
        path: /mnt/user/kube_storage/tracearr
        server: 10.0.0.12
      persistentVolumeReclaimPolicy: Retain
      storageClassName: config-nfs-client
      volumeMode: Filesystem
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: tracearr-data-pvc
      namespace: media
      labels:
        app: tracearr
    spec:
      storageClassName: config-nfs-client
      accessModes:
        - ReadWriteMany
      resources:
        requests:
          storage: 20Gi
      volumeName: tracearr-data-pv
  # TimescaleDB. Runs as 99:100 on purpose: Tower's export squashes every uid
  # to 99:100 (docs/okf/platform/storage.md), and Postgres refuses a data
  # directory not owned by its own uid. The image's entrypoint supports an
  # arbitrary uid through nss_wrapper (initdb needs a passwd entry).
  - apiVersion: v1
    kind: Service
    metadata:
      name: tracearr-db
      namespace: media
      labels:
        app.kubernetes.io/name: tracearr-db
    spec:
      clusterIP: None
      selector:
        app.kubernetes.io/name: tracearr-db
      ports:
        - name: postgresql
          port: 5432
          targetPort: 5432
          protocol: TCP
  - apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: tracearr-db
      namespace: media
      labels:
        app.kubernetes.io/name: tracearr-db
    spec:
      serviceName: tracearr-db
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: tracearr-db
      template:
        metadata:
          labels:
            app.kubernetes.io/name: tracearr-db
        spec:
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 60
          securityContext:
            runAsUser: 99
            runAsGroup: 100
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: timescale
              # Not Kargo-tracked: pg18.N-ts2.N.N is not semver, and a
              # Postgres major change needs a dump/restore. Bump by hand.
              image: timescale/timescaledb-ha:pg18.6-ts2.31.0@sha256:ad8b5095c9e9f19b3c97794133f1dd80f09da9566a5687f79b6208324b98a388
              imagePullPolicy: IfNotPresent
              # Upstream chart's arguments, with memory sized to this
              # hardware (4 CPU / 32 GiB nodes shared by everything).
              args:
                - postgres
                - -c
                - timescaledb.license=timescale
                - -c
                - timescaledb.max_tuples_decompressed_per_dml_transaction=100000
                - -c
                - max_locks_per_transaction=4096
                - -c
                - timescaledb.telemetry_level=off
                - -c
                - max_connections=150
                - -c
                - shared_buffers=256MB
                - -c
                - effective_cache_size=768MB
                - -c
                - work_mem=8MB
                - -c
                - maintenance_work_mem=128MB
                - -c
                - max_wal_size=1GB
                - -c
                - checkpoint_completion_target=0.9
              ports:
                - name: postgresql
                  containerPort: 5432
                  protocol: TCP
              env:
                - name: POSTGRES_USER
                  value: tracearr
                - name: POSTGRES_DB
                  value: tracearr
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: tracearr-secret
                      key: POSTGRES_PASSWORD
                - name: PGDATA
                  value: /home/postgres/pgdata/data
                - name: TZ
                  value: America/Denver
              livenessProbe:
                exec:
                  command: ["pg_isready", "-U", "tracearr", "-h", "127.0.0.1"]
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 6
              readinessProbe:
                exec:
                  command: ["pg_isready", "-U", "tracearr", "-h", "127.0.0.1"]
                initialDelaySeconds: 5
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 1536Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: data
                  mountPath: /home/postgres/pgdata
                  subPath: db
                - name: dshm
                  mountPath: /dev/shm
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: tracearr-data-pvc
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 256Mi
  # Redis for Tracearr's BullMQ job queues and caches. noeviction is required
  # by BullMQ (eviction silently corrupts queues). AOF on the shared volume.
  - apiVersion: v1
    kind: Service
    metadata:
      name: tracearr-redis
      namespace: media
      labels:
        app.kubernetes.io/name: tracearr-redis
    spec:
      selector:
        app.kubernetes.io/name: tracearr-redis
      ports:
        - name: redis
          port: 6379
          targetPort: 6379
          protocol: TCP
  - apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: tracearr-redis
      namespace: media
      labels:
        app.kubernetes.io/name: tracearr-redis
    spec:
      serviceName: tracearr-redis
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: tracearr-redis
      template:
        metadata:
          labels:
            app.kubernetes.io/name: tracearr-redis
        spec:
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 30
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: redis
              # Kargo target tracearr-redis (extraObjects.7...containers.0.image).
              image: redis:8.10.3-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
              imagePullPolicy: IfNotPresent
              args:
                - redis-server
                - --appendonly
                - "yes"
                - --maxmemory
                - 192mb
                - --maxmemory-policy
                - noeviction
                - --save
                - ""
              ports:
                - name: redis
                  containerPort: 6379
                  protocol: TCP
              livenessProbe:
                exec:
                  command: ["redis-cli", "ping"]
                initialDelaySeconds: 10
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
              readinessProbe:
                exec:
                  command: ["redis-cli", "ping"]
                initialDelaySeconds: 5
                periodSeconds: 5
                timeoutSeconds: 3
                failureThreshold: 3
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: data
                  mountPath: /data
                  subPath: redis
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: tracearr-data-pvc
deployment:
  # Singleton poller: never two Tracearr processes on one database.
  strategy:
    type: Recreate
  securityContext:
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    allowPrivilegeEscalation: false
    # Upstream runs it writable; the app writes only to the mounted volumes
    # and /tmp, but that is untested, so this follows upstream.
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
  initContainers:
    wait-for-db:
      image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - 'i=0; until nc -z tracearr-db 5432 && nc -z tracearr-redis 6379; do i=$((i+1)); [ $i -ge 90 ] && exit 1; sleep 2; done'
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
  # Tag only, like the other media apps: Kargo target `tracearr` rewrites it.
  # 3.1.3 = sha256:0a3ca6dba8a7d9f89124207255f5d6580a2b89d9b9c88c408dfe0f288bb6dbf6
  image:
    repository: ghcr.io/connorgallopo/tracearr
    tag: 3.1.3
    pullPolicy: IfNotPresent
  ports:
    - name: http
      containerPort: 3000
      protocol: TCP
  env:
    NODE_ENV:
      value: production
    HOST:
      value: 0.0.0.0
    PORT:
      value: "3000"
    TZ:
      value: America/Denver
    LOG_LEVEL:
      value: info
    # Behind one proxy hop (nginx-gateway-fabric), served only at this origin.
    TRUST_PROXY:
      value: "true"
    CORS_ORIGIN:
      value: https://tracearr.vcluster-media.integratn.tech
    IMAGE_CACHE_DIR:
      value: /data/image-cache
    BACKUP_DIR:
      value: /data/backup
    REDIS_URL:
      value: redis://tracearr-redis:6379
    DATABASE_URL:
      valueFrom:
        secretKeyRef:
          name: tracearr-secret
          key: DATABASE_URL
    JWT_SECRET:
      valueFrom:
        secretKeyRef:
          name: tracearr-secret
          key: JWT_SECRET
    COOKIE_SECRET:
      valueFrom:
        secretKeyRef:
          name: tracearr-secret
          key: COOKIE_SECRET
  startupProbe:
    enabled: true
    failureThreshold: 60
    periodSeconds: 5
    timeoutSeconds: 5
    httpGet:
      path: /health
      port: http
  readinessProbe:
    enabled: true
    failureThreshold: 3
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5
    initialDelaySeconds: 5
    httpGet:
      path: /health
      port: http
  livenessProbe:
    enabled: true
    failureThreshold: 3
    periodSeconds: 30
    successThreshold: 1
    timeoutSeconds: 10
    initialDelaySeconds: 15
    httpGet:
      path: /health
      port: http
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 1Gi
  volumes:
    data:
      persistentVolumeClaim:
        claimName: tracearr-data-pvc
    tmp:
      emptyDir:
        sizeLimit: 512Mi
  # One mount, so the chart's name-keyed volumeMounts can use the shared
  # volume: backups and the poster cache both live under subPath app.
  volumeMounts:
    data:
      mountPath: /data
      subPath: app
    tmp:
      mountPath: /tmp
persistence:
  enabled: false
service:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
httpRoute:
  enabled: true
  parentRefs:
    - name: nginx-gateway
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - tracearr.vcluster-media.integratn.tech
  rules:
    - backendRefs:
        - name: tracearr
          port: 3000
      matches:
        - path:
            type: PathPrefix
            value: /
certificate:
  enabled: false
