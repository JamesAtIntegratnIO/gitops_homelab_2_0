# Mealie's database connection, from 1Password through onepassword-store.
# Fields are read by their LABELS, so renaming one in the item breaks the
# Secret that reads it. Same item layout as umami-db-connection.
#
# 1Password item "mealie-db-connection":
#   host      10.0.3.1
#   port      5432
#   text      the role name (mealie)
#   password  the role's password. Use letters and digits only: Mealie puts it
#             into a connection URL and I did not verify that it escapes
#             symbols.
#
# The database is `mealie`, owned by the role `mealie`, declared in nix_dots_2
# hosts/datacron/postgresql.nix (README.md beside this file).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie-db
  namespace: mealie
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: mealie-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        POSTGRES_SERVER: "{{ .host }}"
        POSTGRES_PORT: "{{ .port }}"
        POSTGRES_USER: "{{ .user }}"
        POSTGRES_PASSWORD: "{{ .password }}"
        POSTGRES_DB: mealie
  data:
    - secretKey: host
      remoteRef: { key: mealie-db-connection, property: host }
    - secretKey: port
      remoteRef: { key: mealie-db-connection, property: port }
    - secretKey: user
      remoteRef: { key: mealie-db-connection, property: text }
    - secretKey: password
      remoteRef: { key: mealie-db-connection, property: password }
