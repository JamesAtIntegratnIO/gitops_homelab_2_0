# PushSecrets may only CREATE new `generated-*` items in the homelab vault.
#
# Why: a reviewed PR can create a NEW random secret in 1Password without a
# value passing through git or Hermes: a Password generator plus a PushSecret
# on the store `onepassword-store` (vault `homelab`), whose Connect token has
# read and write access. ExternalSecrets then read the item back from the same
# store, like any other credential. Hermes authors one only after James says yes
# to a request (skill secret-requests, hermes/secrets-skill.yaml).
#
# Because that token can write to the whole vault, the limits are this policy:
#   - updatePolicy IfNotExists: an existing field is never overwritten. The
#     PushSecret default, Replace, would overwrite it.
#   - deletionPolicy None: deleting a PushSecret never deletes an item. Delete
#     would.
#   - secretStoreRefs only onepassword-store: no other store or provider.
#   - every remoteKey starts `generated-`: a PushSecret cannot be aimed at an
#     existing credential such as `hermes-agent`, whatever the provider does
#     with IfNotExists. A convention of this policy, not an ESO requirement:
#     drop the `data` pattern to remove it.
#
# No PushSecret exists in the cluster yet, so Enforce blocks nothing today.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-pushsecret
  annotations:
    policies.kyverno.io/title: Restrict PushSecret to create-only generated-* items
    policies.kyverno.io/category: Secrets
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      A PushSecret must target only the ClusterSecretStore onepassword-store,
      with updatePolicy IfNotExists, deletionPolicy None and remoteKeys
      starting generated-, so it can create new items and never overwrite or
      delete one.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: pushsecret-create-only
      match:
        any:
          - resources:
              kinds:
                - external-secrets.io/v1alpha1/PushSecret
      validate:
        message: >-
          A PushSecret must use updatePolicy IfNotExists, deletionPolicy None,
          secretStoreRefs of only the ClusterSecretStore onepassword-store,
          and a remoteKey starting generated- on every data entry.
        pattern:
          spec:
            updatePolicy: IfNotExists
            deletionPolicy: None
            secretStoreRefs:
              - name: onepassword-store
                kind: ClusterSecretStore
            data:
              - match:
                  remoteRef:
                    remoteKey: "generated-*"
