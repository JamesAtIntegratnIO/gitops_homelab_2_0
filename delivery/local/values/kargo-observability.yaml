# kargo-observability for the local proving ground.
#
# kube-prometheus-stack names its kube-state-metrics ServiceAccount after the
# release, so this has to match the release name used in 10-platform.sh.
kubeStateMetrics:
  namespace: monitoring
  serviceAccountName: monitoring-kube-state-metrics
  configMapName: kargo-custom-resource-state
  configMapKey: config.yaml
  rbac:
    create: true

metricPrefix: kargo

alerts:
  enabled: true
  kargoURL: http://localhost:8081
  rules:
    # Shortened `for:` windows across the board. Production waits 15m before
    # calling a promotion failure real; a demo that waits 15m shows nothing.
    promotionErrored:
      for: 1m
    promotionFailed:
      for: 1m
    verificationFailed:
      for: 1m

dashboard:
  enabled: true
  # kube-prometheus-stack's sidecar finds dashboards by this label, across all
  # namespaces (searchNamespace=ALL in 10-platform.sh).
  label: grafana_dashboard
  labelValue: "1"
  namespace: monitoring
