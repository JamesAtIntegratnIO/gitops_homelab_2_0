# The landing page. ArgoCD builds this folder with kustomize because this file
# exists, so every manifest the addon ships must be listed under resources.
#
# glance-config is generated from glance/: one key per file, and a name with a
# hash of the content (glance-config-<hash>). Kustomize rewrites the
# Deployment's reference to match, so any change to a file in glance/ is a new
# ConfigMap and rolls the pod; there is nothing to bump by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - env.yaml
  - externalsecret.yaml
  - httproute.yaml
  - snippetsfilter.yaml
configMapGenerator:
  - name: glance-config
    namespace: homepage
    # Every file in glance/, in the order glance.yml includes them.
    # preview/run.sh fails if one is missing here.
    files:
      - glance/glance.yml
      - glance/glance.css
      - glance/glance.js
      - glance/page-home.yml
      - glance/home--delivery.html
      - glance/home--firing-alerts.html
      - glance/home--hosts.html
      - glance/home--integratn-io.html
      - glance/home--status.html
      - glance/home--the-cluster.html
      - glance/page-needs-you.yml
      - glance/needs-you--needs-you.html
      - glance/page-hosts.yml
      - glance/hosts--ci-runners.html
      - glance/hosts--machines.html
      - glance/hosts--proxmox.html
      - glance/hosts--tower-array.html
      - glance/hosts--unifi.html
      - glance/page-media.yml
      - glance/media--downloading.html
      - glance/media--movies.html
      - glance/media--plex.html
      - glance/media--tv.html
      - glance/page-news.yml
