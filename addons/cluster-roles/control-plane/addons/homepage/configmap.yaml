# The landing page's whole configuration: Glance's glance.yml.
#
# `${NAME}` is substituted from the environment when Glance starts, and a name
# that is not set stops Glance from starting at all. glance-env (below) sets
# every name the page uses, the keys empty, and deployment.yaml loads it before
# the 1Password Secret, so a key missing from 1Password costs only its widget,
# which then reads "Not recorded".
#
# Styling is the IntegratnIO design system (specmarshal DESIGN.md, "The Night
# Shift Ledger"), the same tokens integratn.io and Bosun ship: dark ground,
# neutral controls, colour only on a verdict and always next to a word,
# figures in mono. Signal orange is the logo and nothing else.
apiVersion: v1
kind: ConfigMap
metadata:
  name: glance-config
  namespace: homepage
data:
  glance.yml: |
    server:
      port: 8080
      proxied: true

    branding:
      app-name: Homelab
      # The Integratn mark, as integratn.io serves it. Signal orange lives here
      # and nowhere else on the page (Brand-Only Orange).
      logo-url: https://integratn.io/favicon.svg
      favicon-url: https://integratn.io/favicon.svg
      hide-footer: true

    # The IntegratnIO design system ("The Night Shift Ledger", specmarshal
    # DESIGN.md), shared with integratn.io, Specmarshal and Bosun. Dark first;
    # colour is spent only on verdicts, primary is the neutral text colour.
    theme:
      background-color: 220 23 5     # ground #0a0c10
      primary-color: 213 60 97       # text #f3f7fc, never signal orange
      positive-color: 135 51 51      # ok #42c161
      negative-color: 355 85 72      # bad #f47983
      contrast-multiplier: 1.1
      disable-picker: true

    document:
      head: |
        <style>
          /* Brand tokens. Glance's root font-size is 10px, so 1.2rem = 12px. */
          :root {
            --ground:#0a0c10; --well:#14171d; --panel:#1d2126; --raise:#262a30; --line:#393e43;
            --text:#f3f7fc; --said:#cfd5dc; --dim:#acb2b9; --faint:#8d939a;
            --ok:#42c161; --ok-surface:#0c2b13; --ok-border:#024e1c;
            --warn:#cf9a43; --warn-surface:#2f210c; --warn-border:#553a08;
            --bad:#f47983; --bad-surface:#39191b; --bad-border:#67282e;
            --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

            --border-radius:6px;
            --widget-content-vertical-padding:12px; --widget-content-horizontal-padding:12px;
            --color-background:var(--ground);
            --color-widget-background:var(--panel);
            --color-widget-content-border:var(--line);
            --color-widget-background-highlight:var(--raise);
            --color-separator:var(--line);
            --color-popover-background:var(--well);
            --color-popover-border:var(--line);
            --color-progress-border:var(--line);
            --color-progress-value:var(--dim);
            --color-vertical-progress-value:var(--dim);
            --color-graph-gridlines:var(--raise);
            --color-primary:var(--text);
            --color-positive:var(--ok);
            --color-negative:var(--bad);
            --color-text-highlight:var(--text);
            --color-text-paragraph:var(--said);
            --color-text-base:var(--said);
            --color-text-base-muted:var(--dim);
            --color-text-subdue:var(--faint);
            --font-size-base:1.4rem; --font-size-h6:1.2rem; --font-size-h5:1.3rem;
          }
          body { font-family:var(--sans); font-size:1.4rem; line-height:1.5; font-variant-numeric:tabular-nums; }
          /* Flat: one neutral step plus a hairline, never a shadow. */
          .widget-content:not(.widget-content-frameless), .widget-content-frame { box-shadow:none !important; }
          .widget-header { font-size:1.2rem; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--dim); }
          .widget-header a, .widget-header .uppercase { color:var(--dim); }
          .nav-item { font-size:1.3rem; font-weight:600; text-transform:uppercase; letter-spacing:.06em; }
          .logo img { max-height:2.6rem; }
          code { font-family:var(--mono); font-size:1.2rem; color:var(--text); background:var(--raise); padding:0 .4rem; border-radius:6px; }
          .clock-time, .calendar-dates, .monitor-site-status-time { font-family:var(--mono); }

          /* Data Voice: every figure in mono, tabular. */
          .hl-num, .hl-big, .hl-chip .n, .hl-kv span:last-child, .hl-tag, .hl-data { font-family:var(--mono); font-variant-numeric:tabular-nums; }
          .hl-label { font-size:1.2rem; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--dim); }
          .hl-none { color:var(--dim); }

          .hl-banner { display:flex; align-items:center; gap:2.4rem; flex-wrap:wrap; }
          .hl-verdict { display:flex; align-items:center; gap:1.2rem; }
          .hl-verdict .w { font-size:2rem; font-weight:600; color:var(--text); line-height:1.2; }
          .hl-sub { margin-top:.4rem; color:var(--dim); }
          .hl-chips { display:flex; flex-wrap:wrap; gap:.8rem; margin-left:auto; }
          .hl-chip { display:flex; align-items:center; gap:.8rem; padding:.5rem 1.2rem; border-radius:999px;
                     border:1px solid var(--line); background:var(--raise); color:var(--said); }
          .hl-chip:hover { border-color:var(--dim); }
          .hl-chip .n { font-size:1.4rem; font-weight:600; color:var(--text); }
          .hl-chip .l { font-size:1.2rem; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); }
          .hl-chip.bad  { background:var(--bad-surface);  border-color:var(--bad-border); }  .hl-chip.bad .n  { color:var(--bad); }
          .hl-chip.warn { background:var(--warn-surface); border-color:var(--warn-border); } .hl-chip.warn .n { color:var(--warn); }

          /* Verdict badges: colour only next to a word. */
          .hl-tag { display:inline-block; padding:.1rem .8rem; border-radius:999px; font-size:1.2rem; font-weight:600;
                    text-transform:uppercase; letter-spacing:.05em; border:1px solid var(--line); background:var(--raise); color:var(--dim); white-space:nowrap; }
          .hl-tag.ok   { color:var(--ok);   background:var(--ok-surface);   border-color:var(--ok-border); }
          .hl-tag.warn { color:var(--warn); background:var(--warn-surface); border-color:var(--warn-border); }
          .hl-tag.bad  { color:var(--bad);  background:var(--bad-surface);  border-color:var(--bad-border); }
          .hl-ok { color:var(--ok); } .hl-warn { color:var(--warn); } .hl-bad { color:var(--bad); }

          /* Callout: a 3px left rule in the verdict colour. */
          .hl-callout { border-left:3px solid var(--line); padding:.4rem 0 .4rem 1rem; color:var(--dim); }
          .hl-callout.bad { border-left-color:var(--bad); } .hl-callout.warn { border-left-color:var(--warn); } .hl-callout.ok { border-left-color:var(--ok); }

          .hl-bar { height:.6rem; border-radius:6px; background:var(--well); overflow:hidden; }
          .hl-bar > div { height:100%; border-radius:6px; background:var(--dim); }
          .hl-bar > div.hot { background:var(--bad); }
          .hl-bar > div.warm { background:var(--warn); }
          .hl-bar.limit { position:relative; overflow:visible; }
          .hl-bar.limit::after { content:""; position:absolute; left:66.7%; top:-.3rem; bottom:-.3rem; width:1px; background:var(--text); opacity:.6; }

          .hl-nodes { display:grid; grid-template-columns:repeat(auto-fit, minmax(16rem, 1fr)); gap:1.2rem; }
          .hl-node { padding:1.2rem; border-radius:6px; background:var(--well); border:1px solid var(--line); }
          .hl-node .hl-bar { background:var(--raise); }
          .hl-kv { display:flex; justify-content:space-between; align-items:baseline; gap:1rem; margin:.8rem 0 .3rem; }
          .hl-kv > span:first-child { font-size:1.2rem; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); }
          .hl-kv > span:last-child { color:var(--text); }
          .hl-spark { width:100%; height:5rem; display:block; }
          .hl-spark polyline { fill:none; stroke:var(--said); stroke-width:1.5; vector-effect:non-scaling-stroke; }
          .hl-spark polygon { fill:var(--said); opacity:.08; }
          .hl-grid2 { display:grid; grid-template-columns:1fr 1fr; gap:1.6rem; }
          .hl-big { font-size:2rem; font-weight:600; line-height:1.1; color:var(--text); }
          .hl-delta { font-family:var(--mono); font-size:1.2rem; }
          .hl-poster { width:3.4rem; height:5rem; object-fit:cover; border-radius:6px; flex-shrink:0; background:var(--raise); border:1px solid var(--line); }
          .hl-row { display:flex; justify-content:space-between; align-items:center; gap:1rem; }
          .hl-title { color:var(--text); font-weight:600; }
          /* Needs you: one item per thing to act on, the why, then where to act. */
          .hl-section { margin:1.6rem 0 .8rem; padding-top:1.2rem; border-top:1px solid var(--line); }
          .hl-section:first-child { margin-top:0; padding-top:0; border-top:none; }
          .hl-item { padding:1rem 1.2rem; border-radius:6px; background:var(--well); border:1px solid var(--line); }
          .hl-item + .hl-item { margin-top:.8rem; }
          .hl-where { font-family:var(--mono); font-size:1.2rem; color:var(--dim); margin-top:.2rem; overflow-wrap:anywhere; }
          .hl-why { margin-top:.6rem; color:var(--said); font-size:1.3rem; }
          .hl-links { display:flex; flex-wrap:wrap; gap:.6rem; margin-top:.8rem; align-items:center; }
          .hl-links a { font-size:1.2rem; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--text);
                        padding:.2rem 1rem; border-radius:999px; border:1px solid var(--line); background:var(--raise); }
          .hl-links a:hover { border-color:var(--dim); }
          .hl-links code { overflow-wrap:anywhere; }
          /* Phone: Glance's bottom bar switches columns with unlabelled dots.
             Name them, in the label voice; the chosen one gets an underline. */
          .mobile-navigation-label { max-width:none; }
          .mobile-navigation-pill, .mobile-navigation-input:checked + .mobile-navigation-pill {
            width:auto; height:auto; background:none; border-radius:0; padding:.2rem 0;
            font:600 1.2rem/1.2 var(--sans); letter-spacing:.07em; text-transform:uppercase; color:var(--dim);
            border-bottom:2px solid transparent; }
          .mobile-navigation-input:checked + .mobile-navigation-pill { color:var(--text); border-bottom-color:var(--text); }
          .mobile-navigation-label:hover > .mobile-navigation-pill { background:none; color:var(--text); }
          /* Per page: the script below copies Glance's page slug onto <html>. */
          html[data-page="home"] .mobile-navigation-input[value="0"] + .mobile-navigation-pill::after { content:"Launch"; }
          html[data-page="home"] .mobile-navigation-input[value="1"] + .mobile-navigation-pill::after { content:"Cluster"; }
          html[data-page="home"] .mobile-navigation-input[value="2"] + .mobile-navigation-pill::after { content:"Hosts"; }
          html[data-page="media"] .mobile-navigation-input[value="0"] + .mobile-navigation-pill::after { content:"Coming"; }
          html[data-page="media"] .mobile-navigation-input[value="1"] + .mobile-navigation-pill::after { content:"Now"; }
          html[data-page="needs-you"] .mobile-navigation-input[value="0"] + .mobile-navigation-pill::after { content:"Needs you"; }
          html[data-page="news"] .mobile-navigation-input[value="0"] + .mobile-navigation-pill::after { content:"Links"; }
          html[data-page="news"] .mobile-navigation-input[value="1"] + .mobile-navigation-pill::after { content:"Feeds"; }
          @media (max-width: 700px) { .hl-grid2 { grid-template-columns:1fr; } .hl-chips { margin-left:0; } }
        </style>
        <script>
          try { document.documentElement.dataset.page = pageData.slug; } catch (e) {}
          /* Needs you loads after the page, so a #section or #alert-X link would
             land before its target exists. Scroll once it appears. */
          if (location.hash.length > 1) {
            const id = location.hash.slice(1), t0 = Date.now();
            const t = setInterval(() => {
              const el = document.getElementById(id);
              if (el) { el.scrollIntoView({ block: "start" }); clearInterval(t); }
              else if (Date.now() - t0 > 10000) clearInterval(t);
            }, 150);
          }
        </script>

    pages:
      - name: Home
        width: wide
        head-widgets:
          # ── One sentence: is anything wrong? ─────────────────────────────
          - type: custom-api
            title: Status
            hide-header: true
            cache: 1m
            options:
              prom: ${PROM_URL}
              am: ${AM_URL}
            template: |
              {{ $p := concat (.Options.StringOr "prom" "") "/api/v1/query" }}
              {{/* Alerts come from Alertmanager, not Prometheus, so a silenced or
                   inhibited alert stops counting, and the figures match the
                   Needs you tab one for one. */}}
              {{ $am := newRequest (concat (.Options.StringOr "am" "") "/api/v2/alerts") | withParameter "active" "true" | withParameter "silenced" "false" | withParameter "inhibited" "false" | getResponse }}
              {{ $crit := 0 }}{{ $warn := 0 }}
              {{ if eq $am.Response.StatusCode 200 }}
                {{ range $am.JSON.Array "" }}{{ $s := .String "labels.severity" }}{{ if eq $s "critical" }}{{ $crit = add $crit 1 }}{{ else if eq $s "warning" }}{{ $warn = add $warn 1 }}{{ end }}{{ end }}
              {{ else }}
                {{ $crit = (newRequest $p | withParameter "query" `count(ALERTS{alertstate="firing",severity="critical"}) or vector(0)` | getResponse).JSON.Int "data.result.0.value.1" }}
                {{ $warn = (newRequest $p | withParameter "query" `count(ALERTS{alertstate="firing",severity="warning"}) or vector(0)` | getResponse).JSON.Int "data.result.0.value.1" }}
              {{ end }}
              {{ $apps := (newRequest $p | withParameter "query" `count(argocd_app_info{health_status!="Healthy"}) or vector(0)` | getResponse).JSON.Int "data.result.0.value.1" }}
              {{ $kargo := (newRequest $p | withParameter "query" `count(kargo_stage_last_promotion_phase{phase=~"Errored|Failed|Aborted"} == 1) or vector(0)` | getResponse).JSON.Int "data.result.0.value.1" }}
              {{/* The same stuck-pod set as Needs you; keep the two queries in step. */}}
              {{ $pods := (newRequest $p | withParameter "query" (concat "count(" `(max by (namespace, pod, reason) (kube_pod_container_status_waiting_reason{reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError|CreateContainerError"} == 1) or on (namespace, pod) label_replace(kube_pod_status_unschedulable == 1, "reason", "Unschedulable", "", "") or on (namespace, pod) max by (namespace, pod, reason) (kube_pod_container_status_waiting_reason{reason="ContainerCreating"} == 1) or on (namespace, pod) max by (namespace, pod, reason) (label_replace(kube_pod_status_phase{phase=~"Pending|Failed|Unknown"} == 1, "reason", "$1", "phase", "(.*)"))) and on (namespace, pod) (time() - kube_pod_created > 300)` ") or vector(0)") | getResponse).JSON.Int "data.result.0.value.1" }}
              {{ $ready := (newRequest $p | withParameter "query" `sum(kube_node_status_condition{condition="Ready",status="true"}) or vector(0)` | getResponse).JSON.Int "data.result.0.value.1" }}
              {{ $nodes := (newRequest $p | withParameter "query" `count(kube_node_info) or vector(0)` | getResponse).JSON.Int "data.result.0.value.1" }}
              {{ $down := sub (toFloat $nodes) (toFloat $ready) | toInt }}
              {{ $issues := add (add (toFloat $crit) (toFloat $apps)) (add (toFloat $kargo) (toFloat $down)) | toInt }}
              <div class="hl-banner">
                <div>
                  {{ if eq $nodes 0 }}
                    <div class="hl-verdict"><span class="hl-tag">Unknown</span><span class="w">Prometheus did not answer</span></div>
                    <div class="hl-sub">Nothing below is current until it does.</div>
                  {{ else if eq $issues 0 }}
                    <div class="hl-verdict"><span class="hl-tag ok">All clear</span><span class="w">the-cluster is healthy</span></div>
                    <div class="hl-sub"><span class="hl-num">{{ $ready }}/{{ $nodes }}</span> nodes ready, no critical alerts, every app healthy.</div>
                  {{ else }}
                    <div class="hl-verdict"><span class="hl-tag bad">Attention</span><span class="w"><span class="hl-num">{{ $issues }}</span> {{ if eq $issues 1 }}thing needs{{ else }}things need{{ end }} you</span></div>
                    <div class="hl-sub"><span class="hl-num">{{ $ready }}/{{ $nodes }}</span> nodes ready. The Needs you tab has each one, with what to do and where.</div>
                  {{ end }}
                </div>
                <div class="hl-chips">
                  <a class="hl-chip {{ if gt $crit 0 }}bad{{ end }}" href="/needs-you#needs-alerts"><span class="n">{{ $crit }}</span><span class="l">Critical</span></a>
                  <a class="hl-chip {{ if gt $warn 0 }}warn{{ end }}" href="/needs-you#needs-alerts"><span class="n">{{ $warn }}</span><span class="l">Warnings</span></a>
                  <a class="hl-chip {{ if gt $apps 0 }}bad{{ end }}" href="/needs-you#needs-apps"><span class="n">{{ $apps }}</span><span class="l">Apps unhealthy</span></a>
                  <a class="hl-chip {{ if gt $kargo 0 }}bad{{ end }}" href="/needs-you#needs-kargo"><span class="n">{{ $kargo }}</span><span class="l">Promotions failed</span></a>
                  <a class="hl-chip {{ if gt $pods 0 }}warn{{ end }}" href="/needs-you#needs-pods"><span class="n">{{ $pods }}</span><span class="l">Pods stuck</span></a>
                </div>
              </div>

        columns:
          # ── Left: the reference rail ───────────────────────────────────
          - size: small
            widgets:
              - type: clock
                hour-format: 12h
              - type: calendar
                first-day-of-week: sunday
              - type: monitor
                title: Reachable
                style: compact
                cache: 1m
                sites:
                  - { title: ArgoCD,         url: "https://argocd.cluster.integratn.tech",  icon: "di:argo-cd" }
                  - { title: Kargo,          url: "https://kargo.cluster.integratn.tech",   icon: "mdi:truck-cargo-container",  alt-status-codes: [302] }
                  - { title: Grafana,        url: "https://grafana.cluster.integratn.tech", icon: "di:grafana", alt-status-codes: [302] }
                  - { title: Authentik,      url: "https://auth.cluster.integratn.tech",    icon: "di:authentik", alt-status-codes: [302] }
                  - { title: Open WebUI,     url: "https://chat.cluster.integratn.tech",    icon: "di:open-webui", alt-status-codes: [302] }
                  - { title: Plex,           url: "http://10.0.0.12:32400/web", check-url: "http://10.0.0.12:32400/identity", icon: "di:plex" }
                  - { title: Home Assistant, url: "http://10.0.1.174:8123",                 icon: "di:home-assistant" }
                  - { title: Unraid,         url: "http://10.0.0.12",                       icon: "di:unraid", alt-status-codes: [302] }
                  - { title: Proxmox,        url: "https://192.168.0.10:8006",              icon: "di:proxmox", allow-insecure: true }
                  - { title: UniFi,          url: "https://192.168.0.1",                    icon: "di:unifi", allow-insecure: true }
              - type: bookmarks
                title: Launch
                groups:
                  - title: Platform
                    links:
                      - { title: ArgoCD,      url: "https://argocd.cluster.integratn.tech",      icon: "di:argo-cd" }
                      - { title: Kargo,       url: "https://kargo.cluster.integratn.tech",       icon: "mdi:truck-cargo-container" }
                      - { title: Bosun,       url: "https://bosun.cluster.integratn.tech",       icon: "mdi:ferry" }
                      - { title: Specmarshal, url: "https://specmarshal.cluster.integratn.tech", icon: "mdi:clipboard-text-outline" }
                      - { title: Authentik,   url: "https://auth.cluster.integratn.tech",        icon: "di:authentik" }
                      - { title: Trivy,       url: "https://trivy.cluster.integratn.tech",       icon: "di:trivy.png" }
                      - { title: Goldilocks,  url: "https://goldilocks.cluster.integratn.tech",  icon: "mdi:scale-balance" }
                  - title: Observe
                    links:
                      - { title: Grafana,      url: "https://grafana.cluster.integratn.tech",      icon: "di:grafana" }
                      - { title: Prometheus,   url: "https://prometheus.cluster.integratn.tech",   icon: "di:prometheus" }
                      - { title: Alertmanager, url: "https://alertmanager.cluster.integratn.tech", icon: "di:alertmanager" }
                      - { title: Hubble,       url: "https://hubble.cluster.integratn.tech",       icon: "di:cilium" }
                      - { title: Umami,        url: "https://stats.cluster.integratn.tech",        icon: "di:umami" }
                  - title: Media and house
                    links:
                      - { title: Plex,           url: "http://10.0.0.12:32400/web",                    icon: "di:plex" }
                      - { title: Sonarr,         url: "https://sonarr.vcluster-media.integratn.tech",  icon: "di:sonarr" }
                      - { title: Radarr,         url: "https://radarr.vcluster-media.integratn.tech",  icon: "di:radarr" }
                      - { title: SABnzbd,        url: "https://sabnzbd.vcluster-media.integratn.tech", icon: "di:sabnzbd" }
                      - { title: Wiki,           url: "https://wiki.vcluster-media.integratn.tech",    icon: "di:otter-wiki" }
                      - { title: Home Assistant, url: "http://10.0.1.174:8123",                        icon: "di:home-assistant" }
                      - { title: Unraid,         url: "http://10.0.0.12",                              icon: "di:unraid" }
                      - { title: Proxmox,        url: "https://192.168.0.10:8006",                     icon: "di:proxmox" }
                      - { title: UniFi,          url: "https://192.168.0.1",                           icon: "di:unifi" }
                  - title: AI
                    links:
                      - { title: Open WebUI, url: "https://chat.cluster.integratn.tech",             icon: "di:open-webui" }
                      - { title: Qdrant,     url: "https://qdrant.cluster.integratn.tech/dashboard", icon: "di:qdrant" }

          # ── Centre: the work column ────────────────────────────────────
          - size: full
            widgets:
              - type: custom-api
                title: the-cluster
                title-url: https://grafana.cluster.integratn.tech/d/homelab-overview/homelab-overview
                cache: 1m
                options:
                  prom: ${PROM_URL}
                template: |
                  {{ $p := .Options.StringOr "prom" "" }}
                  {{ $q := concat $p "/api/v1/query" }}
                  {{ $qr := concat $p "/api/v1/query_range" }}
                  {{ $start := offsetNow "-6h" | formatTime "unix" }}
                  {{ $end := now | formatTime "unix" }}
                  {{ $cpu := newRequest $q | withParameter "query" `100 * (1 - avg by (nodename) (rate(node_cpu_seconds_total{mode="idle"}[5m]) * on (instance) group_left (nodename) node_uname_info))` | getResponse }}
                  {{ $mem := newRequest $q | withParameter "query" `100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * on (instance) group_left (nodename) node_uname_info` | getResponse }}
                  {{ $temp := newRequest $q | withParameter "query" `max by (nodename) (node_hwmon_temp_celsius * on (instance) group_left (nodename) node_uname_info)` | getResponse }}
                  {{ $pods := newRequest $q | withParameter "query" `count by (node) (kube_pod_info)` | getResponse }}
                  {{ $cpuH := newRequest $qr | withParameter "query" `100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])))` | withParameter "start" $start | withParameter "end" $end | withParameter "step" "300" | getResponse }}
                  {{ $memH := newRequest $qr | withParameter "query" `100 * (1 - sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes))` | withParameter "start" $start | withParameter "end" $end | withParameter "step" "300" | getResponse }}
                  {{ $reqC := (newRequest $q | withParameter "query" `100 * sum(kube_pod_container_resource_requests{resource="cpu"} * on (namespace, pod) group_left () (max by (namespace, pod) (kube_pod_status_phase{phase=~"Running|Pending"}) == 1)) / sum(kube_node_status_allocatable{resource="cpu"})` | getResponse).JSON.Float "data.result.0.value.1" }}
                  {{ $reqM := (newRequest $q | withParameter "query" `100 * sum(kube_pod_container_resource_requests{resource="memory"} * on (namespace, pod) group_left () (max by (namespace, pod) (kube_pod_status_phase{phase=~"Running|Pending"}) == 1)) / sum(kube_node_status_allocatable{resource="memory"})` | getResponse).JSON.Float "data.result.0.value.1" }}
                  <div class="hl-grid2" style="margin-bottom:1.6rem">
                    <div>
                      {{ $last := 0.0 }}{{ range $cpuH.JSON.Array "data.result.0.values" }}{{ $last = .Float "1" }}{{ end }}
                      <div class="hl-kv"><span>CPU · 6h</span><span>{{ printf "%.0f" $last }}%</span></div>
                      <svg class="hl-spark" viewBox="0 0 72 100" preserveAspectRatio="none">
                        <polygon points="0,100 {{ range $i, $v := $cpuH.JSON.Array "data.result.0.values" }}{{ $i }},{{ sub 100 ($v.Float "1") | printf "%.1f" }} {{ end }}71,100"></polygon>
                        <polyline points="{{ range $i, $v := $cpuH.JSON.Array "data.result.0.values" }}{{ $i }},{{ sub 100 ($v.Float "1") | printf "%.1f" }} {{ end }}"></polyline>
                      </svg>
                    </div>
                    <div>
                      {{ $lastM := 0.0 }}{{ range $memH.JSON.Array "data.result.0.values" }}{{ $lastM = .Float "1" }}{{ end }}
                      <div class="hl-kv"><span>Memory · 6h</span><span>{{ printf "%.0f" $lastM }}%</span></div>
                      <svg class="hl-spark" viewBox="0 0 72 100" preserveAspectRatio="none">
                        <polygon points="0,100 {{ range $i, $v := $memH.JSON.Array "data.result.0.values" }}{{ $i }},{{ sub 100 ($v.Float "1") | printf "%.1f" }} {{ end }}71,100"></polygon>
                        <polyline points="{{ range $i, $v := $memH.JSON.Array "data.result.0.values" }}{{ $i }},{{ sub 100 ($v.Float "1") | printf "%.1f" }} {{ end }}"></polyline>
                      </svg>
                    </div>
                  </div>
                  <div class="hl-nodes">
                    {{ range $cpu.JSON.Array "data.result" }}
                      {{ $n := .String "metric.nodename" }}
                      {{ $c := .Float "value.1" }}
                      {{ $m := 0.0 }}{{ range $mem.JSON.Array "data.result" }}{{ if eq (.String "metric.nodename") $n }}{{ $m = .Float "value.1" }}{{ end }}{{ end }}
                      {{ $t := 0.0 }}{{ range $temp.JSON.Array "data.result" }}{{ if eq (.String "metric.nodename") $n }}{{ $t = .Float "value.1" }}{{ end }}{{ end }}
                      {{ $pc := 0 }}{{ range $pods.JSON.Array "data.result" }}{{ if eq (.String "metric.node") $n }}{{ $pc = .Int "value.1" }}{{ end }}{{ end }}
                      <div class="hl-node">
                        <div class="hl-row">
                          <span class="hl-title hl-data">{{ $n }}</span>
                          {{ if or (gt $c 85.0) (gt $m 85.0) (gt $t 80.0) }}<span class="hl-tag bad">Hot</span>{{ else if or (gt $c 65.0) (gt $m 70.0) }}<span class="hl-tag warn">Busy</span>{{ end }}
                        </div>
                        <div class="hl-kv"><span>CPU</span><span>{{ printf "%.0f" $c }}%</span></div>
                        <div class="hl-bar"><div class="{{ if gt $c 85.0 }}hot{{ else if gt $c 65.0 }}warm{{ end }}" style="width:{{ printf "%.0f" $c }}%"></div></div>
                        <div class="hl-kv"><span>Memory</span><span>{{ printf "%.0f" $m }}%</span></div>
                        <div class="hl-bar"><div class="{{ if gt $m 85.0 }}hot{{ else if gt $m 70.0 }}warm{{ end }}" style="width:{{ printf "%.0f" $m }}%"></div></div>
                        <div class="hl-kv"><span>Pods{{ if gt $t 0.0 }} · Temp{{ end }}</span><span>{{ $pc }}{{ if gt $t 0.0 }} · {{ printf "%.0f" $t }}°C{{ end }}</span></div>
                      </div>
                    {{ end }}
                  </div>
                  <div class="hl-grid2" style="margin-top:1.6rem">
                    <div>
                      <div class="hl-kv"><span>CPU requested</span><span>{{ if gt $reqC 66.7 }}<span class="hl-tag bad">Over N+1</span> {{ end }}{{ printf "%.0f" $reqC }}%</span></div>
                      <div class="hl-bar limit"><div class="{{ if gt $reqC 66.7 }}hot{{ else if gt $reqC 55.0 }}warm{{ end }}" style="width:{{ printf "%.0f" $reqC }}%"></div></div>
                    </div>
                    <div>
                      <div class="hl-kv"><span>Memory requested</span><span>{{ if gt $reqM 66.7 }}<span class="hl-tag bad">Over N+1</span> {{ end }}{{ printf "%.0f" $reqM }}%</span></div>
                      <div class="hl-bar limit"><div class="{{ if gt $reqM 66.7 }}hot{{ else if gt $reqM 55.0 }}warm{{ end }}" style="width:{{ printf "%.0f" $reqM }}%"></div></div>
                    </div>
                  </div>
                  <p class="size-h6 color-subdue" style="margin-top:.8rem">The tick on each bar is 67%: above it, losing one node leaves pods unschedulable.</p>

              - type: split-column
                max-columns: 2
                widgets:
                  # ── What is firing, one row per alert name ──
                  - type: custom-api
                    title: Firing alerts
                    # One row per alert name; each opens that alert on the Needs
                    # you tab (summary, object, links). Same Alertmanager set as
                    # that tab, so a silenced alert leaves both.
                    title-url: /needs-you#needs-alerts
                    cache: 1m
                    options:
                      am: ${AM_URL}
                    template: |
                      {{ $r := newRequest (concat (.Options.StringOr "am" "") "/api/v2/alerts") | withParameter "active" "true" | withParameter "silenced" "false" | withParameter "inhibited" "false" | getResponse }}
                      {{ $all := $r.JSON.Array "" }}
                      {{ $n := 0 }}{{ range $all }}{{ $s := .String "labels.severity" }}{{ if or (eq $s "critical") (eq $s "warning") (eq $s "info") }}{{ $n = add $n 1 }}{{ end }}{{ end }}
                      {{ if ne $r.Response.StatusCode 200 }}
                        <p class="hl-none">Not recorded: Alertmanager answered {{ $r.Response.Status }}.</p>
                      {{ else if eq $n 0 }}
                        <div class="hl-callout ok"><span class="hl-tag ok">Quiet</span> Nothing is firing.</div>
                      {{ else }}
                        <ul class="list list-gap-10 collapsible-container" data-collapse-after="6">
                          {{ range unique "labels.alertname" (sortByString "labels.severity" "asc" $all) }}
                            {{ $sev := .String "labels.severity" }}{{ $name := .String "labels.alertname" }}
                            {{ if or (eq $sev "critical") (eq $sev "warning") (eq $sev "info") }}
                              {{ $c := 0 }}{{ range $all }}{{ if eq (.String "labels.alertname") $name }}{{ $c = add $c 1 }}{{ end }}{{ end }}
                              <li class="hl-row">
                                <a class="color-highlight text-truncate" href="/needs-you#alert-{{ $name }}" title="{{ or (.String "annotations.summary") $name }}">{{ $name }}</a>
                                <span class="shrink-0"><span class="hl-num color-subdue">×{{ $c }}</span>
                                  <span class="hl-tag {{ if eq $sev "critical" }}bad{{ else if eq $sev "warning" }}warn{{ end }}">{{ $sev }}</span></span>
                              </li>
                            {{ end }}
                          {{ end }}
                        </ul>
                      {{ end }}

                  # ── Delivery: ArgoCD + Kargo ──
                  - type: custom-api
                    title: Delivery
                    title-url: https://argocd.cluster.integratn.tech
                    cache: 1m
                    options:
                      prom: ${PROM_URL}
                    template: |
                      {{ $q := concat (.Options.StringOr "prom" "") "/api/v1/query" }}
                      {{ $total := (newRequest $q | withParameter "query" `count(argocd_app_info) or vector(0)` | getResponse).JSON.Int "data.result.0.value.1" }}
                      {{ $bad := (newRequest $q | withParameter "query" `argocd_app_info{health_status!="Healthy"} or argocd_app_info{sync_status!="Synced"}` | getResponse).JSON.Array "data.result" }}
                      {{ $kargo := (newRequest $q | withParameter "query" `kargo_stage_last_promotion_phase{phase=~"Errored|Failed|Aborted"} == 1` | getResponse).JSON.Array "data.result" }}
                      <div class="hl-row" style="margin-bottom:1.2rem">
                        <div><div class="hl-big">{{ sub (toFloat $total) (toFloat (len $bad)) | toInt }}<span class="color-subdue">/{{ $total }}</span></div><div class="hl-label">Argo apps clean</div></div>
                        <div style="text-align:right"><div class="hl-big">{{ len $kargo }}</div><div class="hl-label">Kargo stages failed</div></div>
                      </div>
                      {{ if and (eq (len $bad) 0) (eq (len $kargo) 0) }}
                        <div class="hl-callout ok"><span class="hl-tag ok">Synced</span> Everything matches main.</div>
                      {{ end }}
                      <ul class="list list-gap-8 collapsible-container" data-collapse-after="5">
                        {{ range $bad }}
                          {{ $h := .String "metric.health_status" }}
                          <li class="hl-row">
                            <a class="color-highlight text-truncate" href="https://argocd.cluster.integratn.tech/applications/argocd/{{ .String "metric.name" }}?view=tree&resource={{ if ne $h "Healthy" }}{{ concat "health:" $h }}{{ else }}sync:OutOfSync{{ end }}" target="_blank">{{ .String "metric.name" }}</a>
                            <span class="hl-tag {{ if or (eq $h "Degraded") (eq $h "Missing") }}bad{{ else }}warn{{ end }}">{{ if ne $h "Healthy" }}{{ $h }}{{ else }}{{ .String "metric.sync_status" }}{{ end }}</span>
                          </li>
                        {{ end }}
                        {{ range $kargo }}
                          <li class="hl-row">
                            <a class="color-highlight text-truncate" href="https://kargo.cluster.integratn.tech/project/{{ .String "metric.namespace" }}/{{ with .String "metric.promotion" }}promotion/{{ . }}{{ else }}stage/{{ .String "metric.stage" }}{{ end }}" target="_blank">{{ .String "metric.namespace" }} / {{ .String "metric.stage" }}</a>
                            <span class="hl-tag bad">{{ .String "metric.phase" }}</span>
                          </li>
                        {{ end }}
                      </ul>

              # ── Umami, today so far vs the same span yesterday ──
              - type: group
                widgets:
                  - &umami
                    type: custom-api
                    title: integratn.io
                    title-url: https://stats.cluster.integratn.tech/websites/712f4369-49e3-4285-a47a-ed1534441db3
                    cache: 5m
                    options:
                      url: ${UMAMI_URL}
                      key: ${HOMEPAGE_VAR_UMAMI_KEY}
                      site: 712f4369-49e3-4285-a47a-ed1534441db3
                    template: |
                      {{ if eq (.Options.StringOr "key" "") "" }}
                        <p class="hl-none">Not recorded: add a Umami API key to 1Password item <code>homepage-secret</code> as <code>HOMEPAGE_VAR_UMAMI_KEY</code>.</p>
                      {{ else }}
                        {{ $base := concat (.Options.StringOr "url" "") "/api/websites/" (.Options.StringOr "site" "") }}
                        {{ $auth := concat "Bearer " (.Options.StringOr "key" "") }}
                        {{ $from := concat (startOfDay now | formatTime "unix") "000" }}
                        {{ $to := concat (now | formatTime "unix") "000" }}
                        {{ $s := newRequest (concat $base "/stats") | withParameter "startAt" $from | withParameter "endAt" $to | withHeader "Authorization" $auth | getResponse }}
                        {{ if ne $s.Response.StatusCode 200 }}
                          <p class="hl-none">Not recorded: Umami answered {{ $s.Response.Status }}.</p>
                        {{ else }}
                          {{ $a := newRequest (concat $base "/active") | withHeader "Authorization" $auth | getResponse }}
                          {{ $v := $s.JSON.Float "visitors" }}{{ $pv := $s.JSON.Float "comparison.visitors" }}
                          {{ $pg := $s.JSON.Float "pageviews" }}{{ $ppg := $s.JSON.Float "comparison.pageviews" }}
                          <div class="hl-row">
                            <div><div class="hl-big">{{ $a.JSON.Int "visitors" }}</div><div class="hl-label">Online now</div></div>
                            <div style="text-align:center"><div class="hl-big">{{ toInt $v | formatNumber }}</div><div class="hl-label">Visitors today</div>
                              {{ if gt $pv 0.0 }}<div class="hl-delta color-subdue">{{ percentChange $v $pv | printf "%+.0f" }}% vs yesterday</div>{{ end }}</div>
                            <div style="text-align:right"><div class="hl-big">{{ toInt $pg | formatNumber }}</div><div class="hl-label">Pageviews</div>
                              {{ if gt $ppg 0.0 }}<div class="hl-delta color-subdue">{{ percentChange $pg $ppg | printf "%+.0f" }}% vs yesterday</div>{{ end }}</div>
                          </div>
                        {{ end }}
                      {{ end }}
                  - <<: *umami
                    title: bosun.integratn.io
                    title-url: https://stats.cluster.integratn.tech/websites/a4dc99d0-79d0-46df-97d1-67a6b64a9935
                    options:
                      url: ${UMAMI_URL}
                      key: ${HOMEPAGE_VAR_UMAMI_KEY}
                      site: a4dc99d0-79d0-46df-97d1-67a6b64a9935

          # ── Right: the house and the outside world ──────────────────────
          - size: small
            widgets:
              - type: custom-api
                title: Proxmox
                title-url: https://192.168.0.10:8006
                cache: 2m
                options:
                  url: ${PVE_URL}
                  user: ${HOMEPAGE_VAR_PVE_USER}
                  pass: ${HOMEPAGE_VAR_PVE_PASS}
                template: |
                  {{ $r := newRequest (concat (.Options.StringOr "url" "") "/api2/json/cluster/resources") | withAllowInsecure true | withHeader "Authorization" (concat "PVEAPIToken=" (.Options.StringOr "user" "") "=" (.Options.StringOr "pass" "")) | getResponse }}
                  {{ if ne $r.Response.StatusCode 200 }}
                    <p class="hl-none">Not recorded: Proxmox answered {{ $r.Response.Status }}.</p>
                  {{ else }}
                    {{ $vms := 0 }}{{ $run := 0 }}
                    {{ range $r.JSON.Array "data" }}{{ if or (eq (.String "type") "qemu") (eq (.String "type") "lxc") }}{{ $vms = add (toFloat $vms) 1 | toInt }}{{ if eq (.String "status") "running" }}{{ $run = add (toFloat $run) 1 | toInt }}{{ end }}{{ end }}{{ end }}
                    {{ range $r.JSON.Array "data" }}{{ if eq (.String "type") "node" }}
                      {{ $c := mul (.Float "cpu") 100 }}{{ $m := mul (div (.Float "mem") (.Float "maxmem")) 100 }}
                      <div class="hl-row"><span class="hl-title hl-data">{{ .String "node" }}</span>
                        <span>{{ if or (gt $c 85.0) (gt $m 90.0) }}<span class="hl-tag bad">Hot</span>{{ else if or (gt $c 65.0) (gt $m 80.0) }}<span class="hl-tag warn">Busy</span>{{ end }}</span></div>
                      <div class="hl-kv"><span>Guests up</span><span>{{ $run }}/{{ $vms }}</span></div>
                      <div class="hl-kv"><span>CPU</span><span>{{ printf "%.0f" $c }}%</span></div>
                      <div class="hl-bar"><div class="{{ if gt $c 85.0 }}hot{{ else if gt $c 65.0 }}warm{{ end }}" style="width:{{ printf "%.0f" $c }}%"></div></div>
                      <div class="hl-kv"><span>Memory</span><span>{{ printf "%.0f" $m }}%</span></div>
                      <div class="hl-bar"><div class="{{ if gt $m 90.0 }}hot{{ else if gt $m 80.0 }}warm{{ end }}" style="width:{{ printf "%.0f" $m }}%"></div></div>
                    {{ end }}{{ end }}
                  {{ end }}

              - type: custom-api
                title: Tower
                title-url: http://10.0.0.12
                cache: 5m
                options:
                  url: ${UNRAID_URL}
                  key: ${HOMEPAGE_VAR_UNRAID_KEY}
                template: |
                  {{ $r := newRequest (concat (.Options.StringOr "url" "") "/graphql") | withHeader "x-api-key" (.Options.StringOr "key" "") | withHeader "Content-Type" "application/json"
                       | withStringBody `{"query":"{ array { state capacity { kilobytes { free used total } } } metrics { cpu { percentTotal } memory { percentTotal } } }"}` | getResponse }}
                  {{ if ne $r.Response.StatusCode 200 }}
                    <p class="hl-none">Not recorded: Unraid answered {{ $r.Response.Status }}.</p>
                  {{ else }}
                    {{ $used := $r.JSON.Float "data.array.capacity.kilobytes.used" }}{{ $tot := $r.JSON.Float "data.array.capacity.kilobytes.total" }}{{ $free := $r.JSON.Float "data.array.capacity.kilobytes.free" }}
                    {{ $pct := 0.0 }}{{ if gt $tot 0.0 }}{{ $pct = mul (div $used $tot) 100 }}{{ end }}
                    {{ $state := $r.JSON.String "data.array.state" }}
                    <div class="hl-row"><span class="hl-title">Unraid array</span>
                      <span class="hl-tag {{ if eq $state "STARTED" }}ok{{ else }}bad{{ end }}">{{ $state }}</span></div>
                    <div class="hl-kv"><span>Used · {{ div $free 1000000000 | printf "%.1f" }} TB free</span><span>{{ printf "%.0f" $pct }}%</span></div>
                    <div class="hl-bar"><div class="{{ if gt $pct 90.0 }}hot{{ else if gt $pct 80.0 }}warm{{ end }}" style="width:{{ printf "%.0f" $pct }}%"></div></div>
                    {{ $c := $r.JSON.Float "data.metrics.cpu.percentTotal" }}{{ $m := $r.JSON.Float "data.metrics.memory.percentTotal" }}
                    <div class="hl-kv"><span>CPU</span><span>{{ printf "%.0f" $c }}%</span></div>
                    <div class="hl-bar"><div style="width:{{ printf "%.0f" $c }}%"></div></div>
                    <div class="hl-kv"><span>Memory</span><span>{{ printf "%.0f" $m }}%</span></div>
                    <div class="hl-bar"><div style="width:{{ printf "%.0f" $m }}%"></div></div>
                  {{ end }}

              - type: releases
                title: Upstream releases
                cache: 6h
                show-source-icon: true
                collapse-after: 6
                repositories:
                  - argoproj/argo-cd
                  - akuity/kargo
                  - cilium/cilium
                  - siderolabs/talos
                  - goauthentik/authentik
                  - home-assistant/core
                  - kubernetes/kubernetes
                  - glanceapp/glance

      - name: Needs you
        slug: needs-you
        columns:
          - size: full
            widgets:
              # ── Needs you: every open item, why it is open, and where to act ──
              # Its own tab so Home stays a glance; the status chips on Home
              # link to its sections. Each item names the exact thing (the
              # alert instance, the app, the stage's promotion, the pod), says
              # what is wrong in a sentence, and links straight to it: never to
              # a whole dashboard or an unfiltered list.
              - type: custom-api
                title: Needs you
                hide-header: true
                cache: 1m
                options:
                  prom: ${PROM_URL}
                  am: ${AM_URL}
                template: |
                  {{/* One alert instance. Used for critical and warning, then info last. */}}
                  {{ define "alert" }}
                          {{ $sev := .String "labels.severity" }}
                          {{ $name := .String "labels.alertname" }}
                          {{ $ns := or (.String "labels.namespace") (.String "labels.exported_namespace") }}
                          {{ $pod := or (.String "labels.pod") (.String "labels.exported_pod") }}
                          {{ $obj := or $pod (.String "labels.deployment") (.String "labels.statefulset") (.String "labels.daemonset") (.String "labels.job_name") (.String "labels.persistentvolumeclaim") (.String "labels.stage") (.String "labels.name") (.String "labels.service") (.String "labels.instance") (.String "labels.node") }}
                          {{ $m := printf "alertname=%q" $name }}
                          {{ if ne $ns "" }}{{ $m = printf "%s,%s=%q" $m (or (and (.Exists "labels.namespace") "namespace") "exported_namespace") $ns }}{{ end }}
                          {{ if ne $pod "" }}{{ $m = printf "%s,%s=%q" $m (or (and (.Exists "labels.pod") "pod") "exported_pod") $pod }}{{ end }}
                          <div class="hl-item" id="alert-{{ $name }}">
                            <div class="hl-row">
                              <span class="hl-title">{{ or (.String "annotations.summary") $name }}</span>
                              <span class="shrink-0"><span class="size-h6 color-subdue hl-data" {{ .String "startsAt" | parseTime "RFC3339" | toRelativeTime }}></span>
                                <span class="hl-tag {{ if eq $sev "critical" }}bad{{ else if eq $sev "warning" }}warn{{ end }}">{{ $sev }}</span></span>
                            </div>
                            <div class="hl-where">{{ $name }}{{ if ne $ns "" }} · {{ $ns }}{{ end }}{{ if and (ne $obj "") (ne $obj $ns) }}/{{ $obj }}{{ end }}</div>
                            {{ with or (.String "annotations.description") (.String "annotations.message") }}<div class="hl-why">{{ . }}</div>{{ end }}
                            <div class="hl-links">
                              {{ if and (.Exists "labels.promotion") (ne $ns "") }}<a href="https://kargo.cluster.integratn.tech/project/{{ $ns }}/promotion/{{ .String "labels.promotion" }}" target="_blank">Promotion</a>{{ end }}
                              {{ with .String "annotations.kargo_url" }}<a href="{{ . }}" target="_blank">Stage</a>{{ end }}
                              {{ if and (ne (findMatch "^ArgoCD" $name) "") (.Exists "labels.name") }}<a href="https://argocd.cluster.integratn.tech/applications/argocd/{{ .String "labels.name" }}?view=tree{{ with .String "labels.health_status" }}&resource={{ concat "health:" . }}{{ end }}" target="_blank">App</a>{{ end }}
                              {{ if and (ne $ns "") (ne $pod "") }}
                                {{ $panes := printf `{"a":{"datasource":"loki","queries":[{"refId":"A","expr":%q,"datasource":{"type":"loki","uid":"loki"}}],"range":{"from":"now-1h","to":"now"}}}` (printf "{namespace=%q,pod=%q}" $ns $pod) }}
                                <a href="https://grafana.cluster.integratn.tech/explore?schemaVersion=1&orgId=1&panes={{ $panes }}" target="_blank">Pod logs</a>
                              {{ else }}{{ with .String "annotations.logs_url" }}{{ if eq (findMatch "/explore" .) "/explore" }}<a href="{{ . }}" target="_blank">Logs</a>{{ end }}{{ end }}{{ end }}
                              {{ with .String "annotations.runbook_url" }}<a href="{{ . }}" target="_blank">Runbook</a>{{ end }}
                              {{ with .String "generatorURL" }}<a href="{{ . }}" target="_blank">Query</a>{{ end }}
                              <a href="https://alertmanager.cluster.integratn.tech/#/silences/new?filter={{ printf "{%s}" $m }}" target="_blank">Silence</a>
                            </div>
                          </div>
                  {{ end }}
                  {{ $q := concat (.Options.StringOr "prom" "") "/api/v1/query" }}
                  {{ $grafana := "https://grafana.cluster.integratn.tech" }}
                  {{ $amui := "https://alertmanager.cluster.integratn.tech" }}
                  {{ $argo := "https://argocd.cluster.integratn.tech" }}
                  {{ $kargoui := "https://kargo.cluster.integratn.tech" }}
                  {{ $am := newRequest (concat (.Options.StringOr "am" "") "/api/v2/alerts") | withParameter "active" "true" | withParameter "silenced" "false" | withParameter "inhibited" "false" | getResponse }}
                  {{ $alerts := $am.JSON.Array "" }}
                  {{ $nAlerts := 0 }}{{ range $alerts }}{{ $s := .String "labels.severity" }}{{ if or (eq $s "critical") (eq $s "warning") (eq $s "info") }}{{ $nAlerts = add $nAlerts 1 }}{{ end }}{{ end }}
                  {{ $apps := (newRequest $q | withParameter "query" `argocd_app_info{health_status!="Healthy"} or argocd_app_info{sync_status!="Synced"}` | getResponse).JSON.Array "data.result" }}
                  {{ $kargo := (newRequest $q | withParameter "query" `kargo_stage_last_promotion_phase{phase=~"Errored|Failed|Aborted"} == 1` | getResponse).JSON.Array "data.result" }}
                  {{/* The same stuck-pod set as the Status chip; keep the two queries in step. */}}
                  {{ $stuckQ := `(max by (namespace, pod, reason) (kube_pod_container_status_waiting_reason{reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError|CreateContainerError"} == 1) or on (namespace, pod) label_replace(kube_pod_status_unschedulable == 1, "reason", "Unschedulable", "", "") or on (namespace, pod) max by (namespace, pod, reason) (kube_pod_container_status_waiting_reason{reason="ContainerCreating"} == 1) or on (namespace, pod) max by (namespace, pod, reason) (label_replace(kube_pod_status_phase{phase=~"Pending|Failed|Unknown"} == 1, "reason", "$1", "phase", "(.*)"))) and on (namespace, pod) (time() - kube_pod_created > 300)` }}
                  {{ $pods := (newRequest $q | withParameter "query" $stuckQ | getResponse).JSON.Array "data.result" }}
                  {{ $podInfo := (newRequest $q | withParameter "query" (concat "(label_replace(sum by (namespace, pod) (kube_pod_container_status_restarts_total), \"kind\", \"restarts\", \"\", \"\") or label_replace(time() - max by (namespace, pod) (kube_pod_created), \"kind\", \"age\", \"\", \"\")) and on (namespace, pod) (" $stuckQ ")") | getResponse).JSON.Array "data.result" }}

                  {{ if ne $am.Response.StatusCode 200 }}
                    <div class="hl-callout warn"><span class="hl-tag warn">Not recorded</span> Alertmanager answered {{ $am.Response.Status }}, so alerts are missing from this list. <a class="color-highlight" href="{{ $amui }}/#/alerts?silenced=false&inhibited=false&active=true" target="_blank">Open Alertmanager</a></div>
                  {{ else if and (eq $nAlerts 0) (eq (len $apps) 0) (eq (len $kargo) 0) (eq (len $pods) 0) }}
                    <div class="hl-callout ok"><span class="hl-tag ok">Nothing</span> No alerts firing, every app synced and healthy, no failed promotions, no stuck pods.</div>
                  {{ end }}

                  {{ if gt $nAlerts 0 }}
                    <div class="hl-section" id="needs-alerts">
                      <div class="hl-label" style="margin-bottom:.8rem">Alerts · <span class="hl-num">{{ $nAlerts }}</span> <span class="color-subdue" style="text-transform:none;letter-spacing:0;font-weight:400">silence one to take it off this list</span></div>
                      <div>
                      {{ range sortByString "labels.severity" "asc" $alerts }}{{ $sev := .String "labels.severity" }}{{ if or (eq $sev "critical") (eq $sev "warning") }}{{ template "alert" . }}{{ end }}{{ end }}
                      {{ range $alerts }}{{ if eq (.String "labels.severity") "info" }}{{ template "alert" . }}{{ end }}{{ end }}
                      </div>
                    </div>
                  {{ end }}

                  {{ if gt (len $apps) 0 }}
                    <div class="hl-section" id="needs-apps">
                      <div class="hl-label" style="margin-bottom:.8rem">Argo apps · <span class="hl-num">{{ len $apps }}</span></div>
                      <div>
                      {{ range $apps }}
                        {{ $h := .String "metric.health_status" }}{{ $sy := .String "metric.sync_status" }}
                        {{ $n := .String "metric.name" }}{{ $appns := or (.String "metric.namespace") "argocd" }}
                        <div class="hl-item">
                          <div class="hl-row">
                            <a class="hl-title" href="{{ $argo }}/applications/{{ $appns }}/{{ $n }}?view=tree&resource={{ if ne $h "Healthy" }}{{ concat "health:" $h }}{{ else }}sync:OutOfSync{{ end }}" target="_blank">{{ $n }}</a>
                            <span class="shrink-0">{{ if ne $h "Healthy" }}<span class="hl-tag {{ if or (eq $h "Degraded") (eq $h "Missing") }}bad{{ else }}warn{{ end }}">{{ $h }}</span>{{ end }}
                              {{ if ne $sy "Synced" }}<span class="hl-tag warn">{{ $sy }}</span>{{ end }}</span>
                          </div>
                          <div class="hl-where">project {{ .String "metric.project" }}{{ with .String "metric.dest_namespace" }} · into {{ . }}{{ end }}</div>
                          <div class="hl-why">
                            {{ if eq $h "Degraded" }}A workload in it is crashing or never became ready. The link opens the app filtered to the Degraded resources; open one for its events and logs.
                            {{ else if eq $h "Missing" }}Resources it should own do not exist. Usually a sync that failed before creating them; the app's conditions say why.
                            {{ else if eq $h "Progressing" }}Still rolling out. If this has lasted more than a few minutes, the filtered view shows which resource is stuck.
                            {{ else if ne $h "Healthy" }}Argo cannot assess its health. The filtered view shows which resources are {{ $h }}.
                            {{ else }}What is live differs from main. The link opens the OutOfSync resources; each one's Diff tab shows the change.{{ end }}
                          </div>
                          <div class="hl-links"><code>argocd app get {{ $n }} --show-operation</code></div>
                        </div>
                      {{ end }}
                      </div>
                    </div>
                  {{ end }}

                  {{ if gt (len $kargo) 0 }}
                    <div class="hl-section" id="needs-kargo">
                      <div class="hl-label" style="margin-bottom:.8rem">Kargo promotions · <span class="hl-num">{{ len $kargo }}</span></div>
                      <div>
                      {{ range $kargo }}
                        {{ $ph := .String "metric.phase" }}{{ $proj := .String "metric.namespace" }}{{ $st := .String "metric.stage" }}{{ $pr := .String "metric.promotion" }}
                        <div class="hl-item">
                          <div class="hl-row">
                            <a class="hl-title" href="{{ $kargoui }}/project/{{ $proj }}/stage/{{ $st }}" target="_blank">{{ $st }}</a>
                            <span class="hl-tag bad shrink-0">{{ $ph }}</span>
                          </div>
                          <div class="hl-where">project {{ $proj }}{{ if ne $pr "" }} · {{ $pr }}{{ end }}</div>
                          <div class="hl-why">
                            {{ if eq $ph "Errored" }}The last promotion into this stage could not run: a credential, a path that no longer resolves, or an infrastructure fault. The promotion shows the step and its error; fix that, then promote the freight again from the stage.
                            {{ else if eq $ph "Failed" }}The last promotion ran and was refused, usually a red check on its PR or a PR closed unmerged. The promotion shows the step; fix or close the PR, then promote again.
                            {{ else }}The last promotion was aborted. Promote the freight again from the stage, or leave it if a newer one is coming.{{ end }}
                          </div>
                          <div class="hl-links">
                            {{ if ne $pr "" }}<a href="{{ $kargoui }}/project/{{ $proj }}/promotion/{{ $pr }}" target="_blank">Promotion</a>{{ end }}
                            <a href="{{ $kargoui }}/project/{{ $proj }}/stage/{{ $st }}" target="_blank">Stage</a>
                          </div>
                        </div>
                      {{ end }}
                      </div>
                    </div>
                  {{ end }}

                  {{ if gt (len $pods) 0 }}
                    <div class="hl-section" id="needs-pods">
                      <div class="hl-label" style="margin-bottom:.8rem">Stuck pods · <span class="hl-num">{{ len $pods }}</span> <span class="color-subdue" style="text-transform:none;letter-spacing:0;font-weight:400">older than 5 minutes</span></div>
                      <div>
                      {{ range sortByString "metric.namespace" "asc" $pods }}
                        {{ $ns := .String "metric.namespace" }}{{ $pod := .String "metric.pod" }}{{ $why := .String "metric.reason" }}
                        {{ $restarts := -1 }}{{ $age := -1.0 }}
                        {{ range $podInfo }}{{ if and (eq (.String "metric.namespace") $ns) (eq (.String "metric.pod") $pod) }}{{ if eq (.String "metric.kind") "restarts" }}{{ $restarts = .Int "value.1" }}{{ else }}{{ $age = .Float "value.1" }}{{ end }}{{ end }}{{ end }}
                        {{ $panes := printf `{"a":{"datasource":"loki","queries":[{"refId":"A","expr":%q,"datasource":{"type":"loki","uid":"loki"}}],"range":{"from":"now-6h","to":"now"}}}` (printf "{namespace=%q,pod=%q}" $ns $pod) }}
                        <div class="hl-item">
                          <div class="hl-row">
                            <span class="hl-title text-truncate">{{ $pod }}</span>
                            <span class="hl-tag {{ if or (eq $why "Pending") (eq $why "ContainerCreating") }}warn{{ else }}bad{{ end }} shrink-0">{{ $why }}</span>
                          </div>
                          <div class="hl-where">{{ $ns }}{{ if ge $age 0.0 }} · up {{ if ge $age 86400.0 }}{{ div $age 86400.0 | printf "%.0f" }}d{{ else if ge $age 3600.0 }}{{ div $age 3600.0 | printf "%.0f" }}h{{ else }}{{ div $age 60.0 | printf "%.0f" }}m{{ end }}{{ end }}{{ if gt $restarts 0 }} · {{ $restarts }} restarts{{ end }}</div>
                          <div class="hl-why">
                            {{ if eq $why "CrashLoopBackOff" }}It starts and exits, over and over. The last lines of its logs say why.
                            {{ else if or (eq $why "ImagePullBackOff") (eq $why "ErrImagePull") }}Its image cannot be pulled: a wrong tag or digest, or the registry refused. Describe shows the exact image and error.
                            {{ else if eq $why "CreateContainerConfigError" }}A Secret or ConfigMap key it reads does not exist. Check that key's ExternalSecret is Ready.
                            {{ else if eq $why "CreateContainerError" }}The runtime refused to create the container. Describe shows the error.
                            {{ else if eq $why "Unschedulable" }}No node will take it: not enough requested CPU or memory left, or a selector nothing matches. Describe shows the scheduler's reason.
                            {{ else if eq $why "ContainerCreating" }}Stuck creating, usually a volume that will not mount. After a Tower restart that is a stale NFS mount; deleting the pod fixes it.
                            {{ else if eq $why "Failed" }}It exited and will not restart. Read its logs, then delete it.
                            {{ else if eq $why "Unknown" }}Its node stopped reporting on it. Check the node first.
                            {{ else }}Scheduled but not started. Describe shows what it is waiting for.{{ end }}
                          </div>
                          <div class="hl-links">
                            <a href="{{ $grafana }}/explore?schemaVersion=1&orgId=1&panes={{ $panes }}" target="_blank">Logs</a>
                            <code>kubectl -n {{ $ns }} describe pod {{ $pod }}</code>
                          </div>
                        </div>
                      {{ end }}
                      </div>
                    </div>
                  {{ end }}

      # ── Media: what is coming, what is missing, what is downloading ─────
      # Its own tab so Home stays about the platform. Each list leads with
      # what needs a hand (aired or released but not downloaded, a paused
      # queue, a failed download) and links to that title in Sonarr/Radarr.
      - name: Media
        columns:
          - size: full
            widgets:
              # ── Sonarr: one row per show, last two days to a week ahead ──
              - type: custom-api
                title: TV
                title-url: https://sonarr.vcluster-media.integratn.tech/calendar
                cache: 30m
                options:
                  url: ${SONARR_URL}
                  key: ${HOMEPAGE_VAR_SONARR_KEY}
                template: |
                  {{ $r := newRequest (concat (.Options.StringOr "url" "") "/api/v3/calendar")
                       | withParameter "start" (offsetNow "-48h" | formatTime "DateOnly")
                       | withParameter "end" (offsetNow "168h" | formatTime "DateOnly")
                       | withParameter "includeSeries" "true"
                       | withHeader "X-Api-Key" (.Options.StringOr "key" "")
                       | getResponse }}
                  {{ if ne $r.Response.StatusCode 200 }}
                    <p class="hl-none">Not recorded: Sonarr answered {{ $r.Response.Status }}.</p>
                  {{ else if eq (len ($r.JSON.Array "")) 0 }}
                    <p class="hl-none">Nothing aired in the last two days or due this week.</p>
                  {{ else }}
                    {{ $eps := sortByTime "airDateUtc" "RFC3339" "asc" ($r.JSON.Array "") }}
                    {{ $late := offsetNow "-6h" }}
                    <ul class="list list-gap-10">
                      {{ range unique "seriesId" $eps }}
                        {{ $sid := .Int "seriesId" }}
                        {{ $poster := "" }}{{ range .Array "series.images" }}{{ if and (eq $poster "") (eq (.String "coverType") "poster") }}{{ $poster = .String "remoteUrl" }}{{ end }}{{ end }}
                        {{ $got := 0 }}{{ $missing := 0 }}{{ $next := "" }}{{ $nextEp := "" }}{{ $lastGot := "" }}
                        {{ range $eps }}{{ if eq (.Int "seriesId") $sid }}
                          {{ $code := printf "S%02dE%02d" (.Int "seasonNumber") (.Int "episodeNumber") }}
                          {{ if .Bool "hasFile" }}{{ $got = add $got 1 }}{{ $lastGot = $code }}
                          {{ else if (.String "airDateUtc" | parseTime "RFC3339").Before $late }}{{ if .Bool "monitored" }}{{ $missing = add $missing 1 }}{{ end }}
                          {{ else if eq $next "" }}{{ $next = .String "airDateUtc" }}{{ $nextEp = concat $code " · " (.String "title") }}{{ end }}
                        {{ end }}{{ end }}
                        <li class="flex gap-10 items-center">
                          {{ if ne $poster "" }}<img class="hl-poster" src="{{ $poster }}" alt="" loading="lazy">{{ end }}
                          <div class="min-width-0 grow">
                            <a class="color-highlight text-truncate" style="display:block" href="https://sonarr.vcluster-media.integratn.tech/series/{{ .String "series.titleSlug" }}" target="_blank">{{ .String "series.title" }}</a>
                            <div class="size-h6 color-subdue text-truncate">
                              {{ if gt $missing 0 }}<span class="hl-num">{{ $missing }}</span> aired and not downloaded. The series page shows each episode's search.
                              {{ else if ne $next "" }}<span class="hl-data">{{ $nextEp }}</span>
                              {{ else }}{{ if eq $got 1 }}<span class="hl-data">{{ $lastGot }}</span> is in Plex.{{ else }}<span class="hl-num">{{ $got }}</span> new episodes in Plex.{{ end }}{{ end }}
                            </div>
                          </div>
                          <div class="shrink-0" style="text-align:right">
                            {{ if gt $missing 0 }}<span class="hl-tag warn">Missing</span>
                            {{ else if ne $next "" }}<span class="size-h6 color-subdue hl-data" {{ $next | parseTime "RFC3339" | toRelativeTime }}></span>
                            {{ else }}<span class="hl-tag ok">Got it</span>{{ end }}
                          </div>
                        </li>
                      {{ end }}
                    </ul>
                  {{ end }}

              # ── Radarr: what is still to come, and anything released but missing ──
              - type: custom-api
                title: Movies
                title-url: https://radarr.vcluster-media.integratn.tech/calendar
                cache: 1h
                options:
                  url: ${RADARR_URL}
                  key: ${HOMEPAGE_VAR_RADARR_KEY}
                template: |
                  {{ $r := newRequest (concat (.Options.StringOr "url" "") "/api/v3/calendar")
                       | withParameter "start" (offsetNow "-336h" | formatTime "DateOnly")
                       | withParameter "end" (offsetNow "1440h" | formatTime "DateOnly")
                       | withHeader "X-Api-Key" (.Options.StringOr "key" "")
                       | getResponse }}
                  {{ if ne $r.Response.StatusCode 200 }}
                    <p class="hl-none">Not recorded: Radarr answered {{ $r.Response.Status }}.</p>
                  {{ else }}
                    {{ $all := $r.JSON.Array "" }}
                    {{ $got := 0 }}{{ $open := 0 }}{{ range $all }}{{ if .Bool "hasFile" }}{{ $got = add $got 1 }}{{ else }}{{ $open = add $open 1 }}{{ end }}{{ end }}
                    {{ if eq $open 0 }}
                      <p class="hl-none">Nothing waiting: every film released in the last two weeks is in Plex, and none are due in the next two months.</p>
                    {{ else }}
                      <ul class="list list-gap-10">
                        {{ range $all }}{{ if not (.Bool "hasFile") }}
                          {{ $d := .String "digitalRelease" }}{{ if eq $d "" }}{{ $d = .String "physicalRelease" }}{{ end }}
                          {{ $released := and (ne $d "") (($d | parseTime "RFC3339").Before now) }}
                          {{ $poster := "" }}{{ range .Array "images" }}{{ if and (eq $poster "") (eq (.String "coverType") "poster") }}{{ $poster = .String "remoteUrl" }}{{ end }}{{ end }}
                          <li class="flex gap-10 items-center">
                            {{ if ne $poster "" }}<img class="hl-poster" src="{{ $poster }}" alt="" loading="lazy">{{ end }}
                            <div class="min-width-0 grow">
                              <a class="color-highlight text-truncate" style="display:block" href="https://radarr.vcluster-media.integratn.tech/movie/{{ .String "titleSlug" }}" target="_blank">{{ .String "title" }}</a>
                              <div class="size-h6 color-subdue">{{ if $released }}Out to buy or stream and not downloaded. The film's page has its search.{{ else if ne $d "" }}Home release{{ else }}In cinemas only so far{{ end }}</div>
                            </div>
                            <div class="shrink-0">{{ if $released }}<span class="hl-tag warn">Missing</span>{{ else if ne $d "" }}<span class="size-h6 color-subdue hl-data" {{ $d | parseTime "RFC3339" | toRelativeTime }}></span>{{ end }}</div>
                          </li>
                        {{ end }}{{ end }}
                      </ul>
                    {{ end }}
                    {{ if gt $got 0 }}<p class="size-h6 color-subdue" style="margin-top:1rem"><span class="hl-num">{{ $got }}</span> {{ if eq $got 1 }}film{{ else }}films{{ end }} arrived in the last two weeks.</p>{{ end }}
                  {{ end }}

          - size: small
            widgets:
              - type: custom-api
                title: Plex
                title-url: http://10.0.0.12:32400/web
                cache: 1m
                options:
                  url: ${PLEX_URL}
                  key: ${HOMEPAGE_VAR_PLEX_TOKEN}
                template: |
                  {{ $r := newRequest (concat (.Options.StringOr "url" "") "/status/sessions") | withHeader "X-Plex-Token" (.Options.StringOr "key" "") | withHeader "Accept" "application/json" | getResponse }}
                  {{ if eq $r.Response.StatusCode 401 }}
                    <p class="hl-none">Not recorded: the Plex token in <code>homepage-secret</code> has expired.</p>
                  {{ else if ne $r.Response.StatusCode 200 }}
                    <p class="hl-none">Not recorded: Plex answered {{ $r.Response.Status }}.</p>
                  {{ else if eq ($r.JSON.Int "MediaContainer.size") 0 }}
                    <p class="hl-none">Nothing playing.</p>
                  {{ else }}
                    <ul class="list list-gap-10">
                      {{ range $r.JSON.Array "MediaContainer.Metadata" }}
                        <li>
                          <div class="color-highlight text-truncate">{{ with .String "grandparentTitle" }}{{ . }} · {{ end }}{{ .String "title" }}</div>
                          <div class="size-h6 color-subdue">{{ .String "User.title" }} · {{ .String "Player.state" }}</div>
                        </li>
                      {{ end }}
                    </ul>
                  {{ end }}

              # ── SABnzbd: only says something when there is something to say ──
              - type: custom-api
                title: Downloading
                title-url: https://sabnzbd.vcluster-media.integratn.tech
                cache: 30s
                options:
                  url: ${SABNZBD_URL}
                  key: ${HOMEPAGE_VAR_SABNZBD_KEY}
                template: |
                  {{ $base := concat (.Options.StringOr "url" "") "/api" }}
                  {{ $key := .Options.StringOr "key" "" }}
                  {{ $r := newRequest $base | withParameter "mode" "queue" | withParameter "output" "json" | withParameter "apikey" $key | getResponse }}
                  {{ if ne $r.Response.StatusCode 200 }}
                    <p class="hl-none">Not recorded: SABnzbd answered {{ $r.Response.Status }}.</p>
                  {{ else }}
                    {{ $slots := $r.JSON.Array "queue.slots" }}
                    {{ $kb := $r.JSON.Float "queue.kbpersec" }}
                    {{ $paused := $r.JSON.Bool "queue.paused" }}
                    {{ if $paused }}
                      <div class="hl-callout warn" style="margin-bottom:1.2rem"><span class="hl-tag warn">Paused</span> {{ if gt (len $slots) 0 }}<span class="hl-num">{{ len $slots }}</span> waiting. Resume from SABnzbd's header.{{ else }}Nothing queued, but new grabs will wait. Resume from SABnzbd's header.{{ end }}</div>
                    {{ else if eq (len $slots) 0 }}
                      <p class="hl-none">Nothing downloading.</p>
                    {{ else }}
                      <div class="hl-kv"><span>{{ len $slots }} in queue</span><span>{{ if ge $kb 1024.0 }}{{ div $kb 1024 | printf "%.1f" }} MB/s{{ else }}{{ printf "%.0f" $kb }} KB/s{{ end }} · {{ $r.JSON.String "queue.timeleft" }}</span></div>
                    {{ end }}
                    <ul class="list list-gap-10 collapsible-container" data-collapse-after="4" style="margin-top:.8rem">
                      {{ range $slots }}
                        {{ $pct := .Float "percentage" }}
                        <li>
                          <div class="hl-row size-h6"><span class="text-truncate">{{ .String "filename" }}</span><span class="shrink-0 hl-num">{{ printf "%.0f" $pct }}%</span></div>
                          <div class="hl-bar" style="margin-top:.4rem"><div style="width:{{ printf "%.0f" $pct }}%"></div></div>
                        </li>
                      {{ end }}
                    </ul>
                    {{ $h := newRequest $base | withParameter "mode" "history" | withParameter "failed_only" "1" | withParameter "limit" "10" | withParameter "output" "json" | withParameter "apikey" $key | getResponse }}
                    {{ $since := offsetNow "-168h" }}
                    {{ $failed := 0 }}{{ range $h.JSON.Array "history.slots" }}{{ if (.String "completed" | parseTime "unix").After $since }}{{ $failed = add $failed 1 }}{{ end }}{{ end }}
                    {{ if gt $failed 0 }}
                      <div class="hl-label" style="margin-top:1.6rem">Failed this week · <span class="hl-num">{{ $failed }}</span></div>
                      <ul class="list list-gap-10" style="margin-top:.8rem">
                        {{ range $h.JSON.Array "history.slots" }}{{ if (.String "completed" | parseTime "unix").After $since }}
                          <li>
                            <div class="hl-row size-h6"><span class="color-highlight text-truncate">{{ .String "name" }}</span><span class="hl-tag bad shrink-0">Failed</span></div>
                            <div class="size-h6 color-subdue">{{ .String "fail_message" }}</div>
                          </li>
                        {{ end }}{{ end }}
                      </ul>
                    {{ end }}
                  {{ end }}

      - name: News
        columns:
          - size: full
            widgets:
              - type: hacker-news
                limit: 20
                collapse-after: 10
              - type: lobsters
                tags: [devops, linux, networking, go]
                limit: 15
                collapse-after: 8
          - size: small
            widgets:
              - type: rss
                title: Homelab reading
                style: vertical-list
                limit: 15
                collapse-after: 8
                feeds:
                  - url: https://kubernetes.io/feed.xml
                    title: Kubernetes
                  - url: https://www.cncf.io/feed/
                    title: CNCF
                  - url: https://selfh.st/rss/
                    title: selfh.st
---
# Where each API lives, plus an empty default for every key that comes from
# 1Password (externalsecret.yaml), which overrides it when present.
apiVersion: v1
kind: ConfigMap
metadata:
  name: glance-env
  namespace: homepage
data:
  PROM_URL: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
  AM_URL: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
  SONARR_URL: http://sonarr-x-media-x-vcluster-media.vcluster-media.svc.cluster.local:8989
  RADARR_URL: http://radarr-x-media-x-vcluster-media.vcluster-media.svc.cluster.local:7878
  SABNZBD_URL: http://sabnzbd-x-media-x-vcluster-media.vcluster-media.svc.cluster.local:8080
  UMAMI_URL: http://umami.umami.svc.cluster.local:3000
  PLEX_URL: http://10.0.0.12:32400
  PVE_URL: https://192.168.0.10:8006
  UNRAID_URL: http://10.0.0.12
  HOMEPAGE_VAR_SONARR_KEY: ""
  HOMEPAGE_VAR_RADARR_KEY: ""
  HOMEPAGE_VAR_SABNZBD_KEY: ""
  HOMEPAGE_VAR_UMAMI_KEY: ""
  HOMEPAGE_VAR_PLEX_TOKEN: ""
  HOMEPAGE_VAR_PVE_USER: ""
  HOMEPAGE_VAR_PVE_PASS: ""
  HOMEPAGE_VAR_UNRAID_KEY: ""
