# PostSync hook: makes sure grafana-mcp has a *working* Grafana service-account
# token, and repairs it when it does not.
#
# This used to skip whenever the secret merely had a key, which meant it could
# never repair a token Grafana had stopped accepting. The token issued
# 2026-05-20 was rejected with 401 for months; the Job ran, logged "already has
# key — skipping creation", and exited 0 every time. Now it validates against
# Grafana and reissues on rejection.
#
# Uses Grafana admin credentials from monitoring/grafana-admin.
# Stores the resulting SA token in mcp-system/grafana-mcp-secrets.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-grafana-mcp-sa-token
  namespace: mcp-system
  labels:
    app: grafana-mcp
  annotations:
    # PreSync, not PostSync. PostSync waits for every resource in the app to
    # report healthy first -- but grafana-mcp's readiness probe reports on the
    # Grafana connection, so it cannot go healthy while the token is rejected,
    # and the token cannot be repaired until this Job runs. That is a deadlock,
    # and it is exactly the state the app was left in on 2026-08-21: "Synced /
    # Progressing, waiting for healthy state of apps/Deployment/grafana-mcp".
    #
    # Running before the sync also means a fresh token is in place before the
    # Deployment rolls, so new pods start with a working credential instead of
    # needing a second restart.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # A Job's spec.template is immutable, so any change to this Job has to be a
    # delete-and-recreate rather than a patch. Without this, moving the hook from
    # PostSync to PreSync left the old PostSync Job in place and the app stuck
    # OutOfSync, retrying the same failing task. Same reasoning as
    # etcd-secret-writer in kube-prometheus-stack-extras.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: grafana-mcp-sa-creator
    spec:
      serviceAccountName: grafana-sa-creator
      restartPolicy: OnFailure
      containers:
        - name: create-token
          image: docker.io/alpine/k8s:1.35.8@sha256:aaeed1de1399aa816535d376c7d5c9bea905892301649ffaee0905397c7d4956
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/sh
            - -ec
            - |
              GRAFANA_URL="http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local"
              SA_NAME="mcp-readonly"
              SECRET_NAME="grafana-mcp-secrets"
              SECRET_KEY="service-account-token"
              NAMESPACE="mcp-system"

              # Helper: extract JSON value by key (simple flat objects only)
              json_val() { echo "$1" | grep -o "\"$2\":[^,}]*" | head -1 | sed 's/.*://;s/^"//;s/"$//;s/^ *//'; }

              # Is Grafana even reachable? If not, this is not our problem to fix:
              # leave the existing token alone and let the next sync retry, rather
              # than churning a new one against an API that cannot answer.
              HEALTH=$(curl -s -o /dev/null -w '%{http_code}' "$GRAFANA_URL/api/health" || echo 000)
              if [ "$HEALTH" != "200" ]; then
                echo "Grafana not reachable (/api/health -> $HEALTH) — leaving the existing token untouched"
                exit 0
              fi

              # Validate the token we already have rather than assuming a present
              # key means a working credential.
              EXISTING=$(kubectl get secret "$SECRET_NAME" -n "$NAMESPACE" -o jsonpath="{.data.$SECRET_KEY}" 2>/dev/null | base64 -d 2>/dev/null || echo "")
              if [ -n "$EXISTING" ]; then
                CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $EXISTING" "$GRAFANA_URL/api/org" || echo 000)
                if [ "$CODE" = "200" ]; then
                  echo "Existing token is accepted by Grafana (/api/org -> 200) — nothing to do"
                  exit 0
                fi
                echo "Existing token rejected by Grafana (/api/org -> $CODE) — reissuing"
              else
                echo "No token stored yet — issuing one"
              fi

              # Get Grafana admin credentials from monitoring namespace
              ADMIN_USER=$(kubectl get secret grafana-admin -n monitoring -o jsonpath='{.data.admin-user}' | base64 -d)
              ADMIN_PASS=$(kubectl get secret grafana-admin -n monitoring -o jsonpath='{.data.admin-password}' | base64 -d)

              echo "Checking if service account '$SA_NAME' exists..."
              SA_LIST=$(curl -sf -u "$ADMIN_USER:$ADMIN_PASS" "$GRAFANA_URL/api/serviceaccounts/search?query=$SA_NAME" 2>/dev/null || echo '{}')
              # Look for the SA name in results and extract its id
              SA_ID=$(echo "$SA_LIST" | grep -o "{[^}]*\"name\":\"$SA_NAME\"[^}]*}" | head -1 | grep -o '"id":[0-9]*' | head -1 | sed 's/"id"://')

              if [ -z "$SA_ID" ]; then
                echo "Creating service account '$SA_NAME'..."
                SA_RESPONSE=$(curl -sf -u "$ADMIN_USER:$ADMIN_PASS" \
                  -H "Content-Type: application/json" \
                  -X POST "$GRAFANA_URL/api/serviceaccounts" \
                  -d "{\"name\": \"$SA_NAME\", \"role\": \"Viewer\"}")
                SA_ID=$(json_val "$SA_RESPONSE" "id")
                echo "Created service account with ID: $SA_ID"
              else
                echo "Service account '$SA_NAME' already exists with ID: $SA_ID"
              fi

              if [ -z "$SA_ID" ]; then
                echo "ERROR: Could not determine service account ID"
                exit 1
              fi

              echo "Creating token for service account $SA_ID..."
              TOKEN_RESPONSE=$(curl -sf -u "$ADMIN_USER:$ADMIN_PASS" \
                -H "Content-Type: application/json" \
                -X POST "$GRAFANA_URL/api/serviceaccounts/$SA_ID/tokens" \
                -d "{\"name\": \"mcp-token-$(date +%s)\"}")
              TOKEN=$(json_val "$TOKEN_RESPONSE" "key")

              if [ -z "$TOKEN" ]; then
                echo "ERROR: Failed to create token"
                echo "Response: $TOKEN_RESPONSE"
                exit 1
              fi

              echo "Token created successfully. Storing in secret..."
              kubectl create secret generic "$SECRET_NAME" \
                --namespace "$NAMESPACE" \
                --from-literal="$SECRET_KEY=$TOKEN" \
                --dry-run=client -o yaml | kubectl apply -f -

              echo "Secret $SECRET_NAME/$SECRET_KEY updated."

              # secretKeyRef env is read once at container start, so any running
              # pod is still holding the rejected token. Delete the pods rather
              # than restarting the Deployment: the ReplicaSet recreates them
              # with the new secret and nothing git-managed is modified.
              echo "Replacing grafana-mcp pods so they pick up the new token..."
              kubectl delete pod -n "$NAMESPACE" -l app=grafana-mcp --ignore-not-found

              echo "Done."
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-sa-creator
  namespace: mcp-system
  labels:
    app: grafana-mcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-sa-creator
  namespace: mcp-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["grafana-mcp-secrets"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # A new token only reaches the container through a restart: the token is
  # injected via secretKeyRef env, which does not hot-reload. Delete the pods
  # rather than `rollout restart` -- the latter stamps an annotation into the
  # Deployment's pod template, which ArgoCD reads as drift and reverts, costing
  # a second needless rollout.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-sa-creator
  namespace: mcp-system
subjects:
  - kind: ServiceAccount
    name: grafana-sa-creator
    namespace: mcp-system
roleRef:
  kind: Role
  name: grafana-sa-creator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-sa-creator-read-admin
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["grafana-admin"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-sa-creator-read-admin
  namespace: monitoring
subjects:
  - kind: ServiceAccount
    name: grafana-sa-creator
    namespace: mcp-system
roleRef:
  kind: Role
  name: grafana-sa-creator-read-admin
  apiGroup: rbac.authorization.k8s.io
