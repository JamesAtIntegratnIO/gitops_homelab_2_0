# Kratix Values for control-plane clusters

# Disable default BucketStateStore
# Pinned. The chart is requested at "0.0.1", but Syntasso republishes 0.0.1
# under new app versions (the repo index was regenerated 2026-08-21T09:22Z with
# appVersion 1.16.0), so the version pin pins nothing: every ArgoCD sync that
# re-resolves the chart pulls whatever image that day's 0.0.1 bakes into its
# Deployment. The controller image changed twice on 2026-08-21 (02:37Z and
# 16:01Z) on ordinary syncs of unrelated values. This is the same hazard that
# moved grafana-mcp 0.14.0 -> 1.1.0 unannounced, in the platform's core
# controller.
#
# The chart renders this verbatim into the manager container's image field.
# The pipeline-adapter image (reader / work-writer / status-writer in every
# pipeline Job) is NOT controlled here: the chart hard-codes it in a ConfigMap
# (PIPELINE_ADAPTER_IMG) with no value to override, so it still tracks the
# chart. Bump both deliberately, together: update this digest, then sync with a
# hard refresh so the chart is re-pulled too.
#
# 2026-08-28: this pin is also how the pin BREAKS things, and the failure is
# not the one the paragraph above anticipated. Syntasso republished 0.0.1 at
# 11:30Z (same appVersion 1.16.0, new chart digest) with a new entrypoint:
#
#   command: [/sbin/tini, --, /manager]      # was: [/manager]
#
# `command` comes verbatim from the chart's files/deployment.yaml. The chart's
# only container override is `containerPatch`, which merges `image` and
# `resources` -- there is no value that can move `command`. So pinning the
# image alone does not freeze the container, it desynchronises it: the new
# command was rendered against the old image, which has no /sbin/tini. Every
# new pod since 20:35Z that day died with
#
#   StartError, exit 128: unable to start container process:
#   exec: "/sbin/tini": stat /sbin/tini: no such file or directory
#
# and only the 8-day-old pod from the previous ReplicaSet kept Kratix running.
# The pin must therefore track the chart's own default image, not merely be
# "some known-good digest": they are two halves of one artifact. When bumping,
# read the digest straight out of the chart and take both together:
#
#   helm pull kratix --repo https://syntasso.github.io/helm-charts \
#     --version 0.0.1 --untar --untardir /tmp/k
#   grep -n 'image:\|/sbin/tini' /tmp/k/kratix/files/deployment.yaml
#
# The durable fix is to stop consuming a mutable chart version at all -- vendor
# the chart into addons/charts/ so its content is a reviewable diff. Until then
# this pin is a tripwire that has to be re-armed by hand after every republish.
image: syntasso-community.docker.reo.dev/syntasso/kratix-platform@sha256:88809ecdb4eba20835c3ddf78c5c89dd31acdfe33ce6ebd5e01a0ceaa942a6a8

stateStores: []

# Disable default destinations
destinations: []

# Additional resources for Kratix platform setup
additionalResources:
  
  # ExternalSecret to pull GitHub App credentials from 1Password
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: kratix-github-credentials
      namespace: kratix-platform-system
    spec:
      secretStoreRef:
        name: onepassword-store
        kind: ClusterSecretStore
      target:
        name: kratix-github-credentials
        creationPolicy: Owner
      data:
        - secretKey: appID
          remoteRef:
            key: kratix-gitops-statestore
            property: AppID
        - secretKey: installationID
          remoteRef:
            key: kratix-gitops-statestore
            property: InstallID
        - secretKey: privateKey
          remoteRef:
            key: kratix-gitops-statestore
            property: PrivateKey
  
  # GitStateStore pointing to kratix-platform-state repository
  - apiVersion: platform.kratix.io/v1alpha1
    kind: GitStateStore
    metadata:
      name: default
      namespace: kratix-platform-system
    spec:
      authMethod: githubApp
      secretRef:
        name: kratix-github-credentials
        namespace: kratix-platform-system
      url: https://github.com/jamesatintegratnio/kratix-platform-state
      branch: main
      path: clusters

  # PVC for Kratix Git workspace
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: kratix-git-storage
      namespace: kratix-platform-system
    spec:
      accessModes:
        - ReadWriteMany
      resources:
        requests:
          storage: 1Gi
  
  # Destination for the-cluster workload scheduling
  - apiVersion: platform.kratix.io/v1alpha1
    kind: Destination
    metadata:
      name: the-cluster
      namespace: kratix-platform-system
      labels:
        environment: production
        cluster-role: control-plane
        capability.vcluster: "true"
    spec:
      stateStoreRef:
        name: default
        kind: GitStateStore
      path: the-cluster
      strictMatchLabels: false
  
  # ArgoCD Application to reconcile state from kratix-platform-state repo
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: kratix-state-reconciler
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      source:
        repoURL: https://github.com/jamesatintegratnio/kratix-platform-state
        targetRevision: main
        path: clusters/the-cluster
        directory:
          recurse: true
      destination:
        server: https://kubernetes.default.svc
        namespace: kratix-platform-system
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
      ignoreDifferences:
        - group: networking.k8s.io
          kind: NetworkPolicy
          name: default-deny-all
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
        - group: batch
          kind: Job
          jsonPointers:
            - /spec
            - /status
        # GatewayRoute CRD defaults sectionName/httpSectionName on admission,
        # and Kratix relabels the request with the owning promise name
        # (kratix.io/promise-name: gateway-route) while the parent http-service
        # pipeline emits its own — same label churn the ArgoCD* request kinds
        # below already ignore.
        - group: platform.integratn.tech
          kind: GatewayRoute
          jsonPointers:
            - /spec/sectionName
            - /spec/httpSectionName
            - /metadata/annotations/argocd.argoproj.io~1tracking-id
            - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
            - /metadata/labels
        - group: argoproj.io
          kind: Application
          namespace: argocd
          jsonPointers:
            - /metadata/annotations/argocd.argoproj.io~1tracking-id
            - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
        - group: argoproj.io
          kind: AppProject
          namespace: argocd
          jsonPointers:
            - /metadata/annotations/argocd.argoproj.io~1tracking-id
            - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
            - /metadata/labels
        - group: platform.integratn.tech
          kind: ArgoCDApplication
          namespace: platform-requests
          jsonPointers:
            - /metadata/annotations/argocd.argoproj.io~1tracking-id
            - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
            - /metadata/labels
        - group: platform.integratn.tech
          kind: ArgoCDProject
          namespace: platform-requests
          jsonPointers:
            - /metadata/annotations/argocd.argoproj.io~1tracking-id
            - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
            - /metadata/labels
        - group: platform.integratn.tech
          kind: ArgoCDClusterRegistration
          namespace: platform-requests
          jsonPointers:
            - /metadata/annotations/argocd.argoproj.io~1tracking-id
            - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
            - /metadata/labels

  # --- VCluster Delete Pipeline RBAC ---
  # Grant the vcluster-orchestrator-v2 delete pipeline permission to clean up
  # host-level PersistentVolumes created by the vcluster syncer.
  # These PVs are NOT in the Kratix state store and must be deleted via direct API calls.

  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: vcluster-delete-pipeline-pv-cleanup
      labels:
        app.kubernetes.io/part-of: kratix
        app.kubernetes.io/component: vcluster-orchestrator-v2
    rules:
      - apiGroups: [""]
        resources: ["persistentvolumes"]
        verbs: ["get", "list", "delete"]
      - apiGroups: [""]
        resources: ["namespaces"]
        verbs: ["get", "list", "delete"]

  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: vcluster-delete-pipeline-pv-cleanup
      labels:
        app.kubernetes.io/part-of: kratix
        app.kubernetes.io/component: vcluster-orchestrator-v2
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: vcluster-delete-pipeline-pv-cleanup
    subjects:
      - kind: ServiceAccount
        name: vcluster-orchestrator-v2-resource-delete-vco-v2-delete
        namespace: platform-requests

  # --- Pipeline Cleanup ---

  # ServiceAccount for pipeline cleanup CronJob

  # --- Kratix Observability ---

  # ServiceAccount for Prometheus to authenticate to the metrics endpoint
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: kratix-pipeline-cleanup
      namespace: platform-requests
      labels:
        app.kubernetes.io/part-of: kratix

  # Role to delete completed Jobs in platform-requests
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: kratix-pipeline-cleanup
      namespace: platform-requests
      labels:
        app.kubernetes.io/part-of: kratix
    rules:
      - apiGroups: ["batch"]
        resources: ["jobs"]
        verbs: ["list", "delete"]

  # Bind the Role to the ServiceAccount
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: kratix-pipeline-cleanup
      namespace: platform-requests
      labels:
        app.kubernetes.io/part-of: kratix
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: kratix-pipeline-cleanup
    subjects:
      - kind: ServiceAccount
        name: kratix-pipeline-cleanup
        namespace: platform-requests

  # CronJob to delete succeeded pipeline Jobs older than 24h (keeps failed Jobs)
  #
  # Rewritten 2026-08-21. The previous version ran bitnami/kubectl:latest and
  # piped kubectl into jq with no `set -o pipefail`; the CronJob reported
  # success every night while 12 eligible Jobs sat untouched, because a missing
  # tool in the pipeline is invisible to `sh -c` without pipefail. Now: the
  # repo's own pinned kubectl image (the one the Kyverno cleanup CronJobs
  # already run on), bash with -euo pipefail, and no jq -- RFC 3339 UTC
  # timestamps are fixed-width, so "older than the cutoff" is a string compare.
  - apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: kratix-pipeline-cleanup
      namespace: platform-requests
      labels:
        app.kubernetes.io/part-of: kratix
    spec:
      schedule: "0 4 * * *"
      successfulJobsHistoryLimit: 1
      failedJobsHistoryLimit: 3
      jobTemplate:
        spec:
          ttlSecondsAfterFinished: 3600
          template:
            spec:
              serviceAccountName: kratix-pipeline-cleanup
              restartPolicy: OnFailure
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              containers:
                - name: cleanup
                  image: ghcr.io/jamesatintegratnio/gitops_homelab_2_0/kubectl:v1.34.1
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop: ["ALL"]
                    readOnlyRootFilesystem: true
                  command:
                    - /bin/bash
                    - -euo
                    - pipefail
                    - -c
                    - |
                      ns=platform-requests
                      cutoff=$(date -u -d "@$(( $(date -u +%s) - 86400 ))" +%Y-%m-%dT%H:%M:%SZ)
                      [[ "$cutoff" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
                        || { echo "could not compute cutoff: '$cutoff'" >&2; exit 1; }
                      echo "Deleting succeeded pipeline Jobs in $ns that completed before $cutoff"
                      deleted=0
                      while read -r name completed; do
                        [[ -n "$name" && -n "$completed" ]] || continue
                        if [[ "$completed" < "$cutoff" ]]; then
                          echo "  delete $name (completed $completed)"
                          kubectl delete job -n "$ns" "$name" --cascade=foreground --ignore-not-found
                          deleted=$((deleted + 1))
                        fi
                      done < <(kubectl get jobs -n "$ns" \
                        -o jsonpath='{range .items[?(@.status.succeeded==1)]}{.metadata.name}{" "}{.status.completionTime}{"\n"}{end}')
                      echo "Done: $deleted Job(s) deleted"
                  resources:
                    requests:
                      cpu: 10m
                      memory: 32Mi
                    limits:
                      cpu: 100m
                      memory: 64Mi
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: kratix-metrics-reader
      namespace: kratix-platform-system
      labels:
        app.kubernetes.io/part-of: kratix

  # Secret to generate a long-lived token for the ServiceAccount
  - apiVersion: v1
    kind: Secret
    metadata:
      name: kratix-metrics-reader-token
      namespace: kratix-platform-system
      annotations:
        kubernetes.io/service-account.name: kratix-metrics-reader
    type: kubernetes.io/service-account-token

  # ClusterRole granting access to metrics endpoint via kube-rbac-proxy
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: kratix-metrics-reader
    rules:
      - nonResourceURLs: ["/metrics"]
        verbs: ["get"]

  # Bind the ServiceAccount to the ClusterRole
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: kratix-metrics-reader
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: kratix-metrics-reader
    subjects:
      - kind: ServiceAccount
        name: kratix-metrics-reader
        namespace: kratix-platform-system

  # ServiceMonitor for Kratix controller manager metrics
  - apiVersion: monitoring.coreos.com/v1
    kind: ServiceMonitor
    metadata:
      name: kratix-controller-manager
      namespace: kratix-platform-system
      labels:
        app.kubernetes.io/part-of: kratix
    spec:
      selector:
        matchLabels:
          control-plane: controller-manager
      namespaceSelector:
        matchNames:
          - kratix-platform-system
      endpoints:
        - port: https
          scheme: https
          tlsConfig:
            insecureSkipVerify: true
          bearerTokenSecret:
            name: kratix-metrics-reader-token
            key: token
          interval: 30s
          metricRelabelings:
            - action: keep
              sourceLabels: [__name__]
              regex: kratix_.*|workqueue_.*|controller_runtime_.*|process_.*|go_.*
