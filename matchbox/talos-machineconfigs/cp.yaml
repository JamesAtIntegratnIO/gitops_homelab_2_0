machine:
  kubelet:
    extraArgs:
      node-labels: "!node.kubernetes.io/exclude-from-external-load-balancers"
  network:
    interfaces:
    - deviceSelector:
        physical: true
      addresses:
        - 10.0.4.101/9
      vip:
        ip: 10.0.4.100
cluster:
  allowSchedulingOnControlPlanes: true
  apiServer:
    extraArgs:
      # Default is 300s: after a node goes away its pods sit there for five
      # minutes before the scheduler may move them. 60s is the cluster-wide
      # version of the per-workload tolerations set on the recovery-path addons,
      # and it also covers pods from charts we do not control -- vcluster-synced
      # pods, Kratix pipeline Jobs. Not lower than ~45s: below that a brief
      # network blip starts evicting pods that were never really gone.
      default-not-ready-toleration-seconds: "60"
      default-unreachable-toleration-seconds: "60"
  controllerManager:
    extraArgs:
      bind-address: "0.0.0.0"
  scheduler:
    extraArgs:
      bind-address: "0.0.0.0"
  network:
    cni:
      name: none
  proxy:
    disabled: true
  etcd:
    extraArgs:
      listen-metrics-urls: "https://0.0.0.0:2381"
