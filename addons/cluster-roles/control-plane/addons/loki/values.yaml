# Chart: grafana-community/loki (the OSS fork). The upstream grafana/loki chart
# became Grafana Enterprise Logs only at 7.0.0 -- see docs/okf/platform/observability.md.
#
# 18.x renamed the SingleBinary deployment mode to Monolithic, and ships the
# pod/container security contexts this file used to hand-write. Those blocks are
# gone on purpose: the chart resolves them with `coalesce`, so a partial override
# *replaces* the chart's hardened default rather than merging into it.
deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
    path_prefix: /var/loki
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: boltdb-shipper
        object_store: filesystem
        schema: v12
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 168h
    allow_structured_metadata: false

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: config-nfs-client
    size: 50Gi

gateway:
  enabled: true
  service:
    type: ClusterIP
  # New in 18.x and on by default: an access-log-exporter sidecar. Nothing
  # scrapes it -- there is no ServiceMonitor, and network-policies/loki.yaml
  # only admits 80/8080 into the gateway pod.
  metrics:
    enabled: false

# Still required in 18.x: templates/validate.yaml counts `.replicas` directly,
# not the deploymentMode gate, and these default to 3.
read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0
