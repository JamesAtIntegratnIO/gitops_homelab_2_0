# Garbage that looks like failure.
#
# Two incidents in the last six months were caused by leftover objects rather
# than by anything actually broken:
#   * a suspended 170-day-old VCO pipeline Job made vcluster-media report
#     "Reconciled: Failing" for five months while every pod ran fine;
#   * three Trivy scan Jobs stuck in Init:Error deadlocked the operator for 88
#     days, during which zero VulnerabilityReports were produced.
# Both were cleared by deleting the leftover and letting the owning controller
# make a new one. These policies do that on a schedule instead.
#
# The cleanup controller needs the delete permissions granted in
# kyverno-cleanup-rbac.yaml; Kyverno validates that when the policy is admitted.
#
# DeletingPolicy (policies.kyverno.io/v1) since the Kyverno 1.20 migration;
# same names, schedules and conditions as the ClusterCleanupPolicies they
# replaced.
apiVersion: policies.kyverno.io/v1
kind: DeletingPolicy
metadata:
  name: cleanup-suspended-pipeline-jobs
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    policies.kyverno.io/title: Delete suspended Kratix pipeline Jobs
    policies.kyverno.io/subject: Job
    policies.kyverno.io/description: >-
      Kratix suspends a pipeline Job rather than deleting it when a workflow is
      superseded. The kratix-pipeline-cleanup CronJob only prunes *succeeded*
      Jobs, so suspended ones accumulate and keep the request's Reconciled
      condition Failing. Anything still suspended after 24h is finished with.
spec:
  schedule: "17 * * * *"
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [platform-requests]
    resourceRules:
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: ["*"]
        resources: [jobs]
  conditions:
    - name: suspended
      expression: object.spec.?suspend.orValue(false) == true
    - name: older-than-24h
      expression: time.now() - timestamp(object.metadata.creationTimestamp) > duration("24h")
---
apiVersion: policies.kyverno.io/v1
kind: DeletingPolicy
metadata:
  name: cleanup-failed-jobs
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    policies.kyverno.io/title: Delete long-failed Jobs
    policies.kyverno.io/subject: Job
    policies.kyverno.io/description: >-
      A Job still marked failed 24h later has exhausted its backoffLimit and
      will never retry on its own. Deleting it lets the owner -- a CronJob, the
      Trivy operator, or Kratix -- create a fresh one, which is exactly the
      manual fix in docs/kratix-troubleshooting.md and the one that recovered
      Trivy. Failures stay visible through the existing alert rules; this only
      stops a dead Job from blocking its successor.
spec:
  schedule: "23 * * * *"
  matchConstraints:
    resourceRules:
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: ["*"]
        resources: [jobs]
  conditions:
    - name: failed
      expression: object.?status.?failed.orValue(0) > 0
    - name: inactive
      expression: object.?status.?active.orValue(0) == 0
    - name: older-than-24h
      expression: time.now() - timestamp(object.metadata.creationTimestamp) > duration("24h")
---
apiVersion: policies.kyverno.io/v1
kind: DeletingPolicy
metadata:
  name: cleanup-failed-pods
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    policies.kyverno.io/title: Delete Failed and Evicted Pods
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Terminal Pods (Failed phase, which covers Evicted and node-shutdown) are
      not garbage collected until the per-namespace terminated-pod threshold is
      reached. They accumulate after a node loss and make `kubectl get pods -A`
      unreadable exactly when it matters most.
spec:
  schedule: "41 * * * *"
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: ["*"]
        resources: [pods]
  conditions:
    - name: failed
      expression: object.?status.?phase.orValue('') == 'Failed'
    - name: older-than-24h
      expression: time.now() - timestamp(object.metadata.creationTimestamp) > duration("24h")
---
apiVersion: policies.kyverno.io/v1
kind: DeletingPolicy
metadata:
  name: cleanup-pods-stuck-creating-container
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    policies.kyverno.io/title: Delete Pods stuck in CreateContainerError
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Every PV here is an NFS subdirectory mount on Unraid, and those handles go
      stale server-side (mover, array or NFS restart). The kubelet keeps a pod's
      stale mount and never remounts it, so the next container start fails with
      CreateContainerError ("failed to stat ...kubernetes.io~nfs/pvc-...") or
      CreateContainerConfigError ("failed to prepare subPath") and stays there
      until someone deletes the pod -- a fresh pod gets a fresh mount. On
      2026-10-08 that was Prometheus for 21h and the Kratix controller for 18
      days. Nothing else acts on this state: the descheduler protects pods with
      PVCs and a container that never starts accumulates no restarts, and
      cleanup-failed-pods only matches phase Failed. Only pods with an owner are
      touched, so something recreates each one (vcluster-synced pods are owned
      by the vcluster Service and are recreated through the syncer). If the
      cause is not a stale mount -- a missing Secret, or the NFS server still
      down -- the replacement fails the same way and PodStuckCreatingContainer
      in platform-alerts pages; that alert counts by namespace and container
      precisely so this policy's churn cannot reset it.
spec:
  schedule: "*/15 * * * *"
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: ["*"]
        resources: [pods]
  conditions:
    - name: has-owner
      expression: size(object.metadata.?ownerReferences.orValue([])) > 0
    - name: stuck-creating
      expression: >-
        (object.?status.?initContainerStatuses.orValue([])
         + object.?status.?containerStatuses.orValue([]))
        .exists(s, s.?state.?waiting.?reason.orValue('') in
          ['CreateContainerError', 'CreateContainerConfigError'])
    # A floor, not a measure of how long it has been stuck.
    - name: older-than-15m
      expression: time.now() - timestamp(object.metadata.creationTimestamp) > duration("15m")
