# Cloudflare Turnstile keys for the reputation CAPTCHA in
# 15-reputation-gates.yaml (authentik-blueprints-configmap.yaml), read by
# authentik as env TURNSTILE_SITE_KEY / TURNSTILE_SECRET_KEY
# (authentik/values.yaml, optional).
#
# 1Password item "authentik-turnstile", fields by label:
#   site-key    Turnstile widget site key (public)
#   secret-key  Turnstile widget secret key
# Widget: Cloudflare dashboard -> Turnstile, mode Managed, hostnames
# auth.integratn.tech and auth.cluster.integratn.tech.
#
# Env vars are read at pod start: after creating or rotating the item,
# restart authentik-server and authentik-worker.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-turnstile
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: authentik-turnstile
    creationPolicy: Owner
  data:
    - secretKey: site-key
      remoteRef:
        key: authentik-turnstile
        property: site-key
    - secretKey: secret-key
      remoteRef:
        key: authentik-turnstile
        property: secret-key
