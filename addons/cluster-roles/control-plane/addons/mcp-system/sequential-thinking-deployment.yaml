apiVersion: apps/v1
kind: Deployment
metadata:
  name: sequential-thinking
  namespace: mcp-system
  labels:
    app: sequential-thinking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sequential-thinking
  template:
    metadata:
      labels:
        app: sequential-thinking
    spec:
      containers:
        - name: sequential-thinking
          # supergateway wraps the stdio MCP server and exposes it as streamable-http
          image: ghcr.io/supercorp-ai/supergateway:latest
          args:
            - --stdio
            - "npx -y @modelcontextprotocol/server-sequential-thinking"
            - --port
            - "8000"
            - --outputTransport
            - streamableHttp
            - --path
            - /mcp
            - --healthEndpoint
            - /healthz
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
