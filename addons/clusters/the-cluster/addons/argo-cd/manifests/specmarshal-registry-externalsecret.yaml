---
# ArgoCD's login to registry.integratn.io, the licensed registry the
# `specmarshal` addon's chart is pulled from. The registry takes the username
# `license` and the license key as the password.
#
# It is here rather than with the addon because an Application cannot ship the
# credential its own chart source is fetched with.
#
# `url` is the addon's `chartRepository`, character for character: that is how
# ArgoCD finds this Secret for the source. No `oci://`; `enableOCI` says it.
#
# 1Password item "specmarshal-license", field `key`. The same item feeds the
# image pull secret in the specmarshal namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: specmarshal-registry-repo
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword-store
    kind: ClusterSecretStore
  target:
    name: specmarshal-registry-repo
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
          app.kubernetes.io/part-of: argocd
      data:
        name: specmarshal-registry
        url: registry.integratn.io/integratn/charts
        type: helm
        enableOCI: "true"
        username: license
        password: "{{ .key }}"
  data:
    - secretKey: key
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: specmarshal-license
        metadataPolicy: None
        property: key
