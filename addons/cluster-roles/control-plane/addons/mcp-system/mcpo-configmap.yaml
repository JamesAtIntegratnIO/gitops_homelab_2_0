# MCPO config: MCP servers exposed as OpenAPI endpoints
# - prometheus: stdio subprocess via uvx (queries Prometheus for metrics)
# - kubernetes: remote streamable-http (connects to kubernetes-mcp service)
# - grafana: remote streamable-http (dashboards, PromQL, LogQL, alerting via Grafana)
# - github: remote streamable-http (repos, issues, PRs, actions)
# - argocd: remote streamable-http (applications, sync, resource trees)
# - fetch: stdio subprocess via uvx (fetches web pages as markdown)
# - umami: remote streamable-http, in the umami namespace (read-only web
#   analytics for integratn.io and bosun.integratn.io). Umami accepts only an
#   API key (`umami_...`), from 1Password item `umami-mcp` / `token` via
#   externalsecret-umami-mcp.yaml; the init container in mcpo-deployment.yaml
#   renders it in the way it renders ${GITHUB_TOKEN}.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcpo-config
  namespace: mcp-system
  labels:
    app: mcpo
data:
  config.json: |
    {
      "mcpServers": {
        "prometheus": {
          "command": "uvx",
          "args": ["prometheus-mcp-server"],
          "env": {
            "PROMETHEUS_URL": "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
          }
        },
        "kubernetes": {
          "type": "streamable-http",
          "url": "http://kubernetes-mcp.mcp-system.svc.cluster.local:8080/mcp"
        },
        "grafana": {
          "type": "streamable-http",
          "url": "http://grafana-mcp.mcp-system.svc.cluster.local:8000/mcp"
        },
        "github": {
          "type": "streamable-http",
          "url": "http://github-mcp.mcp-system.svc.cluster.local:8082/mcp",
          "headers": {
            "Authorization": "Bearer ${GITHUB_TOKEN}"
          }
        },
        "argocd": {
          "type": "streamable-http",
          "url": "http://argocd-mcp.mcp-system.svc.cluster.local:3000/mcp"
        },
        "fetch": {
          "command": "uvx",
          "args": ["mcp-server-fetch"]
        },
        "sequential-thinking": {
          "type": "streamable-http",
          "url": "http://sequential-thinking.mcp-system.svc.cluster.local:8000/mcp"
        },
        "umami": {
          "type": "streamable-http",
          "url": "http://umami.umami.svc.cluster.local:3000/mcp",
          "headers": {
            "Authorization": "Bearer ${UMAMI_MCP_TOKEN}"
          }
        }
      }
    }
