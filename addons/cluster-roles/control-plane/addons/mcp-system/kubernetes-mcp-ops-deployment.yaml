# kubernetes-mcp-ops Deployment + Service. Config, RBAC and the why are in
# kubernetes-mcp-ops.yaml. The image line is a Kargo pin (kubernetes-mcp
# target): keep the Deployment the first document and the line comment-free.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-mcp-ops
  namespace: mcp-system
  labels:
    app: kubernetes-mcp-ops
  annotations:
    # Stakater Reloader rolls this Deployment when its config changes, so the
    # config-revision bump below is no longer needed.
    configmap.reloader.stakater.com/reload: "kubernetes-mcp-ops-config"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes-mcp-ops
  template:
    metadata:
      labels:
        app: kubernetes-mcp-ops
      annotations:
        # Was: bump to roll the pod after editing kubernetes-mcp-ops-config.
        # Reloader does that now; left in place so this change rolls nothing.
        config-revision: "1"
    spec:
      priorityClassName: platform-batch
      serviceAccountName: kubernetes-mcp-ops
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: kubernetes-mcp
          image: quay.io/containers/kubernetes_mcp_server:v0.1.3@sha256:6347155616c49c78512114500688b50d275ddde7597b6a38cefe6f40a8c42c16
          args:
            - "--config"
            - "/etc/kubernetes-mcp-server/config.toml"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/kubernetes-mcp-server
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: kubernetes-mcp-ops-config
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-mcp-ops
  namespace: mcp-system
  labels:
    app: kubernetes-mcp-ops
spec:
  type: ClusterIP
  selector:
    app: kubernetes-mcp-ops
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
