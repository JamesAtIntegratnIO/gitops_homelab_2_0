# Hermes Agent (Nous Research) on the Raspberry Pi 5 worker, talos-pi5-1.
#
# Image: our thin derivative of the official v0.23.0 image with local
# speech-to-text (faster-whisper in /opt/hermes-stt, on the venv's sys.path via a .pth file), arm64 only:
# images/hermes-agent/Dockerfile, built by
# .github/workflows/build-hermes-agent-image.yaml. Digest-pinned. To move
# Hermes, bump the FROM digest there, let CI publish, then pin the new digest
# here.
# Docs: website/docs/user-guide/docker.md in NousResearch/hermes-agent at v0.23.0.
#
# How the image runs, and what that requires here:
#   - ENTRYPOINT is s6-overlay /init. It starts as root, fixes ownership of
#     /opt/data, seeds .env/config.yaml/SOUL.md if missing, then drops every
#     service to the `hermes` user (uid 10000). So: no runAsNonRoot, no
#     readOnlyRootFilesystem, and never override the entrypoint.
#   - `gateway run` keeps the container alive while s6 supervises the gateway.
#     With no chat platform configured, what it serves is the OpenAI-compatible
#     API server on 8642 (API_SERVER_* below). The dashboard stays off: it
#     refuses a non-loopback bind without an auth provider.
#   - All state is /opt/data. state.db is SQLite in WAL mode, which needs a
#     local filesystem (not NFS) and exactly one gateway per data dir: hence
#     `local-nvme` and a single replica with Recreate.
#
# Secrets: 1Password item `hermes-agent` in the `homelab` vault, fields
# ANTHROPIC_API_KEY (the Anthropic API key, billed per token) and
# API_SERVER_KEY (a random string; the API server can run shell commands, so it
# is mandatory even inside the cluster).
#
# Talking to it:
#   kubectl --context admin@the-cluster -n hermes exec -it deploy/hermes-agent -- hermes chat
#   kubectl --context admin@the-cluster -n hermes port-forward svc/hermes-agent 8642
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-agent
  namespace: hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: hermes-agent
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: hermes-agent
        property: ANTHROPIC_API_KEY
    - secretKey: API_SERVER_KEY
      remoteRef:
        key: hermes-agent
        property: API_SERVER_KEY
---
# arr-mcp's bearer token (mcp-system/arr-mcp.yaml; tier `write`, so it cannot
# delete). Separate from hermes-agent: one bad field fails the whole Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-arr-mcp
  namespace: hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: hermes-arr-mcp
    creationPolicy: Owner
  data:
    - secretKey: MCP_TOKEN
      remoteRef:
        key: arr-mcp
        property: MCP_TOKEN
---
# cq-server's address and Hermes's API key for it, read by mcp_servers.cq's
# env. Its own Secret (optional in the pod): until the item has
# HERMES_API_KEY, this Secret does not exist, both env entries render empty,
# and cq stays on its local file.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-cq
  namespace: hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: hermes-cq
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        CQ_ADDR: "http://cq-server.cq.svc.cluster.local:3000"
        CQ_API_KEY: "{{ .apiKey }}"
  data:
    - secretKey: apiKey
      remoteRef:
        key: cq-server
        property: HERMES_API_KEY
---
# The settings git owns. An init container copies this over
# /opt/data/config.yaml on every start, so a change made inside the pod
# (`hermes config set ...`) lasts only until the next restart; make it here.
# Everything not set falls back to Hermes's defaults, and its own config
# migrations still run at boot.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: hermes
data:
  config.yaml: |
    model:
      provider: "anthropic"
      default: "claude-sonnet-5-5"
    terminal:
      # Commands run inside this pod: no Docker socket, no host access. The
      # optimization guide's hardened profile wants terminal.backend: docker;
      # a Kubernetes pod has no Docker, so the pod is the sandbox instead:
      # non-root uid 10000 after init, all capabilities dropped but six, and
      # egress limited to the public internet (network-policies/hermes.yaml).
      backend: "local"

    # ---- Tuning from OnlyTerp/hermes-optimization-guide (written for
    # v0.21.4), every key checked against v0.23.0's DEFAULT_CONFIG on
    # 2026-11-07. Dropped as absent in v0.23.0: security.tirith_fail_open.

    # Cost: side tasks default to the main model (auxiliary.*: auto). Put them
    # on Haiku. No `vision` block: Sonnet sees images itself.
    auxiliary:
      compression:
        provider: "anthropic"
        model: "claude-haiku-5-5"
        reasoning_effort: "low"
      title_generation:
        provider: "anthropic"
        model: "claude-haiku-5-5"
        reasoning_effort: "low"
      background_review:   # the memory/skill review fork
        provider: "anthropic"
        model: "claude-haiku-5-5"
      approval:            # the classifier behind approvals.mode: smart
        provider: "anthropic"
        model: "claude-haiku-5-5"
      curator:
        provider: "anthropic"
        model: "claude-haiku-5-5"
      goal_judge:
        provider: "anthropic"
        model: "claude-haiku-5-5"
    agent:
      disabled_toolsets:
        - "tts"          # no voice provider; browser stays (see /dev/shm below)
      # Cost caps (keys checked against v0.23.0 config_defaults.py). A run
      # stops after 60 model turns; at 80% the model gets a one-time warning so
      # it can wrap up rather than being cut off mid-task. Default is unlimited.
      max_turns: 60
      budget_warning_ratio: 0.8
    # "auto": 1-hour Anthropic cache for human-paced chats (pauses longer than
    # 5 minutes), 5-minute for cron, API and subagents. Default is "5m".
    prompt_caching:
      cache_ttl: "auto"
    delegation:
      max_concurrent_children: 4   # default 10; a Pi 5 has 4 cores and tools run in-pod
    tool_loop_guardrails:
      hard_stop_enabled: true      # stop exact-repeat failure loops (default false)

    # Security: it reads web pages, so assume prompt injection.
    approvals:
      mode: "smart"
      deny:                        # blocked even under /yolo
        - "sudo *"
        - "*curl*|*sh*"
        - "*wget*|*sh*"
        - "dd if=* of=/dev/*"
        - "git push --force*"
        - "*authorized_keys*"
        - "kubectl *"              # the pod has no kube credentials; be explicit anyway
        # A nested `hermes -z` sets HERMES_YOLO_MODE=1, and yolo also skips the
        # trust: untrusted MCP gate (kubeops, github). These keep the terminal
        # from starting an unapproved run of itself, or rewriting its own
        # approval settings. fnmatch over the lowercased command. Not airtight
        # (a python subprocess is not a shell command): kubeops RBAC is the
        # real limit.
        - "*hermes* -z*"
        - "*hermes*--oneshot*"
        - "*--yolo*"
        - "*hermes_yolo_mode*"
        - "*hermes*config set*"
        - "*approvals.mode*"
    security:
      allow_private_urls: false    # also enforced by network-policies/hermes.yaml
      redact_secrets: true
      allow_lazy_installs: false   # no runtime pip installs
      website_blocklist:
        enabled: true
        domains:
          - "*.cluster.integratn.tech"   # the platform's own hosts
    hooks_auto_accept: false
    skills:
      guard_agent_created: true    # scan agent-written skills for injection/exfiltration
      # Cluster skills from git (skills.yaml), mounted read-only.
      external_dirs:
        - "/opt/hermes-skills"
    auth:
      adopt_external_logins: false # never borrow a Claude Code login
    browser:
      use_real_profile: false
      # Chromium's own sandbox cannot start on this node: Talos sets
      # user.max_user_namespaces=0, so there are no user namespaces, and the
      # setuid fallback would need CAP_SYS_ADMIN. Hermes adds --no-sandbox by
      # itself only under Docker, as root or under AppArmor's userns
      # restriction, and detects none of those under containerd, so browser_exec
      # died with "No usable sandbox!". A renderer exploit lands as uid 10000
      # in this pod: the user the terminal tool already runs shell commands as,
      # with capabilities dropped, RuntimeDefault seccomp and internet-only
      # egress. Opening user namespaces on the node would expose every pod on
      # it to a common kernel-exploit path, which is the worse trade.
      # /dev/shm is a 1Gi tmpfs (below), so no --disable-dev-shm-usage.
      chromium_args:
        - "--no-sandbox"
    vault:                         # no 1Password/Bitwarden CLI in this pod
      onepassword:
        enabled: false
      bitwarden:
        enabled: false

    # Ops
    sessions:
      auto_prune: true
      retention_days: 90

    # ---- Cluster access, read-only, through the platform's own MCP servers
    # (addons/.../mcp-system, docs/mcp.md), called by Service DNS: the
    # NetworkPolicies are allow-mcp-system-egress (hermes.yaml) and
    # allow-hermes-ingress (mcp-system.yaml). Hermes holds no kube or ArgoCD
    # credentials: what it can see is what those servers' RBAC allows.
    #   kubernetes  read_only=true, ClusterRole kubernetes-mcp-viewer (no secrets)
    #   grafana     --disable-write; its --allowed-hosts already lists this host
    #   argocd      MCP_READ_ONLY=true and the mcp-readonly account
    # The shared github-mcp (gateway, read-only, client token) is not used;
    # Hermes has its own github-mcp-hermes for GitOps PRs (below).
    # trust: untrusted makes Hermes ask before any tool that does not declare
    # readOnlyHint. Every kubernetes and grafana tool declares it. No argocd
    # tool does, so argocd is trust: full (James, 2026-11-07): argocd-mcp runs
    # MCP_READ_ONLY=true with the mcp-readonly account, so it cannot write,
    # and an approval prompt would block scheduled health checks that have
    # nobody to answer it. The include lists are the second guard: a tool
    # added in a server upgrade stays off until it is named here.
    mcp_servers:
      kubernetes:
        url: "http://kubernetes-mcp.mcp-system.svc.cluster.local:8080/mcp"
        trust: "untrusted"
        timeout: 60
        tools:
          include:
            - "events_list"
            - "namespaces_list"
            - "nodes_log"
            - "nodes_stats_summary"
            - "nodes_top"
            - "pods_get"
            - "pods_list"
            - "pods_list_in_namespace"
            - "pods_log"
            - "pods_top"
            - "resources_get"
            - "resources_list"
          resources: false
          prompts: false
      # The same read-only server, running INSIDE vcluster-media and reading
      # the vcluster's own API (its Deployments, PVCs, events, ArgoCD
      # Applications) with a vcluster `view` token. No Secrets.
      # workloads/vcluster-media/addons/kubernetes-mcp.
      kubemedia:
        url: "http://kubernetes-mcp-x-media-x-vcluster-media.vcluster-media.svc.cluster.local:8080/mcp"
        trust: "untrusted"
        timeout: 60
        tools:
          include:
            - "events_list"
            - "namespaces_list"
            - "pods_get"
            - "pods_list"
            - "pods_list_in_namespace"
            - "pods_log"
            - "resources_get"
            - "resources_list"
          resources: false
          prompts: false
      # Operational actions, each approved by James (trust: untrusted; neither
      # tool declares readOnlyHint): kubernetes-mcp-ops in mcp-system, which
      # exposes only these two tools and whose RBAC allows only pod delete,
      # node patch (cordon/uncordon) and Deployment/StatefulSet/DaemonSet
      # patch (rollout restart). See the cluster-remediate skill.
      kubeops:
        url: "http://kubernetes-mcp-ops.mcp-system.svc.cluster.local:8080/mcp"
        trust: "untrusted"
        timeout: 60
        tools:
          include:
            - "pods_delete"
            - "resources_create_or_update"
          resources: false
          prompts: false
      grafana:
        url: "http://grafana-mcp.mcp-system.svc.cluster.local:8000/mcp"
        trust: "untrusted"
        timeout: 60
        tools:
          include:
            - "query_prometheus"
            - "query_prometheus_histogram"
            - "list_prometheus_metric_names"
            - "list_prometheus_metric_metadata"
            - "list_prometheus_label_names"
            - "list_prometheus_label_values"
            - "query_loki_logs"
            - "query_loki_stats"
            - "query_loki_patterns"
            - "list_loki_label_names"
            - "list_loki_label_values"
            - "alerting_rules_read"
            - "alerting_silences_read"
            - "list_datasources"
            - "check_datasources_health"
            - "search_dashboards"
            - "get_dashboard_summary"
            - "get_dashboard_panel_queries"
          resources: false
          prompts: false
      argocd:
        url: "http://argocd-mcp.mcp-system.svc.cluster.local:3000/mcp"
        trust: "full"
        timeout: 60
        tools:
          include:
            - "list_applications"
            - "get_application"
            - "get_application_resource_tree"
            - "get_application_events"
            - "get_resource_events"
            - "get_application_workload_logs"
          resources: false
          prompts: false
      # ArgoCD sync, each approved by James (trust: untrusted). argocd-mcp-ops
      # runs with writes on, but its ArgoCD account `hermes-ops` may only get
      # and sync (mcp-system/argocd-mcp-ops-deployment.yaml); the reads stay on
      # the read-only `argocd` server above. Use for an app stuck OutOfSync
      # that self-heal does not retry, or to re-sync after a fix merges.
      argocdops:
        url: "http://argocd-mcp-ops.mcp-system.svc.cluster.local:3000/mcp"
        trust: "untrusted"
        timeout: 120
        tools:
          include:
            - "sync_application"
          resources: false
          prompts: false
      # GitOps fixes: branch + PR on JamesAtIntegratnIO/gitops_homelab_2_0,
      # through github-mcp-hermes (mcp-system/github-mcp-hermes.yaml), which
      # holds the bot token so it never enters this pod. The server already
      # refuses merge, delete, repo create/fork and reviews; this list is the
      # second guard. Writes (no readOnlyHint) each need approval: untrusted.
      # Knowledge memory: Mozilla.ai's cq (James's pick, 2026-11-08), the
      # `cq` CLI built into our image (images/hermes-agent) and run as a stdio
      # MCP server. Its SQLite store sits on the data volume, the Pi's local
      # NVMe. The store of record is cq-server (addon cq) via CQ_ADDR and
      # CQ_API_KEY (Secret hermes-cq); the local file is the fallback. trust: full because cq declares no readOnlyHint and its
      # writes only touch that local file; an approval per query would make
      # it useless. Skill: knowledge-memory.
      cq:
        command: "/usr/local/bin/cq"
        args: ["mcp"]
        env:
          CQ_LOCAL_DB_PATH: "/opt/data/cq/local.db"
          CQ_CONFIG_DIR: "/opt/data/cq"
          # cq-server (addon cq). Unset -> local only. Set -> proposals go to
          # the server as `private`, and local units drain to it on start.
          CQ_ADDR: "${CQ_ADDR}"
          CQ_API_KEY: "${CQ_API_KEY}"
        trust: "full"
        timeout: 60
        tools:
          include:
            - "query"
            - "propose"
            - "confirm"
            - "flag"
            - "revoke"
            - "status"
          resources: false
          prompts: false
      # Branches and PRs without approval (James, 2026-11-08: approving each
      # one was busywork). trust: full is safe here because none of these can
      # change `main`: create_branch only adds a ref, a PR only proposes, and
      # github-mcp-hermes refuses merge, delete, repo create/fork and reviews
      # outright. The file writes, which take any branch name including
      # `main`, are on `githubwrite` below (also trust: full since
      # 2026-11-08; read the comment there).
      github:
        url: "http://github-mcp-hermes.mcp-system.svc.cluster.local:8083/mcp"
        trust: "full"
        timeout: 120
        tools:
          include:
            - "get_file_contents"
            - "list_branches"
            - "list_commits"
            - "get_commit"
            - "list_pull_requests"
            - "pull_request_read"
            - "search_code"
            - "search_pull_requests"
            - "create_branch"
            - "create_pull_request"
            - "update_pull_request"
            - "update_pull_request_branch"
            # Merges without approval (James, 2026-11-08 card: "Merge without
            # asking"). The gitops-fix skill limits when; addons-gate is the
            # check.
            - "merge_pull_request"
            # Read-only: issues and CI (workflow runs, job logs), so a PR's
            # failing check can be read without James (2026-11-08).
            - "issue_read"
            - "list_issues"
            - "search_issues"
            - "actions_list"
            - "actions_get"
            - "get_job_logs"
          resources: false
          prompts: false
      # Commits: the same server, on every repo the token reaches (gitops and
      # nix_dots_2 today). trust: full since James's decision of 2026-11-08, made
      # with the risk known: these two tools take any branch name, including
      # `main`, the token is James's admin PAT, and the `main` ruleset lets the
      # Admin role bypass it. So NOTHING BUT HERMES'S OWN RULES stops a commit
      # to `main`. James's condition: every change goes through a
      # `hermes/<type>-<slug>` branch and a pull request; Hermes never commits
      # or pushes to `main`. Enforcing that for real needs a "require a pull
      # request" ruleset without the admin bypass, or a non-admin token (see
      # github-mcp-hermes.yaml). To bring the per-call approval back, set
      # trust to "untrusted" again.
      githubwrite:
        url: "http://github-mcp-hermes.mcp-system.svc.cluster.local:8083/mcp"
        trust: "full"
        timeout: 120
        tools:
          include:
            - "create_or_update_file"
            - "push_files"
          resources: false
          prompts: false
      # File deletes (James, 2026-11-09: a PR branch could not drop files it no
      # longer needed, so the PR had to be replaced). The same server and the
      # same admin PAT as githubwrite, so delete_file also takes any branch name,
      # `main` included, and the same condition holds: only on the
      # `hermes/<type>-<slug>` branch of an open PR, never on `main`. Unlike
      # the commit tools this one is trust: untrusted, because delete_file
      # declares no readOnlyHint and a delete is the one write that is hard to
      # see in a review: every delete asks James. To drop the prompt, set trust
      # to "full" as githubwrite is.
      githubdelete:
        url: "http://github-mcp-hermes.mcp-system.svc.cluster.local:8083/mcp"
        trust: "untrusted"
        timeout: 120
        tools:
          include:
            - "delete_file"
          resources: false
          prompts: false
      # Inside the media apps (mcp-system/arr-mcp.yaml): Sonarr, Radarr, Bazarr,
      # SABnzbd, Jellyfin. Every read declares readOnlyHint; writes need
      # approval (untrusted), and each is a preview then a confirm. The server
      # grants safe_write on the four arr apps and no destructive tier at
      # all, and the token is tier `write`; this list is the second guard
      # (no deletes, no Seerr/Profilarr/indexer tools). Token: 1Password
      # `arr-mcp`/MCP_TOKEN via the hermes-arr-mcp Secret. If it is missing,
      # this server alone fails to connect.
      arr:
        url: "http://arr-mcp.mcp-system.svc.cluster.local:6060/mcp"
        trust: "untrusted"
        timeout: 120
        headers:
          Authorization: "Bearer ${ARR_MCP_TOKEN}"
        tools:
          include:
            - "diagnose"
            - "stack_health"
            - "search_media"
            - "get_media_details"
            - "get_metadata_issues"
            - "get_library"
            - "get_profile_issues"
            - "get_queue"
            - "get_history"
            - "get_wanted"
            - "get_releases"
            - "get_blocklist"
            - "get_calendar"
            - "get_subtitles"
            - "get_playback"
            - "get_indexers"
            - "lookup_media"
            - "discover_media"
            - "trigger_search"
            - "trigger_scan"
            - "trigger_subtitle_search"
            - "grab_release"
            - "set_monitoring"
            - "update_media"
            - "add_media"
            - "retry_download"
            - "pause_downloads"
            - "remove_blocklist_item"
          resources: false
          prompts: false
      # Recipes, meal plans and shopping lists in Mealie, through mealie-mcp
      # (mcp-system/mealie-mcp.yaml, djwmarcx/better-mealie-mcp: one tool per
      # Mealie API endpoint, generated from its OpenAPI spec). The token is
      # James's Mealie API token and stays in that pod. The server marks no
      # tool read-only, so it is split like github/githubwrite:
      #   mealie       reads, plus the two calls that compute without saving
      #                (ingredient parser, test-scrape of a URL): trust full.
      #   mealiewrite  everything that saves: trust untrusted, every call asks
      #                James.
      # Not listed, so never callable: deletes, merges, bulk actions, full-
      # recipe PUT (PATCH only changes the fields given), exports, sharing,
      # meal-plan rules, iCal, webhooks, invitations, household settings.
      # 180 s: an AI import waits on Mealie's AI provider (server side 170 s).
      mealie:
        url: "http://mealie-mcp.mcp-system.svc.cluster.local:8000/mcp"
        trust: "full"
        timeout: 180
        tools:
          include:
            - "list_app_about"
            - "list_recipes"
            - "get_recipes_by_slug"
            - "list_recipes_suggestions"
            - "list_recipes_timeline_events"
            - "create_recipes_test_scrape_url"
            - "create_parser_ingredient"
            - "create_parser_ingredients"
            - "list_foods"
            - "get_foods_by_item"
            - "list_units"
            - "get_units_by_item"
            - "list_organizers_categories"
            - "list_organizers_tags"
            - "list_organizers_tools"
            - "get_organizers_categories_slug_by_category_slug"
            - "get_organizers_tags_slug_by_tag_slug"
            - "get_organizers_tools_slug_by_tool_slug"
            - "list_households_mealplans"
            - "list_households_mealplans_today"
            - "get_households_mealplans_by_item"
            - "list_households_shopping_lists"
            - "get_households_shopping_lists_by_item"
            - "list_households_shopping_items"
          resources: false
          prompts: false
      mealiewrite:
        url: "http://mealie-mcp.mcp-system.svc.cluster.local:8000/mcp"
        trust: "untrusted"
        timeout: 180
        tools:
          include:
            # Import: from a URL, from HTML or schema.org JSON, or with AI
            # (text, photos), and a blank recipe to fill with PATCH.
            - "create_recipes_create_url"
            - "create_recipes_create_html_or_json"
            - "create_recipes_create_ai"
            - "create_recipes"
            - "patch_recipes_by_slug"
            - "patch_recipes_by_slug_last_made"
            - "create_recipes_by_slug_image"
            - "update_recipes_by_slug_image"
            # Vocabulary the parser matches against.
            - "create_foods"
            - "update_foods_by_item"
            - "create_units"
            - "update_units_by_item"
            - "create_organizers_categories"
            - "create_organizers_tags"
            - "create_organizers_tools"
            # Meal plans and shopping lists.
            - "create_households_mealplans"
            - "update_households_mealplans_by_item"
            - "create_households_shopping_lists"
            - "create_households_shopping_items"
            - "create_households_shopping_items_create_bulk"
            - "update_households_shopping_items_by_item"
            - "create_households_shopping_lists_by_item_recipe"
            - "create_households_shopping_lists_by_item_recipe_by_recip"
          resources: false
          prompts: false
      # Walmart catalog, through walmart-mcp (mcp-system/walmart-mcp.yaml, our
      # own image, images/walmart-mcp). Three tools, all readOnlyHint, none of
      # which touches a Walmart account: search_products, lookup_items (store
      # 500 / ZIP 79924 by default) and cart_link, which only builds the
      # add-to-cart URL James opens and checks out himself. So trust: full.
      # Skill: walmart-cart.
      walmart:
        url: "http://walmart-mcp.mcp-system.svc.cluster.local:8000/mcp"
        trust: "full"
        timeout: 60
        tools:
          include:
            - "search_products"
            - "lookup_items"
            - "cart_link"
          resources: false
          prompts: false
    # ---- Features, 2026-11-07. Only free ones that need no key beyond
    # Anthropic and send nothing to Nous. Already on by default in v0.23.0 and
    # left alone: memory and user profile, skills, session_search, cron (the
    # gateway's ticker runs jobs), Claude-native vision (agent.image_input_mode:
    # auto), and web search, which with no key configured falls back to the
    # free Exa/Parallel/Keenable endpoints (the queries go to those vendors).
    #
    # File snapshots before the agent edits, so /rollback can undo them.
    # Stored under /opt/data (local-nvme), pruned after 7 days.
    checkpoints:
      enabled: true
    # Speech-to-text on the Pi's CPU with faster-whisper: no audio leaves the
    # pod. The library comes from our derived image (images/hermes-agent);
    # until the Deployment runs it, local STT reports itself unavailable and
    # nothing else changes. `base` (~150MB, int8 on CPU) is the model; it
    # downloads from the Hugging Face Hub on first use into HF_HOME on the
    # PVC. Unloaded after 10 idle minutes to give the memory back.
    stt:
      enabled: true
      provider: "local"
      local:
        model: "base"
        unload_after_idle_seconds: 600
    # Defaults, pinned so an upstream default change cannot turn them on.
    telemetry:
      shared_metrics:
        enabled: false
        send: false
    cron:
      allow_agent_scheduling: false   # the agent may not schedule its own jobs

    # The browser UIs, behind nginx-gateway (internal only, LAN/Tailscale):
    #   Webapp     https://hermes.cluster.integratn.tech        -> 9120
    #   dashboard  https://hermes-admin.cluster.integratn.tech  -> 9119
    # Both sign in with authentik through Hermes's self-hosted OIDC plugin: a
    # PUBLIC PKCE client `hermes` (authentik blueprint 10-hermes-provider.yaml),
    # so there is no client secret. The authentik application is bound to the
    # `authentik Admins` group: every account that can sign in acts as the
    # machine owner.
    webapp:
      enabled: true
      host: "0.0.0.0"
      port: 9120
      public_url: "https://hermes.cluster.integratn.tech"
    # Hermes's own UIs in James's design system (Night Shift Ledger): the
    # theme and skin files come from ConfigMap hermes-skill-design
    # (hack/hermes-design/). A pick in the UI lasts until the next restart.
    display:
      skin: "integratn"
    dashboard:
      theme: "integratn"
      public_url: "https://hermes-admin.cluster.integratn.tech"
      # The gateway's data-plane pods connect from the pod network; only they
      # may set X-Forwarded-* (so cookies are marked Secure behind TLS).
      trusted_proxies:
        - "10.244.0.0/16"
      oauth:
        provider: "self-hosted"
        self_hosted:
          issuer: "https://auth.cluster.integratn.tech/application/o/hermes/"
          client_id: "hermes"
          scopes: "openid profile email"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  namespace: hermes
spec:
  storageClassName: local-nvme
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes-agent
  annotations:
    # Stakater Reloader (addons/.../reloader) rolls this Deployment when any of
    # these ConfigMaps changes: the settings (an init container copies
    # config.yaml in on every start) and the three skill ConfigMaps (subPath
    # mounts never update in place). Without it a merged config change sat
    # unused until someone ran a rollout restart by hand.
    configmap.reloader.stakater.com/reload: "hermes-config,hermes-skills,hermes-skill-design,hermes-skill-secrets"
    # ... and when one of the Secrets read through env changes (the Anthropic
    # and API-server keys, the arr-mcp token, the cq key). Not hermes-talos:
    # that is a mounted volume, which updates in place without a restart.
    # A rollout ends any conversation in flight.
    secret.reloader.stakater.com/reload: "hermes-agent,hermes-arr-mcp,hermes-cq"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-agent
      annotations:
        # Rolls the pod when hermes-skill-design changes: subPath mounts never
        # update in place. Written by hack/hermes-design/gen.sh.
        integratn.tech/design-hash: "474ba8649864f068"
    spec:
      nodeSelector:
        node.integratn.tech/board: rpi5
      tolerations:
        - key: node.integratn.tech/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: config
          image: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command:
            - sh
            - -c
            - cp /config/config.yaml /opt/data/config.yaml && chown 10000:10000 /opt/data/config.yaml
          # Kyverno's mutate-restrict-escalation adds `drop: [ALL]` to any
          # container that names no capabilities, which leaves root unable to
          # chown. Naming them here keeps that default and adds back CHOWN, plus
          # DAC_OVERRIDE: after the first boot Hermes's s6 setup makes /opt/data
          # 0700 and uid 10000, and without it root cannot even stat inside it
          # ("cp: can't stat '/opt/data/config.yaml': Permission denied").
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE]
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: config
              mountPath: /config
              readOnly: true
      containers:
        - name: hermes
          image: ghcr.io/jamesatintegratnio/gitops_homelab_2_0/hermes-agent:v0.23.0-stt-cq0.19.2-tc1.13.12@sha256:ce7787e5371b657d5f0af99c90cefb7a8bc18d614a3428787211bbb22edaa196
          args: ["gateway", "run"]
          # s6 /init runs as root to chown /opt/data, then s6-setuidgid drops
          # every service to uid 10000, and s6-svscan signals those processes.
          # Kyverno would otherwise drop ALL capabilities (see the init
          # container); these are the ones that startup needs, all within the
          # baseline PodSecurity level. Dropping uid needs no escalation.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL]
          env:
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: API_SERVER_PORT
              value: "8642"
            # s6 supervises the dashboard alongside the gateway. Bound to all
            # interfaces, it refuses to start without the OIDC sign-in above.
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: "0.0.0.0"
            - name: HERMES_DASHBOARD_PORT
              value: "9119"
            # Whisper model cache on the PVC, not the container's overlay,
            # so a restart does not download it again.
            - name: HF_HOME
              value: "/opt/data/cache/huggingface"
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            # faster-whisper's ctranslate2 threads (cpu_threads=0 defers to
            # this). Keep equal to limits.cpu so it is not throttled.
            - name: TALOSCONFIG
              value: /var/run/secrets/talos.dev/config
            - name: OMP_NUM_THREADS
              value: "4"
            # arr-mcp's bearer token, read by mcp_servers.arr's header. Its own
            # Secret, so a missing field cannot blank the Anthropic key.
            - name: ARR_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-arr-mcp
                  key: MCP_TOKEN
                  optional: true
            # cq-server address + API key for mcp_servers.cq (Secret hermes-cq).
            - name: CQ_ADDR
              valueFrom:
                secretKeyRef:
                  name: hermes-cq
                  key: CQ_ADDR
                  optional: true
            - name: CQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-cq
                  key: CQ_API_KEY
                  optional: true
          envFrom:
            - secretRef:
                name: hermes-agent
          ports:
            - name: api
              containerPort: 8642
              protocol: TCP
            - name: dashboard
              containerPort: 9119
              protocol: TCP
            - name: webapp
              containerPort: 9120
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 15
            failureThreshold: 4
          # /health is answered by the gateway itself (no upstream call), so a
          # failing liveness means a wedged gateway, not a slow Anthropic API.
          # s6 already restarts a crashed gateway inside the container; this
          # catches one that hangs.
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            # 4 = every core on the Pi, which runs little else. Local
            # speech-to-text (faster-whisper) is CPU-bound: at a 2-CPU limit
            # its default 4 threads were throttled and a 6 s clip took 14 s
            # (7 s on 2 threads). OMP_NUM_THREADS below matches this.
            limits:
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            # Chromium (browser toolset) needs more than the container
            # runtime's 64Mi /dev/shm. Memory-backed, so it counts against the
            # 4Gi limit.
            - name: dshm
              mountPath: /dev/shm
            # Read-only Talos API (talos-serviceaccount.yaml). Optional: the
            # Secret only exists once the control-plane nodes allow os:reader
            # for this namespace.
            - name: talos
              mountPath: /var/run/secrets/talos.dev
              readOnly: true
            # Cluster skills from git, one subPath per file (see skills.yaml
            # for why not a plain ConfigMap mount).
            - name: skills
              mountPath: /opt/hermes-skills/homelab/DESCRIPTION.md
              subPath: DESCRIPTION.md
              readOnly: true
            - name: skills
              mountPath: /opt/hermes-skills/homelab/cluster-health-check/SKILL.md
              subPath: cluster-health-check.md
              readOnly: true
            - name: skills
              mountPath: /opt/hermes-skills/homelab/cluster-triage/SKILL.md
              subPath: cluster-triage.md
              readOnly: true
            - name: skills
              mountPath: /opt/hermes-skills/homelab/gitops-fix/SKILL.md
              subPath: gitops-fix.md
              readOnly: true
            - name: skills
              mountPath: /opt/hermes-skills/homelab/cluster-remediate/SKILL.md
              subPath: cluster-remediate.md
              readOnly: true
            - name: skills
              mountPath: /opt/hermes-skills/homelab/loki-log-triage/SKILL.md
              subPath: loki-log-triage.md
              readOnly: true
            - name: skills
              mountPath: /opt/hermes-skills/homelab/kargo-health/SKILL.md
              subPath: kargo-health.md
              readOnly: true
            - name: skills
              mountPath: /opt/hermes-skills/homelab/talos-node-health/SKILL.md
              subPath: talos-node-health.md
              readOnly: true
            - name: skills
              mountPath: /opt/hermes-skills/homelab/knowledge-memory/SKILL.md
              subPath: knowledge-memory.md
              readOnly: true
            - name: skills
              mountPath: /opt/hermes-skills/homelab/media-house-rules/SKILL.md
              subPath: media-house-rules.md
              readOnly: true
            - name: skills
              mountPath: /opt/hermes-skills/homelab/skill-improve/SKILL.md
              subPath: skill-improve.md
              readOnly: true
            - name: skills
              mountPath: /opt/hermes-skills/homelab/okf-update/SKILL.md
              subPath: okf-update.md
              readOnly: true
            # secret-requests: the ask-first protocol for generated secrets
            # (secrets-skill.yaml, with network-policies/
            # kyverno-restrict-pushsecret.yaml).
            - name: secrets-skill
              mountPath: /opt/hermes-skills/homelab/secret-requests/SKILL.md
              subPath: SKILL.md
              readOnly: true
            # integratn-design: the design system for anything visual, with
            # its template files (design-skill.yaml, generated by
            # hack/hermes-design/gen.sh).
            - name: design-skill
              mountPath: /opt/hermes-skills/homelab/integratn-design/SKILL.md
              subPath: SKILL.md
              readOnly: true
            - name: design-skill
              mountPath: /opt/hermes-skills/homelab/integratn-design/templates/base.css
              subPath: base.css
              readOnly: true
            - name: design-skill
              mountPath: /opt/hermes-skills/homelab/integratn-design/templates/page.html
              subPath: page.html
              readOnly: true
            # The same design system for Hermes's own UIs: dashboard theme and
            # the CLI/TUI/Webapp skin, selected in config.yaml (dashboard.theme,
            # display.skin).
            - name: design-skill
              mountPath: /opt/data/dashboard-themes/integratn.yaml
              subPath: dashboard-theme.yaml
              readOnly: true
            - name: design-skill
              mountPath: /opt/data/skins/integratn.yaml
              subPath: skin.yaml
              readOnly: true
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: talos
          secret:
            secretName: hermes-talos
            optional: true
            defaultMode: 0444
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: config
          configMap:
            name: hermes-config
        - name: skills
          configMap:
            name: hermes-skills
        - name: secrets-skill
          configMap:
            name: hermes-skill-secrets
        - name: design-skill
          configMap:
            name: hermes-skill-design
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-agent
  namespace: hermes
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hermes-agent
  ports:
    - name: api
      port: 8642
      targetPort: api
    - name: dashboard
      port: 9119
      targetPort: dashboard
    - name: webapp
      port: 9120
      targetPort: webapp
---
# Internal only: the gateway VIP is on the LAN, not the internet (see
# docs/okf/platform/networking.md). No authentik forward-auth filter: Hermes
# signs users in itself, and a second sign-in in front would break its own
# OIDC callback and WebSocket.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes-webapp
  namespace: hermes
spec:
  parentRefs:
    - name: nginx-gateway
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - hermes.cluster.integratn.tech
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        # /login goes straight to authentik (login-snippetsfilter.yaml).
        - type: ExtensionRef
          extensionRef:
            group: gateway.nginx.org
            kind: SnippetsFilter
            name: hermes-login-via-authentik
      backendRefs:
        - name: hermes-agent
          port: 9120
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes-dashboard
  namespace: hermes
spec:
  parentRefs:
    - name: nginx-gateway
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - hermes-admin.cluster.integratn.tech
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        # /login goes straight to authentik (login-snippetsfilter.yaml).
        - type: ExtensionRef
          extensionRef:
            group: gateway.nginx.org
            kind: SnippetsFilter
            name: hermes-login-via-authentik
      backendRefs:
        - name: hermes-agent
          port: 9119
