# The one Git credential Kargo uses to clone this repo, push promotion
# branches, and open/merge/poll pull requests. It lives in the shared-resources
# namespace (global.sharedResources.namespace in the chart values) so every
# Kargo Project resolves it without its own copy; the chart grants the
# controller read access there.
#
# Kargo matches credentials by the `repoURL` below (normalised: host lowercase,
# .git suffix ignored), which must equal git.repoURL in the kargo-projects
# values.
#
# Requires 1Password item "kargo-github-token" with property:
#   token  fine-grained GitHub PAT scoped to jamesatintegratnio/gitops_homelab_2_0
#          with  Contents: read+write,  Pull requests: read+write,  Metadata: read
#          (Contents write is what lets git-merge-pr merge; nothing here needs
#          Workflows or Administration).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-github-gitops-homelab
  namespace: kargo-shared-resources
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: kargo-github-gitops-homelab
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      data:
        repoURL: https://github.com/jamesatintegratnio/gitops_homelab_2_0.git
        # Any username satisfies GitHub when the password is a PAT.
        username: kargo
        password: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: kargo-github-token
        property: token
