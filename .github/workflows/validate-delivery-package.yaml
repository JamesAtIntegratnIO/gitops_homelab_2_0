name: Validate Delivery Package

# The delivery/ directory is a self-contained package that is expected to be
# extracted into its own repository (`git subtree split --prefix=delivery`).
# That stays cheap only while nothing inside it reaches out into this
# repository. This job is what keeps that true -- see delivery/CONTRIBUTING.md.

on:
  pull_request:
    paths:
      - 'delivery/**'
      - '.github/workflows/validate-delivery-package.yaml'
  push:
    branches: [main]
    paths:
      - 'delivery/**'

permissions:
  contents: read

jobs:
  extraction-test:
    name: Extraction test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Copy the package out and prove it stands alone
        run: delivery/hack/extraction-test.sh
