# Every public hostname under *.cluster.integratn.tech terminates on the NGINX
# data plane. With a single replica, losing its node meant MetalLB re-announcing
# 10.0.4.205 within seconds to a Service with no endpoints, and staying that way
# for the ~6 minutes it takes to evict, reschedule and start the replacement.
# Two replicas, one per node. externalTrafficPolicy is Local (see the service
# block below), so MetalLB announces the VIP from a node running a replica.
nginx:
  replicas: 2
  pod:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: nginx-gateway-nginx
    # Default is 300s: the pod sits on a dead node for five minutes before the
    # scheduler is allowed to move it. 60s still absorbs a brief network blip.
    tolerations:
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 60
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 60
  # NginxProxy.spec…deployment.pod has no priorityClassName field, so the data
  # plane gets its priority through a Deployment patch instead.
  patches:
    - type: StrategicMerge
      value:
        spec:
          template:
            spec:
              priorityClassName: platform-critical
  # REAL CLIENT IP FOR TUNNEL TRAFFIC (2026-11-27). auth.integratn.tech comes
  # from Cloudflare through the cloudflared pods to the `tunnel` listener
  # below, so the TCP peer is a pod and the client is in X-Forwarded-For
  # ("<whatever the client sent>, <real IP Cloudflare appended>"). Trusting
  # only the pod network and walking the header from the right
  # (setIPRecursively) makes $remote_addr the address Cloudflare saw: the
  # rightmost untrusted entry, which the client cannot write. LAN clients
  # connect from LAN addresses, which are not trusted, so their own
  # X-Forwarded-For is ignored and $remote_addr stays the peer. The original
  # peer is still $realip_remote_addr (used by the authentik snippets).
  # CrowdSec reads these access logs, so this is what makes its bans land on
  # real addresses.
  config:
    rewriteClientIP:
      mode: XForwardedFor
      setIPRecursively: true
      trustedAddresses:
        - type: CIDR
          value: 10.244.0.0/16
  service:
    loadBalancerIP: 10.0.4.205
    # Local, not Cluster (2026-11-25). With Cluster, a request that MetalLB
    # delivered to a node without an NGINX pod was forwarded and SNATed by
    # Cilium, so NGINX -- and authentik, Grafana, every app's logs and
    # rate-limits behind it -- saw a 10.244.x.x Cilium address instead of the
    # client. Local keeps the source address; MetalLB L2 then only announces
    # the VIP from a node that has a ready NGINX pod, and with two replicas on
    # two nodes the other takes over when one goes. (vcluster-media's gateway
    # 10.0.4.201 already runs this way.) authentik's admin hostname
    # allow-list (authentik-httproute.yaml) relies on it.
    externalTrafficPolicy: Local

# The control plane is leader-elected (nginxGateway.leaderElection.enable
# defaults to true), so a second replica is a warm standby rather than a split
# brain. It has also restarted 49 times since March.
# Chart 2.2.2 exposed no priorityClassName for the control plane, so this one
# stayed at default priority; 2.6.x adds `nginxGateway.priorityClassName`, so
# that is now a choice rather than a limitation. Left at default for the moment:
# it configures NGINX rather than serving traffic, and existing config keeps
# being served while it is away.
nginxGateway:
  replicas: 2
  tolerations:
    - key: node.kubernetes.io/not-ready
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 60
    - key: node.kubernetes.io/unreachable
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 60
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: nginx-gateway-fabric
          topologyKey: kubernetes.io/hostname
  snippetsFilters:
    enable: true

# Disable the built-in cert-generator Helm hook Job.
# TLS secrets (server-tls, agent-tls) already exist and the Job was a no-op
# (overwrite: false). Disabling avoids ArgoCD hook lifecycle conflicts with
# immutable Job spec.template on syncs.
certGenerator:
  enable: false

gateways:
  - name: nginx-gateway
    namespace: nginx-gateway
    labels:
      app: nginx-gateway-fabric
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      argocd.argoproj.io/compare-options: IgnoreExtraneous
      argocd.argoproj.io/sync-options: Prune=false
    spec:
      gatewayClassName: nginx
      addresses:
        - type: IPAddress
          value: 10.0.4.205
      listeners:
        - name: http
          port: 80
          protocol: HTTP
          hostname: "*.cluster.integratn.tech"
          allowedRoutes:
            namespaces:
              from: All
        - name: https
          port: 443
          protocol: HTTPS
          hostname: "*.cluster.integratn.tech"
          tls:
            mode: Terminate
            certificateRefs:
              - group: ""
                kind: Secret
                name: wildcard-integratn-tech-tls
          allowedRoutes:
            namespaces:
              from: All
        # The Cloudflare tunnel's way in (2026-11-27): cloudflared sends
        # auth.integratn.tech here as plain HTTP inside the cluster (TLS ends
        # at Cloudflare). Only authentik's namespace may attach routes, and its
        # route refuses anything not from a pod (authentik-httproute.yaml), so
        # this name on the LAN VIP gets a 403.
        - name: tunnel
          port: 80
          protocol: HTTP
          hostname: auth.integratn.tech
          allowedRoutes:
            namespaces:
              from: Selector
              selector:
                matchLabels:
                  kubernetes.io/metadata.name: authentik
