# Grafana MCP: Bridges AI platform to Grafana
# Provides: dashboards, PromQL, LogQL, alerting, datasources, annotations, navigation
# Image: grafana/mcp-grafana, Transport: streamable-http on port 8000
# Could replace prometheus-mcp-server (superset of functionality via Grafana datasources)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-mcp
  namespace: mcp-system
  labels:
    app: grafana-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-mcp
  template:
    metadata:
      labels:
        app: grafana-mcp
    spec:
      # Deferrable: developer tooling, not a platform dependency.
      priorityClassName: platform-batch
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: grafana-mcp
          # Pinned. Unpinned, this tag silently moved 0.14.0 (2026-05-08) ->
          # 1.1.0 (2026-08-10) on the first restart in three months, and 1.1.0's
          # /healthz rejects an unauthenticated Grafana connection where 0.14.0
          # tolerated it -- turning a stale token into a CrashLoop.
          image: docker.io/grafana/mcp-grafana:1.1.0@sha256:f21a19cebbfa7c3a76ef1746171e5ffc3601064e432f593e7c6cb526e5216e5f
          args:
            - "-t"
            - "streamable-http"
            - "--address"
            - "0.0.0.0:8000"
            - "--disable-write"
            - "--disable-oncall"
            - "--disable-sift"
            - "--disable-cloudwatch"
            - "--disable-clickhouse"
            - "--disable-incident"
            - "--disable-examples"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: GRAFANA_URL
              value: "http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local:80"
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-mcp-secrets
                  key: service-account-token
                  optional: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          # Readiness tracks the dependency: /healthz reports non-200 when the
          # Grafana connection is unauthorized, so the pod drops out of the
          # Service until Grafana is reachable and the token is valid.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          # Liveness only asks "is this process wedged". Pointing it at /healthz
          # made a *Grafana* problem restart the pod forever: on 2026-08-21 a
          # stale service-account token put this container into CrashLoopBackOff
          # with 11 restarts, when the correct behaviour is to sit there
          # not-ready until the token is repaired.
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-mcp
  namespace: mcp-system
  labels:
    app: grafana-mcp
spec:
  type: ClusterIP
  selector:
    app: grafana-mcp
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
