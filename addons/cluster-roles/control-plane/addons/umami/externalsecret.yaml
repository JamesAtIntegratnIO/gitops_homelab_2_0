# Umami's Secrets, all from 1Password through onepassword-store. Every item and
# field read below is listed, with what goes in it, in README.md beside this
# file. Fields are read by their LABELS, so renaming one in the item breaks the
# Secret that reads it.
---
# Umami's environment (`envFrom` in deployment.yaml).
#
# DATABASE_URL is Postgres on 10.0.3.1, from the item "umami-db-connection":
#
#   host      10.0.3.1
#   port      5432
#   text      the role name (umami)
#   password  the role's password
#
# THE PASSWORD IS IN THE URL, URL-ENCODED. specmarshal keeps its password out
# of the URL and hands it over as PGPASSWORD; that does not work here. Umami
# parses DATABASE_URL with `new URL()` and gives it to node-postgres, but the
# migration at every start is `prisma migrate deploy`, Prisma's schema engine,
# which reads the URL alone. So the password goes in, through `urlquery` so an
# `@`, `/`, `:` or `%` in it cannot corrupt the URL. `urlquery` encodes a space
# as `+`, which a URL's user-info does not decode, so the password must not
# contain spaces -- 1Password's generator never makes one.
#
# APP_SECRET, from "umami-app-secret" / `password`, signs dashboard login
# tokens. Without it Umami falls back to a hash of DATABASE_URL, which would
# log everyone out whenever the database password is rotated.
#
# REDIS_URL, from "umami-redis" / `password`: the same password redis.yaml
# starts the server with, encoded the same way. The user-info is `:password`,
# no user name, which is what `--requirepass` expects.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: umami-env
  namespace: umami
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: umami-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgresql://{{ .user }}:{{ .password | urlquery }}@{{ .host }}:{{ .port }}/umami"
        APP_SECRET: "{{ .appSecret }}"
        REDIS_URL: "redis://:{{ .redisPassword | urlquery }}@umami-redis.umami.svc.cluster.local:6379"
  data:
    - secretKey: host
      remoteRef: { key: umami-db-connection, property: host }
    - secretKey: port
      remoteRef: { key: umami-db-connection, property: port }
    - secretKey: user
      remoteRef: { key: umami-db-connection, property: text }
    - secretKey: password
      remoteRef: { key: umami-db-connection, property: password }
    - secretKey: appSecret
      remoteRef: { key: umami-app-secret, property: password }
    - secretKey: redisPassword
      remoteRef: { key: umami-redis, property: password }
---
# The Redis password alone, for the server (redis.yaml). The same 1Password
# item as REDIS_URL above, so the two cannot disagree for longer than one
# refresh -- and a rotation needs both pods restarted, since neither rereads
# its environment.
#
# 1Password item "umami-redis", field:
#   password  a generated password, no spaces
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: umami-redis
  namespace: umami
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-store
  target:
    name: umami-redis
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef: { key: umami-redis, property: password }
